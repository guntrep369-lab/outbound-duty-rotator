<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เบิกตามออเดอร์ — WMS</title>
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:var(--wms-surface); --surface2:var(--wms-surface2);
  --border:var(--wms-border); --border2:var(--wms-border2);
  --primary:var(--wms-primary); --primary-dark:var(--wms-primary-dark);
  --primary-light:var(--wms-primary-light); --text:var(--wms-text);
  --muted:var(--wms-muted); --faint:var(--wms-faint);
  --radius:var(--wms-radius); --shadow:var(--wms-shadow); --sans:var(--wms-font);
}
.main{padding:14px 20px 40px}   /* ระยะล่างจริงตั้งจาก JS ตามความสูงแถบสรุป */

.os-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px}
.os-src .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.os-src .pill b{color:var(--text);font-weight:600}
.os-src .sp{flex:1}
.os-src button{padding:4px 12px;border-radius:999px;border:1px solid var(--border2);
  background:var(--surface);font-family:var(--sans);font-size:12px;color:#334155;cursor:pointer}
.os-src button:hover:not(:disabled){background:var(--primary-light);border-color:var(--primary);
  color:var(--primary-dark)}
.os-src button:disabled{opacity:.6;cursor:default}

/* ── แถบเครื่องมือ ── */
.os-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.os-lbl{font-size:12px;color:var(--muted)}
.os-chip{padding:5px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  font-family:var(--sans);font-size:12.5px;color:var(--muted);cursor:pointer}
.os-chip:hover:not(.active){border-color:var(--primary);color:var(--primary)}
.os-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.os-q{flex:1;min-width:190px;padding:6px 13px;border-radius:999px;border:1px solid var(--border2);
  background:var(--surface);font-family:var(--sans);font-size:12.5px;color:var(--text)}
.os-q:focus{border-color:var(--primary);outline:none}
.os-hint{font-size:11px;color:var(--muted);margin-left:4px}

/* ── หนึ่งก้อนต่อหนึ่งออเดอร์ ── */
.os-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:9px;overflow:hidden}
.os-card.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.os-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 13px;
  background:var(--surface2);border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px}
.os-head:hover{background:var(--primary-light)}
.os-id{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;font-weight:700;color:var(--text)}
.os-who{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.os-tag{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;
  background:var(--primary-light);color:var(--primary-dark)}
.os-tag.truck{background:#DCFCE7;color:#166534}
.os-tag.sup{background:#EDE9FE;color:#5B21B6}
.os-sp{flex:1}
.os-count{font-size:11.5px;color:var(--muted);white-space:nowrap}
.os-count b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

.os-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.os-tbl td{padding:6px 10px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.os-tbl tr:last-child td{border-bottom:0}
.os-tbl tr.on{background:#EEF2FF}
.os-tbl tr:hover{background:var(--surface2)}
.os-tbl tr.on:hover{background:#E0E7FF}
.os-ck{width:34px;padding-left:13px!important}
.os-sku{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--primary);width:150px}
.os-nm{color:var(--text)}
.os-gift{font-size:10.5px;font-weight:600;color:#92400E;background:#FEF3C7;
  padding:1px 6px;border-radius:999px;margin-left:6px}
.os-qty{text-align:right;font-weight:700;font-size:14px;width:56px;font-variant-numeric:tabular-nums}
/* ยอดคงเหลือข้างรายการ — กันไม่ให้ขอของที่ QA ก็ไม่มี ซึ่งใบเบิกช่วยไม่ได้ */
.os-stk{width:150px;text-align:right;font-size:10.5px;color:var(--muted);white-space:nowrap}
.os-stk b{font-weight:700;color:var(--text)}
.os-stk.low b{color:#B91C1C}
.os-stk.none{color:#B45309}

.os-empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.os-empty b{color:var(--text)}

/* ── แถบสรุปที่ลอยอยู่ล่างจอ ── */
.os-foot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;padding:11px 20px;background:var(--surface);
  border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(15,23,42,.07);font-size:13px}
.os-foot .sum{color:var(--text)}
.os-foot .sum b{font-weight:800;font-variant-numeric:tabular-nums}
.os-foot .sp{flex:1}
.os-foot .warn{font-size:11.5px;color:#B45309}
.btn{padding:7px 15px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);
  font-family:var(--sans);font-size:13px;color:#334155;cursor:pointer}
.btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
@media (min-width:1024px){ .os-foot{left:240px} }
</style>
</head>
<body data-wms-module="reqpick">

<div class="wms-shell">
<div data-wms-shell="reqpick" data-root="../" class="no-print"></div>
<div class="wms-main">

  <div class="mod-head no-print">
    <div class="mod-title">
      <div class="ic">🧾</div>
      <div>
        <h2>เบิกตามออเดอร์ · Order Requisition</h2>
        <p>เลือกออเดอร์และรายการที่ต้องการ แล้วสร้างใบเบิกเฉพาะของที่เลือก</p>
      </div>
    </div>
  </div>

  <div class="os-src no-print" id="src"></div>

  <div class="main" id="body"></div>

</div><!-- /.wms-main -->
</div><!-- /.wms-shell -->

<div class="os-foot no-print" id="foot" hidden></div>

<script type="module" src="../wms-shell.js"></script>
<script src="../wms-date.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-order-index.js"></script>
<script src="../wms-truck.js"></script>
<script src="../wms-pick.js"></script>
<script src="../wms-stock.js"></script>
<script src="../wms-draft.js"></script>
<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let PULLING = '';

/**
 * หน้านี้ไม่มีกฎเป็นของตัวเอง
 *
 * การแตกแถวชีตออกเป็นรายการสินค้าใช้ WmsPick.aggregateSKUDemand() ตัวเดียวกับ
 * ใบหยิบของ เรียกทีละออเดอร์แทนที่จะเรียกทั้งกอง — กฎจับคู่ของแถมกับจำนวน
 * (หลายบรรทัดในเซลล์เดียว จับคู่บรรทัดต่อบรรทัด) เคยพลาดมาแล้วครั้งหนึ่ง
 * ตอนที่จำนวนแรกถูกเอาไปใช้กับของแถมทุกบรรทัด สำเนาที่สองของกฎนี้จะทำให้
 * ใบเบิกกับใบหยิบขอของคนละจำนวนโดยไม่มีใครรู้ว่าอันไหนถูก
 */
function carriersOf() {
  const o = window.OrderIndex ? OrderIndex.getCarriers() : null;
  return o ? o.carriers : [];
}
function stockMap() {
  const o = window.WmsStock ? WmsStock.read() : null;
  return o ? o.map : {};
}

/* ── สถานะหน้าจอ ───────────────────────────────────────────────────────── */
let source = 1;        // 1 = Daily Logis (รอบเช้า) · 2 = Daily CRM
let carrierKey = '';   // '' = ทุกขนส่ง
let query = '';

/**
 * รายการที่ติ๊กไว้ เก็บเป็น "เลขออเดอร์ + SKU" เพราะเลือกได้ทีละรายการในออเดอร์
 *
 * อยู่ใน sessionStorage ผูกกับ at ของชุดข้อมูล เหมือนที่หน้าสรุปหยิบของทำกับ
 * ออเดอร์ที่ตัดออก — ดึงข้อมูลใหม่แล้วของที่ติ๊กไว้ต้องหมดอายุ ไม่งั้นพรุ่งนี้
 * กดสร้างใบเบิกแล้วได้ของเมื่อวานติดมาโดยไม่มีใครสั่ง
 */
const SEL_KEY = 'wms:reqpick:sel';
const SEP = '␀';
let sel = new Set();

function dataAt() {
  const o = window.OrderIndex && OrderIndex.getCarriers();
  return o ? o.at : 0;
}
function loadSel() {
  try {
    const o = JSON.parse(sessionStorage.getItem(SEL_KEY) || 'null');
    if (!o || o.at !== dataAt()) { sel = new Set(); return; }
    sel = new Set(o.keys || []);
    if (o.source === 1 || o.source === 2) source = o.source;
  } catch (e) { sel = new Set(); }
}
function saveSel() {
  try {
    sessionStorage.setItem(SEL_KEY, JSON.stringify({ at: dataAt(), keys: [...sel], source }));
  } catch (e) {}
}

/* ── ข้อมูล ─────────────────────────────────────────────────────────────── */

/**
 * ออเดอร์ในรอบที่เลือก พร้อมรายการสินค้าที่แตกออกมาแล้ว
 *
 * หนึ่งออเดอร์กินหลายแถวในชีต และของแถมหลายชิ้นอยู่ในเซลล์เดียว — รวมแถวของ
 * ออเดอร์เดียวกันก่อนแล้วค่อยแตกเป็นรายการ จึงได้ SKU ซ้ำในออเดอร์เดียวกัน
 * รวมเป็นบรรทัดเดียวพร้อมจำนวนที่บวกแล้ว ไม่ใช่สองบรรทัดที่ต้องมาบวกเองบนใบเบิก
 */
function orders() {
  const out = [];
  carriersOf().forEach(c => {
    const rows = (source === 1 ? c.data1 : c.data2) || [];
    const by = new Map();
    rows.forEach(r => {
      const id = String(r.orderID || '').trim();
      if (!id) return;
      if (!by.has(id)) by.set(id, { id, carrier: c.key, rows: [] });
      by.get(id).rows.push(r);
    });
    by.forEach(o => {
      const r0 = o.rows[0];
      const items = Object.values(WmsPick.aggregateSKUDemand(o.rows))
        .sort((a, b) => (a.type === b.type ? b.qty - a.qty : (a.type === 'bed' ? -1 : 1)));
      if (items.length) {
        out.push({
          id: o.id, carrier: o.carrier, customer: r0.customer || '—',
          truck: r0.truck || '', sup: r0.sup || '', appt: r0.apptTime || '',
          num: WmsTruck.numberOf(r0.truck), items,
        });
      }
    });
  });
  /* เรียงตามเลขคัน คันที่ไม่มีเลข (งาน Event ที่เขียน "5 คัน") ไว้ท้ายสุด
     ลำดับเดียวกับผังงานรถและแผงตัดออเดอร์ จะได้ไล่หาด้วยสายตาแบบเดียวกัน */
  return out.sort((a, b) => {
    if (a.num == null && b.num == null) return a.id.localeCompare(b.id, 'th');
    if (a.num == null) return 1;
    if (b.num == null) return -1;
    return a.num - b.num || a.id.localeCompare(b.id, 'th');
  });
}

function shown() {
  const q = query.trim().toLowerCase();
  return orders()
    .filter(o => !carrierKey || o.carrier === carrierKey)
    .filter(o => !q || (o.id + ' ' + o.customer + ' ' + o.truck + ' ' + o.sup + ' ' +
      o.items.map(i => i.sku + ' ' + nameOf(i)).join(' ')).toLowerCase().indexOf(q) >= 0);
}

/** ชื่อสินค้า — ไฟล์สต๊อกระบุชัดกว่าไฟล์ออเดอร์ ใช้กฎเดียวกับใบหยิบของ */
const nameOf = (item) => WmsPick.nameOf(item, stockMap());

const keyOf = (orderId, sku) => orderId + SEP + sku;

/* ── เลือก / ไม่เลือก ───────────────────────────────────────────────────── */
function toggleItem(orderId, sku) {
  const k = keyOf(orderId, sku);
  sel.has(k) ? sel.delete(k) : sel.add(k);
  saveSel();
  render();
}

/** ติ๊กหัวออเดอร์ = เลือกทุกรายการในนั้น กดซ้ำ = เอาออกทั้งออเดอร์ */
function toggleOrder(orderId) {
  const o = shown().find(x => x.id === orderId);
  if (!o) return;
  const all = o.items.every(i => sel.has(keyOf(o.id, i.sku)));
  o.items.forEach(i => { all ? sel.delete(keyOf(o.id, i.sku)) : sel.add(keyOf(o.id, i.sku)); });
  saveSel();
  render();
}

function clearSel() { sel = new Set(); saveSel(); render(); }

/** ติ๊กทุกออเดอร์ที่กรองอยู่ตอนนี้ — ไม่ใช่ทั้งวัน จะได้ตรงกับที่ตาเห็น */
function selectShown() {
  const list = shown();
  const all = list.length && list.every(o => o.items.every(i => sel.has(keyOf(o.id, i.sku))));
  list.forEach(o => o.items.forEach(i => {
    all ? sel.delete(keyOf(o.id, i.sku)) : sel.add(keyOf(o.id, i.sku));
  }));
  saveSel();
  render();
}

function setSource(n) { source = n; saveSel(); render(); }
function setCarrier(k) { carrierKey = (carrierKey === k) ? '' : k; render(); }
function setQuery(v) {
  query = v;
  render();
  const el = document.getElementById('osQ');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/* ── ที่เลือกไว้ทั้งหมด ─────────────────────────────────────────────────── */

/**
 * แถวที่จะไปลงใบเบิก — หนึ่งบรรทัดต่อหนึ่ง SKU ต่อหนึ่งออเดอร์
 *
 * ไม่รวม SKU เดียวกันข้ามออเดอร์เข้าด้วยกัน เพราะช่องเลขออเดอร์บนใบเบิกจะเขียน
 * อะไรไม่ได้ถ้าบรรทัดเดียวมาจากสองออเดอร์ และจุดประสงค์ทั้งหมดของหน้านี้คือ
 * เบิกโดยตามรอยได้ว่าของชิ้นไหนเป็นของออเดอร์ไหน
 *
 * ไล่จากทั้งวัน ไม่ใช่เฉพาะที่กรองอยู่ — ที่ติ๊กไว้แล้วต้องไปครบแม้จะพิมพ์คำค้น
 * ทับไปแล้ว ไม่งั้นของหายจากใบเบิกเพราะเหตุที่มองไม่เห็น
 */
function picked() {
  const out = [];
  orders().forEach(o => o.items.forEach(i => {
    if (sel.has(keyOf(o.id, i.sku))) {
      out.push({ sku: i.sku, name: nameOf(i), qty: i.qty, order: o.id, customer: o.customer });
    }
  }));
  return out;
}

/** ใบเบิกหนึ่งใบมี 10 บรรทัด — บอกล่วงหน้าว่าจะได้กี่ใบ ไม่ใช่ไปเจอเอาตอนพิมพ์ */
const ROWS_PER_SHEET = 10;

function makeRequisition() {
  const items = picked();
  if (!items.length) return;
  if (!WmsDraft.put('requisition', items, { from: 'QA', to: 'NEW WH-2', src: 'หน้าเบิกตามออเดอร์' })) {
    alert('ส่งรายการไปใบเบิกไม่ได้ — เบราว์เซอร์ไม่ยอมให้เก็บข้อมูลชั่วคราว');
    return;
  }
  location.href = '../warehouse-forms/requisition.html';
}

/* ── วาดหน้าจอ ──────────────────────────────────────────────────────────── */

/** ยอดคงเหลือของ SKU นี้ — บอกเป็นตัวเลข ไม่ตัดสินแทนว่าพอหรือไม่พอ */
function stockCell(item) {
  const s = stockMap()[item.sku];
  if (!Object.keys(stockMap()).length) return '<td class="os-stk"></td>';
  if (!s) return '<td class="os-stk none">ไม่พบใน Stock</td>';
  const low = s.qa < item.qty ? ' low' : '';
  return '<td class="os-stk' + low + '">NEW WH <b>' + s.newwh + '</b> · QA <b>' + s.qa + '</b></td>';
}

function card(o) {
  const on = o.items.filter(i => sel.has(keyOf(o.id, i.sku))).length;
  const rows = o.items.map(i => {
    const k = sel.has(keyOf(o.id, i.sku));
    return '<tr class="' + (k ? 'on' : '') + '" onclick="toggleItem(' + attr(o.id) + ',' + attr(i.sku) + ')">' +
      '<td class="os-ck"><input type="checkbox"' + (k ? ' checked' : '') + ' tabindex="-1"></td>' +
      '<td class="os-sku">' + esc(i.sku) + '</td>' +
      '<td class="os-nm">' + esc(nameOf(i)) +
        (i.type === 'gift' ? '<span class="os-gift">ของแถม</span>' : '') + '</td>' +
      stockCell(i) +
      '<td class="os-qty">' + i.qty + '</td></tr>';
  }).join('');

  return '<div class="os-card' + (on ? ' on' : '') + '">' +
    '<div class="os-head" onclick="toggleOrder(' + attr(o.id) + ')">' +
      '<input type="checkbox"' + (on === o.items.length ? ' checked' : '') + ' tabindex="-1">' +
      '<span class="os-id">' + esc(o.id) + '</span>' +
      '<span class="os-who">' + esc(o.customer) + '</span>' +
      '<span class="os-tag">' + esc(o.carrier) + '</span>' +
      (o.truck ? '<span class="os-tag truck">🚚 ' + esc(o.truck) + '</span>' : '') +
      (o.sup ? '<span class="os-tag sup">' + esc(o.sup) + '</span>' : '') +
      (o.appt ? '<span class="os-count">⏰ ' + esc(o.appt) + '</span>' : '') +
      '<span class="os-sp"></span>' +
      '<span class="os-count">' + (on ? 'เลือก <b>' + on + '</b>/' : '') +
        '<b>' + o.items.length + '</b> รายการ</span>' +
    '</div>' +
    '<table class="os-tbl"><tbody>' + rows + '</tbody></table></div>';
}

const attr = v => JSON.stringify(v).replace(/"/g, '&quot;');

function render() {
  loadSel();
  renderSrc();

  const host = document.getElementById('body');
  if (!carriersOf().length) {
    host.innerHTML = '<div class="os-empty">ยังไม่มีข้อมูลออเดอร์ — ไปที่ <b>เทียบ Order</b> ' +
      'แล้วกดดึงข้อมูลก่อน</div>';
    renderFoot();
    return;
  }

  const keys = [...new Set(orders().map(o => o.carrier))];
  const list = shown();
  const all = list.length && list.every(o => o.items.every(i => sel.has(keyOf(o.id, i.sku))));

  const bar =
    '<div class="os-bar"><span class="os-lbl">ใช้ข้อมูลจาก</span>' +
    '<button class="os-chip' + (source === 1 ? ' active' : '') + '" onclick="setSource(1)">🌅 Daily Logis</button>' +
    '<button class="os-chip' + (source === 2 ? ' active' : '') + '" onclick="setSource(2)">🌆 Daily CRM</button>' +
    '<span class="os-hint">ออเดอร์ที่เพิ่มมาทีหลังอยู่ในรอบ CRM</span></div>' +

    '<div class="os-bar"><span class="os-lbl">ชีต</span>' +
    '<button class="os-chip' + (carrierKey ? '' : ' active') + '" onclick="setCarrier(\'\')">ทุกขนส่ง</button>' +
    keys.map(k => '<button class="os-chip' + (carrierKey === k ? ' active' : '') + '" ' +
      'onclick="setCarrier(' + attr(k) + ')">' + esc(k) + '</button>').join('') + '</div>' +

    '<div class="os-bar">' +
    '<input class="os-q" id="osQ" value="' + esc(query).replace(/"/g, '&quot;') + '" ' +
    'placeholder="ค้นเลขออเดอร์ · ลูกค้า · คัน · Sup · SKU · ชื่อสินค้า" ' +
    'oninput="setQuery(this.value)">' +
    (list.length ? '<button class="os-chip" onclick="selectShown()">' +
      (all ? '☐ เอาออกทั้งหมดที่เห็น' : '☑ เลือกทั้งหมดที่เห็น') + '</button>' : '') +
    '</div>';

  host.innerHTML = bar + (list.length
    ? list.map(card).join('')
    : '<div class="os-empty">ไม่พบออเดอร์ที่ตรงกับที่ค้น<b></b></div>');

  renderFoot();
}

function renderFoot() {
  const foot = document.getElementById('foot');
  const items = picked();
  if (!items.length) { foot.hidden = true; foot.innerHTML = ''; padForFoot(); return; }

  const pcs = items.reduce((n, x) => n + x.qty, 0);
  const ords = new Set(items.map(x => x.order)).size;
  const sheets = Math.ceil(items.length / ROWS_PER_SHEET);
  const noStock = items.filter(x => {
    const s = stockMap()[x.sku];
    return s && s.qa < x.qty;
  }).length;

  foot.hidden = false;
  foot.innerHTML =
    '<span class="sum">เลือกไว้ <b>' + items.length + '</b> รายการ · <b>' + pcs +
      '</b> ชิ้น · จาก <b>' + ords + '</b> ออเดอร์</span>' +
    (sheets > 1 ? '<span class="warn">ใบเบิกมี 10 บรรทัดต่อใบ — ชุดนี้จะได้ ' + sheets +
      ' ใบ กรอกใบแรกให้แล้วกดสร้างใบถัดไป</span>' : '') +
    (noStock ? '<span class="warn">⚠ ' + noStock + ' รายการ QA มีไม่พอตามที่ขอ</span>' : '') +
    '<span class="sp"></span>' +
    '<button class="btn" onclick="clearSel()">ล้างที่เลือก</button>' +
    '<button class="btn btn-primary" onclick="makeRequisition()">📝 สร้างใบเบิก</button>';

  padForFoot();
}

/**
 * เว้นที่ล่างสุดเท่าความสูงจริงของแถบสรุป
 *
 * ตั้งเป็นค่าคงที่ไม่ได้ เพราะแถบสูงไม่เท่ากัน — บนจอมือถือคำเตือนเรื่องจำนวนใบ
 * กับ QA ไม่พอตกลงมาเป็นสามบรรทัด แล้วไปบังออเดอร์ใบสุดท้ายซึ่งเลื่อนลงไปดู
 * ไม่ได้อีก คือของที่หายไปจากหน้าจอโดยไม่มีอะไรบอก
 */
function padForFoot() {
  const foot = document.getElementById('foot');
  const body = document.getElementById('body');
  if (!foot || !body) return;
  body.style.paddingBottom = (foot.hidden ? 40 : foot.offsetHeight + 18) + 'px';
}

// แถบตกบรรทัดใหม่เมื่อจอแคบลง ระยะเว้นจึงต้องคิดใหม่ด้วย
window.addEventListener('resize', padForFoot);

/* ── แถบบอกที่มาของข้อมูล ───────────────────────────────────────────────── */
function renderSrc() {
  const o = window.OrderIndex ? OrderIndex.getCarriers() : null;
  const st = window.WmsStock ? WmsStock.read() : null;
  let html = '';
  if (o) {
    const n = o.carriers.reduce((a, c) => a + ((source === 1 ? c.data1 : c.data2) || []).length, 0);
    html += '<span class="pill">📋 <b>' + n + '</b> แถว · <b>' + o.carriers.length + '</b> ชีต</span>';
    html += '<span class="pill">🕒 ดึงเมื่อ <b>' + new Date(o.at)
      .toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + '</b></span>';
  } else {
    html += '<span class="pill">ยังไม่มีข้อมูลออเดอร์ของวันนี้</span>';
  }
  html += st
    ? '<span class="pill">📦 สต๊อก <b>' + Object.keys(st.map).length + '</b> SKU</span>'
    : '<span class="pill">ยังไม่มีสต๊อก — จะไม่บอกยอดคงเหลือข้างรายการ</span>';
  const url = window.OrderIndex ? OrderIndex.savedUrl() : '';
  html += '<span class="sp"></span>' +
    (url ? '' : '<span class="pill">ยังไม่ได้ตั้ง Apps Script URL — ดึงจากหน้านี้ไม่ได้</span>') +
    '<button onclick="pullOrders()"' + (PULLING || !url ? ' disabled' : '') + '>' +
    (PULLING || '🔄 ดึงข้อมูลใหม่') + '</button>';
  document.getElementById('src').innerHTML = html;
}

/**
 * ดึงออเดอร์รอบใหม่จาก Apps Script ตัวเดียวกับที่เทียบ Order ใช้
 *
 * ที่ติ๊กไว้จะหมดอายุเองเพราะ at เปลี่ยน — เขียนไว้ตรงนี้ให้ชัด เพราะคนกดปุ่มนี้
 * ตอนกำลังเลือกของอยู่จะเสียของที่เลือกไป และควรรู้ตัวก่อนกด
 */
async function pullOrders() {
  if (PULLING || !OrderIndex.savedUrl()) return;
  if (sel.size && !confirm('ดึงข้อมูลใหม่แล้วรายการที่เลือกไว้ ' + sel.size +
      ' รายการจะถูกล้าง ต้องการดึงต่อไหม')) return;
  PULLING = 'กำลังดึง…';
  renderSrc();
  try { await OrderIndex.pull(OrderIndex.savedUrl()); } catch (e) {}
  PULLING = '';
  render();
}

loadSel();
render();
</script>
</body>
</html>
