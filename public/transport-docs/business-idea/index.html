<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Business Idea — ทำใบงานขนส่ง</title>
<link rel="stylesheet" href="../../wms-theme.css">
<style>
/* Reset — the tool pages have their own; placeholders need one too */
*{box-sizing:border-box;margin:0;padding:0}.mod-head{background:#fff;border-bottom:1px solid #E2E5EA;padding:10px 16px 0;flex-shrink:0}
.mod-title{display:flex;align-items:center;gap:10px}
.mod-title .ic{width:36px;height:36px;border-radius:10px;background:#EEF2FF;color:#4F46E5;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mod-title h2{font-size:15px;font-weight:700;margin:0}
.mod-title p{font-size:11px;color:#64748B;margin:2px 0 0}

.soon-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.soon-card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;box-shadow:0 1px 3px rgba(15,23,42,.06);
  padding:40px 32px;max-width:460px;text-align:center}
.soon-card .emoji{font-size:40px;margin-bottom:12px}
.soon-card h3{font-size:17px;font-weight:700;color:#1E293B;margin:0 0 6px}
.soon-card p{font-size:13px;color:#64748B;line-height:1.7;margin:0}
.soon-card .phase{display:inline-block;margin-top:16px;padding:5px 14px;border-radius:999px;
  background:#EEF2FF;color:#4338CA;font-size:12px;font-weight:600}
</style>
</head>
<body data-wms-module="transport">

<div class="wms-shell">
<div data-wms-shell="transport" data-root="../../"></div>
<div class="wms-main">
  <div class="mod-head">
    <div class="mod-title">
      <div class="ic">🚚</div>
      <div>
        <h2>ทำใบงานขนส่ง · Transport Documents</h2>
        <p>เลือกขนส่ง แล้วสร้างเอกสารจากไฟล์ Excel</p>
      </div>
    </div>
    <nav class="carrier-nav">
        <a class="carrier-tab" href="../">รถบริษัท</a>
        <a class="carrier-tab soon" href="../kex/">Kex express<span class="soon-badge">เร็ว ๆ นี้</span></a>
        <a class="carrier-tab soon" href="../best/">Best express<span class="soon-badge">เร็ว ๆ นี้</span></a>
        <span class="carrier-tab active" aria-current="page">Business Idea<span class="soon-badge">เร็ว ๆ นี้</span></span>
    </nav>
  </div>
  <div class="soon-wrap">
    <div class="soon-card">
      <div class="emoji">🚧</div>
      <h3>Business Idea</h3>
      <p>ยังไม่มีเอกสารสำหรับขนส่งรายนี้<br>ระบบเตรียมโครงไว้แล้ว รอเพิ่มฟังก์ชันในเฟสถัดไป</p>
      <div class="phase">Phase ถัดไป</div>
    </div>
  </div>
</div>
</div>
<script type="module" src="../../wms-shell.js"></script>
</body>
</html>
