<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>รายงาน FIFO สต๊อก — สำหรับ Supply chain</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="fifo.css">
<!--
  ลิงก์ Supply chain: เปิดจากลิงก์ที่ทีมส่งให้ (ปุ่ม 🔗 ลิงก์ Supply chain ในหน้า FIFO สต๊อก)
  ไม่มีหน้าเข้าระบบและเมนูของ WMS เพราะคนเปิดไม่ได้ใช้แอป
  ลิงก์มี URL สคริปต์อยู่หลัง # ไม่ส่งไปกับการเปิดหน้า
    ระบบใหม่: เว็บแอปของ fire-backup.gs ตอบชุดแชร์ที่ทำทุก 2 ชั่วโมง → wms-fire-share.js คิด FIFO ด้วย wms-fire-core.js
    ระบบเดิม: สคริปต์ Transaction (tx-api.gs) ตอบชุดข้อมูลกลาง (tx-fifo shared)
  อ่านอย่างเดียว ไม่มีปุ่มดึงใหม่ ไม่มีลิงก์ไปชีต ดาวน์โหลด Excel สี่ชีตชุดเดียวกับหน้าในแอปได้
  หน้าตาและตัวเลขมาจาก fifo.css กับ fifo-page.js ไฟล์เดียวกับหน้าในแอป
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
.fs-head{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--wms-surface);
  border-bottom:1px solid var(--wms-border)}
.fs-head img{width:30px;height:30px;flex:none}
.fs-head .tt{min-width:0}
.fs-head h1{font-size:15px;font-weight:700;line-height:1.3}
.fs-head p{font-size:12px;color:var(--wms-muted);line-height:1.4}
@media (max-width:640px){ .fs-head{padding:10px 12px} }
</style>
</head>
<body data-fifo-share>

<div class="wms-main">

  <div class="fs-head">
    <img src="../icons/package.png" alt="">
    <div class="tt">
      <h1>รายงาน FIFO สต๊อก</h1>
      <p>สำหรับ Supply chain · ดูอย่างเดียว · ข้อมูลอัปเดตเองทุก 2 ชั่วโมง</p>
    </div>
  </div>

  <div class="tx-src" id="src"></div>
  <div class="fi-sum" id="sum"></div>
  <div class="tx-tabs" id="tabs" role="tablist"></div>
  <div class="tx-body" id="body"></div>

</div>

<script src="../wms-gas.js"></script>
<script src="../wms-shared.js"></script>
<script src="../wms-sup.js"></script>
<script src="../wms-fifo.js"></script>
<script src="../wms-fire-core.js"></script>
<script src="../wms-fire-share.js"></script>
<script src="fifo-page.js"></script>
</body>
</html>
