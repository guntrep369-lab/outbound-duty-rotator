<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ออเดอร์ติดปัญหา — สำหรับ Logis</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<!--
  หน้าดูอย่างเดียวสำหรับทีม Logis — ไม่มีหน้าเข้าระบบและเมนูของ WMS เพราะคนเปิดไม่ใช่ทีมคลัง
  ข้อมูลมาจาก op 'view' ของ apps-script/roster-api.gs ด้วยรหัสดู (VIEW_TOKEN) ซึ่งตัดเหลือแค่
  ออเดอร์ติดปัญหาตั้งแต่ในสคริปต์ หน้านี้จึงไม่เคยได้รายชื่อพนักงานหรือตารางกะ
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --txt2:#475569;
  --open:#b45309; --open-bg:#fffbeb;
  --done:#15803d; --done-bg:#f0fdf4;
  --void:#64748b; --void-bg:#f1f5f9;
  --logis:#1d4ed8; --logis-bg:#eff6ff; --logis-border:#bfdbfe;
}
body{background:var(--wms-bg)}
.lg-head{background:var(--wms-surface);border-bottom:1px solid var(--wms-border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lg-title{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.lg-title .ic{width:40px;height:40px;border-radius:10px;background:var(--logis-bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.lg-title h1{font-size:17px;font-weight:700;color:var(--wms-text)}
.lg-title p{font-size:12px;color:var(--wms-muted);margin-top:2px}
.lg-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lg-state{font-size:12px;color:var(--wms-muted)}
.lg-state.err{color:var(--wms-danger);font-weight:600}
.lg-main{padding:16px 20px 40px;max-width:1200px}
.card{background:var(--wms-surface);border:1px solid var(--wms-border);border-radius:var(--wms-radius);padding:16px 18px;margin-bottom:16px;box-shadow:var(--wms-shadow)}
.card h2{font-size:15px;margin-bottom:6px;color:var(--wms-text)}
.hint{font-size:12px;color:var(--wms-faint);line-height:1.6;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fg label{font-size:12px;font-weight:600;color:var(--txt2)}
.lg-main input{border:1px solid var(--wms-border2);border-radius:var(--wms-radius-sm);padding:9px 10px;font-size:14px;font-family:inherit;width:100%;background:var(--wms-surface);color:var(--wms-text)}
.lg-main input:focus{outline:2px solid var(--wms-primary);border-color:transparent}
.btn{background:var(--wms-surface);border:1px solid var(--wms-border2);color:var(--txt2);border-radius:var(--wms-radius-sm);padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--wms-primary);color:var(--wms-primary)}
.btn:disabled{opacity:.6;cursor:default}
.btn-ok{background:var(--wms-primary);color:#fff;border:none;border-radius:var(--wms-radius-sm);padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-link{background:none;border:none;color:var(--wms-primary);text-decoration:underline;cursor:pointer;font-size:inherit;font-family:inherit}
.lg-tools{margin-bottom:12px}
.lg-foot{font-size:12px;color:var(--wms-faint);margin-top:8px}
.empty{color:var(--wms-faint);font-size:13px;padding:8px 0}

.sec{margin-bottom:18px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--wms-text);margin-bottom:8px}
.sec-h .n{background:var(--open-bg);color:var(--open);border-radius:20px;padding:1px 9px;font-size:12px}
.sec-h.logis .n{background:var(--logis);color:#fff}
.sec-h .sub{font-weight:400;font-size:12px;color:var(--wms-muted)}

.oid{font-weight:700;color:var(--wms-text)}
.sup{display:inline-block;background:#fee2e2;color:#b91c1c;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:4px}
.rchip{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;border:1px solid}
.g-stock{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.g-fetch{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
.g-logis{background:var(--logis-bg);color:var(--logis);border-color:var(--logis-border)}
.g-other{background:#f8fafc;color:var(--txt2);border-color:var(--wms-border2)}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px}
.st-done{background:var(--done-bg);color:var(--done)}
.st-void{background:var(--void-bg);color:var(--void)}

.otbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--wms-surface);border:1px solid var(--wms-border);border-radius:var(--wms-radius-sm)}
.otbl th{background:#f8fafc;color:var(--txt2);font-size:11px;font-weight:600;padding:8px 10px;border-bottom:2px solid var(--wms-border);text-align:left;white-space:nowrap}
.otbl td{padding:9px 10px;border-bottom:1px solid var(--wms-border);vertical-align:top;color:var(--wms-text)}
.otbl td .sub{display:block;font-size:12px;color:var(--txt2);word-break:break-word}
.otbl td .mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.it + .it{margin-top:8px;padding-top:8px;border-top:1px dashed var(--wms-border)}
/* ตารางเรียงเป็นการ์ดเมื่อกล่องของมันแคบ (มือถือ) */
#out{container-type:inline-size}
/* ความกว้างคอลัมน์คงที่ ตารางของแต่ละกองจะได้ตรงกัน — สินค้ากับหมายเหตุแบ่งที่เหลือ */
@container (min-width:761px){
  .otbl{table-layout:fixed}
  .otbl th:nth-child(1){width:92px}
  .otbl th:nth-child(2){width:150px}
  .otbl th:nth-child(4){width:150px}
  .otbl th:nth-child(6){width:120px}
}
.oid,.sup,.rchip,.lchip{white-space:nowrap}
.otbl .c-when{white-space:nowrap}
.otbl .c-when b{display:block;color:var(--open)}
.otbl tr.old .c-when b{color:var(--wms-danger)}
.note{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.upd{font-size:12px;color:var(--txt2);margin-top:4px;padding-left:8px;border-left:2px solid var(--wms-border2);word-break:break-word}
.upd b{font-weight:600}
@media(max-width:760px){.lg-head,.lg-main{padding-left:12px;padding-right:12px}}
@container (max-width:760px){
  .otbl{border:none;background:none}
  .otbl thead{display:none}
  .otbl,.otbl tbody,.otbl tr,.otbl td{display:block;width:100%}
  .otbl tr{background:var(--wms-surface);border:1px solid var(--wms-border);border-left:4px solid var(--open);border-radius:var(--wms-radius-sm);margin-bottom:10px;padding:6px 0}
  .otbl tr.old{border-left-color:var(--wms-danger)}
  .otbl td{border:none;padding:4px 12px;display:flex;gap:10px}
  .otbl td::before{content:attr(data-l);flex:0 0 64px;font-size:11px;color:var(--wms-faint);font-weight:600;padding-top:2px}
  .otbl td > div{flex:1;min-width:0}
  .otbl td:has(> div:empty){display:none}
}
</style>
</head>
<body>

<header class="lg-head">
  <div class="lg-title">
    <div class="ic">📦</div>
    <div>
      <h1>ออเดอร์ติดปัญหา · สำหรับ Logis</h1>
      <p>จากสมุดกะของทีม Outbound · หน้านี้ดูได้อย่างเดียว</p>
    </div>
  </div>
  <div class="lg-bar">
    <span class="lg-state" id="state"></span>
    <button type="button" class="btn" id="reload" onclick="load()">🔄 โหลดใหม่</button>
  </div>
</header>

<main class="lg-main">
  <section class="card" id="setup" style="display:none">
    <h2>ตั้งค่าครั้งแรก</h2>
    <p class="hint">ขอลิงก์จากทีม Outbound (ปุ่ม 🔗 หน้าสำหรับ Logis ในสมุดกะ) แล้วเปิดลิงก์นั้นในเครื่องนี้ หรือใส่สองช่องนี้เอง</p>
    <div class="fg"><label for="s-url">Apps Script URL</label><input id="s-url" type="text" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <div class="fg"><label for="s-code">รหัสดู</label><input id="s-code" type="password" autocomplete="off"></div>
    <button type="button" class="btn-ok" onclick="saveSetup()">บันทึกแล้วเปิดดู</button>
  </section>

  <div id="view" style="display:none">
    <div class="lg-tools"><input id="q" type="text" autocomplete="off" placeholder="ค้นหา Order ID · เลข consign · สินค้า · ขนส่ง" oninput="render()"></div>
    <div id="out"></div>
    <p class="lg-foot">โหลดใหม่เองทุก 2 นาที · <button type="button" class="btn-link" onclick="resetSetup()">เปลี่ยน URL / รหัสดู</button></p>
  </div>
</main>

<script src="../wms-gas.js"></script>
<script src="shiftlog.js"></script>
<script>
var L=window.ShiftLog;
var CFG_KEY='wms:logisView';
var ITEMS=null,LOADING=false;

function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function stamp(ts){return new Date(ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function readCfg(){try{var c=JSON.parse(localStorage.getItem(CFG_KEY)||'null');return c&&c.url&&c.code?c:null;}catch(e){return null;}}
function writeCfg(c){try{if(c)localStorage.setItem(CFG_KEY,JSON.stringify(c));else localStorage.removeItem(CFG_KEY);}catch(e){}}
function setState(txt,err){var s=el('state');s.textContent=txt;s.className='lg-state'+(err?' err':'');}

/* ลิงก์จากสมุดกะมี URL กับรหัสดูมาหลัง # — เก็บไว้ในเครื่องแล้วลบออกจากแถบที่อยู่
   คนกดแชร์หน้าจอหรือบุ๊กมาร์กต่อจะได้ไม่ติดรหัสไปด้วย */
(function takeHash(){
  if(!location.hash)return;
  var p=new URLSearchParams(location.hash.slice(1)),u=p.get('u'),k=p.get('k');
  if(u&&k)writeCfg({url:u,code:k});
  history.replaceState(null,'',location.pathname+location.search);
})();

function showSetup(msg){
  var c=readCfg()||{};
  el('setup').style.display='';el('view').style.display='none';
  el('s-url').value=c.url||'';el('s-code').value='';
  setState(msg||'',!!msg);
}
function saveSetup(){
  var url=el('s-url').value.trim(),code=el('s-code').value.trim();
  if(!/^https:\/\/script\.google\.com\//.test(url)){alert('URL ต้องขึ้นต้นด้วย https://script.google.com/');return;}
  if(!code){alert('ใส่รหัสดู');return;}
  writeCfg({url:url,code:code});load();
}
function resetSetup(){writeCfg(null);ITEMS=null;showSetup('');}

function load(quiet){
  var c=readCfg();
  if(!c){showSetup('');return;}
  if(LOADING)return;
  LOADING=true;el('reload').disabled=true;
  if(!quiet||!ITEMS)setState('⏳ กำลังโหลด…');
  WmsGas.post(c.url,{op:'view',token:c.code},{timeoutMs:60000}).then(function(r){
    if(r&&r.error){
      if(/รหัสดู|VIEW_TOKEN/.test(r.error)){showSetup('⚠ '+r.error+' — ขอลิงก์ใหม่จากทีม Outbound');return;}
      throw new Error(r.error);
    }
    if(!r||r.app!=='roster'||!Array.isArray(r.items))throw new Error('URL นี้ไม่ใช่สคริปต์ของสมุดกะ');
    ITEMS=r.items;
    el('setup').style.display='none';el('view').style.display='';
    setState('อัปเดต '+stamp(Date.now())+(r.at?' · ทีม Outbound แก้ล่าสุด '+stamp(r.at):''));
    render();
  }).catch(function(err){
    setState('⚠ โหลดไม่สำเร็จ: '+err.message+(ITEMS?' · แสดงข้อมูลชุดก่อน':''),true);
    if(!ITEMS){
      el('setup').style.display='none';el('view').style.display='';
      el('out').innerHTML='<div class="empty">ยังโหลดไม่ได้ — กด 🔄 โหลดใหม่ ถ้ายังไม่ได้ให้ขอลิงก์ใหม่จากทีม Outbound</div>';
    }
  }).then(function(){LOADING=false;el('reload').disabled=false;});
}

function reasonHtml(e){var r=L.reasonOf(e.reason);return '<span class="rchip g-'+r.group+'">'+esc(r.label)+'</span>';}
function updatesHtml(e){
  return (Array.isArray(e.updates)?e.updates:[]).map(function(x){
    return '<div class="upd"><b>'+esc(x.by||'—')+'</b> '+(x.at?stamp(x.at):'')+' · '+esc(x.text)+'</div>';}).join('');
}
function itemsHtml(e){
  var items=L.itemsOf(e);
  if(!items.length)return '—';
  return items.map(function(i){
    var sz=[i.size,i.qty?'×'+i.qty:''].filter(Boolean).join(' ');
    return '<div class="it">'+esc(i.product||'—')+(sz?'<span class="sub">'+esc(sz)+'</span>':'')+(i.sku?'<span class="sub mono">'+esc(i.sku)+'</span>':'')+'</div>';
  }).join('');
}
function row(e,today){
  var a=L.age(e,today);
  var when=e.open?'<b>'+(a?'ค้าง '+a+' วัน':'วันนี้')+'</b>':
    (e.result==='cancelled'?'<span class="st st-void">✕ ยกเลิกออเดอร์</span>':'<span class="st st-done">✓ ส่งออกแล้ว</span>')+
    '<span class="sub">'+(e.closedAt?stamp(e.closedAt):'')+'</span>';
  return '<tr'+(e.open&&a>=2?' class="old"':'')+'>'+
    '<td data-l="'+(e.open?'ค้าง':'ผล')+'" class="c-when"><div>'+when+'<span class="sub">'+L.dayText(e.date).replace(/ \d{4}$/,'')+' · '+L.SHIFTS[e.shift]+'</span></div></td>'+
    '<td data-l="ออเดอร์"><div><span class="oid">'+esc(e.order)+'</span>'+(e.sup?'<span class="sup">'+esc(e.sup)+'</span>':'')+
      (e.consign?'<span class="sub mono">'+esc(e.consign)+'</span>':'')+'</div></td>'+
    '<td data-l="สินค้า"><div>'+itemsHtml(e)+'</div></td>'+
    '<td data-l="ติดเพราะ"><div>'+reasonHtml(e)+'</div></td>'+
    '<td data-l="หมายเหตุ"><div>'+(e.text?'<div class="note">'+esc(e.text)+'</div>':'')+updatesHtml(e)+'</div></td></tr>';
}
function table(list,today,first){
  return '<table class="otbl"><thead><tr><th>'+first+'</th><th>ออเดอร์</th><th>สินค้า</th><th>ติดเพราะ</th><th>หมายเหตุ / อัปเดตจาก Outbound</th></tr></thead><tbody>'+
    list.map(function(e){return row(e,today);}).join('')+'</tbody></table>';
}
function byWhen(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.shift===b.shift?(a.at||0)-(b.at||0):a.shift==='morning'?-1:1);}

function render(){
  if(!ITEMS)return;
  var q=el('q').value.trim().toLowerCase(),today=L.shiftAt(new Date()).date;
  var list=ITEMS.filter(function(e){
    var words=[e.order,e.consign,e.sup];
    L.itemsOf(e).forEach(function(i){words.push(i.product,i.sku);});
    return !q||words.some(function(v){return String(v||'').toLowerCase().indexOf(q)>=0;});
  });
  var mine=list.filter(function(e){return e.open&&e.logis;}).sort(byWhen);
  var other=list.filter(function(e){return e.open&&!e.logis;}).sort(byWhen);
  var done=list.filter(function(e){return !e.open;}).sort(function(a,b){return (b.closedAt||0)-(a.closedAt||0);});
  var sec=function(cls,title,sub,arr,empty,first){
    return '<div class="sec"><div class="sec-h '+cls+'">'+title+' <span class="n">'+arr.length+'</span> <span class="sub">'+sub+'</span></div>'+
      (arr.length?table(arr,today,first||'ค้าง'):'<div class="empty">'+empty+'</div>')+'</div>';
  };
  el('out').innerHTML=
    sec('logis','ต้องให้ Logis ดำเนินการ','แก้บิล · ใบปะหน้า · ออเดอร์ที่ถูกแก้',mine,q?'ไม่เจอ':'ไม่มีเรื่องรอ Logis 👍')+
    sec('','ค้างอื่น ๆ','ทีม Outbound กำลังตาม — ให้รู้ไว้',other,q?'ไม่เจอ':'ไม่มี')+
    sec('','ปิดแล้ว 3 วันล่าสุด','',done,q?'ไม่เจอ':'ยังไม่มี','ผล');
}

load();
setInterval(function(){if(!document.hidden&&readCfg())load(true);},120000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&readCfg()&&ITEMS)load(true);});
</script>
</body>
</html>
