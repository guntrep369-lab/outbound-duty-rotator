<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>สรุปหยิบของ — WMS</title>
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --surface:var(--wms-surface); --surface2:var(--wms-surface2);
  --border:var(--wms-border); --border2:var(--wms-border2);
  --primary:var(--wms-primary); --primary-dark:var(--wms-primary-dark);
  --primary-light:var(--wms-primary-light); --text:var(--wms-text);
  --muted:var(--wms-muted); --faint:var(--wms-faint);
  --radius:var(--wms-radius); --radius-sm:var(--wms-radius-sm); --shadow:var(--wms-shadow);
}
.main{padding:14px 20px 40px}
.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);
  font-family:var(--wms-font);font-size:13px;color:#334155;cursor:pointer}
.btn:hover{border-color:var(--primary);color:var(--primary-dark)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.08);color:#fff}
.btn-sm{padding:5px 12px;font-size:12.5px}
.pk-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px}
.pk-src .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.pk-src .pill b{color:var(--text);font-weight:600}
.pk-src .sp{flex:1}
.pk-src button{padding:4px 12px;border-radius:999px;border:1px solid var(--border2);
  background:var(--surface);font-family:var(--wms-font);font-size:12px;color:#334155;cursor:pointer}
.pk-src button:hover:not(:disabled){background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark)}
@media print{ .no-print{display:none!important} .wms-shell,.wms-main{display:block!important} }
  /* ── สรุปหยิบของ ── */
  .ps-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .ps-lbl{font-size:12px;color:var(--muted)}
  .ps-spacer{flex:1}
  .ps-opt{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer}
  .ps-opt.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .ps-grand{background:var(--primary-light);border:1px solid #C7D2FE;border-radius:10px;
    padding:9px 14px;font-size:13px;color:#3730A3;margin-bottom:14px}
  .ps-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 1px 3px rgba(15,23,42,.06);overflow:hidden;margin-bottom:16px}
  .ps-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 18px;background:var(--primary);color:#fff}
  .ps-carrier{font-size:18px;font-weight:700}
  .ps-meta{font-size:11.5px;color:#C7D2FE;margin-top:2px}
  .ps-tot{text-align:right;flex-shrink:0}
  .ps-tot b{font-size:22px;font-weight:800;display:block;line-height:1}
  .ps-tot span{font-size:11px;color:#C7D2FE}
  .ps-group{padding:12px 18px 16px}
  .ps-gtitle{font-size:13px;font-weight:700;color:var(--text);margin-bottom:7px}
  .ps-gtitle span{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:6px}
  .ps-table{width:100%;border-collapse:collapse;font-size:13px}
  .ps-table th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;padding:5px 8px;border-bottom:1.5px solid var(--border)}
  .ps-table td{padding:7px 8px;border-bottom:1px solid #F1F5F9;vertical-align:top}
  .ps-chk{border:1.5px solid #94A3B8;border-radius:4px;width:16px;height:16px;display:inline-block;margin-top:1px}
  .ps-table td.ps-chk{border:0;padding-left:8px}
  .ps-table td.ps-chk::before{content:'';display:inline-block;width:15px;height:15px;
    border:1.5px solid #94A3B8;border-radius:4px}
  .ps-sku{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--primary)}
  .ps-qty{text-align:right;font-weight:700;font-size:15px}
  .ps-empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}

  @media print{
    body{background:#fff}
    /* .tabs กับ .tab-pane:not(#tab-picksum) เคยอยู่ตรงนี้สมัยเป็นแท็บในเทียบ Order
       หน้านี้ไม่มีแท็บแล้ว จึงเป็นกฎที่ไม่ตรงกับ element ไหนเลย */
    header,.ps-bar,.no-print,.sysbar,[data-wms-shell]{display:none!important}
    .main{padding:0!important;max-width:none!important}
    /* แต่ละขนส่งขึ้นหน้าใหม่ ฉีกแจกให้แต่ละคนได้ */
    .ps-card{page-break-after:always;break-after:page;box-shadow:none;border:0;margin:0}
    .ps-card:last-child{page-break-after:auto;break-after:auto}
    .ps-head{background:#fff!important;color:#000!important;border-bottom:2.5px solid #000;padding:0 0 8px}
    .ps-carrier{font-size:20px}
    .ps-xnote{color:#000!important;font-weight:700}
    .ps-meta,.ps-tot span{color:#444!important}
    .ps-group{padding:10px 0 12px}
    .ps-table{page-break-inside:auto}
    .ps-table tr{page-break-inside:avoid}
  }

  /* หัวโซนหยิบ — อยู่เหนือชั้นประเภท ต้องหนักกว่าหัวประเภทให้เห็นว่าคุมอยู่ */
  .ps-zone{margin-top:14px}
  .ps-zone:first-child{margin-top:4px}
  .ps-zname{font-size:13px;font-weight:800;color:var(--primary-dark);
    background:var(--primary-light);border-left:4px solid var(--primary);
    border-radius:0 6px 6px 0;padding:5px 10px;margin-bottom:2px}
  .ps-zname span{font-weight:400;font-size:11px;color:var(--primary);opacity:.8;margin-left:6px}
  .ps-cat{margin-top:10px}
  .ps-cat:first-child{margin-top:2px}
  .ps-cname{font-size:12.5px;font-weight:700;color:var(--text);padding:4px 0 3px;
    border-bottom:1.5px solid var(--border)}
  .ps-cname span{font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
  .ps-size{font-size:11.5px;font-weight:600;color:var(--primary);background:var(--primary-light);
    border-radius:6px;padding:3px 9px;margin:7px 0 3px;display:inline-block}
  .ps-size span{font-weight:400;color:var(--primary);opacity:.75;margin-left:5px}
  @media print{
    /* พิมพ์ขาวดำ สีบอกลำดับชั้นไม่ได้ ใช้เส้นกับพื้นเทาแทน */
    .ps-zname{background:#DDD!important;color:#000!important;border-left:4px solid #000;
      border-radius:0}
    .ps-zname span{color:#000!important;opacity:1}
    .ps-cname{border-bottom:1.5px solid #000}
    .ps-size{background:#EEE!important;color:#000!important;border:1px solid #000}
    .ps-size span{color:#000!important}
    .ps-cat{page-break-inside:auto}
  }
  .ps-nostock{font-size:10px;font-weight:600;color:#B45309;background:#FEF3C7;
    border:1px solid #FDE68A;border-radius:5px;padding:1px 6px;white-space:nowrap}
  /* หน้าคลังมีไม่พอ — ต้องทำใบเบิกก่อนถึงจะหยิบได้ครบ จึงเข้มกว่า "ไม่พบใน Stock"
     ซึ่งแปลว่าไฟล์สต๊อกไม่รู้จักของชิ้นนี้เฉย ๆ */
  .ps-short{font-size:10px;font-weight:700;color:#B91C1C;background:#FEF2F2;
    border:1px solid #FCA5A5;border-radius:5px;padding:1px 6px;white-space:nowrap}
  /* เตือนที่หัวใบ ให้เห็นก่อนออกเดิน ไม่ใช่ไปเจอที่ชั้น */
  .ps-warn{background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B;border-radius:8px;
    padding:7px 12px;margin:8px 0 0;font-size:12px;line-height:1.6;font-weight:600}
  @media print{
    .ps-nostock{background:#fff!important;border:1px solid #000;color:#000!important}
    .ps-short{background:#fff!important;border:1.5px solid #000;color:#000!important}
    .ps-warn{background:#fff!important;border:1.5px solid #000;color:#000!important}
  }
  /* แถบทำใบเบิก — อยู่เหนือใบทั้งหมด เพราะเป็นสิ่งที่ต้องทำก่อนออกไปหยิบ */
  .ps-qabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;
    padding:9px 14px;border-radius:10px;background:#FEF2F2;border:1px solid #FCA5A5;
    color:#991B1B;font-size:12.5px}
  .ps-qabar b{font-weight:800}
  .ps-cannot{color:#7C2D12;font-weight:600}
  .ps-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
  .ps-carriers{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ps-chip{padding:5px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer}
  .ps-chip:hover:not(.active){border-color:var(--primary);color:var(--primary)}
  .ps-chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .ps-chip-alt{border-style:dashed;color:var(--muted)}
  .ps-hint{font-size:11px;color:var(--muted);margin-left:4px}
  .ps-range{padding:5px 11px;border-radius:999px;border:1px solid var(--border2, var(--border));
    background:var(--surface);font-family:var(--sans);font-size:12.5px;color:var(--text);
    outline:none;min-width:210px}
  .ps-range:focus{border-color:var(--primary)}
  /* เลขช่วงบนปุ่มกลุ่ม — บอกว่าปุ่มนี้ครอบคันไหนบ้าง โดยไม่แย่งสายตาจากชื่อกลุ่ม */
  .ps-tiny{font-weight:400;font-size:10.5px;opacity:.7;margin-left:3px}
  .ps-mix{margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--primary-light);
    color:var(--primary);font-size:11px;font-weight:600;vertical-align:middle}
  .ps-split{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
  .ps-split span{padding:2px 9px;border-radius:6px;border:1px solid var(--border);
    font-size:11px;color:var(--muted);white-space:nowrap}
  .ps-split b{color:var(--text);font-weight:700;margin-left:2px}

  /* แผงตัดออเดอร์ออกจากยอด — ชื่อคลาสขึ้นต้น ps-x ไม่ใช่ ps-cut เพราะ ps-cut
     ถูกใช้ไปแล้วกับเส้นบอกรอยตัดหน้ากระดาษที่ drawPageGuides() วาด */
  .ps-xpanel{border:1px solid var(--border);border-radius:12px;background:var(--surface);
    padding:10px 12px;margin-bottom:12px}
  .ps-xtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .ps-xq{flex:1;min-width:150px;padding:5px 11px;border-radius:999px;
    border:1px solid var(--border2,var(--border));background:var(--surface);
    font-family:var(--sans);font-size:12.5px;color:var(--text)}
  .ps-xq:focus{border-color:var(--primary);outline:none}
  .ps-xlist{max-height:290px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
  .ps-xrow{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:8px;
    border:1px solid transparent;font-size:12.5px;cursor:pointer}
  .ps-xrow:hover{background:var(--surface2)}
  .ps-xrow.on{background:#FEF2F2;border-color:#FCA5A5}
  .ps-xrow.on .ps-xid{text-decoration:line-through;color:#991B1B}
  .ps-xid{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--primary);min-width:100px}
  .ps-xwho{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .ps-xtruck{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .ps-xpcs{font-weight:700;font-variant-numeric:tabular-nums;min-width:46px;text-align:right;color:var(--text)}
  .ps-xnone{padding:16px;text-align:center;color:var(--muted);font-size:12.5px}
  /* บรรทัดนี้ต้องติดไปกับกระดาษด้วย ไม่ใช่ no-print — คนถือใบออกไปเดินต้องรู้ว่า
     ใบในมือไม่ใช่ยอดทั้งวัน ไม่งั้นหยิบขาดแล้วไม่มีใครรู้ว่าทำไม */
  .ps-xnote{margin-top:6px;font-size:11.5px;color:#FECACA;font-weight:600}
  /* แถบดึงข้อมูล (.d*) และ .consign-no ย้ายไปอยู่ ../wms-theme.css แล้ว
     เพราะหน้าเทียบ Order ใช้ชุดเดียวกัน — สองสำเนาแปลว่าวันหนึ่งจะเพี้ยนกัน */

  /* ── โหมดพิมพ์ label 150×100 มม. — บีบให้ลงดวงเล็ก ── */
  @media print{
    body.ps-paper-label .ps-head{padding:0 0 4px;border-bottom:2px solid #000}
    body.ps-paper-label .ps-carrier{font-size:13px}
    body.ps-paper-label .ps-meta{font-size:8px}
    body.ps-paper-label .ps-tot b{font-size:15px}
    body.ps-paper-label .ps-tot span{font-size:8px}
    body.ps-paper-label .ps-group{padding:4px 0 5px}
    body.ps-paper-label .ps-gtitle{font-size:10px;margin-bottom:3px}
    body.ps-paper-label .ps-gtitle span{font-size:8px}
    body.ps-paper-label .ps-cname{font-size:9.5px;padding:2px 0 1px}
    body.ps-paper-label .ps-cname span{font-size:8px}
    body.ps-paper-label .ps-size{font-size:8.5px;padding:1px 5px;margin:3px 0 1px}
    body.ps-paper-label .ps-table{font-size:9px}
    body.ps-paper-label .ps-table td{padding:2px 4px}
    body.ps-paper-label .ps-sku{font-size:8.5px}
    body.ps-paper-label .ps-qty{font-size:11px}
    body.ps-paper-label .ps-table td.ps-chk::before{width:9px;height:9px;border-width:1px}
    body.ps-paper-label .ps-empty{padding:8px;font-size:9px}
    body.ps-paper-label .ps-card{page-break-inside:auto}
    body.ps-paper-label .ps-cat{page-break-inside:avoid}
  }

  /* ── ตัวอย่างตามขนาดกระดาษ ── */
  .ps-papermode{background:#E9EDF2;padding:16px 0;border-radius:12px}
  .ps-papermode .ps-carriers,.ps-papermode .ps-grand{margin-left:16px;margin-right:16px}
  /* ⚠️ padding บน <table> ที่ border-collapse:collapse ไม่มีผลตามสเปก
     ขอบกระดาษจึงต้องไปอยู่ที่เซลล์ ไม่ใช่ที่ตัวตาราง */
  .ps-papermode .ps-card{
    position:relative;margin:0 auto 18px;border-radius:0;border:1px solid #C9D2DD;
    box-shadow:0 2px 10px rgba(15,23,42,.13);overflow:visible;
    width:210mm;padding:0;                   /* ฐาน = A4 ถูกตั้งแต่ก่อน JS ทำงาน */
  }
  .ps-papermode .ps-card > thead > tr > td{padding:10mm 10mm 0}
  .ps-papermode .ps-card > tbody > tr > td{padding:0 10mm 10mm}
  body.ps-paper-label .ps-papermode .ps-card{width:150mm}
  body.ps-paper-label .ps-papermode .ps-card > thead > tr > td{padding:4mm 4mm 0}
  body.ps-paper-label .ps-papermode .ps-card > tbody > tr > td{padding:0 4mm 4mm}
  body.ps-portrait   .ps-papermode .ps-card{width:100mm}
  /* หัวใบเดิมกินขอบเต็ม ในโหมดกระดาษต้องอยู่ในขอบพิมพ์ */
  .ps-papermode .ps-head{margin:0}
  .ps-papermode .ps-group{padding-left:0;padding-right:0}
  .ps-papermode .ps-summary,.ps-papermode .ps-empty{padding-left:0;padding-right:0}

  .ps-pagecount{display:block;font-size:10px;color:#C7D2FE;margin-top:2px}

  .ps-cut{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed #94A3B8;
    pointer-events:none;z-index:2}
  .ps-cut span{position:absolute;right:4px;top:-9px;background:#E9EDF2;color:#64748B;
    font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}

  @media print{
    .ps-papermode{background:#fff!important;padding:0;border-radius:0}
    /* ⚠️ width:auto บน <table> = หดตามเนื้อหา (ไม่เหมือน block ที่เต็มความกว้าง)
       ต้องสั่ง 100% ไม่งั้นพิมพ์ออกมาไม่เต็มหน้ากระดาษ */
    .ps-papermode .ps-card{width:100%!important;padding:0!important;border:0!important;
      box-shadow:none!important;margin:0!important}
    /* @page คุมขอบกระดาษจริงแล้ว เซลล์ต้องไม่เว้นซ้ำอีกชั้น */
    .ps-papermode .ps-card > thead > tr > td,
    .ps-papermode .ps-card > tbody > tr > td{padding:0!important}
    .ps-cut{display:none!important}
  }
  /* การ์ดเป็น <table> แล้ว กันสไตล์ตารางอื่นมากวน */
  .ps-card{border-collapse:collapse;width:100%;table-layout:fixed}
  .ps-card > thead > tr > td,.ps-card > tbody > tr > td{padding:0;border:0}
  @media print{
    /* หัวใจของเรื่อง: เบราว์เซอร์พิมพ์ thead ซ้ำทุกหน้าที่ตารางกินไป
       จึงได้หัวขนส่งบนทุกแผ่นโดยไม่ต้องคำนวณเอง */
    .ps-card > thead{display:table-header-group}
    .ps-card > tbody{display:table-row-group}
  }
</style>
</head>
<body data-wms-module="picking">

<div class="wms-shell">
<div data-wms-shell="picking" data-root="../" class="no-print"></div>
<div class="wms-main">

  <div class="mod-head no-print">
    <div class="mod-title">
      <div class="ic">🧾</div>
      <div>
        <h2>สรุปหยิบของ · Picking Sheet</h2>
        <p>รวมยอดที่ต้องหยิบทั้งวันเป็นใบเดียว จัดกลุ่มตามชนิดของ แล้วสั่งพิมพ์</p>
      </div>
    </div>
  </div>

  <div class="pk-src no-print" id="src"></div>

  <div class="main">
    <div class="ps-bar no-print">
      <span class="ps-lbl">ใช้ข้อมูลจาก</span>
      <button class="ps-opt active" data-src="1" onclick="setPickSource(1)">🌅 Daily Logis</button>
      <button class="ps-opt" data-src="2" onclick="setPickSource(2)">🌆 Daily CRM</button>
      <span class="ps-sep"></span>
      <span class="ps-lbl">พิมพ์</span>
      <button class="ps-opt active" data-filter="all"  onclick="setPickFilter('all')">ทั้งหมด</button>
      <button class="ps-opt" data-filter="bed"  onclick="setPickFilter('bed')">🛏️ เฉพาะที่นอน</button>
      <button class="ps-opt" data-filter="gift" onclick="setPickFilter('gift')">🎁 เฉพาะของแถม</button>
      <span class="ps-sep"></span>
      <span class="ps-lbl">กระดาษ</span>
      <button class="ps-opt active" data-paper="a4" onclick="setPickPaper('a4')">A4</button>
      <button class="ps-opt" data-paper="land" onclick="setPickPaper('land')">🏷️ 150×100 แนวนอน</button>
      <button class="ps-opt" data-paper="port" onclick="setPickPaper('port')">🏷️ 100×150 แนวตั้ง</button>
      <span class="ps-spacer"></span>

<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/**
 * ใบหยิบของ — ย้ายออกมาจากแท็บในโมดูลเทียบ Order
 *
 * เป็นงานของคลัง ไม่ใช่งานเทียบออเดอร์: คนละคน คนละจังหวะของวัน และเปิดมาเพื่อ
 * พิมพ์อย่างเดียว ไม่ได้มาดูว่าสองรอบตรงกันไหม
 *
 * กฎการนับและจัดกลุ่มอยู่ที่ ../wms-pick.js ชุดเดียวกับที่แท็บเช็คสต๊อกใช้ —
 * ถ้าต่างคนต่างถือ วันหนึ่งใบหยิบจะบอกให้หยิบ 12 แต่เช็คสต๊อกบอกต้องใช้ 9
 */
function carriersOf() {
  const o = window.OrderIndex ? OrderIndex.getCarriers() : null;
  return o ? o.carriers : [];
}
function stockMap() {
  const o = window.WmsStock ? WmsStock.read() : null;
  return o ? o.map : {};
}
const PC = (item) => WmsPick.categoryOf(item, stockMap());
const PN = (item) => WmsPick.nameOf(item, stockMap());
function inStock(item) { return !!stockMap()[item.sku]; }

/** วันของงานในใบ ไม่ใช่วันที่กดพิมพ์ — ทีมทำงานล่วงหน้า */
function sheetDate(cars) {
  const ds = [...new Set((cars || []).map(c => c.date).filter(Boolean))].sort();
  const longTH = (v) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
    return m ? new Date(+m[1], +m[2] - 1, +m[3])
      .toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' }) : '';
  };
  if (ds.length) return 'งานวันที่ ' + ds.map(longTH).join(' และ ');
  return 'พิมพ์เมื่อ ' + new Date().toLocaleDateString('th-TH',
    { day:'numeric', month:'long', year:'numeric' });
}

/* ══════════ การจัดกลุ่มสินค้าในใบสรุปหยิบของ ══════════
   จำแนกจาก "ชื่อสินค้า" ซึ่งขึ้นต้นด้วยคำประเภทเสมอ เช่น
     ที่นอน 6FT Emmas Boston…     เก้าอี้เพื่อสุขภาพ Lunio…
     ท็อปโต๊ะ 160x80CM…           แถม - หมอน Morning Sleep…

   แก้กฎได้ที่นี่ที่เดียว ลำดับสำคัญ: อันที่เจาะจงกว่าต้องอยู่ก่อน

   ⚠️ ของที่ไม่เข้ากฎไหนเลยจะไปอยู่กลุ่ม "อื่น ๆ" — ไม่หายไปจากใบ
      เพราะของหายจากใบหยิบแปลว่าลืมหยิบจริง */

/**
 * ชื่อที่ใช้ "จำแนกประเภทและขนาด"
 *
 * ไฟล์สต๊อกระบุขนาด/ประเภทชัดกว่าไฟล์ออเดอร์มาก จึงใช้ description จาก
 * stockMap เป็นหลัก แล้วค่อยถอยไปใช้ชื่อจากไฟล์ออเดอร์เมื่อ
 *   • ยังไม่ได้โหลดไฟล์สต๊อก  หรือ
 *   • SKU นั้นไม่มีในไฟล์สต๊อก
 * ใบหยิบจึงยังใช้ได้แม้ไม่มีสต๊อก แค่จำแนกหยาบลง
 */

/** SKU นี้มีในไฟล์สต๊อกไหม — ใช้ติดป้ายเตือนบนใบ */

/** ขนาดที่นอนจากชื่อ เช่น "6FT" "3.5FT" → 6, 3.5 (ไม่เจอ = null) */

/** จับสินค้าเข้ากลุ่ม ตัวแรกที่ตรงชนะ ไม่ตรงเลย → อื่น ๆ */


/* ══════════ ตัวอย่างตามขนาดกระดาษ ══════════
   แสดงเป็นแผ่นกระดาษขนาดจริงพร้อมเส้นบอกว่าตัดหน้าตรงไหน

   ⚠️ เส้นแบ่งเป็นการ "คำนวณ" ไม่ใช่ผลจริง — ตอนพิมพ์เบราว์เซอร์เป็นคนตัดสิน
      และฟอนต์ตอนพิมพ์อาจต่างจากบนจอเล็กน้อย จึงอาจคลาดหนึ่งบรรทัด
      ใช้ดูว่ากินกี่หน้า/จัดหน้าสวยไหม ถ้าต้องการเป๊ะ 100% ให้กด Ctrl+P */
const PAPER = {
  a4:     { w: 210, h: 297, margin: 10, label: 'A4' },
  land:   { w: 150, h: 100, margin: 4,  label: '150×100 แนวนอน' },
  port:   { w: 100, h: 150, margin: 4,  label: '100×150 แนวตั้ง' },
};

/** px ต่อ 1mm ของเบราว์เซอร์นี้ วัดจริงไม่เดา */
function mmPx() {
  const d = document.createElement('div');
  d.style.cssText = 'width:100mm;position:absolute;visibility:hidden;top:-9999px';
  document.body.appendChild(d);
  const px = d.getBoundingClientRect().width / 100;
  d.remove();
  return px || 3.7795;
}

/**
 * ลากเส้นแบ่งหน้าบนแต่ละใบ
 * แต่ละขนส่งขึ้นหน้าใหม่เสมอ การนับหน้าจึงเริ่มใหม่ทุกใบ
 */
function drawPageGuides() {
  const pg = PAPER[pickPaper] || PAPER.a4;
  const px = mmPx();
  const usableH = (pg.h - pg.margin * 2) * px;

  document.querySelectorAll('#pickSumBody .ps-card').forEach(card => {
    card.querySelectorAll('.ps-cut').forEach(e => e.remove());
    const h = card.scrollHeight;
    const pages = Math.max(1, Math.ceil(h / usableH));
    card.dataset.pages = pages;

    for (let i = 1; i < pages; i++) {
      const cut = document.createElement('div');
      cut.className = 'ps-cut';
      cut.style.top = (i * usableH) + 'px';
      const who = card.querySelector('.ps-carrier');
      cut.innerHTML = '<span>ตัดหน้า · หน้า ' + (i + 1) +
        (who ? ' · ขึ้นหัว ' + (who.dataset.label || who.textContent) : '') + '</span>';
      card.appendChild(cut);
    }
    const tag = card.querySelector('.ps-pagecount');
    if (tag) tag.textContent = pages > 1 ? pages + ' หน้า' : '1 หน้า';
  });
}

/* ══════════ สรุปหยิบของ (แยกตามขนส่ง) ══════════
   ใช้ WmsPick.aggregateSKUDemand() ตัวเดียวกับแท็บเช็คสต๊อก แต่เรียกทีละขนส่ง
   แทนที่จะรวมทุกเจ้าเข้าด้วยกัน — น้องในทีมจะได้หยิบของแต่ละคันในรอบเดียว */
let pickSource = 1;   // 1 = Daily Logis (รอบเช้า), 2 = Daily CRM
let pickFilter = 'all';  // 'all' | 'bed' | 'gift' — แยกใบให้สองคนหยิบพร้อมกันได้
// ว่าง = แยกใบทุกขนส่ง · 1 เจ้า = ใบของเจ้านั้น · หลายเจ้า = รวมเป็นใบเดียว
let pickCarriers = [];
let pickPaper = 'a4';    // 'a4' | 'label' (150×100 มม.)
/* ช่วงเลขคันที่ใช้แยกใบ เช่น "1-20, 21-60" — ว่าง = ไม่แยก
   เก็บไว้ในเครื่อง เพราะทีมแบ่งกลุ่มแบบเดิมทุกวัน ไม่ควรต้องพิมพ์ใหม่ทุกเช้า */
const TG_KEY = 'wms:pick:truckGroups';
let truckGroups = (() => { try { return localStorage.getItem(TG_KEY) || ''; } catch (e) { return ''; } })();

/* กลุ่มรถที่ล็อกอยู่ — '' = ไม่ล็อก (ดูทุกกลุ่ม), 'none' = เฉพาะงานที่ไม่มีเลขคัน
   จำไว้ในเครื่องเหมือนช่วงเลข เพราะคนหยิบคนเดิมมักดูกลุ่มเดิมทุกวัน */
const TL_KEY = 'wms:pick:truckLock';
let truckLock = (() => { try { return localStorage.getItem(TL_KEY) || ''; } catch (e) { return ''; } })();

function setTruckLock(id) {
  truckLock = (truckLock === id) ? '' : id;   // กดซ้ำที่ปุ่มเดิม = ปลดล็อก
  try { localStorage.setItem(TL_KEY, truckLock); } catch (e) {}
  renderPickSum();
}

/** แถวนี้อยู่ในกลุ่มที่ล็อกไว้ไหม — รับค่าล็อกมา ไม่อ่าน truckLock เอง
    เพราะค่าที่จำไว้กับค่าที่มีผลจริงเป็นคนละตัวกัน (ดู teamNow) */
function inTeam(r, lock) {
  return !lock || WmsTruck.bucketOf(r.truck) === lock;
}

/**
 * ตัวกรองของรถทั้งสามแถว (กลุ่มรถ · แยกใบเอง · Sup) เป็นเรื่องของขนส่งเจ้าเดียว
 * จึงขึ้นต่อเมื่อเจาะจงมาที่เจ้านั้นแล้ว — ตอนกาง "แยกทุกขนส่ง" หรือรวมหลายเจ้า
 * เป็นใบเดียว การล็อกกลุ่มรถจะไปตัดงานของเจ้าที่ไม่มีชื่อรถทิ้งทั้งหมด
 *
 * ไม่ได้เช็คชื่อ "รถบริษัท" ตรง ๆ แต่เช็คว่าเจ้าที่เลือกมีชื่อรถจริงไหม —
 * วันไหนขนส่งเจ้าอื่นเริ่มส่งชื่อรถมาด้วย ปุ่มจะขึ้นเองโดยไม่ต้องแก้โค้ด
 */
function truckScope(keys) {
  if (!keys || keys.length !== 1) return null;
  const c = carriersOf().find(x => x.key === keys[0]);
  return c && hasTruck([c]) ? c : null;
}

/**
 * กลุ่มรถที่กรองอยู่จริง ไม่ใช่ค่าที่จำไว้เฉย ๆ
 *
 * ล็อกรถเสริมไว้แล้วกด "แยกทุกขนส่ง" — แถวปุ่มหายไป แต่ถ้าค่ายังมีผล งานของ
 * KEX/BEST/BI จะถูกตัดทิ้งทั้งหมดเพราะไม่มีเลขคัน โดยไม่มีอะไรบนจอบอกว่าทำไม
 * ค่าที่จำไว้จึงมีผลเฉพาะตอนที่ปุ่มโผล่ให้กดปลดได้เท่านั้น
 */
function teamNow(keys) {
  return truckScope(keys) ? truckLock : '';
}

/** ขนส่งกลุ่มนี้มีชื่อรถในรอบที่เลือกอยู่ไหม */
function hasTruck(cars) {
  return cars.some(c => ((pickSource === 1 ? c.data1 : c.data2) || []).some(r => r.truck));
}

/* Sup ที่ล็อกอยู่ — ลิสต์ว่าง = ทุกเจ้า
   ขนส่งรถบริษัทมีของหลายเจ้าปนกันในรอบเดียว (Lunio กับ JST) ซึ่งหยิบแยกกัน
   เลือกได้หลายเจ้าพร้อมกัน เพราะบางวันสองเจ้ารวมใบเดียวก็ได้ แต่ไม่อยากได้เจ้าที่สาม
   จำไว้ในเครื่องเหมือนล็อกกลุ่มรถ คนเดิมมักหยิบของเจ้าเดิมทุกวัน */
const SUP_KEY = 'wms:pick:sup';

/* เคยเก็บเป็นสตริงเดี่ยว ("Lunio") ตอนที่เลือกได้ทีละเจ้า — เครื่องที่ใช้อยู่แล้ว
   ยังมีค่าเก่าค้างใน localStorage อ่านให้ได้ทั้งสองแบบ ไม่งั้นเปิดมาวันแรก
   หลังอัปเดตแล้วล็อกที่ตั้งไว้จะหายไปเฉย ๆ */
let supLock = (() => {
  try {
    var raw = localStorage.getItem(SUP_KEY) || '';
    if (!raw) return [];
    if (raw.charAt(0) === '[') {
      var a = JSON.parse(raw);
      return Array.isArray(a) ? a.filter(Boolean) : [];
    }
    return [raw];
  } catch (e) { return []; }
})();

function setSupLock(v) {
  // ปุ่ม "ทุกเจ้า" ส่ง '' มา = ปลดทั้งหมด · ปุ่มเจ้าอื่นสลับเข้า-ออกทีละเจ้า
  supLock = !v ? []
    : supLock.indexOf(v) >= 0 ? supLock.filter(x => x !== v)
    : supLock.concat([v]);
  try { localStorage.setItem(SUP_KEY, JSON.stringify(supLock)); } catch (e) {}
  renderPickSum();
}

/**
 * รายชื่อ Sup ที่ให้เลือกได้ตอนนี้ — คืน [] แปลว่าไม่ต้องขึ้นแถวนี้เลย
 *
 * ปุ่ม Sup เป็นเรื่องของขนส่งรถบริษัทเจ้าเดียว จึงขึ้นเฉพาะตอนที่เจาะจงมาที่รถบริษัทแล้ว
 * คือกดเลือกขนส่งเจ้าเดียว หรือกดล็อกกลุ่มรถ — มีแต่งานรถบริษัทที่มีชื่อคัน
 * กลุ่มรถจึงเป็นรถบริษัทอยู่แล้วในตัว ส่วนตอนกาง "แยกทุกขนส่ง" ยังไม่ได้เจาะจงอะไร ปุ่มจึงไม่ขึ้น
 *
 * อ่านชื่อเจ้าจากข้อมูลของวันนั้น ไม่ฝัง Lunio/JST ไว้ในโค้ด — วันไหนมีเจ้าที่สาม
 * ปุ่มขึ้นเอง วันไหนเหลือเจ้าเดียวปุ่มหายไปเอง เพราะไม่มีอะไรให้แยก
 *
 * นับเฉพาะแถวที่จะขึ้นใบจริง คือรอบที่เลือกอยู่และกลุ่มรถที่ล็อกไว้ — ปุ่มที่กด
 * แล้วได้ใบเปล่า คือปุ่มที่ทำให้คนสงสัยว่าตัวเองกดผิดหรือข้อมูลหาย
 */
function supsInData(keys) {
  if (!keys || !keys.length) return [];
  const lock = teamNow(keys);
  const sel = carriersOf().filter(c => keys.includes(c.key));
  const per = sel.map(c => supsIn([c], lock));
  /* ต้องมีสักเจ้าที่รับของมากกว่าหนึ่งเจ้าจริง ๆ ถึงจะมีอะไรให้แยก — เลือก KEX
     กับ BEST ที่มี Sup เจ้าเดียวเท่ากันทั้งคู่ ปุ่มก็ไม่ควรขึ้น */
  if (!per.some(l => l.length > 1)) return [];
  const all = new Set();
  per.forEach(l => l.forEach(x => all.add(x)));
  return [...all].sort((a, b) => a.localeCompare(b, 'th'));
}

/**
 * ขนส่งเจ้านี้มีคอลัมน์ Sup กรอกไว้ไหม (ในรอบที่เลือกอยู่)
 *
 * ใช้ตัดสินว่าการล็อก Sup จะไปแตะเจ้านั้นหรือไม่ — เจ้าที่ไม่มี Sup เลย ถ้าเอา
 * กฎ "ต้องเท่ากับ Lunio" ไปจับ ของจะหายทั้งเจ้าเพราะช่องมันว่าง ซึ่งตรงข้ามกับ
 * สิ่งที่คนกดต้องการ คือเอาเฉพาะ Lunio ของรถบริษัท ไปรวมกับเจ้าอื่นทั้งก้อน
 */
function carrierHasSup(c, src) {
  return ((src === 1 ? c.data1 : c.data2) || []).some(r => String(r.sup || '').trim());
}

/** ชื่อ Sup ที่อยู่ในขนส่งกลุ่มนี้ ตามรอบและกลุ่มรถที่เลือกอยู่ */
function supsIn(cars, lock) {
  const seen = new Set();
  cars.forEach(c => ((pickSource === 1 ? c.data1 : c.data2) || [])
    .filter(r => inTeam(r, lock))
    .forEach(r => { const s = String(r.sup || '').trim(); if (s) seen.add(s); }));
  return [...seen].sort((a, b) => a.localeCompare(b, 'th'));
}

/**
 * มีขนส่งเจ้าไหนที่กดแล้วจะเจอปุ่ม Sup ไหม
 *
 * ปุ่ม Sup ถูกซ่อนไว้จนกว่าจะเจาะจงมาที่รถบริษัท ซึ่งถูกแล้ว แต่คนที่ไม่รู้กติกา
 * จะเห็นแค่ว่าปุ่มหายไป — ใบ้ไว้ข้างแถวขนส่งว่ากดเจ้าเดียวแล้วจะเจอ
 */
function hasMultiSup() {
  return carriersOf().some(c => supsIn([c], '').length > 1);
}

// นับชิ้นตามตัวกรองที่เปิดอยู่ ใช้ทั้งยอดรวมของใบ ยอดแยกรายเจ้าในหัวใบ และแผงตัดออเดอร์
const piecesOf = rows => Object.values(WmsPick.aggregateSKUDemand(rows))
  .filter(x => pickFilter === 'all' || (pickFilter === 'bed') === (x.type === 'bed'))
  .reduce((n, x) => n + x.qty, 0);

/**
 * ออเดอร์ที่ตัดออกจากยอด
 *
 * เก็บใน sessionStorage ไปกับข้อมูลของวัน ไม่ใช่ localStorage เหมือนล็อก Sup
 * กับกลุ่มรถ — สองอันนั้นเป็นนิสัยการทำงานที่ควรจำข้ามวัน ส่วนการตัดออเดอร์เป็น
 * ข้อเท็จจริงของวันนี้วันเดียว ถ้าจำข้ามวัน ของจะหายจากใบพรุ่งนี้เงียบ ๆ
 * โดยไม่มีใครสั่ง ซึ่งเป็นความผิดพลาดชนิดที่ไม่มีอะไรบนจอชี้ให้เห็น
 *
 * ผูกไว้กับ at ของชุดข้อมูล: ดึงข้อมูลใหม่ = at เปลี่ยน = ที่ตัดไว้หมดอายุทันที
 * โดยไม่ต้องให้หน้าอื่นมาสั่งล้าง
 */
const CUT_KEY = 'wms:pick:cut';
let cutIds = new Set();
let cutMode = 'split';   // 'split' = แยกเป็นใบต่อท้าย · 'drop' = ไม่พิมพ์เลย
let cutOpen = false;     // แผงเลือกออเดอร์เปิดอยู่ไหม
let cutQ = '';           // คำค้นในแผง

function dataAt() {
  const o = window.OrderIndex && OrderIndex.getCarriers();
  return o ? o.at : 0;
}

function loadCuts() {
  try {
    const o = JSON.parse(sessionStorage.getItem(CUT_KEY) || 'null');
    if (!o || o.at !== dataAt()) { cutIds = new Set(); return; }
    cutIds = new Set(o.ids || []);
    if (o.mode === 'drop' || o.mode === 'split') cutMode = o.mode;
  } catch (e) {
    cutIds = new Set();
  }
}

function saveCuts() {
  try {
    sessionStorage.setItem(CUT_KEY, JSON.stringify({ at: dataAt(), ids: [...cutIds], mode: cutMode }));
  } catch (e) {}
}

function toggleCut(id) {
  cutIds.has(id) ? cutIds.delete(id) : cutIds.add(id);
  saveCuts();
  renderPickSum();
}

function setCutMode(m) { cutMode = m; saveCuts(); renderPickSum(); }
function clearCuts() { cutIds = new Set(); saveCuts(); renderPickSum(); }
function toggleCutPanel() { cutOpen = !cutOpen; renderPickSum(); }

function setCutQ(v) {
  cutQ = v;
  renderPickSum();
  // วาดใหม่แล้ว input ตัวเดิมหายไป ต้องคืนโฟกัสให้พิมพ์ต่อได้ไม่สะดุด
  const el = document.getElementById('cutQ');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/**
 * ออเดอร์ของวันนี้ พร้อมจำนวนชิ้น — ข้อมูลของแผงเลือกตัด
 *
 * ไล่จากทุกขนส่งเสมอ ไม่ใช่เฉพาะที่เลือกดูอยู่ เพราะถ้าลิสต์แคบตามขอบเขต
 * ออเดอร์ที่ตัดไว้แล้วจะหายจากลิสต์ทันทีที่เปลี่ยนขอบเขต แล้วปลดไม่ได้อีกเลย
 * กลายเป็นของที่หายจากใบโดยไม่มีทางเอากลับ
 */
function ordersOfDay() {
  const by = new Map();
  carriersOf().forEach(c => ((pickSource === 1 ? c.data1 : c.data2) || []).forEach(r => {
    const id = String(r.orderID || '').trim();
    if (!id) return;
    if (!by.has(id)) {
      by.set(id, { id, carrier: c.key, customer: r.customer || '—', truck: r.truck || '', rows: [] });
    }
    by.get(id).rows.push(r);
  }));
  /* เรียงตามเลขคัน คันที่ไม่มีเลข (งาน Event ที่เขียน "5 คัน") ไว้ท้ายสุด
     ลำดับเดียวกับผังงานรถวันนี้ จะได้ไล่หาออเดอร์ด้วยสายตาแบบเดียวกัน */
  return [...by.values()].map(o => ({ ...o, pieces: piecesOf(o.rows) }))
    .sort((a, b) => {
      const na = WmsTruck.numberOf(a.truck), nb = WmsTruck.numberOf(b.truck);
      if (na == null && nb == null) return a.id.localeCompare(b.id, 'th');
      if (na == null) return 1;
      if (nb == null) return -1;
      return na - nb || a.id.localeCompare(b.id, 'th');
    });
}

/**
 * งาน Event — ชีตเขียนชื่อรถเป็นจำนวนคัน ("5 คัน") ไม่ใช่ชื่อคัน เพราะงานเดียว
 * ใช้รถหลายคันส่งลูกค้ารายเดียว ทีมอื่นรับไปจัดต่างหาก จึงเป็นเคสที่ต้องตัดออก
 * บ่อยที่สุด — ปุ่มเดียวจบ ไม่ต้องไล่ติ๊กทีละใบ
 *
 * ใช้ isCount() ไม่ใช่ bucketOf() === 'none' เพราะ 'none' รวมแถวที่ไม่มีชื่อรถ
 * เลยเข้าไปด้วย ซึ่งคือออเดอร์ของขนส่งเจ้าอื่นทั้งหมด — กดทีเดียวของหายทั้งวัน
 */
function eventOrders() {
  return ordersOfDay().filter(o => WmsTruck.isCount(o.truck));
}

function cutEventOrders() {
  const ev = eventOrders();
  const allCut = ev.length && ev.every(o => cutIds.has(o.id));
  ev.forEach(o => { allCut ? cutIds.delete(o.id) : cutIds.add(o.id); });
  saveCuts();
  renderPickSum();
}

/* ปุ่มสองอันท้ายขึ้นเฉพาะเมื่อมีงานตกอยู่ในนั้นจริง — ปุ่มที่กดแล้วได้ใบเปล่า
   คือปุ่มที่ทำให้คนสงสัยว่าตัวเองกดผิดหรือข้อมูลหาย */
const SPARE_LOCKS = [
  { id: 'outside', label: 'นอกกลุ่ม' },
  { id: 'none',    label: 'ไม่ระบุคัน' },
];

function spareLocksInData(cars) {
  const rows = cars.flatMap(c => (pickSource === 1 ? c.data1 : c.data2) || []);
  return SPARE_LOCKS.filter(s => rows.some(r => r.truck && WmsTruck.bucketOf(r.truck) === s.id));
}

function setTruckGroups(v) {
  truckGroups = v;
  try { localStorage.setItem(TG_KEY, v); } catch (e) {}
  renderPickSum();
  // วาดใหม่แล้ว input ตัวเดิมหายไป ต้องคืนโฟกัสให้พิมพ์ต่อได้ไม่สะดุด
  const el = document.getElementById('truckGroups');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

/** ข้อมูลชุดนี้มีชื่อรถไหม — ขนส่งเจ้าอื่นไม่มีคอลัมน์นี้ */
/**
 * สลับขนาดกระดาษที่จะพิมพ์
 * เนื้อหาเหมือนกันทุกอย่าง ต่างแค่ @page และความแน่นของตัวอักษร —
 * รายการยาวจะไหลลงดวงถัดไปเอง และยังขึ้นดวงใหม่ทุกขนส่งเหมือนเดิม
 */
/**
 * ทาสีปุ่มในกลุ่มหนึ่งให้ตรงกับค่าที่เลือกอยู่ — กลุ่มคือปุ่มที่มี data ตัวเดียวกัน
 *
 * ยึดจาก "ค่าปัจจุบันคืออะไร" ไม่ใช่ "ผู้ใช้เพิ่งกดปุ่มไหน" ปุ่มจึงถูกเสมอ
 * แม้ค่าจะถูกตั้งจากที่อื่นโดยไม่มีการกด
 *
 * เดิมทั้งสามฟังก์ชันกรองด้วย '#tab-picksum .ps-opt' ซึ่งเป็น id ของแท็บสมัยที่
 * หน้านี้ยังอยู่ในเทียบ Order พอย้ายออกมาเป็นโมดูลของตัวเอง id นั้นไม่มีแล้ว
 * querySelectorAll จึงคืนค่าว่าง ไม่มีใครถูกถอด active ออก แล้วบรรทัดถัดมาก็เติม
 * ให้ปุ่มที่กดอีกอัน — กดไปเรื่อย ๆ ปุ่มก็ติดสีสะสมจนม่วงทั้งแถบ
 * และของเดิมยังกวาด .ps-opt ทุกปุ่มโดยไม่แยกกลุ่ม กลุ่มอื่นจึงดับไปด้วย
 */
function pickOne(attr, val) {
  document.querySelectorAll('.ps-bar .ps-opt[data-' + attr + ']').forEach(b =>
    b.classList.toggle('active', b.dataset[attr] === String(val)));
}

function setPickPaper(v) {
  if (!PAPER[v]) v = 'a4';
  pickPaper = v;
  const pg = PAPER[v];
  pickOne('paper', v);

  // ขนาดกระดาษเล็กใช้ตัวอักษรบีบ ส่วน A4 ใช้ปกติ
  document.body.classList.toggle('ps-paper-label', v !== 'a4');
  document.body.classList.toggle('ps-a4', v === 'a4');
  document.body.classList.toggle('ps-portrait', v === 'port');

  // ระบุทั้งกว้างและสูงเสมอ เบราว์เซอร์จึงล็อกแนวให้ตรงกับที่เลือกไว้
  // (นี่คือเหตุผลที่ปุ่มแนวตั้ง/แนวนอนใน print dialog กดไม่ได้ — จึงต้องเลือกที่นี่)
  let st = document.getElementById('ps-page-size');
  if (!st) { st = document.createElement('style'); st.id = 'ps-page-size'; document.head.appendChild(st); }
  st.textContent = '@page { size: ' + pg.w + 'mm ' + pg.h + 'mm; margin: ' + pg.margin + 'mm; }';

  drawPageGuides();
}


/**
 * กดชิปขนส่ง — กดซ้ำเพื่อเอาออก, ไม่ส่ง key มาคือกลับไปแยกใบทุกเจ้า
 *
 * เลือกหลายเจ้าแล้ว "รวมเป็นใบเดียว" ไม่ใช่พิมพ์หลายใบ เพราะจุดประสงค์ของแท็บนี้
 * คือหยิบรอบเดียว ถ้าคนเดียวรับผิดชอบสองขนส่งแล้วยังแยกใบ ก็ต้องเดินหยิบซ้ำ
 * สองรอบอยู่ดี ซึ่งเป็นสิ่งที่แท็บนี้มีไว้ตัดทิ้ง
 */
function togglePickCarrier(key) {
  if (!key) { pickCarriers = []; renderPickSum(); return; }
  const i = pickCarriers.indexOf(key);
  if (i < 0) pickCarriers.push(key); else pickCarriers.splice(i, 1);
  renderPickSum();
}

function selectAllPickCarriers() {
  pickCarriers = carriersOf().map(c => c.key);
  renderPickSum();
}

function setPickFilter(v) {
  pickFilter = v;
  pickOne('filter', v);
  renderPickSum();
}

function setPickSource(n) {
  pickSource = n;
  pickOne('src', n);
  renderPickSum();
}

function renderPickSum() {
  const host = document.getElementById('pickSumBody');
  if (!carriersOf().length) {
    host.innerHTML = '<div class="empty-state" style="padding:44px 20px;text-align:center;color:var(--muted)">' +
      'ยังไม่มีข้อมูลออเดอร์ — ไปที่แท็บ <b>เทียบ Order</b> แล้วกดดึงข้อมูลก่อน</div>';
    return;
  }

  loadCuts();   // ดึงข้อมูลรอบใหม่ = at เปลี่ยน = ที่ตัดไว้เมื่อกี้หมดอายุเอง

  const srcName = pickSource === 1 ? 'Sheet Daily Logis (รอบเช้า)' : 'Sheet Daily CRM';
  let html = '';
  let grand = 0;
  /* ของที่ขาดข้ามทุกใบ รวมเป็น SKU เดียวกันครั้งเดียว — ใบเบิกย้ายของทั้งคลัง
     ถ้าสองใบขาด SKU เดียวกันแล้วขอทั้งสองครั้ง จะได้ใบเบิกที่ขอเกินจริง */
  SHORTAGE = new Map();

  // ชิปที่เลือกไว้อาจชี้ขนส่งที่หายไปหลังดึงข้อมูลรอบใหม่
  const keys = pickCarriers.filter(k => carriersOf().some(c => c.key === k));
  if (keys.length !== pickCarriers.length) pickCarriers = keys;

  /* Sup ที่กรองอยู่จริง ไม่ใช่ค่าที่จำไว้เฉย ๆ — ตัวกรองที่มองไม่เห็นคือของอันตราย
     ถ้าปลดล็อกกลุ่มรถแล้วแถว Sup หายไปแต่ยังกรองอยู่ ของจะหายจากใบโดยไม่มีอะไร
     บนจอบอกว่าทำไม ค่าที่จำไว้จึงมีผลเฉพาะตอนที่ปุ่มโผล่ให้กดปลดได้เท่านั้น */
  const sups = supsInData(keys);
  /* เรียงตามลำดับปุ่มที่เห็น ไม่ใช่ลำดับที่กด — หัวใบจะได้เขียนเหมือนกันทุกครั้ง
     ไม่ว่าจะกด Lunio ก่อนหรือ JST ก่อน ใบที่พิมพ์ซ้ำจึงหน้าตาเหมือนเดิม */
  const supNow = sups.filter(x => supLock.indexOf(x) >= 0);

  /* ทั้งสามแถวของรถขึ้นพร้อมกัน และมีผลพร้อมกัน — ค่าที่จำไว้ทั้งกลุ่มรถและช่วง
     เลขคันมีผลเฉพาะตอนที่ปุ่มโผล่ให้กดปลดได้ ไม่งั้นกด "แยกทุกขนส่ง" แล้วงานของ
     เจ้าที่ไม่มีชื่อรถจะหายทั้งก้อนโดยไม่มีอะไรบนจอบอกว่าทำไม */
  const truckOn = !!truckScope(keys);
  const teamLock = teamNow(keys);

  /* กรอง Sup ตั้งแต่ตรงนี้ ไม่ใช่ทีหลัง — ยอดแยกรายขนส่งบนหัวใบรวมก็คิดจาก
     rowsOf เหมือนกัน ถ้ากรองทีหลังหัวใบจะบอกยอดหนึ่ง เนื้อใบบอกอีกยอด

     และต้องกรองที่ระดับแถวออเดอร์ ไม่ใช่ที่รายการที่รวมยอดแล้ว เพราะ SKU
     เดียวกันถูกสั่งได้ทั้งจาก Lunio และ JST ในวันเดียวกัน พอรวมยอดแล้วมันเป็น
     บรรทัดเดียวที่มีทั้งสองเจ้าปนอยู่ข้างใน แยกทีหลังไม่ได้ */
  /* ล็อก Sup แตะเฉพาะขนส่งที่มีคอลัมน์นี้ — เจ้าที่ไม่มีผ่านมาทั้งก้อน
     ไม่งั้นกด Lunio ตอนรวมหลายเจ้า แล้ว KEX/BEST/BI หายหมดเพราะช่อง Sup ว่าง */
  const supAware = new Map();
  carriersOf().forEach(c => supAware.set(c.key, carrierHasSup(c, pickSource)));
  const inSup = (r, key) => !supNow.length || !supAware.get(key) ||
    supNow.indexOf(String(r.sup || '').trim()) >= 0;
  const isCut = r => cutIds.has(String(r.orderID || '').trim());
  const srcRows = c => (pickSource === 1 ? c.data1 : c.data2) || [];
  const rowsOf = c => srcRows(c).filter(r => inSup(r, c.key) && !isCut(r));
  const sel = carriersOf().filter(c => keys.includes(c.key));

  /**
   * บอกบนกระดาษว่าล็อก Sup ไปแตะอะไรบ้าง
   *
   * ใบที่หัวเขียนว่า "รถบริษัท + KEX HRZ · Lunio" อ่านได้ว่า KEX ถูกกรองด้วย
   * ซึ่งไม่จริง — KEX ไม่มีคอลัมน์ Sup จึงเอามาทั้งก้อน ต้องเขียนไว้ ไม่งั้น
   * คนอ่านจะเชื่อว่ายอด KEX บนใบนี้เป็นเฉพาะของ Lunio
   *
   * และแถวที่อยู่ในเจ้าที่มี Sup แต่ไม่ได้กรอก Sup จะไม่เข้าใบไหนเลย —
   * ของหายเงียบ ๆ แบบที่ไม่มีอะไรบนใบบอก จึงต้องนับแล้วเขียนไว้ด้วย
   */
  const supNote = (() => {
    if (!supNow.length) return '';
    const cars = sel.length ? sel : carriersOf();
    const aware = cars.filter(c => supAware.get(c.key));
    const plain = cars.filter(c => !supAware.get(c.key));
    /* นับเป็นชิ้น ไม่ใช่แถว เพราะชิ้นคือตัวเลขที่กระทบยอดได้ — ใบ Lunio 7 บวก
       ใบ JST 3 ไม่เท่ารถบริษัท 15 ก็เพราะ 5 ชิ้นนี้ ถ้าบอกเป็น "1 แถว"
       คนอ่านยังกระทบยอดไม่ได้อยู่ดี */
    const blank = piecesOf(aware.reduce((a, c) => a.concat(srcRows(c)
      .filter(r => !String(r.sup || '').trim() && !isCut(r) && inTeam(r, teamLock))), []));
    const bits = [];
    if (plain.length && aware.length) {
      bits.push('Sup ' + supNow.join(' + ') + ' ใช้กับ ' + aware.map(c => c.key).join(' · ') +
        ' เท่านั้น — ' + plain.map(c => c.key).join(' · ') + ' เอามาทั้งหมด');
    }
    if (blank) bits.push('มีของ ' + blank + ' ชิ้นที่ไม่ได้กรอก Sup ไม่อยู่ในใบนี้');
    return bits.length ? ' · ' + bits.join(' · ') : '';
  })();

  /**
   * วันที่บนหัวใบ = วันของงานในใบ ไม่ใช่วันที่กดพิมพ์
   *
   * เดิมใช้ new Date() ตรง ๆ ซึ่งผิดทุกครั้งที่ทีมทำงานล่วงหน้า — เย็นนี้พิมพ์ใบ
   * ไปหยิบของพรุ่งนี้ แล้วบนกระดาษเขียนวันนี้ ใบหยิบของถูกเก็บไว้และถูกใช้อ้างอิง
   * ทีหลัง วันที่ผิดบนกระดาษจึงอยู่ต่อไปนานกว่าวันที่ผิดบนจอมาก
   *
   * สคริปต์รุ่นเก่าที่ยังไม่ส่งวันที่มา จะเขียนว่า "พิมพ์เมื่อ" แทน เพื่อไม่ให้ใบ
   * อ้างว่าเป็นงานของวันนั้นทั้งที่ไม่รู้จริง
   */
  const longTH = (v) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
    if (!m) return '';
    return new Date(+m[1], +m[2] - 1, +m[3])
      .toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
  };
  function sheetDate(cars) {
    const ds = [...new Set((cars || []).map(c => c.date).filter(Boolean))].sort();
    if (ds.length) return 'งานวันที่ ' + ds.map(longTH).join(' และ ');
    return 'พิมพ์เมื่อ ' + new Date().toLocaleDateString('th-TH',
      { day:'numeric', month:'long', year:'numeric' });
  }

  // เลือกหลายเจ้า = ใบเดียวที่รวมยอดแล้ว ไม่ใช่หลายใบ
  const groups = keys.length > 1
    ? [{
        label: sel.map(c => c.key).join(' + '),
        parts: sel.map(c => ({ key: c.key, pieces: piecesOf(rowsOf(c)) })),
        rows:  sel.reduce((a, c) => a.concat(rowsOf(c)), []),
        cars:  sel,
      }]
    : (keys.length ? sel : carriersOf()).map(c => ({ label: c.key, parts: null, rows: rowsOf(c), cars: [c] }));

  /* แยกใบตามกลุ่มคนรถ — แต่ละกลุ่มหยิบของกันคนละรอบ จึงต้องได้ยอดของตัวเอง
     งานที่ดึงเลขคันไม่ได้ (เช่น "5 คัน" ของงาน Event) ไปรวมใบ "ไม่ระบุคัน"
     ไม่ใช่กระจายเข้าใบใดใบหนึ่ง เพราะจะทำให้ทีมนั้นหยิบของที่ไม่ใช่งานตัวเอง */
  /* ล็อกกลุ่มรถ = ดูกลุ่มเดียว จึงกรองก่อน แล้วไม่ต้องแยกใบต่อ — การแยกใบ
     ของสิ่งที่เหลือกลุ่มเดียวได้ใบเดิมกลับมาพร้อมหัวข้อที่ไม่ได้แบ่งอะไร */
  /* แถวถูกกรอง Sup ไปแล้วตั้งแต่ rowsOf — ตรงนี้เหลือแค่ติดชื่อ Sup บนหัวใบ
     และตัดขนส่งที่ไม่มีของเจ้านั้นเลยออก ไม่ให้เหลือใบเปล่า */
  const groupsS = !supNow.length ? groups : groups
    .filter(g => g.rows.length)
    .map(g => ({ ...g, label: g.label + ' · ' + supNow.join(' + ') }));

  const lockedTeam = WmsTruck.TRUCK_TEAMS.find(t => t.id === teamLock);
  const lockLabel = lockedTeam ? lockedTeam.label
    : (SPARE_LOCKS.find(s => s.id === teamLock) || {}).label || '';
  const groups1 = !teamLock ? groupsS : groupsS
    .map(g => ({ ...g, label: g.label + ' · ' + lockLabel, rows: g.rows.filter(r => inTeam(r, teamLock)) }))
    .filter(g => g.rows.length);

  const ranges = (truckOn && !teamLock) ? WmsTruck.parseRanges(truckGroups) : [];
  const groups2 = !ranges.length ? groups1 : groups1.flatMap(g => {
    const buckets = ranges.map(r => ({ label: r.label, rows: [] }));
    /* แยกสองกรณีที่ต่างกันจริง: ไม่มีเลขคันเลย กับ มีเลขแต่อยู่นอกช่วงที่ตั้งไว้
       ถ้ารวมเป็นก้อนเดียวชื่อ "ไม่ระบุคัน" งานของคัน 21 จะไปกองอยู่ในนั้นตอนที่
       ตั้งช่วงไว้แค่ 1-20 แล้วคนอ่านจะเชื่อว่าคันนั้นไม่มีเลข ทั้งที่แค่ตั้งช่วงไม่ครบ */
    const noNum = { label: 'ไม่ระบุคัน', rows: [] };
    const outside = { label: 'นอกช่วงที่ตั้งไว้', rows: [] };
    g.rows.forEach(r => {
      const num = WmsTruck.numberOf(r.truck);
      const i = WmsTruck.rangeIndex(num, ranges);
      if (i >= 0) buckets[i].rows.push(r);
      else (num == null ? noNum : outside).rows.push(r);
    });
    return buckets.concat(outside, noNum)
      .filter(b => b.rows.length)
      .map(b => ({ ...g, label: g.label + ' · ' + b.label, rows: b.rows }));
  });

  /* แถวที่ถูกตัดออก แต่ยังอยู่ในขอบเขตที่กำลังพิมพ์ (ขนส่งที่เลือก · Sup · กลุ่มรถ)
     คิดจากขอบเขตเดียวกับใบหลักเสมอ ใบหลักบวกใบนี้จึงเท่ายอดก่อนตัดพอดี
     ซึ่งเป็นสิ่งที่ตรวจด้วยตาได้ว่าไม่มีอะไรหายไประหว่างทาง */
  const cutByCarrier = new Map();
  (keys.length ? sel : carriersOf()).forEach(c => {
    const rs = srcRows(c).filter(r => inSup(r, c.key) && isCut(r) && inTeam(r, teamLock));
    if (rs.length) cutByCarrier.set(c.key, rs);
  });
  const cutRows = [...cutByCarrier.values()].flat();
  const cutPcs = piecesOf(cutRows);
  const cutList = [...new Set(cutRows.map(r => String(r.orderID || '').trim()).filter(Boolean))];

  /* บรรทัดเตือนบนหัวใบ ติดไปกับกระดาษด้วย — ใบที่ถูกตัดของออกไปแล้วแต่หน้าตา
     เหมือนใบเต็ม คือใบที่ทำให้หยิบขาดโดยไม่มีใครรู้ว่าทำไม

     คิดทีละใบตามขนส่งของใบนั้น ไม่ใช่แปะยอดรวมทั้งชุดลงทุกใบ — ใบ Kerry ที่ขึ้นว่า
     "ตัดออก 2 ออเดอร์" ทั้งที่ตัดของรถบริษัท ทำให้คนอ่านออกไปตามหาออเดอร์ที่ไม่มีอยู่ */
  const cutNoteFor = (cars) => {
    const rows = (cars || []).flatMap(c => cutByCarrier.get(c.key) || []);
    if (!rows.length) return '';
    const ids = [...new Set(rows.map(r => String(r.orderID || '').trim()).filter(Boolean))];
    return '<div class="ps-xnote">✂ ตัดออกจากใบนี้ <b>' + ids.length + '</b> ออเดอร์ · <b>' +
      piecesOf(rows) + '</b> ชิ้น — ' + (cutMode === 'split' ? 'พิมพ์แยกไว้ใบท้าย' : 'ไม่ได้พิมพ์') +
      '<br>' + esc(ids.join(', ')) + '</div>';
  };

  /* โหมดแยกใบ: ของที่ตัดออกไปโผล่เป็นใบของตัวเองต่อท้าย ไม่ใช่หายไปจากระบบ
     ใบนี้เดินผ่านทางเดียวกับใบอื่นทุกอย่าง (จัดกลุ่ม เช็คสต๊อก แบ่งหน้า)
     ต่างแค่ไม่ถูกนับเข้ายอดรวม เพราะมันคือของที่ตั้งใจไม่นับ */
  /* หัวใบตัดต้องบอกขอบเขตเดียวกับใบหลัก — พิมพ์รถบริษัท+Lunio แล้วพิมพ์
     รถบริษัท+JST ต่อ จะได้ใบตัดสองใบที่หน้าตาเหมือนกันเป๊ะถ้าไม่เขียนไว้ */
  const cutScope = [keys.length ? keys.join(' + ') : null, supNow.join(' + ') || null, lockLabel || null]
    .filter(Boolean).join(' · ');
  const sheets = (cutMode === 'split' && cutRows.length)
    ? groups2.concat([{
        label: '✂ ตัดออกจากยอด' + (cutScope ? ' · ' + cutScope : ''),
        parts: null, rows: cutRows, cars: keys.length ? sel : carriersOf(), cut: true,
      }])
    : groups2;

  sheets.forEach(g => {
    const items = Object.values(WmsPick.aggregateSKUDemand(g.rows)).sort((a, b) =>
      a.type === b.type ? b.qty - a.qty : (a.type === 'bed' ? -1 : 1));

    const beds  = pickFilter === 'gift' ? [] : items.filter(x => x.type === 'bed');
    const gifts = pickFilter === 'bed'  ? [] : items.filter(x => x.type !== 'bed');
    const shown = beds.concat(gifts);
    const pieces = shown.reduce((n, x) => n + x.qty, 0);
    if (!g.cut) grand += pieces;   // ใบที่ตัดออกคือของที่ตั้งใจไม่นับ
    const scope = pickFilter === 'bed' ? ' · เฉพาะที่นอน' : pickFilter === 'gift' ? ' · เฉพาะของแถม' : '';
    const when = sheetDate(g.cars);

    // ใบรวมต้องบอกยอดแยกรายเจ้าไว้ด้วย ไม่งั้นหยิบเสร็จแล้วแบ่งกองไม่ถูกว่าของ
    // เจ้าไหนกี่ชิ้น ซึ่งเป็นงานที่ตามหลังการหยิบเสมอ
    const split = g.parts
      ? '<div class="ps-split">' + g.parts.map(x =>
          '<span>' + esc(x.key) + ' <b>' + x.pieces + '</b></span>').join('') + '</div>'
      : '';

    // แต่ละใบขึ้นหน้าใหม่ตอนพิมพ์ เพื่อฉีกแจกให้แต่ละคนได้
    // การ์ดเป็น <table> ไม่ใช่ <section> เพราะหัวขนส่งต้องซ้ำทุกแผ่นที่พิมพ์
    // เบราว์เซอร์ทำให้เองเมื่ออยู่ใน <thead> + display:table-header-group
    // วิธีอื่น (position:fixed / ซ้ำเองด้วย JS) ไม่ทำงานกับการแบ่งหน้าจริง
    html += '<table class="ps-card"><thead><tr><td>' +
      '<div class="ps-head">' +
        '<div><div class="ps-carrier" data-label="' + esc(g.label) + '">' + esc(g.label) +
        (g.parts ? '<span class="ps-mix">รวม ' + g.parts.length + ' ขนส่ง</span>' : '') + '</div>' +
        '<div class="ps-meta">' + esc(srcName) + ' · ' + esc(when) + esc(scope) +
          (g.cut ? '' : esc(supNote)) + '</div>' + split +
        (g.cut ? '' : cutNoteFor(g.cars)) +
        (() => {
          const short = shortLines(shown);
          short.forEach(x => {
            /* บวกข้ามใบ ไม่ใช่เอาค่ามากสุด — แต่ละใบเป็นคนละก้อนไม่ทับกัน
               (คนละขนส่ง หรือคนละกลุ่มรถ) ของ SKU เดียวกันที่ขาดในสองใบจึงเป็น
               ความต้องการที่ต้องขนมาให้ครบทั้งสองก้อน ถ้าเอาค่ามากสุดจะขอขาด */
            const cur = SHORTAGE.get(x.sku);
            SHORTAGE.set(x.sku, { sku: x.sku, name: PN(x), qty: (cur ? cur.qty : 0) + x.qty });
          });
          if (!short.length) return '';
          const pcs = short.reduce((n, x) => n + x.qty, 0);
          return '<div class="ps-warn">⚠ ' + short.length + ' รายการ (' + pcs +
            ' ชิ้น) หน้าคลังมีไม่พอ — ดูบรรทัดที่ทำสีไว้ ต้องทำใบเบิกก่อนถึงจะหยิบครบ</div>';
        })() +
        '</div>' +
        '<div class="ps-tot"><b>' + pieces + '</b><span>ชิ้น</span>' +
        '<span class="ps-pagecount no-print"></span></div>' +
      '</div>' +
    '</td></tr></thead><tbody><tr><td>';

    if (!shown.length) {
      html += '<div class="ps-empty">ไม่มีรายการ' + (scope ? scope.replace(' · ','') : '') +
              'ของขนส่งนี้</div></td></tr></tbody></table>';
      return;
    }
    html += renderPickGroup('🛏️ ที่นอน', beds) + renderPickGroup('🎁 ของแถม', gifts);
    html += '</td></tr></tbody></table>';
  });

  const attr = v => JSON.stringify(v).replace(/"/g, '&quot;');

  /* แถว Sup อยู่ใต้แถวกลุ่มรถ เพราะมันคือการซอยงานรถบริษัทต่ออีกชั้น ไม่ใช่
     ตัวกรองอิสระ — วางไว้บนสุดแล้วมันจะอ่านเหมือนใช้ได้กับทุกขนส่ง
     supsInData() เป็นตัวเดียวที่ตัดสินว่าจะขึ้นหรือไม่ขึ้น */
  const supRow = !sups.length ? '' : (() => {
    const on = v => v ? supNow.indexOf(v) >= 0 : !supNow.length;
    const chip = (v, label) => '<button class="ps-chip' + (on(v) ? ' active' : '') + '" ' +
      'onclick="setSupLock(' + attr(v) + ')">' + esc(label) + '</button>';
    return '<div class="ps-carriers no-print"><span class="ps-lbl">Sup</span>' +
      chip('', 'ทุกเจ้า') + sups.map(x => chip(x, x)).join('') +
      '<span class="ps-hint">เลือกได้หลายเจ้า — ที่เลือกจะรวมเป็นใบเดียว · กดปุ่มเดิมซ้ำเพื่อปลด' +
      '</span></div>';
  })();

  /* แถวตัดออเดอร์อยู่ล่างสุดของแถบเครื่องมือ เพราะเป็นตัวเดียวที่ลบของออกจากใบ
     ไม่ใช่แค่เลือกว่าจะดูก้อนไหน — ของที่ตัดต้องกดสองที (เปิดแผง แล้วติ๊ก)
     ไม่ใช่ปุ่มเดียวที่เผลอโดนแล้วยอดเปลี่ยน */
  const cutUI = (() => {
    const all = ordersOfDay();
    if (!all.length) return '';
    const ev = eventOrders();
    const evAllCut = ev.length > 0 && ev.every(o => cutIds.has(o.id));
    const n = cutIds.size;

    const head = '<div class="ps-carriers no-print"><span class="ps-lbl">ตัดออเดอร์</span>' +
      '<button class="ps-chip' + (n ? ' active' : '') + '" onclick="toggleCutPanel()">' +
      (cutOpen ? '▾ ' : '▸ ') + (n ? 'ตัดไว้ ' + n + ' ออเดอร์' : 'เลือกออเดอร์ที่ไม่นับ') + '</button>' +
      (n ? '<button class="ps-chip ps-chip-alt" onclick="clearCuts()">↺ เอากลับทั้งหมด</button>' : '') +
      '<span class="ps-hint">เฉพาะวันนี้ · ดึงข้อมูลใหม่แล้วกลับมาครบเอง</span></div>';
    if (!cutOpen) return head;

    const q = cutQ.trim().toLowerCase();
    const list = !q ? all
      : all.filter(o => (o.id + ' ' + o.customer + ' ' + o.truck).toLowerCase().indexOf(q) >= 0);
    const line = o => '<label class="ps-xrow' + (cutIds.has(o.id) ? ' on' : '') + '">' +
      '<input type="checkbox"' + (cutIds.has(o.id) ? ' checked' : '') +
      ' onchange="toggleCut(' + attr(o.id) + ')">' +
      '<span class="ps-xid">' + esc(o.id) + '</span>' +
      '<span class="ps-xwho">' + esc(o.customer) + '</span>' +
      '<span class="ps-xtruck">' + esc(o.truck || 'ไม่ระบุคัน') + '</span>' +
      '<span class="ps-xpcs">' + o.pieces + '</span></label>';

    return head + '<div class="ps-xpanel no-print"><div class="ps-xtop">' +
      (ev.length ? '<button class="ps-chip' + (evAllCut ? ' active' : '') +
        '" onclick="cutEventOrders()">🎪 งาน Event ' + ev.length + ' ออเดอร์</button>' : '') +
      '<button class="ps-chip' + (cutMode === 'split' ? ' active' : '') +
      '" onclick="setCutMode(\'split\')">แยกเป็นใบต่อท้าย</button>' +
      '<button class="ps-chip' + (cutMode === 'drop' ? ' active' : '') +
      '" onclick="setCutMode(\'drop\')">ไม่พิมพ์เลย</button>' +
      '<input class="ps-xq" id="cutQ" value="' + esc(cutQ).replace(/"/g, '&quot;') + '" ' +
      'placeholder="ค้นเลขออเดอร์ / ลูกค้า / คัน" oninput="setCutQ(this.value)">' +
      '</div><div class="ps-xlist">' +
      (list.length ? list.map(line).join('') : '<div class="ps-xnone">ไม่พบออเดอร์ที่ค้น</div>') +
      '</div></div>';
  })();

  const chips = '<div class="ps-carriers no-print"><span class="ps-lbl">พิมพ์ขนส่ง</span>' +
    '<button class="ps-chip' + (keys.length ? '' : ' active') + '" ' +
    'onclick="togglePickCarrier()">แยกทุกขนส่ง</button>' +
    carriersOf().map(c =>
      '<button class="ps-chip' + (keys.includes(c.key) ? ' active' : '') + '" ' +
      'onclick="togglePickCarrier(' + attr(c.key) + ')">' + esc(c.key) + '</button>').join('') +
    (carriersOf().length > 1
      ? '<button class="ps-chip ps-chip-alt" onclick="selectAllPickCarriers()">➕ รวมทุกเจ้าเป็นใบเดียว</button>'
      : '') +
    /* บอกไว้ว่าตัวกรองของรถไปอยู่ไหน — ขึ้นเฉพาะตอนที่กดแล้วเจอจริง
       ปุ่มที่หายไปเฉย ๆ คือปุ่มที่คนเชื่อว่าพัง */
    '<span class="ps-hint">เลือกได้หลายเจ้า — ที่เลือกจะรวมเป็นใบเดียว' +
    (() => {
      const more = [];
      if (!sups.length && hasMultiSup()) more.push('Sup');
      if (!truckOn && hasTruck(carriersOf())) more.push('กลุ่มรถ (เจ้าเดียว)');
      return more.length ? ' · เลือกขนส่งเพื่อแยก ' + more.join(' · ') : '';
    })() + '</span></div>' +
    /* สามแถวของรถขึ้นเฉพาะตอนเจาะจงมาที่ขนส่งเจ้าที่มีชื่อรถแล้ว — กางทุกเจ้าอยู่
       แล้วล็อกกลุ่มรถ เท่ากับตัดงานของเจ้าที่ไม่มีชื่อรถทิ้งทั้งหมด */
    (truckOn ? '<div class="ps-carriers no-print"><span class="ps-lbl">กลุ่มรถ</span>' +
      '<button class="ps-chip' + (teamLock ? '' : ' active') + '" ' +
      'onclick="setTruckLock(\'\')">ทั้งหมด</button>' +
      WmsTruck.TRUCK_TEAMS.map(t =>
        '<button class="ps-chip' + (teamLock === t.id ? ' active' : '') + '" ' +
        'onclick="setTruckLock(\'' + t.id + '\')">' + esc(t.label) +
        ' <span class="ps-tiny">คัน ' + t.from + '-' + t.to + '</span></button>').join('') +
      spareLocksInData([truckScope(keys)]).map(s =>
        '<button class="ps-chip ps-chip-alt' + (teamLock === s.id ? ' active' : '') + '" ' +
        'onclick="setTruckLock(\'' + s.id + '\')">' + esc(s.label) + '</button>').join('') +
      '<span class="ps-hint">ล็อกไว้ดูกลุ่มเดียว · กดปุ่มเดิมซ้ำเพื่อปลด</span></div>' +
      /* ช่องช่วงเลขไว้ใช้เฉพาะกิจ ซ่อนไว้ตอนล็อกอยู่ เพราะล็อกแล้วเหลือกลุ่มเดียว
         การแยกใบไม่มีความหมาย และช่องที่กรอกแล้วไม่เกิดอะไรคือช่องที่ทำให้สับสน */
      (teamLock ? '' :
        '<div class="ps-carriers no-print"><span class="ps-lbl">แยกใบเอง</span>' +
        '<input class="ps-range" id="truckGroups" value="' + esc(truckGroups) + '" ' +
        'placeholder="เช่น 1-20, 21-60 — เว้นว่าง = ไม่แยก" ' +
        'oninput="setTruckGroups(this.value)">' +
        '<span class="ps-hint">แยกใบตามช่วงเลขคันที่กำหนดเอง</span></div>')
      /* เลือกเจ้าเดียวแล้วปุ่มยังไม่มา แปลว่าชีตยังไม่ได้กรอกชื่อรถ ไม่ใช่ของพัง
         เช็คทั้งวัน ไม่ใช่เฉพาะเจ้าที่เลือก — เจ้าที่ไม่เคยมีชื่อรถอยู่แล้ว (KEX/BEST)
         ไม่ควรขึ้นคำอธิบายที่ชวนให้ไปรอของที่ไม่มีวันมา */
      : (keys.length === 1 && !hasTruck(carriersOf())
        ? '<div class="ps-carriers no-print"><span class="ps-lbl">กลุ่มรถ</span>' +
          '<span class="ps-hint">ข้อมูลรอบนี้ยังไม่มีชื่อรถสักแถว — ปุ่มรถบริษัท / รถเสริม ' +
          'จะขึ้นเองเมื่อชีตกรอกคอลัมน์ชื่อรถแล้วกดดึงข้อมูลใหม่</span></div>'
        : ''))
      + supRow + cutUI;

  const scopeTxt = keys.length > 1 ? ('รวม ' + keys.length + ' ขนส่งเป็นใบเดียว')
                 : keys.length === 1 ? esc(keys[0])
                 : carriersOf().length + ' ขนส่ง (แยกใบ)';
  host.className = 'ps-papermode';
  host.innerHTML = chips +
    '<div class="ps-grand no-print">รวม <b>' + grand + '</b> ชิ้น · ' +
    scopeTxt + ' · จาก ' + esc(srcName) +
    (cutRows.length ? ' · ตัดออก <b>' + cutList.length + '</b> ออเดอร์ (' + cutPcs + ' ชิ้น)' : '') +
    '</div>' + shortageBar() + html;

  // เรียกตรง ๆ ไม่ผ่าน requestAnimationFrame — rAF ถูก throttle เมื่อแท็บ/เฟรม
  // ไม่ได้อยู่หน้าจอ ทำให้เส้นแบ่งหน้าไม่ถูกวาด ส่วนการอ่าน scrollHeight
  // บังคับให้ layout คำนวณเสร็จอยู่แล้ว จึงไม่ต้องรอเฟรมถัดไป
  drawPageGuides();
}

function renderPickGroup(title, list) {
  if (!list.length) return '';
  const sum = list.reduce((n, x) => n + x.qty, 0);

  /* ใบของแถมแบ่งโซนหยิบก่อนแบ่งประเภท — ของรหัส FRE เก็บอยู่ติดกันในคลัง
     เดินรอบเดียวจบ ส่วนการแบ่งประเภทข้างในยังเหมือนเดิมทุกอย่าง
     ใบที่นอนไม่ต้องแบ่ง เพราะไม่มีรหัส FRE อยู่เลย */
  let body;
  if (list[0] && list[0].type === 'gift') {
    const fre = list.filter(x => WmsPick.inFreZone(x));
    const rest = list.filter(x => !WmsPick.inFreZone(x));
    // มีโซนเดียวก็ไม่ต้องขึ้นหัวโซน จะได้ไม่มีหัวข้อที่ไม่ได้แบ่งอะไร
    body = (fre.length && rest.length)
      ? zoneBlock('📦 โซน FRE', fre) + zoneBlock('📍 นอกโซน FRE', rest)
      : catBlocks(list);
  } else {
    body = catBlocks(list);
  }

  return '<div class="ps-group"><div class="ps-gtitle">' + title +
    ' <span>' + list.length + ' รายการ · ' + sum + ' ชิ้น</span></div>' + body + '</div>';
}

function zoneBlock(label, list) {
  if (!list.length) return '';
  const sum = list.reduce((n, x) => n + x.qty, 0);
  return '<div class="ps-zone"><div class="ps-zname">' + esc(label) +
    ' <span>' + list.length + ' รายการ · ' + sum + ' ชิ้น</span></div>' +
    catBlocks(list) + '</div>';
}

function catBlocks(list) {
  // จัดเข้าหมวด แล้วที่นอนซอยย่อยตามขนาดอีกชั้น
  const cats = new Map();
  list.forEach(item => {
    const c = PC(item);
    if (!cats.has(c.label)) cats.set(c.label, { cat: c, items: [] });
    cats.get(c.label).items.push(item);
  });

  // เรียงหมวดตามลำดับใน WmsPick.PICK_CATS/WmsPick.GIFT_CATS ไม่ใช่ตามที่บังเอิญเจอก่อนในข้อมูล
  // เพื่อให้ใบหยิบหน้าตาเหมือนกันทุกวัน คนหยิบจะได้ชินที่
  const order = (list[0] && list[0].type === 'gift') ? WmsPick.GIFT_CATS : WmsPick.PICK_CATS;
  const rank = (c) => {
    if (c.last) return 999;                    // กลุ่มที่ทีมขอให้อยู่ท้ายใบ
    const i = order.findIndex(x => x.label === c.label);
    return i < 0 ? 99 : i;                     // ไม่รู้จัก (อื่น ๆ) มาก่อนกลุ่มท้ายใบ
  };
  const sorted = [...cats.values()].sort((a, b) => rank(a.cat) - rank(b.cat));

  let body = '';
  for (const { cat, items } of sorted) {
    const csum = items.reduce((n, x) => n + x.qty, 0);
    body += '<div class="ps-cat"><div class="ps-cname">' + esc(cat.label) +
            ' <span>' + items.length + ' รายการ · ' + csum + ' ชิ้น</span></div>';

    if (cat.bySize) {
      // ซอยตามขนาด เรียงใหญ่→เล็ก ของที่ไม่ระบุขนาดไว้ท้ายสุด
      const sizes = new Map();
      items.forEach(it => {
        const s = WmsPick.pickSize(PN(it));
        const k = s === null ? '__none' : s;
        if (!sizes.has(k)) sizes.set(k, []);
        sizes.get(k).push(it);
      });
      const keys = [...sizes.keys()].sort((a, b) =>
        a === '__none' ? 1 : b === '__none' ? -1 : b - a);
      keys.forEach(k => {
        const rows = sizes.get(k);
        const label = k === '__none' ? 'ไม่ระบุขนาด' : k + ' ฟุต';
        const ssum = rows.reduce((n, x) => n + x.qty, 0);
        body += '<div class="ps-size">' + esc(label) +
                ' <span>' + ssum + ' ชิ้น</span></div>' + pickTable(rows);
      });
    } else {
      body += pickTable(items);
    }
    body += '</div>';
  }

  return body;
}

/**
 * หน้าคลังหยิบของบรรทัดนี้ได้ครบไหม
 *
 * ระบบรู้ตั้งแต่ตอนกดพิมพ์ว่าของกองอยู่ที่ QA ไม่ใช่ NEW WH แต่ใบที่น้องถือ
 * ไม่เคยบอก น้องจึงเดินไปถึงชั้นแล้วค่อยรู้ว่าหยิบไม่ครบ ต้องเดินกลับมาบอก
 * รอทำใบเบิก แล้วเดินไปใหม่ — รู้ก่อนออกเดินคือประหยัดรอบเดินทั้งรอบ
 *
 * บอกเป็นตัวเลขที่นับได้จริง ไม่ตัดสินแทนว่า "พอ" หรือ "ไม่พอ" — ของชิ้นเดียวกัน
 * อาจถูกหยิบให้อีกคันในใบอีกใบด้วย ใบนี้จึงรับประกันแทนทั้งวันไม่ได้
 *
 * @returns {string} '' = ไม่มีอะไรต้องบอก
 */
function stockNote(x) {
  const s = stockMap()[x.sku];
  if (!s) return ' <span class="ps-nostock">ไม่พบใน Stock</span>';
  if (s.newwh >= x.qty) return '';
  const qa = s.qa > 0 ? ' · QA มี ' + s.qa : '';
  return ' <span class="ps-short">NEW WH มี ' + s.newwh + qa + '</span>';
}

function pickTable(list) {
  return '<table class="ps-table"><tbody>' +
    list.sort((a, b) => b.qty - a.qty).map(x =>
      '<tr><td class="ps-chk"></td><td class="ps-sku">' + esc(x.sku) + '</td>' +
      '<td>' + esc(PN(x)) + stockNote(x) + '</td>' +
      '<td class="ps-qty">' + x.qty + '</td></tr>').join('') +
    '</tbody></table>';
}

/** บรรทัดที่หน้าคลังมีไม่พอ — รวมไว้บอกที่หัวใบ ไม่ต้องไล่อ่านทั้งใบก่อนออกเดิน */
function shortLines(list) {
  const m = stockMap();
  if (!Object.keys(m).length) return [];
  return list.filter(x => { const s = m[x.sku]; return s && s.newwh < x.qty; });
}

/** ของที่ขาดของทุกใบรวมกัน ตั้งใหม่ทุกครั้งที่วาด */
let SHORTAGE = new Map();

/**
 * แบ่งของที่ขาดออกเป็น "เบิกได้" กับ "เบิกไม่ได้"
 *
 * ขอเท่าที่ขาดจริง (ที่ต้องใช้ − ที่หน้าคลังมี) ไม่ใช่ทั้งบรรทัด เพราะของที่อยู่
 * หน้าคลังแล้วไม่ต้องขนมาอีก
 *
 * ขอเกินกว่าที่ QA มีไม่ได้ — ใบเบิกคือการขอย้ายของที่มีอยู่จริง ไม่ใช่การสั่งของ
 * บรรทัดที่ QA เองก็ไม่พอจึงแยกออกมาบอกต่างหาก เพราะใบเบิกแก้ให้ไม่ได้
 */
function splitShortage() {
  const m = stockMap();
  const can = [], cannot = [];
  SHORTAGE.forEach(x => {
    const s = m[x.sku];
    if (!s) return;
    const need = x.qty - s.newwh;
    if (need <= 0) return;
    if (s.qa >= need) can.push({ sku: x.sku, name: x.name, qty: need });
    else if (s.qa > 0) { can.push({ sku: x.sku, name: x.name, qty: s.qa }); cannot.push({ ...x, short: need - s.qa }); }
    else cannot.push({ ...x, short: need });
  });
  return { can, cannot };
}

function shortageBar() {
  if (!SHORTAGE.size) return '';
  const { can, cannot } = splitShortage();
  if (!can.length && !cannot.length) return '';
  const pcs = can.reduce((n, x) => n + x.qty, 0);
  return '<div class="ps-qabar no-print">' +
    (can.length
      ? '<span>ต้องขนจาก QA มาหน้าคลัง <b>' + can.length + '</b> รายการ · <b>' + pcs + '</b> ชิ้น</span>' +
        '<button class="btn btn-primary btn-sm" onclick="makeQaRequisition()">📝 ทำใบเบิก QA</button>'
      : '<span>มีของขาดแต่ QA ก็ไม่มีของ — ใบเบิกช่วยไม่ได้</span>') +
    (cannot.length
      ? '<span class="ps-cannot">⚠ ' + cannot.length + ' รายการ QA มีไม่พอด้วย ต้องหาทางอื่น</span>'
      : '') + '</div>';
}

/**
 * ส่งของที่ขาดเข้าใบเบิก โดยกรอกมาให้แล้ว
 *
 * ใช้ทางเดียวกับที่หน้าสต๊อกกับแท็บเช็คสต๊อกใช้ (WmsDraft) — ถ้าทำทางที่สอง
 * วันหนึ่งสองทางจะกรอกใบเบิกคนละแบบแล้วไม่มีใครรู้ว่าอันไหนถูก
 */
function makeQaRequisition() {
  const { can } = splitShortage();
  if (!can.length) return;
  if (!WmsDraft.put('requisition', can, { from: 'QA', to: 'NEW WH-2', src: 'ใบสรุปหยิบของ' })) {
    alert('ส่งรายการไปใบเบิกไม่ได้ — เบราว์เซอร์ไม่ยอมให้เก็บข้อมูลชั่วคราว');
    return;
  }
  location.href = '../warehouse-forms/requisition.html';
}

/* ── แถบแหล่งข้อมูล ─────────────────────────────────────────────────────── */
let PULLING = '';

function renderSrc() {
  const el = document.getElementById('src');
  const o = window.OrderIndex ? OrderIndex.getCarriers() : null;
  const st = window.WmsStock ? WmsStock.read() : null;
  const hhmm = (t) => new Date(t).toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
  let html = '';
  if (PULLING) html += `<span class="pill">⏳ ${esc(PULLING)}</span>`;
  else {
    const n = o ? o.carriers.reduce((s,c) => s + c.data1.length + c.data2.length, 0) : 0;
    html += o ? `<span class="pill">📋 ออเดอร์ <b>${n}</b> แถว · ${hhmm(o.at)}</span>`
              : `<span class="pill">📋 ยังไม่มีออเดอร์ของวันนี้</span>`;
    /* สต๊อกไม่ใช่ของบังคับ — ใบหยิบยังทำได้ไม่มีสต๊อก แค่จำแนกประเภทหยาบลง
       เพราะชื่อจากไฟล์ออเดอร์บอกขนาดและชนิดไม่ชัดเท่าชื่อในไฟล์สต๊อก */
    html += st ? `<span class="pill">📦 สต๊อก <b>${Object.keys(st.map).length}</b> SKU</span>`
               : `<span class="pill">📦 ยังไม่มีสต๊อก — จัดกลุ่มได้หยาบกว่าปกติ</span>`;
  }
  html += '<span class="sp"></span>';
  html += `<button onclick="pullAll()" ${PULLING ? 'disabled' : ''}>🔄 ดึงข้อมูลใหม่</button>`;
  el.innerHTML = html;
}

async function pullAll() {
  if (PULLING) return;
  PULLING = 'กำลังดึงข้อมูล…'; renderSrc();
  const jobs = [];
  if (OrderIndex.savedUrl()) jobs.push(OrderIndex.pull(OrderIndex.savedUrl()).catch(() => {}));
  if (WmsStock.savedUrl())   jobs.push(WmsStock.pull(WmsStock.savedUrl()).catch(() => {}));
  await Promise.all(jobs);
  PULLING = ''; renderSrc(); renderPickSum();
}

renderSrc();
renderPickSum();

/* ดึงให้เองตอนเปิด ด้วยกติกาเดียวกับหน้าอื่นในระบบ */
if (!OrderIndex.getCarriers() && OrderIndex.savedUrl() && WmsGas.firstTry('order:picking')) pullAll();
else if (!WmsStock.read() && WmsStock.savedUrl() && WmsGas.firstTry('stock:picking')) pullAll();
</script>
