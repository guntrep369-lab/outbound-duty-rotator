/* ── แท็บเทียบรายวัน ────────────────────────────────────────────────────── */

function dailyResult() {
  if (DAILY) return DAILY;
  if (!RAW || !RAW.daily || !LEDGER) return null;
  /* ผลเก่าของคนละเดือน เอามาเทียบจะดูเหมือนขาดทั้งเดือน */
  if (LEDGER.from !== RAW.period.from || LEDGER.to !== RAW.period.to) return null;
  DAILY = WmsCut.compareDaily(RAW.daily, RAW.period, LEDGER);
  return DAILY;
}

/** ปุ่มเดียวกันทุกจุด เพราะดึงใหม่ได้โดยไม่ต้องตรวจหลักซ้ำ */
function ledgerBtn(label) {
  return `<button class="tx-opt" data-reload ${BUSY ? 'disabled' : ''}>${esc(label)}</button>`;
}

/** ยังเทียบไม่ได้เพราะอะไร ต้องบอกให้รู้ว่าต้องทำอะไรต่อ */
function dailyWaiting() {
  if (!RAW.daily) {
    return `<div class="tx-empty art-data">ผลตรวจรอบนี้ยังไม่มียอดรายวัน กด <b>ตรวจใหม่</b> ด้านบน<br>
      ถ้ากดแล้วยังขึ้นข้อความนี้ แปลว่า <b>cut-api.gs</b> ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version</div>`;
  }
  if (!WmsSettings.txUrl()) {
    return `<div class="tx-empty art-link">ยังไม่ได้ตั้ง Apps Script URL ของ Transaction — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a></div>`;
  }
  return `${LEDGER_ERR ? `<div class="tx-warn">⚠️ ดึงยอดขายไม่สำเร็จ: ${esc(LEDGER_ERR)}</div>` : ''}
    <div class="tx-empty art-data">ต้องดึงยอดขายจากสต๊อกราย Location มาเทียบก่อน<br><br>${ledgerBtn('▶️ ดึงยอดขาย')}</div>`;
}

function tone(side, odd) {
  if (!odd) return '';
  if (odd === 'all') return 'tx-mid';
  return odd === side ? 'tx-neg' : '';
}

/** ลูกศรบอกว่ามากกว่าหรือน้อยกว่าค่าที่ควรเป็น คนที่แยกสีแดงไม่ออกก็ยังเห็น */
function dir(v, ref) { return v > ref ? ' tx-up' : v < ref ? ' tx-dn' : ''; }

/** สีของช่อง k และลูกศรเทียบกับอีกสองช่องที่เท่ากันเอง */
function mark(k, odd, v) {
  const t = tone(k, odd);
  return t === 'tx-neg' ? t + dir(v[k], k === 's' ? v.x : v.s) : t;
}

/** ช่องตัวเลข Report ควรออกขึ้นก่อนเป็นยอดตั้ง แล้วตามด้วยสามระบบ สีบอกว่าระบบไหนต่างจากอีกสองระบบ */
function numCells(c, r) {
  const odd = WmsCut.oddOne(r.s, r.x, r.t);
  return `${c.hasR ? `<td class="num" data-label="${esc(L.r)}">${f(r.r)}</td>` : ''}
    <td class="num ${mark('s', odd, r)}" data-label="${esc(L.s)}">${f(r.s)}</td>
    <td class="num ${mark('x', odd, r)}" data-label="${esc(L.x)}">${f(r.x)}</td>
    <td class="num ${mark('t', odd, r)}" data-label="${esc(L.t)}">${f(r.t)}</td>`;
}

/** จอมือถือ ตารางที่มีช่อง Report ควรออก มีตัวเลขสี่ช่อง */
function numClass(c) { return c.hasR ? 'mc-4' : 'mc-3'; }

/** ผลเทียบสองช่อง ชื่อกำกับขึ้นเฉพาะบนมือถือที่ไม่มีหัวตาราง ช่องเดียวไม่ต้องบอก */
function resCells(c, three, rep) {
  return `<td class="tx-res k-res"${c.hasR ? ' data-label="สามระบบ"' : ''}>${three}</td>
    ${c.hasR ? `<td class="tx-res k-res2" data-label="Report">${rep}</td>` : ''}`;
}

function numHead(c) {
  return `${c.hasR ? `<th class="num">${L.r}</th>` : ''}<th class="num">${L.s}</th><th class="num">${L.x}</th><th class="num">${L.t}</th>`;
}

function resHead(c) {
  return `<th>สามระบบเทียบกัน</th>${c.hasR ? '<th>เทียบกับ Report</th>' : ''}`;
}

/** more = แถวนี้กดเปิดหน้าต่างรายละเอียดได้ */
function skuCell(r, more) {
  const caret = more ? '<span class="tx-more"><i>▸</i></span>' : '';
  return `<td class="tx-name k-main"><b>${caret}${esc(r.sku)}</b><span class="tx-sub">${esc(r.name)}</span></td>`;
}

const SHIFT_TAG = '<span class="tx-tag">น่าจะลงคนละวัน</span>';

/** ผลของหนึ่งแถวที่เป็นยอดรวม (ราย SKU หรือแถวรวม) ไม่มีเรื่องลงคนละวัน */
function sumResults(c, r) {
  const words = WmsCut.reportWords(r.r, r.s, r.x, r.t);
  return resCells(c, esc(WmsCut.diffWords(r.s, r.x, r.t)), words ? esc(words) : '<span class="tx-ok">ตรง</span>');
}

const EASED = 'หักลงคนละวันแล้ว ';

/** ถ้าหักที่ลงคนละวันได้บางส่วน บอกยอดที่เหลือจริง ยอดดิบส่วนใหญ่คือของที่ลงวันติดกัน */
function rowReport(r) {
  if (r.rl) return esc(EASED + WmsCut.reportWords(0, r.rl.s, r.rl.x, r.rl.t));
  const words = WmsCut.reportWords(r.r, r.s, r.x, r.t);
  if (!words) return '<span class="tx-ok">ตรง</span>';
  return `${esc(words)}${r.rmoved ? `<br>${SHIFT_TAG}` : ''}`;
}

function skuDayRow(c, r, withDate) {
  return `<tr data-cell="${esc(`${r.date}|${r.sku}`)}">
    ${withDate ? `<td class="nw k-top">${esc(dm(r.date))}</td>` : ''}
    ${skuCell(r, true)}
    ${numCells(c, r)}
    ${resCells(c, `${esc(WmsCut.diffWords(r.s, r.x, r.t))}${r.moved ? `<br>${SHIFT_TAG}` : ''}`, c.hasR ? rowReport(r) : '')}
  </tr>`;
}

function cellInfo() {
  if (!CELLS) CELLS = WmsCut.cellIndex(RAW.daily, LEDGER);
  return CELLS;
}

/** ตัวเลขที่ไม่เท่ากับ Report ของแถวเดียวกันเป็นสีแดง */
function vsReport(v, r, label) { return `<td class="num ${v !== r ? 'tx-neg' + dir(v, r) : ''}" data-label="${esc(label)}">${f(v)}</td>`; }

/** ตัวเลขสามช่องของตารางรายออเดอร์ มีชื่อกำกับไว้ใช้บนมือถือ */
function ordNums(r, x, t) {
  return `<td class="num" data-label="${esc(L.r)}">${f(r)}</td><td class="num" data-label="${esc(L.x)}">${f(x)}</td><td class="num" data-label="${esc(L.t)}">${f(t)}</td>`;
}

function kindLabel(k) { return (KINDS[k] || PARTS[k] || { label: k }).label; }

/** ช่องนี้ต่างเพราะอะไร ชี้ว่าต้องดูฝั่งไหนก่อน แล้วแตกลงไปถึงออเดอร์และแถวในชีตทีม */
function cellPanel(c, r) {
  const info = cellInfo(), one = info.get(r.date, r.sku);
  return `<div class="tx-cell">
    <div class="tx-hint">👉 ${esc(WmsCut.fixHint(r, c.hasR))}</div>
    ${ordersBlock(c, r, info, one)}
    ${rowsBlock(r, info, one)}
  </div>`;
}

function ordersBlock(c, r, info, one) {
  const head = `<div class="tx-h">รายออเดอร์ของวันที่ ${esc(dm(r.date))} ใน ${esc(L.x)} และ ${esc(L.t)}</div>`;
  if (!info.hasOrders) {
    return `${head}<div class="tx-why">ผลตรวจรอบนี้ยังไม่มีรายออเดอร์ ให้วาง <b>cut-api.gs</b> ใหม่ แล้ว Deploy เป็น New version จากนั้นกด <b>ตรวจใหม่</b></div>`;
  }
  if (!one.listed) {
    return `${head}<div class="tx-why">${esc(L.x)}, ${esc(L.t)} และ ${esc(L.r)} ตรงกันในวันนี้ ไม่มีออเดอร์ที่ต้องดู</div>`;
  }
  const rows = one.orders.map((e) => `<tr>
      <td class="nw k-main"><span class="tx-ref">${esc(e.ref || '(ไม่มีเลข)')}</span><span class="tx-sub">${esc(e.sys)}</span></td>
      <td class="num" data-label="${esc(L.r)}">${f(e.r)}</td>${vsReport(e.x, e.r, L.x)}${vsReport(e.t, e.r, L.t)}
      <td class="tx-res k-res">${esc(kindLabel(e.kind))}${WmsCut.dateWords(e) ? `<span class="tx-sub">${esc(WmsCut.dateWords(e))}</span>` : ''}</td>
    </tr>`);
  one.moved.forEach((g) => rows.push(`<tr>
      <td class="k-main"><b class="nw">${f(g.orders)} ออเดอร์</b><span class="tx-sub">${g.orders > g.refs.length ? 'เช่น ' : ''}${g.refs.map((x) => `<span class="nw">${esc(x)}</span>`).join(', ')}</span></td>
      ${ordNums(g.r, g.x, g.t)}
      <td class="tx-res k-res">${SHIFT_TAG}<span class="tx-sub">ยอดของออเดอร์ตรงแล้ว ต่างแค่วันที่ลง · ${esc(WmsCut.dateWords(g))}</span></td>
    </tr>`));
  if (one.ok.orders) {
    rows.push(`<tr><td class="k-main">อีก ${f(one.ok.orders)} ออเดอร์</td>
      ${ordNums(one.ok.qty, one.ok.qty, one.ok.qty)}
      <td class="tx-res k-res"><span class="tx-ok">ตรงทุกแหล่ง</span></td></tr>`);
  }
  if (one.more) rows.push(`<tr><td class="k-main" colspan="5">และอีก ${f(one.more)} ออเดอร์ที่ไม่ได้แสดง ดูได้ในแท็บตัดผิด / ตัดเกิน หรือยังไม่ตัด</td></tr>`);
  return `${head}<div class="tx-wrap"><table class="tx-tbl tx-ords tx-mc">
      <thead><tr><th>ออเดอร์</th><th class="num">${L.r}</th><th class="num">${L.x}</th><th class="num">${L.t}</th><th>เรื่อง</th></tr></thead>
      <tbody>${rows.join('')}
        <tr class="sum"><td class="k-main">รวมทั้งช่อง</td>${ordNums(r.r, r.x, r.t)}<td></td></tr>
      </tbody>
    </table></div>`;
}

function rowsBlock(r, info, one) {
  const head = `<div class="tx-h">แถวขายใน ${esc(L.s)} ของวันที่ ${esc(dm(r.date))}</div>`;
  if (!info.hasRows) {
    return `${head}<div class="tx-why">ยอดขายรอบนี้ยังไม่มีรายแถว ให้วาง <b>tx-api.gs</b> ใหม่ แล้ว Deploy เป็น New version จากนั้นกด <b>ดึงยอดขายใหม่</b></div>`;
  }
  if (!one.rows.length) return `${head}<div class="tx-why">ไม่มีแถวขายของ SKU นี้ในวันนี้</div>`;
  const link = (row) => {
    const u = WmsCut.rowUrl(info.sheet, row);
    return u ? `<a class="tx-row" href="${esc(u)}" target="_blank" rel="noopener">${row}</a>` : String(row);
  };
  const qty = (q) => (typeof q === 'number' ? f(q) : `<span class="tx-neg">${esc(q)}</span><span class="tx-sub">ไม่ใช่ตัวเลข นับเป็น 0</span>`);
  return `${head}<div class="tx-wrap"><table class="tx-tbl">
      <thead><tr><th>แถวที่</th><th>Location</th><th>LOT</th><th>PO</th><th class="num">จำนวน</th><th>คนลง</th></tr></thead>
      <tbody>${one.rows.map((x) => `<tr>
          <td class="nw">${link(x.row)}</td><td class="nw">${esc(x.loc)}</td><td>${esc(x.lot)}</td><td>${esc(x.po)}</td>
          <td class="num">${qty(x.qty)}</td><td>${esc(x.who)}</td>
        </tr>`).join('')}
        <tr class="sum"><td colspan="4">รวม</td><td class="num">${f(r.s)}</td><td></td></tr>
      </tbody>
    </table></div>
    <div class="tx-why">กดเลขแถวเพื่อเปิดชีตตรงแถวนั้น</div>`;
}

function dayResult(d) {
  if (d.status === 'ok') return '<span class="tx-ok">ตรงทุก SKU</span>';
  if (d.status === 'shift') return `${SHIFT_TAG}<span class="tx-sub">${f(d.shift)} SKU</span>`;
  const words = WmsCut.diffWords(d.s, d.x, d.t);
  const more = d.shift ? ` · อีก ${f(d.shift)} SKU น่าจะลงคนละวัน` : '';
  return `${esc(words || 'ยอดรวมเท่ากัน แต่รายตัวไม่ตรง')}<span class="tx-sub">${f(d.bad)} SKU ไม่ตรง${esc(more)}</span>`;
}

/** ยอดที่บอกคือส่วนที่ยังต่างจาก Report หลังหักที่ลงคนละวันแล้ว ถ้ามีการหักจะขึ้นต้นให้รู้ */
function dayReport(d) {
  const p = d.rep;
  if (p.status === 'ok') return '<span class="tx-ok">ตรง Report</span>';
  if (p.status === 'shift') return `${SHIFT_TAG}<span class="tx-sub">${f(p.shift)} SKU</span>`;
  const words = WmsCut.reportWords(0, p.s, p.x, p.t);
  const eased = p.shift || p.split ? EASED : '';
  const more = p.shift ? ` · อีก ${f(p.shift)} SKU น่าจะลงคนละวัน` : '';
  return `${esc(words ? eased + words : 'ยอดรวมเท่ากัน แต่รายตัวไม่ตรง')}<span class="tx-sub">${f(p.bad)} SKU ไม่ตรง${esc(more)}</span>`;
}

function dayRow(c, d) {
  const results = resCells(c, dayResult(d), c.hasR ? dayReport(d) : '');
  if (d.status === 'ok' && (!d.rep || d.rep.status === 'ok')) {
    return `<tr class="is-ok"><td class="nw k-top"><span class="tx-more"><i></i>${esc(dm(d.date))}</span></td>${numCells(c, d)}${results}</tr>`;
  }
  /* ส้ม = ต่างแค่ลงคนละวัน แดง = มียอดที่ต้องแก้จริง */
  const hard = [d.status, d.rep && d.rep.status].some((s) => s && s !== 'ok' && s !== 'shift');
  return `<tr data-day="${esc(d.date)}" class="${hard ? 'is-bad' : 'is-warn'}">
      <td class="nw k-top"><button class="tx-more" aria-haspopup="dialog"><i>▸</i>${esc(dm(d.date))}</button></td>
      ${numCells(c, d)}
      ${results}
    </tr>`;
}

/* ── หน้าต่างรายละเอียด ─────────────────────────────────────────────────── */

/** ตัวเลขสี่ช่องกับผลเทียบ ขึ้นบนสุดของหน้าต่าง ไม่ต้องย้อนไปดูแถวที่กดมา */
function popStats(c, v, three, rep) {
  const odd = WmsCut.oddOne(v.s, v.x, v.t);
  const box = (k) => `<div class="tx-stat"><small>${ICON[k] ? `<img class="tx-ic" src="${ICON[k]}" alt="">` : ''}${esc(L[k])}</small><b class="${k === 'r' ? '' : mark(k, odd, v)}">${f(v[k])}</b></div>`;
  return `<div class="tx-stats">${c.hasR ? box('r') : ''}${box('s')}${box('x')}${box('t')}</div>
    <div class="pop-res"><div><small>สามระบบเทียบกัน</small>${three}</div>${c.hasR ? `<div><small>เทียบกับ Report</small>${rep}</div>` : ''}</div>`;
}

function popDay(c, d) {
  const rows = c.rows.filter((r) => r.date === d.date);
  return {
    title: `วันที่ ${dm(d.date)}`,
    sub: `${f(rows.length)} SKU ที่ยอดไม่ตรงกัน`,
    body: `${popStats(c, d, dayResult(d), c.hasR ? dayReport(d) : '')}
      <div class="tx-why">กดที่ SKU เพื่อดูว่าต่างเพราะออเดอร์ไหน หรือแถวไหนในชีตทีม</div>
      <div class="tx-wrap"><table class="tx-tbl tx-mc ${numClass(c)}">
        <thead><tr><th>SKU</th>${numHead(c)}${resHead(c)}</tr></thead>
        <tbody>${rows.map((r) => skuDayRow(c, r, false)).join('')}</tbody>
      </table></div>`,
  };
}

function popCell(c, r) {
  const three = WmsCut.diffWords(r.s, r.x, r.t);
  return {
    title: r.sku,
    sub: `${r.name ? `${r.name} · ` : ''}วันที่ ${dm(r.date)}`,
    body: popStats(c, r, `${three ? esc(three) : '<span class="tx-ok">ตรงกัน</span>'}${r.moved ? `<br>${SHIFT_TAG}` : ''}`, c.hasR ? rowReport(r) : '')
      + cellPanel(c, r),
  };
}

function renderPop() {
  const box = $('pop');
  const c = POP && (TAB === 'daily' || TAB === 'sys') ? dailyResult() : null;
  const day = c && POP.day ? c.days.find((d) => d.date === POP.day) : null;
  const row = c && POP.cell ? c.rows.find((r) => `${r.date}|${r.sku}` === POP.cell) : null;
  const view = row ? popCell(c, row) : day ? popDay(c, day) : null;
  /* ข้อมูลชุดใหม่อาจไม่มีวันหรือ SKU ที่เปิดค้างไว้แล้ว ปิดไปเลย */
  if (!view) POP = null;
  document.documentElement.classList.toggle('pop-open', !!view);
  box.classList.toggle('open', !!view);
  if (!view) { box.innerHTML = ''; return; }
  const back = row && day ? `<button class="pop-back" data-back>← กลับไปรายการ SKU ของวันที่ ${esc(dm(day.date))}</button>` : '';
  box.innerHTML = `<div class="modal-box">
      <div class="modal-header">
        <div>${back}<h3 id="popTitle">${esc(view.title)}</h3><p>${esc(view.sub)}</p></div>
        <button class="modal-close" data-close aria-label="ปิด">✕</button>
      </div>
      <div class="modal-body">${view.body}</div>
    </div>`;
  box.querySelector('[data-close]').focus();
}

/** at = จุดที่กด หน้าต่างขยายออกจากตรงนั้น เปลี่ยนเนื้อหาระหว่างเปิดอยู่ไม่ขยายซ้ำ */
function openPop(p, at) {
  if (CLOSING) return;
  const was = !!POP;
  POP = p;
  if (!was && at) POP_AT = at;
  renderPop();
  if (!was && POP) window.WmsMotion?.popIn($('pop').querySelector('.modal-box'), POP_AT);
}

/** หดกลับไปที่แถวที่กดเปิด แล้วค่อยปิดจริง */
function closePop() {
  const box = $('pop').querySelector('.modal-box');
  if (!POP || CLOSING) return;
  const done = () => { CLOSING = false; $('pop').classList.remove('wms-fading'); openPop(null); };
  if (!window.WmsMotion || !box) { done(); return; }
  CLOSING = true;
  WmsMotion.popOut(box, done, POP_AT);
}

/** จุดที่กด กดด้วยแป้นพิมพ์ไม่มีพิกัด ใช้กลางแถวแทน */
function tapAt(e, el) {
  if (e.clientX || e.clientY) return { x: e.clientX, y: e.clientY };
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function dayTable(c) {
  return `<div class="tx-wrap"><table class="tx-tbl tx-m2 ${numClass(c)}">
    <thead><tr><th>วันที่</th>${numHead(c)}${resHead(c)}</tr></thead>
    <tbody>
      ${c.days.map((d) => dayRow(c, d)).join('')}
      <tr class="sum"><td class="k-top">รวม</td>${c.hasR ? `<td class="num">${f(c.totals.r)}</td>` : ''}<td class="num">${f(c.totals.s)}</td><td class="num">${f(c.totals.x)}</td><td class="num">${f(c.totals.t)}</td>${sumResults(c, c.totals)}</tr>
    </tbody>
  </table></div>`;
}

function skuTable(c) {
  const hit = c.skus.filter((r) => `${r.sku} ${r.name}`.toUpperCase().includes(Q));
  if (!hit.length) {
    return c.skus.length
      ? '<div class="tx-empty art-search">ไม่พบ SKU ที่ตรงกับคำค้น</div>'
      : '<div class="tx-empty art-done">รวมทั้งช่วงแล้วทุก SKU <b>ตรงกันหมด</b></div>';
  }
  return `<div class="tx-why">SKU ที่รวมทั้งช่วงแล้วยังไม่ตรง${c.hasR ? 'กันเองหรือไม่ตรงกับ Report' : ''} กดแถวเพื่อดูว่าต่างกันวันไหน</div>
    <div class="tx-wrap"><table class="tx-tbl tx-mc ${numClass(c)}">
      <thead><tr><th>SKU</th>${numHead(c)}${resHead(c)}</tr></thead>
      <tbody>${hit.map((r) => `<tr data-sku="${esc(r.sku)}">${skuCell(r)}${numCells(c, r)}${sumResults(c, r)}</tr>`).join('')}</tbody>
    </table></div>`;
}

function searchTable(c) {
  const hit = c.rows.filter((r) => `${r.sku} ${r.name}`.toUpperCase().includes(Q));
  if (!hit.length) return '<div class="tx-empty art-search">ไม่พบวันที่ไม่ตรงของ SKU นี้ ถ้าพิมพ์รหัสถูก แปลว่าตรงกันทุกวัน</div>';
  return `<div class="tx-wrap"><table class="tx-tbl tx-mc ${numClass(c)}">
    <thead><tr><th>วันที่</th><th>SKU</th>${numHead(c)}${resHead(c)}</tr></thead>
    <tbody>${hit.map((r) => skuDayRow(c, r, true)).join('')}</tbody>
  </table></div>`;
}

function dailyList() {
  const c = dailyResult();
  if (VIEW === 'sku') return skuTable(c);
  return Q ? searchTable(c) : dayTable(c);
}

/** แถวที่นับไม่ได้ต้องเห็น ไม่งั้นยอดที่หายไปจะดูเหมือนตัดไม่ตรง */
function dailyWarnings(c) {
  const out = [];
  const part = (p, text) => { if (p && p.rows) out.push(`${text} ${f(p.rows)} แถว${p.qty ? ` (${f(p.qty)} ชิ้น)` : ''} ไม่ได้นับ`); };
  if (!c.last) out.push('ไม่พบแถวที่ช่องรับ/เบิกเป็น "ขาย" ในสมุด Transaction');
  if (c.waiting.length) {
    const left = c.waiting.map((w) => `${dm(w.date)} (${c.hasR ? `${L.r} ${f(w.r)} · ` : ''}${L.x} ${f(w.x)} · ${L.t} ${f(w.t)})`).join(', ');
    out.push(`${L.s} ลงถึงวันที่ ${dm(c.last)} วันต่อจากนี้ยังเทียบไม่ได้: ${left}`);
  }
  part(LEDGER.noDate, `แถวขายใน ${L.s} ที่ไม่มีวันที่`);
  part(LEDGER.noSku, `แถวขายใน ${L.s} ที่ไม่มีรหัส SKU`);
  part(LEDGER.future, `แถวขายใน ${L.s} ที่วันที่เลยวันนี้ไป น่าจะพิมพ์ปีผิด`);
  if (LEDGER.badQty && LEDGER.badQty.rows) out.push(`แถวขายใน ${L.s} ที่จำนวนไม่ใช่ตัวเลข ${f(LEDGER.badQty.rows)} แถว นับเป็นศูนย์`);
  part(RAW.daily.skippedX, `แถวใน ${L.x} ที่ไม่มีวันที่หรือ SKU`);
  part(RAW.daily.skippedT, `แถวใน ${L.t} ที่ไม่มีวันที่หรือ SKU`);
  const noDay = RAW.daily.skippedR;
  if (noDay && noDay.rows) out.push(`รายการใน Report ที่ไม่มีวันที่ ${f(noDay.rows)} รายการ (${f(noDay.qty)} ชิ้น) ไม่ได้นับในช่อง ${L.r}`);
  return out.map((w) => `<div class="tx-warn">⚠️ ${esc(w)}</div>`).join('');
}

function dailyHtml() {
  const c = dailyResult();
  if (!c) return dailyWaiting();
  const n = c.counts;
  const stat = (label, v, cls, sub) => `<div class="tx-stat"><small>${esc(label)}</small><b class="${cls}">${f(v)}</b><i>${esc(sub)}</i></div>`;
  const when = new Date(LEDGER.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const opt = (v, label) => `<button class="tx-opt ${VIEW === v ? 'on' : ''}" data-view="${v}">${label}</button>`;
  return `${LEDGER_ERR ? `<div class="tx-warn">⚠️ ดึงยอดขายรอบล่าสุดไม่สำเร็จ ตัวเลขนี้เป็นของรอบก่อน: ${esc(LEDGER_ERR)}</div>` : ''}
    ${dailyWarnings(c)}
    <div class="tx-why">ยอดออกของแต่ละ SKU ในแต่ละวัน เทียบสามที่: ${L.s} คือแถว "ขาย" ในสต๊อกราย Location, ${L.x} คือแท็บตัด Transaction และ ${L.t}${c.hasR ? ` แล้วเทียบกับ ${L.r} ว่าจริง ๆ ควรออกเท่าไร` : ''} (${dm(c.from)} ถึง ${dm(c.to)})</div>
    <div class="tx-stats">
      ${stat('วันที่ตรงทุก SKU', n.daysOk, 'tx-ok', `จาก ${f(c.days.length)} วัน`)}
      ${stat('วันที่ไม่ตรง', n.daysBad, n.daysBad ? 'tx-neg' : 'tx-ok', 'กดที่วันเพื่อดูราย SKU')}
      ${c.hasR ? stat('วันที่ไม่ตรงกับ Report', n.repBad, n.repBad ? 'tx-neg' : 'tx-ok', `ควรออกรวม ${f(c.totals.r)} ชิ้น`) : ''}
      ${stat('รายการน่าจะลงคนละวัน', n.shiftKeys, n.shiftKeys ? 'tx-mid' : 'tx-ok', 'รวมสองวันติดกันแล้วเท่ากัน')}
      ${stat('SKU ที่รวมทั้งช่วงยังไม่ตรง', n.skusBad, n.skusBad ? 'tx-neg' : 'tx-ok', `รายวันตรง ${f(n.equal)} จาก ${f(n.keys)} รายการ`)}
    </div>
    <div class="tx-bar">
      <input class="tx-input" id="q" type="search" placeholder="ค้น SKU หรือชื่อสินค้า" value="${esc(Q)}">
      ${opt('day', 'รายวัน')}${opt('sku', 'ราย SKU รวมทั้งช่วง')}
      <span class="sp"></span>
      <span>ดึงยอดขายเมื่อ ${esc(when)}</span>
      ${ledgerBtn('🔄 ดึงยอดขายใหม่')}
    </div>
    <div id="list"></div>
    <div class="tx-note">ตัวเลขสีแดงคือช่องที่ต่างจากอีกสองช่อง ▲ มากกว่า ▼ น้อยกว่า สีส้มคือไม่เท่ากันทั้งสามช่อง
      แถบแดงหน้าวันคือวันที่มียอดต้องแก้ แถบส้มคือน่าจะแค่ลงคนละวัน
      กดวันแล้วกด SKU เพื่อดูรายออเดอร์และแถวขายในชีตทีมของช่องนั้น<br>
      ${c.hasR
        ? `${RAW.totals.tf
            ? `${L.r} คือ Report JST + CRM ตามวันที่ออกจากคลัง และ Report โอนย้ายตามวันที่จัดส่ง
              ไม่นับรายการที่ขนส่งยกเลิกก่อนของออก สถานะขนส่งว่าง หรือรหัสที่ไม่ใช่ของในคลัง เช่นออเดอร์แฝง STR`
            : `${L.r} คือ Report JST + CRM ตามวันที่ออกจากคลัง ไม่นับรายการที่ขนส่งยกเลิกก่อนของออก สถานะขนส่งว่าง หรือรหัสที่ไม่ใช่ของในคลัง
              แล้วบวกงานโอนย้ายจาก ${L.x} เพราะยังไม่มีแท็บ ${TAB_TF}`}<br>
          บางออเดอร์ตัดสต๊อกคนละวันกับวันที่ออกจากคลัง ถ้าสองวันติดกันหักกันแล้วเท่ากันจะขึ้นว่าน่าจะลงคนละวัน`
        : `ยังไม่มีช่อง ${L.r} ให้วาง <b>cut-api.gs</b> ใหม่ แล้ว Deploy เป็น New version จากนั้นกด <b>ตรวจใหม่</b>`}</div>`;
}

/* ── แท็บแก้แยกตามระบบ ──────────────────────────────────────────────────── */

/** คำที่ใช้ตอนแก้ในแต่ละระบบ need บวก = ต้องลงเพิ่ม ลบ = ต้องคืน */
const WHO_INFO = {
  s: {
    label: `ชีตทีม (${L.s})`, more: 'ลงขายเพิ่ม', less: 'ลดยอดขาย',
    why: `ชีตทีมไม่มีเลขออเดอร์ รายการจึงมาจากเทียบรายวันสองทาง: ช่องที่ชีตทีมต่างจาก ${L.x} และ ${L.t} ที่ตรงกันเอง และออเดอร์ที่สองระบบนั้นผิด แล้วชีตทีมวันนั้นลงเท่ากับระบบที่ผิด กดแถวเพื่อดูแถวขายในชีต`,
  },
  x: { label: L.x, more: 'ตัดเพิ่ม', less: 'คืนยอด', why: `รายออเดอร์ที่ยอดใน ${L.x} ไม่เท่ากับที่ควรตัดตาม Report` },
  t: {
    label: L.t, more: 'เบิกออกเพิ่ม', less: 'ลงรับเข้าคืน',
    why: `รายออเดอร์ที่ยอดใน ${L.t} ไม่เท่ากับที่ควรตัดตาม Report การคืนยอดลงเป็นรับเข้าของออเดอร์เดิม`,
  },
};
const WHO_ORDER = ['s', 'x', 't'];

function fixResult() {
  if (!FIX) {
    const c = dailyResult();
    FIX = WmsCut.fixLists(RAW.rows, RAW.gaps, c, c ? cellInfo() : null);
  }
  return FIX;
}

function needSum(list) {
  return list.reduce((t, e) => {
    if (e.need > 0) t.more += e.need; else t.less -= e.need;
    return t;
  }, { more: 0, less: 0 });
}

function whoCards(fx, st) {
  return `<div class="tx-cards tx-who">${WHO_ORDER.map((k) => {
    const list = fx[k], info = WHO_INFO[k], on = WHO === k ? 'on' : '';
    const card = (inner) => `<button class="tx-card tx-card-ic ${on}" data-who="${k}"><img src="${ICON[k]}" alt="" width="34" height="34"><span>${inner}</span></button>`;
    if (!list) return card(`<small>${esc(info.label)}</small><b>–</b><i>ต้องดึงยอดขายก่อน</i>`);
    const n = needSum(list);
    const wait = st ? list.filter((e) => logOf(st, k, e).state === 'wait').length : 0;
    return card(`<small>${esc(info.label)}</small>
      <b class="${list.length ? 'tx-neg' : 'tx-ok'}" data-count="${list.length}" data-count-key="who-${k}">${f(list.length)}</b>
      <i>${list.length ? `ลงเพิ่ม ${f(n.more)} · คืน ${f(n.less)} ชิ้น${wait ? ` · รอตรวจ ${f(wait)}` : ''}` : 'ไม่มีที่ต้องแก้'}</i>`);
  }).join('')}</div>`;
}

function fixWhy(e) {
  return e.kind === 'sheet' ? `ชีตทีมต่างจาก ${L.x} และ ${L.t}` : kindLabel(e.kind);
}

function fixNotes(e) {
  const out = [];
  if (e.via) out.push(`ชีตทีมวันนั้นเท่ากับ ${L[e.via]} จึงน่าจะลงผิดเหมือนกัน`);
  if (e.mixed) out.push(`ช่องนี้ ${L.x} หรือ ${L.t} มีออเดอร์ต้องแก้ด้วย แก้สองระบบนั้นก่อน ยอดที่ต้องลงอาจเปลี่ยน`);
  if (e.kind === 'cancel') out.push('คืนยอด เพราะยกเลิกก่อนของออกจากคลัง');
  return out;
}

/** วันที่ตัดจริง ถ้าไม่ใช่วันเดียวกับใน Report */
function fixCut(e) {
  return e.days.length && (e.days.length > 1 || e.days[0] !== e.date) ? `ตัด ${e.days.map(dm).join(', ')}` : '';
}

/** เลขออเดอร์กับ SKU อยู่ช่องเดียวกัน จอมือถือจะได้เห็นช่องต้องทำโดยไม่ต้องเลื่อนตาราง */
function fixItem(e) {
  if (e.kind === 'gap') return `<b>${f(e.orders)} ออเดอร์ ${esc(e.sys)} ทั้งวัน</b><span class="tx-sub">${f(e.lines)} รายการ</span>`;
  const order = e.ref ? `<span class="tx-ref">${esc(e.ref)}</span> <span class="tx-sub tx-in">${esc(e.sys || '-')}</span><br>` : '';
  if (!e.sku) return `${order}<b>ทั้งออเดอร์ ${f(e.lines)} SKU</b>`;
  return `${order}<b>${esc(e.sku)}</b><span class="tx-sub">${esc(e.name || RAW.names[e.sku] || '')}</span>`;
}

const logOf = (st, k, e) => (st && st.by[WmsCut.fixKey(k, e)]) || { state: 'open' };

/** ต้องดูซ้ำ: กดแก้แล้ว ตรวจใหม่แล้วยังไม่หาย ไม่ว่ายอดเท่าเดิม เหลือบางส่วน หรือกลับข้าง */
const AGAIN = { still: 1, part: 1, flip: 1 };

function logWords(s, e) {
  if (s.state === 'still') return { cls: 'lg-still', text: 'กดแก้แล้ว แต่ตรวจใหม่ยังไม่หาย', hint: 'ดูว่าลงในระบบแล้วจริง และไฟล์ตัดสต๊อกดึงข้อมูลใหม่แล้ว' };
  if (s.state === 'part') return { cls: 'lg-still', text: `แก้ไปบางส่วน จาก ${plus(s.mark.need)} เหลือ ${plus(e.need)}`, hint: '' };
  if (s.state === 'flip') return { cls: 'lg-flip', text: `ยอดกลับข้าง จาก ${plus(s.mark.need)} เป็น ${plus(e.need)}`, hint: 'น่าจะแก้ซ้ำสองรอบ ดูก่อนแก้อีก' };
  return null;
}

/** ช่องบันทึก: ปุ่มแก้แล้ว หรือสถานะหลังกด ใครกดเมื่อไร */
function logCell(k, e, st) {
  if (!st) return '';
  const key = WmsCut.fixKey(k, e), s = logOf(st, k, e);
  const btn = (attr, label) => `<button class="tx-opt lg-btn" ${attr}="${esc(key)}" ${SAVING ? 'disabled' : ''}>${SAVING === key ? 'กำลังบันทึก…' : label}</button>`;
  const who = s.mark ? `<span class="tx-sub">${esc(s.mark.by || 'ไม่ได้ระบุชื่อ')} · ${esc(atText(s.mark.at))}</span>` : '';
  if (s.state === 'open') return `${s.back ? '<span class="tx-sub tx-mid">เคยตรวจแล้วหาย แต่กลับมาอีก</span>' : ''}${btn('data-mark', '✓ แก้แล้ว')}`;
  if (s.state === 'wait') return `<span class="lg lg-wait">แก้แล้ว รอตรวจใหม่</span>${who}${btn('data-undo', 'ยกเลิก')}`;
  const w = logWords(s, e);
  return `<span class="lg ${w.cls}">${esc(w.text)}</span>${w.hint ? `<span class="tx-sub">${esc(w.hint)}</span>` : ''}${who}${btn('data-mark', '✓ แก้อีกรอบแล้ว')}`;
}

function fixRow(k, e, st) {
  const cut = fixCut(e);
  const more = e.kind === 'gap' && e.orders > e.refs.length ? ` และอีก ${f(e.orders - e.refs.length)} ออเดอร์` : '';
  const refs = e.kind === 'gap' ? `<details class="tx-int"><summary>ดูเลขออเดอร์</summary><p>${e.refs.map(esc).join(', ')}${esc(more)}</p></details>` : '';
  const verb = e.need > 0 ? WHO_INFO[k].more : WHO_INFO[k].less;
  const dim = logOf(st, k, e).state === 'wait' ? ' class="lg-dim"' : '';
  return `<tr${e.cell ? ` data-cell="${esc(e.cell)}"` : ''}${dim}>
    <td class="k-top"><span class="nw">${esc(dm(e.date))}</span>${cut ? `<span class="tx-sub">${esc(cut)}</span>` : ''}</td>
    <td class="tx-name k-main">${fixItem(e)}</td>
    <td class="nw k-side"><b class="tx-need ${e.need > 0 ? 'tx-mid' : 'tx-neg'}">${plus(e.need)}</b><span class="tx-sub">${esc(verb)}</span></td>
    <td class="tx-res k-res">${esc(fixWhy(e))}${fixNotes(e).map((t) => `<span class="tx-sub">${esc(t)}</span>`).join('')}${refs}</td>
    ${st ? `<td class="k-log">${logCell(k, e, st)}</td>` : ''}
  </tr>`;
}

/** วางลงชีตแล้วแตกเป็นคอลัมน์ได้เลย วันที่เขียนเต็มให้ชีตอ่านเป็นวันที่ไม่สลับวันกับเดือน */
function fixTsv(k, list, st) {
  const clean = (v) => String(v ?? '').replace(/[\t\r\n]+/g, ' ');
  const head = ['วันที่', 'ออเดอร์', 'ระบบขาย', 'SKU', 'ชื่อสินค้า', 'ต้องทำ', 'จำนวน', 'วันที่ตัด', 'เรื่อง', 'บันทึก'];
  const lines = list.map((e) => {
    const gap = e.kind === 'gap';
    return [
      e.date,
      gap ? e.refs.join(', ') + (e.orders > e.refs.length ? ` และอีก ${e.orders - e.refs.length} ออเดอร์` : '') : e.ref,
      e.sys || '',
      gap ? `${e.lines} รายการ` : e.sku || `ทั้งออเดอร์ ${e.lines} SKU`,
      e.name || RAW.names[e.sku] || '',
      e.need > 0 ? WHO_INFO[k].more : WHO_INFO[k].less,
      Math.abs(e.need),
      e.days.join(', '),
      [fixWhy(e), ...fixNotes(e)].join(' · '),
      (logWords(logOf(st, k, e), e) || {}).text || '',
    ].map(clean).join('\t');
  });
  return [head.join('\t'), ...lines].join('\n');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    /* เบราว์เซอร์ที่ไม่ให้ใช้ clipboard ตรงๆ ใช้วิธีเลือกข้อความแล้วคัดลอกแทน */
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove();
    return ok;
  }
}

/** รายการของระบบที่เปิดอยู่ ตามตัวกรองบันทึก copy ไม่เอารายการที่กดแก้แล้วรอตรวจ จะได้ไม่ส่งให้แก้ซ้ำ */
function sysRows() {
  const fx = fixResult();
  if (!WHO) WHO = WHO_ORDER.find((k) => fx[k] && fx[k].length) || 'x';
  const list = fx[WHO] || [];
  const st = logState();
  if (!st) return { fx, list, st, shown: list, copy: list, opens: [] };
  const state = (e) => logOf(st, WHO, e).state;
  const shown = list.filter((e) => !FSHOW || (FSHOW === 'again' ? AGAIN[state(e)] : state(e) === FSHOW));
  return { fx, list, st, shown, copy: shown.filter((e) => state(e) !== 'wait'), opens: shown.filter((e) => state(e) === 'open') };
}

function fshowBar(st, list) {
  const n = { '': list.length, open: 0, wait: 0, again: 0 };
  list.forEach((e) => {
    const s = logOf(st, WHO, e).state;
    n[AGAIN[s] ? 'again' : s]++;
  });
  const opt = (v, label) => `<button class="tx-opt ${FSHOW === v ? 'on' : ''}" data-fshow="${v}">${label} ${f(n[v])}</button>`;
  return `<div class="tx-bar">${opt('', 'ทั้งหมด')}${opt('open', 'ยังไม่แก้')}${opt('wait', 'รอตรวจใหม่')}${opt('again', 'ต้องดูซ้ำ')}</div>`;
}

/** ประวัติของระบบที่เปิดอยู่ รายการที่กดแก้แล้วและตรวจรอบหลังไม่พบแล้ว */
function doneHtml(st) {
  const list = st.done.filter((m) => m.k === WHO);
  if (!list.length) return '';
  const item = (m) => {
    const order = m.ref ? `<span class="tx-ref">${esc(m.ref)}</span> <span class="tx-sub tx-in">${esc(m.sys || '-')}</span><br>` : '';
    const what = m.sku ? `<b>${esc(m.sku)}</b>` : m.ref ? '<b>ทั้งออเดอร์</b>' : `<b>ขาดทั้งวัน ${esc(m.sys)}</b>`;
    return `${order}${what}<span class="tx-sub">${esc(m.what)}</span>`;
  };
  return `<details class="tx-int lg-done"><summary>✓ ตรวจแล้วหาย ${f(list.length)} รายการ</summary>
    <div class="tx-wrap"><table class="tx-tbl tx-mc mc-fix">
      <thead><tr><th>วันที่</th><th>ออเดอร์ / SKU</th><th>ที่แก้</th><th>คนกดแก้แล้ว</th></tr></thead>
      <tbody>${list.map((m) => `<tr>
        <td class="k-top"><span class="nw">${esc(dm(m.date))}</span></td>
        <td class="tx-name k-main">${item(m)}</td>
        <td class="nw k-side"><b class="tx-need">${plus(m.need)}</b></td>
        <td class="tx-res k-res">${esc(m.by || 'ไม่ได้ระบุชื่อ')}<span class="tx-sub">${esc(atText(m.at))}</span></td>
      </tr>`).join('')}</tbody>
    </table></div></details>`;
}

function sysHtml() {
  const { fx, list: all, st, shown, copy, opens } = sysRows();
  const info = WHO_INFO[WHO], list = fx[WHO];
  const tab = FIXLOG && FIXLOG.sheet
    ? `<a href="${esc(WmsCut.rowUrl(FIXLOG.sheet, 1))}" target="_blank" rel="noopener">บันทึกการแก้ ↗</a>` : '<b>บันทึกการแก้</b>';
  const intro = `<div class="tx-why">รวมทุกเรื่องที่ต้องแก้จากแท็บอื่น แยกตามระบบที่ต้องไปแก้ แต่ละรายการบอกว่าต้องลงเพิ่มหรือคืนเท่าไร
    กดคัดลอกแล้ววางในชีตหรือไลน์ ส่งให้คนดูแลระบบนั้นได้เลย${st ? ` แก้ในระบบเสร็จแล้วกด <b>แก้แล้ว</b> แล้วกดตรวจใหม่
    รายการที่หายไปจะถูกบันทึกว่าตรวจแล้วหาย ทุกเครื่องเห็นชุดเดียวกันในแท็บ ${tab} ของไฟล์ตัดสต๊อก` : ''}</div>`;
  const warn = FIXLOG_ERR ? `<div class="tx-warn bad lg-err">${esc(FIXLOG_ERR)}</div>`
    : FIXLOG_OLD ? '<div class="tx-warn">ปุ่มแก้แล้วยังใช้ไม่ได้ — สคริปต์ cut-api.gs ยังเป็นรุ่นที่ไม่มีบันทึกการแก้ ให้วางโค้ดใหม่แล้ว Deploy เป็น New version</div>' : '';
  let body;
  if (!list) body = dailyWaiting();
  else if (!list.length) body = `<div class="tx-empty art-done">${esc(info.label)} ไม่มีรายการที่ต้องแก้ — <b>เป็นเรื่องดี</b></div>`;
  else {
    const capped = Object.keys(RAW.kinds).some((k) => RAW.kinds[k].shown < RAW.kinds[k].total)
      ? '<div class="tx-note">บางประเภทมีรายการมากกว่าที่สคริปต์ส่งมา รายการนี้จึงมีแค่ที่หนักสุด แก้ชุดนี้แล้วกดตรวจใหม่จะเห็นที่เหลือ</div>' : '';
    const unclear = WHO === 's' && fx.unclear
      ? `<div class="tx-note">อีก ${f(fx.unclear)} ช่องที่สามแหล่งไม่เท่ากันเลย บอกไม่ได้ว่าระบบไหนผิด ดูในแท็บเทียบรายวัน</div>` : '';
    const shift = WHO === 's' ? ' ช่องที่น่าจะลงคนละวันไม่อยู่ในรายการ เพราะยอดรวมสองวันตรงแล้ว' : '';
    const bulk = opens.length > 1
      ? `<button class="tx-opt" data-mark-all ${SAVING ? 'disabled' : ''}>${SAVING === 'all' ? 'กำลังบันทึก…'
        : ARMED ? `กดอีกครั้งเพื่อยืนยัน ${f(opens.length)} รายการ` : `✓ แก้แล้วทั้ง ${f(opens.length)} รายการที่ยังไม่แก้`}</button>` : '';
    const table = shown.length
      ? `<div class="tx-wrap"><table class="tx-tbl tx-mc mc-fix">
        <thead><tr><th>วันที่</th><th>ออเดอร์ / SKU</th><th>ต้องทำ</th><th>เรื่อง</th>${st ? '<th>บันทึก</th>' : ''}</tr></thead>
        <tbody>${shown.map((e) => fixRow(WHO, e, st)).join('')}</tbody>
      </table></div>`
      : '<div class="tx-empty art-search">ไม่มีรายการในตัวกรองนี้</div>';
    body = `<h3 class="tx-h"><img class="tx-ic" src="${ICON[WHO]}" alt="">${esc(info.label)}<span class="n">${f(list.length)} รายการ</span></h3>
      <div class="tx-why">${esc(info.why + shift)}</div>
      ${st ? fshowBar(st, all) : ''}
      <div class="tx-bar"><button class="tx-opt" data-copy ${copy.length ? '' : 'disabled'}>📋 คัดลอก ${f(copy.length)} รายการ${st ? 'ที่ยังไม่ได้แก้' : ''} ไปวางในชีตหรือไลน์</button>${bulk}</div>
      ${table}${unclear}${capped}`;
  }
  return intro + warn + whoCards(fx, st) + body + (st && list ? doneHtml(st) : '');
}

async function markOne(act, key) {
  if (SAVING) return;
  const e = (fixResult()[WHO] || []).find((x) => WmsCut.fixKey(WHO, x) === key);
  if (e) await saveLog(act, [logItem(WHO, e)], key);
}

/** กดครั้งแรกให้ยืนยันก่อน ทั้งชุดอาจเป็นร้อยรายการ กดพลาดแล้วต้องยกเลิกทีละรายการ */
let armTimer = 0;
async function markAll() {
  if (SAVING) return;
  clearTimeout(armTimer);
  if (!ARMED) {
    ARMED = 1;
    renderBody();
    armTimer = setTimeout(() => { ARMED = 0; if (TAB === 'sys') renderBody(); }, 5000);
    return;
  }
  ARMED = 0;
  await saveLog('แก้แล้ว', sysRows().opens.map((e) => logItem(WHO, e)));
}

/* ── รวมหน้า ────────────────────────────────────────────────────────────── */

function renderBody() {
  if (!RAW) {
    $('body').innerHTML = `<div class="tx-empty ${BUSY ? '' : WmsSettings.cutUrl() ? 'art-data' : 'art-link'}">
      ${BUSY ? '<b>กำลังตรวจ</b><br>สคริปต์ต้องอ่านข้อมูลหลายแสนแถว อาจใช้เวลา 1-3 นาที' : ''}
      ${!BUSY && WmsSettings.cutUrl() ? 'กด <b>เริ่มตรวจ</b> เพื่อเทียบรายการตัดสต๊อกกับ Report ของเดือน' : ''}
      ${!BUSY && !WmsSettings.cutUrl() ? 'ยังไม่ได้ตั้ง URL ของสคริปต์ <b>cut-api.gs</b><br>ดูวิธีติดตั้งใน README หัวข้อ Stock Cut Check' : ''}
    </div>`;
    return;
  }
  if (TAB === 'recon') { $('body').innerHTML = warnings() + reconHtml(); return; }
  if (TAB === 'daily') { $('body').innerHTML = dailyHtml(); renderList(); return; }
  if (TAB === 'sys') { $('body').innerHTML = warnings() + sysHtml(); return; }
  const top = TAB === 'fix' ? cards(FIX_KINDS) : RAW.gaps.map(gapBlock).join('');
  $('body').innerHTML = warnings() + top + filterBar() + '<div id="list"></div>' + (TAB === 'fix' ? '<div class="pk-bar" id="pkBar"></div>' : '');
  renderList();
}

function render() { renderSrc(); renderSum(); renderTabs(); renderBody(); renderPop(); }

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  TAB = b.dataset.tab;
  KIND = '';
  Q = '';   // รหัสที่ค้นค้างจากแท็บอื่นจะทำให้แท็บนี้ดูเหมือนว่างเปล่า
  POP = null;
  render();
  /* เลื่อนลงไปแล้วเปลี่ยนแท็บ ให้เริ่มดูแท็บใหม่จากหัว ไม่ใช่กลางหน้า
     จอคอมแถบแท็บติดจอ จอเล็กแถบแท็บอยู่ใต้เมนูแอปที่ติดขอบบน */
  const top = $('body').getBoundingClientRect().top + scrollY - $('tabs').offsetHeight - barHeight();
  if (scrollY > top) scrollTo(0, top);
});

/** เมนูของแอปติดขอบบนจอเมื่อจอแคบ ตอนนั้นมันกว้างเต็มจอ จอคอมเมนูอยู่ด้านข้างไม่บังอะไร */
function barHeight() {
  const bar = document.querySelector('.sysbar');
  return bar && bar.offsetWidth >= document.documentElement.clientWidth - 1 ? bar.offsetHeight : 0;
}

$('sum').addEventListener('click', (e) => {
  if (!e.target.closest('[data-sum]')) return;
  SUM_OPEN = !SUM_OPEN;
  renderSum();
});

$('pop').addEventListener('click', (e) => {
  /* กดที่พื้นหลังนอกกล่องก็ปิด */
  if (e.target === e.currentTarget || e.target.closest('[data-close]')) { closePop(); return; }
  if (e.target.closest('[data-back]')) { openPop({ day: POP.day, cell: '' }); return; }
  const cell = e.target.closest('[data-cell]');
  if (cell) openPop({ day: POP.day, cell: cell.dataset.cell });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && POP) closePop();
});

$('body').addEventListener('change', (e) => {
  const one = e.target.closest('input[data-pick]');
  if (one) {
    if (one.checked) PICK.add(one.dataset.pick); else PICK.delete(one.dataset.pick);
    PICK_MSG = null;
    syncPicks();
    return;
  }
  const all = e.target.closest('input[data-pick-kind]');
  if (all) {
    sectionRefs(all.dataset.pickKind).forEach((x) => (all.checked ? PICK.add(x) : PICK.delete(x)));
    PICK_MSG = null;
    syncPicks();
  }
});

$('body').addEventListener('click', (e) => {
  if (e.target.closest('[data-export]')) { exportPicked(); return; }
  if (e.target.closest('[data-pick-clear]')) { PICK.clear(); PICK_MSG = null; syncPicks(); return; }
  /* มียอดขายของช่วงนี้แล้ว กดคือขอชุดใหม่ ยังไม่มีอ่านชุดกลางที่เก็บไว้ก่อน เร็วกว่า */
  if (e.target.closest('[data-reload]')) { loadLedger(ledgerFits()); return; }
  const mark = e.target.closest('[data-mark]');
  if (mark) { markOne('แก้แล้ว', mark.dataset.mark); return; }
  const undo = e.target.closest('[data-undo]');
  if (undo) { markOne('ยกเลิก', undo.dataset.undo); return; }
  if (e.target.closest('[data-mark-all]')) { markAll(); return; }
  const fshow = e.target.closest('[data-fshow]');
  if (fshow) {
    FSHOW = fshow.dataset.fshow;
    ARMED = 0;
    renderBody();
    return;
  }
  const copy = e.target.closest('[data-copy]');
  if (copy) {
    const rows = sysRows();
    copyText(fixTsv(WHO, rows.copy, rows.st)).then((ok) => {
      copy.textContent = ok ? '✓ คัดลอกแล้ว วางในชีตได้เลย' : 'คัดลอกไม่ได้ ลองกดอีกครั้ง';
    });
    return;
  }
  const who = e.target.closest('[data-who]');
  if (who) {
    WHO = who.dataset.who;
    ARMED = 0;
    renderBody();
    return;
  }
  const view = e.target.closest('[data-view]');
  if (view) {
    VIEW = view.dataset.view;
    renderBody();
    return;
  }
  const cell = e.target.closest('[data-cell]');
  if (cell) {
    openPop({ day: '', cell: cell.dataset.cell }, tapAt(e, cell));
    return;
  }
  const sku = e.target.closest('[data-sku]');
  if (sku) {
    VIEW = 'day';
    Q = sku.dataset.sku;
    renderBody();
    return;
  }
  const day = e.target.closest('[data-day]');
  if (day) {
    openPop({ day: day.dataset.day, cell: '' }, tapAt(e, day));
    return;
  }
  const card = e.target.closest('[data-kind]');
  if (card) {
    KIND = KIND === card.dataset.kind ? '' : card.dataset.kind;
    renderBody();
    return;
  }
  const opt = e.target.closest('[data-sys]');
  if (opt) {
    SYS = opt.dataset.sys;
    renderBody();
  }
});

$('body').addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  Q = e.target.value.trim().toUpperCase();
  renderList();   // ไม่วาดช่องค้นใหม่ ไม่งั้นเคอร์เซอร์จะหลุดระหว่างพิมพ์
});

readCache();
render();
loadFixLog();
/* เปิดหน้าแล้วถามทันทีว่ามีผลตรวจชุดกลางที่ใหม่กว่าในเครื่องนี้ไหม จากนั้นถามทุกนาที */
const WATCH = WmsShared.watch(checkShared);
WATCH.now();
</script>
</body>
</html>
