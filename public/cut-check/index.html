<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เช็ครายการตัดสต๊อก — WMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── แถบแหล่งข้อมูล ── */
.tx-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--wms-surface2);border-bottom:1px solid var(--wms-border);font-size:12px}
.tx-src .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--wms-surface);border:1px solid var(--wms-border);color:var(--wms-muted)}
.tx-src .pill b{color:var(--wms-text);font-weight:600}
.tx-src .pill.warn{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.tx-src .sp{flex:1}
.tx-src button{padding:4px 12px;border-radius:999px;border:1px solid var(--wms-border2);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:12px;color:#334155;cursor:pointer}
.tx-src button:hover:not(:disabled){background:var(--wms-primary-light);border-color:var(--wms-primary);
  color:var(--wms-primary-dark)}
.tx-src button.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff}
.tx-src button.p:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.tx-src button:disabled{opacity:.6;cursor:default}
.tx-err{width:100%;font-size:12.5px;color:#B91C1C;font-weight:600}

/* ── ยอดรวม ── */
.tx-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;padding:12px 20px;
  background:var(--wms-surface);border-bottom:1px solid var(--wms-border)}
.tx-sum:empty{display:none}
.tx-stat{padding:8px 11px;border-radius:var(--wms-radius-sm);background:var(--wms-surface2)}
.tx-stat small{display:block;font-size:11.5px;color:var(--wms-muted)}
.tx-stat b{font-size:18px;font-weight:700;color:var(--wms-text);font-variant-numeric:tabular-nums}
.tx-stat i{display:block;font-style:normal;font-size:11px;color:var(--wms-muted)}

/* ── เนื้อหา ── */
.tx-body{padding:14px 20px 60px}
.tx-empty{padding:44px 20px;text-align:center;color:var(--wms-muted);font-size:14px;line-height:1.7}
.tx-empty b{color:var(--wms-text)}
.tx-note{margin-top:10px;font-size:12px;color:var(--wms-muted);line-height:1.6}
.tx-warn{margin-bottom:12px;padding:10px 13px;border-radius:var(--wms-radius-sm);background:#FEF3C7;
  border:1px solid #FDE68A;color:#92400E;font-size:13px;line-height:1.6}
.tx-warn b{font-weight:700}
.tx-pass{margin-bottom:12px;padding:10px 13px;border-radius:var(--wms-radius-sm);background:#DCFCE7;
  border:1px solid #BBF7D0;color:#166534;font-size:13px;font-weight:600;line-height:1.6}
.tx-h{margin:20px 0 4px;font-size:14px;font-weight:700;color:var(--wms-text)}
.tx-h:first-child{margin-top:0}
.tx-h .n{margin-left:6px;font-size:12px;font-weight:500;color:var(--wms-muted)}
.tx-why{margin-bottom:8px;font-size:12.5px;color:var(--wms-muted);line-height:1.5}

/* ตารางกว้างกว่าจอมือถือ เลื่อนเฉพาะตาราง หน้าทั้งหน้าไม่ต้องเลื่อนตาม */
.tx-wrap{overflow-x:auto;background:var(--wms-surface);border:1px solid var(--wms-border);border-radius:var(--wms-radius)}
.tx-tbl{width:100%;border-collapse:collapse;font-size:13px}
.tx-tbl th{text-align:left;padding:9px 11px;background:var(--wms-surface2);font-size:11.5px;
  font-weight:600;color:var(--wms-muted);border-bottom:1px solid var(--wms-border);white-space:nowrap}
.tx-tbl td{padding:8px 11px;border-bottom:1px solid #F1F5F9;vertical-align:top}
.tx-tbl tr:last-child td{border-bottom:0}
.tx-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-tbl th.num{text-align:right}
.tx-tbl .nw{white-space:nowrap}
.tx-tbl .sum td{background:var(--wms-surface2);font-weight:700}
.tx-sub{display:block;font-size:11.5px;color:var(--wms-muted);line-height:1.4}
.tx-name{min-width:170px}   /* จอมือถือบีบชื่อสินค้าจนเรียงทีละคำ ให้ตารางเลื่อนข้างแทน */
.tx-res{min-width:190px}
.tx-ref{font-weight:600}
.tx-neg{color:#B91C1C;font-weight:700}
.tx-mid{color:#B45309;font-weight:600}
.tx-ok{color:#166534;font-weight:600}

.tx-int{margin-top:8px}
.tx-int summary{cursor:pointer;font-size:12.5px;font-weight:600}
.tx-int p{margin-top:6px;font-size:12px;line-height:1.7;word-break:break-word}

/* ── ตัวเลือก ── */
.tx-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--wms-muted)}
.tx-opt{padding:5px 13px;border-radius:999px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px;color:#334155;cursor:pointer}
.tx-opt:hover{border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.tx-opt.on{background:var(--wms-primary-light);border-color:var(--wms-primary);color:var(--wms-primary-dark);font-weight:600}
.tx-input{flex:1;min-width:180px;max-width:460px;padding:9px 13px;border-radius:10px;border:1.5px solid var(--wms-border2);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:13.5px;color:var(--wms-text);outline:none}
.tx-input:focus{border-color:var(--wms-primary)}

/* ── การ์ดแต่ละประเภท กดเพื่อดูเฉพาะประเภทนั้น ── */
.tx-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tx-card{padding:9px 12px;border-radius:var(--wms-radius-sm);background:var(--wms-surface);
  border:1px solid var(--wms-border);text-align:left;font-family:var(--wms-font);cursor:pointer}
.tx-card small{display:block;font-size:11.5px;color:var(--wms-muted)}
.tx-card b{font-size:18px;font-weight:700;color:var(--wms-text);font-variant-numeric:tabular-nums}
.tx-card b.tx-neg{color:#B91C1C}
.tx-card b.tx-mid{color:#B45309}
.tx-card b.tx-ok{color:#166534}
.tx-card i{display:block;font-style:normal;font-size:11.5px;color:var(--wms-muted)}
.tx-card:hover{border-color:var(--wms-primary)}
.tx-card.on{border-color:var(--wms-primary);background:var(--wms-primary-light)}

/* ── เทียบรายวัน ── */
.tx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tx-stats .tx-stat{background:var(--wms-surface);border:1px solid var(--wms-border)}
.tx-stat b.tx-neg{color:#B91C1C}
.tx-stat b.tx-mid{color:#B45309}
.tx-stat b.tx-ok{color:#166534}
.tx-bar .sp{flex:1}
.tx-tbl tr[data-day],.tx-tbl tr[data-sku]{cursor:pointer}
.tx-tbl tr[data-day]:hover td,.tx-tbl tr[data-sku]:hover td{background:var(--wms-primary-light)}
.tx-tbl tr.open td{background:var(--wms-primary-light);font-weight:600}
.tx-more{padding:0;border:0;background:none;font:inherit;color:inherit;white-space:nowrap}
button.tx-more{cursor:pointer}
.tx-more i{display:inline-block;width:12px;font-style:normal;color:var(--wms-muted)}
.tx-tbl .tx-detail>td{padding:10px;background:var(--wms-surface2)}
.tx-tag{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:999px;background:#FEF3C7;
  color:#92400E;font-size:11px;font-weight:600;white-space:nowrap}

@media (max-width:640px){
  .tx-body{padding:12px 12px 60px}
  .tx-src,.tx-sum,.tx-tabs{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body data-wms-module="cutcheck">

<div class="wms-shell">
<div data-wms-shell="cutcheck" data-root="../"></div>
<div class="wms-main">

  <div class="mod-head">
    <div class="mod-title">
      <div class="ic"><img src="../icons/cut-check.png" alt="" width="38" height="38"></div>
      <div>
        <h2>เช็ครายการตัดสต๊อก · Stock Cut Check</h2>
        <p>เทียบรายการตัดใน Transaction และ TRcloud กับ Report ออเดอร์ของเดือน และเทียบยอดออกรายวันกับสต๊อกราย Location — อ่านอย่างเดียว ไม่แก้ชีต</p>
      </div>
    </div>
  </div>

  <div class="tx-src" id="src"></div>
  <div class="tx-sum" id="sum"></div>
  <div class="tx-tabs" id="tabs" role="tablist"></div>
  <div class="tx-body" id="body"></div>

</div><!-- /.wms-main -->
</div><!-- /.wms-shell -->

<script type="module" src="../wms-shell.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-cut.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f = n => Math.round(n).toLocaleString('en-US');
const plus = n => (n > 0 ? '+' : n < 0 ? '−' : '') + f(Math.abs(n));
const dm = d => { const p = String(d || '').split('-'); return p.length === 3 ? `${+p[2]}/${+p[1]}` : ''; };

const CACHE = 'wms:cut:result';   // ผลรอบล่าสุด สคริปต์อ่านชีตทั้งไฟล์ เปิดหน้ากลับมาจึงไม่ควรต้องรอใหม่
const LEDGER_CACHE = 'wms:cut:ledger';   // ยอดขายรายวันจากสต๊อกราย Location คนละสคริปต์กับด้านบน ดึงใหม่แยกกันได้
const TIMEOUT = 300000;           // อ่านสี่แท็บรวมหลายแสนแถว เผื่อเวลาให้ใกล้เพดาน 6 นาทีของ Apps Script
const L = WmsCut.LABEL;

const KINDS = {
  over: { label: 'ตัดเกิน', why: 'ตัดมากกว่าจำนวนใน Report ส่วนมากเกิดจากลงซ้ำ ดูวันที่ตัดในคอลัมน์วันที่', tone: 'tx-neg' },
  wrong: { label: 'ตัดผิด SKU', why: 'ออเดอร์นี้มีใน Report แต่ SKU นี้ไม่อยู่ในออเดอร์', tone: 'tx-neg' },
  ghost: { label: 'ตัดแต่ไม่มีใน Report', why: 'มีรายการตัด แต่ไม่พบเลขออเดอร์นี้ทั้งใน Report JST และ CRM', tone: 'tx-neg' },
  cancel: { label: 'ขนส่งยกเลิกแต่ตัดแล้ว', why: 'Report บอกว่าการจัดส่งถูกยกเลิก ถ้าของไม่ได้ออกจากคลังจริงต้องคืนยอด', tone: 'tx-mid' },
  blankCut: { label: 'สถานะขนส่งว่างแต่ตัดแล้ว', why: 'Report ยังไม่มีสถานะขนส่ง อาจยังไม่ได้ออกจริง ควรเช็คอีกที', tone: 'tx-mid' },
  transferDiff: { label: 'โอนย้ายไม่ตรงกัน', why: 'งานโอนย้ายที่ยอดในสองระบบไม่เท่ากัน', tone: 'tx-neg' },
  under: { label: 'ยังไม่ตัดหรือตัดไม่ครบ', why: 'จำนวนใน Report มากกว่ายอดที่ตัด ดูคอลัมน์สุดท้ายว่าขาดฝั่งไหน', tone: 'tx-neg' },
};
const FIX_KINDS = ['over', 'wrong', 'ghost', 'cancel', 'blankCut', 'transferDiff'];

/* ครบทุกถังที่สคริปต์ส่งมา ถังที่ไม่อยู่ในนี้จะขึ้นชื่อถังดิบ เห็นได้ทันทีว่าลืมเพิ่ม */
const PARTS = {
  over: { label: 'ตัดเกิน', fix: true },
  wrong: { label: 'ตัดผิด SKU', fix: true },
  ghost: { label: 'ตัดแต่ไม่มีใน Report', fix: true },
  transferDiff: { label: 'โอนย้ายไม่ตรงกัน', fix: true },
  under: { label: 'ยังไม่ตัดหรือตัดไม่ครบ', fix: true },
  gap: { label: 'ขาดทั้งวัน', fix: true },
  nonstock: { label: 'รหัสที่ไม่ใช่ของในคลัง ไม่ได้ตัด' },
  blankOk: { label: 'สถานะขนส่งว่าง และยังไม่ตัด' },
  cancelOk: { label: 'ขนส่งยกเลิก และไม่ได้ตัด' },
  transfer: { label: 'งานโอนย้าย ไม่มีใน Report' },
  outside: { label: 'ตัดนอกช่วงของ Report รอเทียบรอบถัดไป' },
  adjust: { label: 'TRcloud แผนก IV ปรับยอดคลัง' },
};

const SIDE = { tx: 'Transaction', tr: 'TRcloud', both: 'ทั้งสองระบบ' };

let RAW = null;
let BUSY = '';
let ERR = '';
let TAB = 'fix';
let KIND = '';    // การ์ดที่กดเลือก
let SYS = '';     // JST | CRM
let Q = '';
let LEDGER = null;      // คำตอบจาก tx-daily
let LEDGER_ERR = '';
let DAILY = null;       // ผลเทียบรายวัน คิดครั้งเดียวต่อข้อมูลหนึ่งชุด
let VIEW = 'day';       // day | sku
let OPEN_DAY = '';

function readCache() {
  try {
    const r = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (r && r.app === 'cut' && r.kinds && r.recon) RAW = r;
    const l = JSON.parse(localStorage.getItem(LEDGER_CACHE) || 'null');
    if (l && l.cells) LEDGER = l;
  } catch (e) {}
}

function saveCache(key, r) {
  /* เก็บไม่ได้ก็แค่ต้องกดตรวจใหม่รอบหน้า ไม่กระทบผลรอบนี้ */
  try { localStorage.setItem(key, JSON.stringify(r)); } catch (e) {}
}

/* ── แถบแหล่งข้อมูล ─────────────────────────────────────────────────────── */

function renderSrc() {
  const url = WmsSettings.cutUrl();
  let html = '';
  if (BUSY) {
    html += `<span class="pill">⏳ ${esc(BUSY)}</span>`;
  } else if (RAW) {
    const when = new Date(RAW.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    html += `<span class="pill">📅 Report <b>${esc(dm(RAW.period.from))} ถึง ${esc(dm(RAW.period.to))}</b></span>`;
    html += `<span class="pill">🕐 ตรวจเมื่อ <b>${esc(when)}</b></span>`;
  } else {
    html += `<span class="pill warn">⚠️ ยังไม่ได้ตรวจ</span>`;
  }
  html += `<span class="sp"></span>`;
  if (url) {
    html += `<button id="runBtn" class="${RAW ? '' : 'p'}" ${BUSY ? 'disabled' : ''}>${BUSY ? 'กำลังตรวจ…' : (RAW ? '🔄 ตรวจใหม่' : '▶️ เริ่มตรวจ')}</button>`;
  } else {
    html += `<span class="pill">ยังไม่ได้ตั้ง Apps Script URL — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a></span>`;
  }
  if (ERR) html += `<div class="tx-err">${esc(ERR)}</div>`;
  $('src').innerHTML = html;
  const btn = $('runBtn');
  if (btn) btn.onclick = run;
}

async function run() {
  const url = WmsSettings.cutUrl();
  if (BUSY || !url) return;
  ERR = '';
  BUSY = 'กำลังอ่านชีตทั้ง 4 แท็บ…';
  renderSrc();
  renderBody();
  try {
    const r = await WmsGas.json(url, 'cut-check', {
      retries: 0,
      timeoutMs: TIMEOUT,
      onProgress: (sec) => { BUSY = `กำลังอ่านชีตทั้ง 4 แท็บ… ${sec} วินาที`; renderSrc(); },
    });
    if (r.error) throw new Error(r.error);
    if (r.app !== 'cut' || !r.kinds) throw new Error('คำตอบไม่ใช่ของสคริปต์เช็คตัดสต๊อก ตรวจ URL ที่หน้าตั้งค่า');
    RAW = r;
    DAILY = null;
    saveCache(CACHE, r);
  } catch (e) {
    ERR = e.message;
    BUSY = '';
    render();
    return;
  }
  await loadLedger();
}

/** ดึงแยกจากการตรวจหลัก แก้สมุดแล้วเช็คซ้ำได้ในไม่กี่วินาที ไม่ต้องรอตรวจทั้งสี่แท็บ */
async function loadLedger() {
  const url = WmsSettings.txUrl();
  LEDGER_ERR = '';
  if (url && RAW) {
    const say = (sec) => { BUSY = `กำลังอ่านยอดขายจากสต๊อกราย Location…${sec ? ` ${sec} วินาที` : ''}`; renderSrc(); };
    say(0);
    renderBody();
    try {
      const r = await WmsGas.json(url, `tx-daily&from=${RAW.period.from}&to=${RAW.period.to}`, { retries: 1, onProgress: say });
      if (r.error) throw new Error(r.error);
      if (r.app !== 'transaction') throw new Error('URL ของ Transaction ในหน้าตั้งค่าไม่ใช่สคริปต์ tx-api.gs');
      if (!r.cells) throw new Error('สคริปต์ tx-api.gs ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version');
      LEDGER = r;
      DAILY = null;
      saveCache(LEDGER_CACHE, r);
    } catch (e) {
      LEDGER_ERR = e.message;
    }
  }
  BUSY = '';
  render();
}

/* ── ยอดรวมและแท็บ ──────────────────────────────────────────────────────── */

function renderSum() {
  if (!RAW) { $('sum').innerHTML = ''; return; }
  const t = RAW.totals;
  const stat = (label, n, sub) => `<div class="tx-stat"><small>${esc(label)}</small><b>${f(n)}</b><i>${esc(sub)}</i></div>`;
  $('sum').innerHTML =
    stat('Report ของเดือน', t.report, `JST ${f(t.jst)} · CRM ${f(t.crm)}`) +
    stat('ตัดใน Transaction', t.tx, `ต่างจาก Report ${plus(t.tx - t.report)}`) +
    stat('ตัดใน TRcloud', t.tr, `ต่างจาก Report ${plus(t.tr - t.report)}`) +
    stat('รายการที่ตรงกันทุกฝั่ง', RAW.info.matched.lines, `${f(RAW.info.matched.qty)} ชิ้น`);
}

function fixCount() { return FIX_KINDS.reduce((s, k) => s + RAW.kinds[k].total, 0); }
function underCount() { return RAW.kinds.under.total + RAW.gaps.length; }

function renderTabs() {
  if (!RAW) { $('tabs').innerHTML = ''; return; }
  const tab = (id, label, icon, n) => `<button class="tx-tab ${TAB === id ? 'on' : ''}" data-tab="${id}" role="tab" aria-selected="${TAB === id}"><img src="${icon}" alt="" width="26" height="26">${esc(label)}${n === null ? '' : `<span class="n">${f(n)}</span>`}</button>`;
  $('tabs').innerHTML =
    tab('fix', 'ตัดผิด / ตัดเกิน', '../icons/tab-cut.png', fixCount()) +
    tab('under', 'ยังไม่ตัด', '../icons/tab-wait.png', underCount()) +
    tab('daily', 'เทียบรายวัน', '../icons/tab-daily.png', dailyResult() ? dailyResult().counts.daysBad : null) +
    tab('recon', 'ที่มาของยอด', '../icons/tab-source.png', null);
}

/* ── ตารางรายการ ────────────────────────────────────────────────────────── */

/** คอลัมน์สุดท้ายอ่านแล้วต้องรู้เลยว่าต่างกันยังไงและฝั่งไหน ไม่ต้องลบเลขเอง */
function diffText(r) {
  const word = (d) => {
    if (r.goal === 0) return d > 0 ? `ตัดอยู่ ${f(d)}` : `ติดลบ ${f(-d)}`;
    return d > 0 ? `เกิน ${f(d)}` : `ขาด ${f(-d)}`;
  };
  const dx = r.x - r.goal, dt = r.t - r.goal;
  if (dx === dt) return dx ? `${word(dx)} ทั้งสองระบบ` : '';
  return [dx ? `Transaction ${word(dx)}` : '', dt ? `TRcloud ${word(dt)}` : ''].filter(Boolean).join(' · ');
}

function cutDays(r) {
  const days = r.xd.length ? r.xd : r.td;
  if (!days.length) return 'ยังไม่มีรายการตัด';
  if (days.length === 1 && days[0] === r.date) return '';
  return 'ตัด ' + days.map(dm).join(', ');
}

function rowHtml(r) {
  const name = r.sku ? (RAW.names[r.sku] || '') : '';
  const cut = cutDays(r);
  const bad = (v) => (v !== r.goal ? 'tx-neg' : '');
  return `<tr>
    <td class="nw"><span class="tx-ref">${esc(r.ref || '(ไม่มีเลขออเดอร์)')}</span><span class="tx-sub">${esc(r.sys || '-')}${r.sup ? ' · ' + esc(r.sup) : ''}</span></td>
    <td class="tx-name">${r.sku ? `<b>${esc(r.sku)}</b><span class="tx-sub">${esc(name)}</span>` : `<b>ทั้งออเดอร์ ${f(r.lines)} SKU</b>`}</td>
    <td class="nw">${esc(dm(r.date))}${cut ? `<span class="tx-sub">${esc(cut)}</span>` : ''}${r.ship ? `<span class="tx-sub">${esc(r.ship)}</span>` : ''}</td>
    <td class="num">${f(r.r)}</td>
    <td class="num ${bad(r.x)}">${f(r.x)}</td>
    <td class="num ${bad(r.t)}">${f(r.t)}</td>
    <td class="tx-res">${esc(diffText(r))}${r.note ? `<span class="tx-sub">เหตุผลใน TRcloud: ${esc(r.note)}</span>` : ''}</td>
  </tr>`;
}

const TABLE_HEAD = `<tr><th>ออเดอร์</th><th>SKU</th><th>วันที่</th><th class="num">Report</th><th class="num">Transaction</th><th class="num">TRcloud</th><th>ต่างกันยังไง</th></tr>`;

function matches(r) {
  if (SYS && r.sys !== SYS) return false;
  if (!Q) return true;
  const hay = `${r.ref} ${r.sku} ${RAW.names[r.sku] || ''}`.toUpperCase();
  return hay.includes(Q);
}

function section(kind) {
  const info = KINDS[kind], sum = RAW.kinds[kind];
  const rows = RAW.rows.filter((r) => r.k === kind && matches(r));
  if (!rows.length) return '';
  const capped = sum.shown < sum.total ? `<div class="tx-note">แสดง ${f(sum.shown)} รายการที่หนักสุด จากทั้งหมด ${f(sum.total)} รายการ</div>` : '';
  return `<h3 class="tx-h">${esc(info.label)}<span class="n">${f(rows.length)} รายการ</span></h3>
    <div class="tx-why">${esc(info.why)}</div>
    <div class="tx-wrap"><table class="tx-tbl"><thead>${TABLE_HEAD}</thead><tbody>${rows.map(rowHtml).join('')}</tbody></table></div>${capped}`;
}

function cards(kinds) {
  return `<div class="tx-cards">${kinds.map((k) => {
    const s = RAW.kinds[k], info = KINDS[k];
    return `<button class="tx-card ${KIND === k ? 'on' : ''}" data-kind="${k}"><small>${esc(info.label)}</small>
      <b class="${s.total ? info.tone : 'tx-ok'}">${f(s.total)}</b><i>${s.total ? `${f(s.orders)} ออเดอร์ · ${f(s.qty)} ชิ้น` : 'ไม่มี'}</i></button>`;
  }).join('')}</div>`;
}

function filterBar() {
  const opt = (v, label) => `<button class="tx-opt ${SYS === v ? 'on' : ''}" data-sys="${v}">${label}</button>`;
  return `<div class="tx-bar">
    <input class="tx-input" id="q" type="search" placeholder="ค้นเลขออเดอร์ หรือ SKU" value="${esc(Q)}">
    ${opt('', 'ทุกระบบ')}${opt('JST', 'JST')}${opt('CRM', 'CRM')}
  </div>`;
}

function renderList() {
  const box = $('list');
  if (!box) return;
  if (TAB === 'daily') { box.innerHTML = dailyList(); return; }
  const kinds = TAB === 'fix' ? FIX_KINDS : ['under'];
  const shown = KIND ? [KIND] : kinds;
  const html = shown.map(section).join('');
  const total = TAB === 'fix' ? fixCount() : RAW.kinds.under.total;
  box.innerHTML = html || (total
    ? `<div class="tx-empty art-search">ไม่พบรายการที่ตรงกับตัวกรอง</div>`
    : `<div class="tx-empty art-done">${TAB === 'fix' ? 'ไม่พบรายการตัดผิดหรือตัดเกิน' : 'ไม่พบรายการที่ยังไม่ตัด'} — <b>เป็นเรื่องดี</b></div>`);
}

function gapBlock(g) {
  const who = g.side === 'both' ? 'ทั้ง Transaction และ TRcloud' : SIDE[g.side];
  const other = g.side === 'both' ? '' : ` แต่ ${SIDE[g.side === 'tx' ? 'tr' : 'tx']} ตัดแล้ว`;
  const carriers = Object.keys(g.carriers).map((c) => `${c} ${f(g.carriers[c])}`).join(', ');
  const more = g.orders > g.refs.length ? ` และอีก ${f(g.orders - g.refs.length)} ออเดอร์` : '';
  return `<div class="tx-warn">
    <b>${esc(dm(g.date))} · ${esc(g.sys)} ทั้งวันยังไม่ลง ${esc(who)}</b>${esc(other)}<br>
    ${f(g.orders)} ออเดอร์ · ${f(g.lines)} รายการ · ${f(g.qty)} ชิ้น (${esc(carriers)})
    <details class="tx-int"><summary>ดูเลขออเดอร์</summary><p>${g.refs.map(esc).join(', ')}${esc(more)}</p></details>
  </div>`;
}

function warnings() {
  return RAW.warnings.map((w) => `<div class="tx-warn">⚠️ ${esc(w)}</div>`).join('');
}

/* ── แท็บที่มาของยอด ────────────────────────────────────────────────────── */

function partLine(p) {
  const info = PARTS[p.id] || { label: p.id };
  return `<tr>
    <td>${esc(info.label)}${partNote(p.id)}</td>
    <td class="num">${f(p.lines)}</td>
    <td class="num ${info.fix && p.dx ? 'tx-neg' : ''}">${plus(p.dx) || '0'}</td>
    <td class="num ${info.fix && p.dt ? 'tx-neg' : ''}">${plus(p.dt) || '0'}</td>
  </tr>`;
}

function partNote(id) {
  const i = RAW.info;
  let text = '';
  if (id === 'nonstock') text = `รหัสขึ้นต้น STR ${f(i.nonStock.qty)} ชิ้น · รหัสไม่ครบหรือว่าง ${f(i.badSku.qty)} ชิ้น`;
  if (id === 'blankOk') text = 'น่าจะยังไม่ออกจากคลังจริง';
  if (id === 'cancelOk') text = 'ถูกต้องแล้ว';
  if (id === 'transfer') text = `${f(i.transfer.refs)} เลขงาน ยอดสองระบบตรงกัน`;
  if (id === 'outside') text = `${dm(i.outsideTx.from)}${i.outsideTx.to !== i.outsideTx.from ? ' ถึง ' + dm(i.outsideTx.to) : ''} · ${f(i.outsideTx.orders)} ออเดอร์`;
  if (id === 'adjust') text = `รับเข้า ${f(i.adjust.inq)} · เบิกออก ${f(i.adjust.outq)}`;
  return text ? `<span class="tx-sub">${esc(text)}</span>` : '';
}

function reconHtml() {
  const c = RAW.recon, i = RAW.info;
  const parts = c.parts.slice().sort((a, b) => (PARTS[a.id]?.fix ? 0 : 1) - (PARTS[b.id]?.fix ? 0 : 1));
  const ok = c.okTx && c.okTr;
  return `${ok
      ? `<div class="tx-pass">✅ ยอดลงตัวทุกชิ้น ทุกแถวในชีตถูกนับครบและอธิบายที่มาได้</div>`
      : `<div class="tx-warn">⚠️ <b>ยอดไม่ลงตัว</b> แปลว่าสคริปต์นับตกหล่น อย่าเพิ่งใช้ตัวเลขในหน้านี้</div>`}
    <div class="tx-why">ยอดที่ต่างจาก Report มาจากไหนบ้าง บวกกันแล้วต้องเท่ายอดจริงในแท็บ</div>
    <div class="tx-wrap"><table class="tx-tbl">
      <thead><tr><th>เรื่อง</th><th class="num">รายการ</th><th class="num">Transaction</th><th class="num">TRcloud</th></tr></thead>
      <tbody>
        <tr class="sum"><td>ยอดตาม Report</td><td class="num"></td><td class="num">${f(c.report)}</td><td class="num">${f(c.report)}</td></tr>
        ${parts.map(partLine).join('')}
        <tr class="sum"><td>ยอดจริงในแท็บ</td><td class="num"></td><td class="num">${f(c.tx)}</td><td class="num">${f(c.tr)}</td></tr>
      </tbody>
    </table></div>
    <div class="tx-note">ที่อยู่ในตารางนี้แต่ไม่ได้เป็นสีแดงคือเรื่องปกติ ไม่ต้องแก้
      ${RAW.kinds.cancel.total || RAW.kinds.blankCut.total ? '<br>รายการที่ขนส่งยกเลิกหรือสถานะว่างแต่ตัดแล้ว ยอดเท่า Report จึงไม่อยู่ในตารางนี้ ดูที่แท็บตัดผิด / ตัดเกิน' : ''}
      ${i.reversedCount ? `<br>ตัดแล้วกลับรายการจนเป็นศูนย์เรียบร้อย ${f(i.reversedCount)} ออเดอร์ ไม่กระทบยอด` : ''}
      ${i.trIn ? `<br>TRcloud มีแถวรับเข้าทั้งหมด ${f(i.trIn)} ชิ้น ซึ่งหักออกจากยอดเบิกแล้ว` : ''}
    </div>`;
}

/* ── แท็บเทียบรายวัน ────────────────────────────────────────────────────── */

function dailyResult() {
  if (DAILY) return DAILY;
  if (!RAW || !RAW.daily || !LEDGER) return null;
  /* ผลเก่าของคนละเดือน เอามาเทียบจะดูเหมือนขาดทั้งเดือน */
  if (LEDGER.from !== RAW.period.from || LEDGER.to !== RAW.period.to) return null;
  DAILY = WmsCut.compareDaily(RAW.daily, RAW.period, LEDGER);
  return DAILY;
}

/** ปุ่มเดียวกันทุกจุด เพราะดึงใหม่ได้โดยไม่ต้องตรวจหลักซ้ำ */
function ledgerBtn(label) {
  return `<button class="tx-opt" data-reload ${BUSY ? 'disabled' : ''}>${esc(label)}</button>`;
}

/** ยังเทียบไม่ได้เพราะอะไร ต้องบอกให้รู้ว่าต้องทำอะไรต่อ */
function dailyWaiting() {
  if (!RAW.daily) {
    return `<div class="tx-empty art-data">ผลตรวจรอบนี้ยังไม่มียอดรายวัน กด <b>ตรวจใหม่</b> ด้านบน<br>
      ถ้ากดแล้วยังขึ้นข้อความนี้ แปลว่า <b>cut-api.gs</b> ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version</div>`;
  }
  if (!WmsSettings.txUrl()) {
    return `<div class="tx-empty art-link">ยังไม่ได้ตั้ง Apps Script URL ของ Transaction — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a></div>`;
  }
  return `${LEDGER_ERR ? `<div class="tx-warn">⚠️ ดึงยอดขายไม่สำเร็จ: ${esc(LEDGER_ERR)}</div>` : ''}
    <div class="tx-empty art-data">ต้องดึงยอดขายจากสต๊อกราย Location มาเทียบก่อน<br><br>${ledgerBtn('▶️ ดึงยอดขาย')}</div>`;
}

function tone(side, odd) {
  if (!odd) return '';
  if (odd === 'all') return 'tx-mid';
  return odd === side ? 'tx-neg' : '';
}

function threeCells(r) {
  const odd = WmsCut.oddOne(r.s, r.x, r.t);
  return `<td class="num ${tone('s', odd)}">${f(r.s)}</td>
    <td class="num ${tone('x', odd)}">${f(r.x)}</td>
    <td class="num ${tone('t', odd)}">${f(r.t)}</td>`;
}

const THREE_HEAD = `<th class="num">${L.s}</th><th class="num">${L.x}</th><th class="num">${L.t}</th>`;

function skuCell(r) {
  return `<td class="tx-name"><b>${esc(r.sku)}</b><span class="tx-sub">${esc(r.name)}</span></td>`;
}

function skuDayRow(r, withDate) {
  return `<tr>
    ${withDate ? `<td class="nw">${esc(dm(r.date))}</td>` : ''}
    ${skuCell(r)}
    ${threeCells(r)}
    <td class="tx-res">${esc(WmsCut.diffWords(r.s, r.x, r.t))}${r.moved ? '<br><span class="tx-tag">น่าจะลงคนละวัน</span>' : ''}</td>
  </tr>`;
}

function dayResult(d) {
  if (d.status === 'ok') return '<span class="tx-ok">ตรงทุก SKU</span>';
  if (d.status === 'shift') return `<span class="tx-tag">น่าจะลงคนละวัน</span><span class="tx-sub">${f(d.shift)} SKU</span>`;
  const words = WmsCut.diffWords(d.s, d.x, d.t);
  const more = d.shift ? ` · อีก ${f(d.shift)} SKU น่าจะลงคนละวัน` : '';
  return `${esc(words || 'ยอดรวมเท่ากัน แต่รายตัวไม่ตรง')}<span class="tx-sub">${f(d.bad)} SKU ไม่ตรง${esc(more)}</span>`;
}

function dayRow(d, rows) {
  const open = OPEN_DAY === d.date;
  if (d.status === 'ok') {
    return `<tr><td class="nw"><span class="tx-more"><i></i>${esc(dm(d.date))}</span></td>${threeCells(d)}<td class="tx-res">${dayResult(d)}</td></tr>`;
  }
  const detail = open ? `<tr class="tx-detail"><td colspan="5"><div class="tx-wrap"><table class="tx-tbl">
      <thead><tr><th>SKU</th>${THREE_HEAD}<th>ต่างกันยังไง</th></tr></thead>
      <tbody>${rows.filter((r) => r.date === d.date).map((r) => skuDayRow(r, false)).join('')}</tbody>
    </table></div></td></tr>` : '';
  return `<tr data-day="${esc(d.date)}" class="${open ? 'open' : ''}">
      <td class="nw"><button class="tx-more" aria-expanded="${open}"><i>${open ? '▾' : '▸'}</i>${esc(dm(d.date))}</button></td>
      ${threeCells(d)}
      <td class="tx-res">${dayResult(d)}</td>
    </tr>${detail}`;
}

function dayTable(c) {
  return `<div class="tx-wrap"><table class="tx-tbl">
    <thead><tr><th>วันที่</th>${THREE_HEAD}<th>ผล</th></tr></thead>
    <tbody>
      ${c.days.map((d) => dayRow(d, c.rows)).join('')}
      <tr class="sum"><td>รวม</td><td class="num">${f(c.totals.s)}</td><td class="num">${f(c.totals.x)}</td><td class="num">${f(c.totals.t)}</td><td class="tx-res">${esc(WmsCut.diffWords(c.totals.s, c.totals.x, c.totals.t))}</td></tr>
    </tbody>
  </table></div>`;
}

function skuTable(c) {
  const hit = c.skus.filter((r) => `${r.sku} ${r.name}`.toUpperCase().includes(Q));
  if (!hit.length) {
    return c.skus.length
      ? '<div class="tx-empty art-search">ไม่พบ SKU ที่ตรงกับคำค้น</div>'
      : '<div class="tx-empty art-done">รวมทั้งช่วงแล้วทุก SKU <b>ตรงกันหมด</b></div>';
  }
  return `<div class="tx-why">SKU ที่รวมทั้งช่วงแล้วยังไม่ตรง กดแถวเพื่อดูว่าต่างกันวันไหน</div>
    <div class="tx-wrap"><table class="tx-tbl">
      <thead><tr><th>SKU</th>${THREE_HEAD}<th>ต่างกันยังไง</th></tr></thead>
      <tbody>${hit.map((r) => `<tr data-sku="${esc(r.sku)}">${skuCell(r)}${threeCells(r)}<td class="tx-res">${esc(WmsCut.diffWords(r.s, r.x, r.t))}</td></tr>`).join('')}</tbody>
    </table></div>`;
}

function searchTable(c) {
  const hit = c.rows.filter((r) => `${r.sku} ${r.name}`.toUpperCase().includes(Q));
  if (!hit.length) return '<div class="tx-empty art-search">ไม่พบวันที่ไม่ตรงของ SKU นี้ ถ้าพิมพ์รหัสถูก แปลว่าตรงกันทุกวัน</div>';
  return `<div class="tx-wrap"><table class="tx-tbl">
    <thead><tr><th>วันที่</th><th>SKU</th>${THREE_HEAD}<th>ต่างกันยังไง</th></tr></thead>
    <tbody>${hit.map((r) => skuDayRow(r, true)).join('')}</tbody>
  </table></div>`;
}

function dailyList() {
  const c = dailyResult();
  if (VIEW === 'sku') return skuTable(c);
  return Q ? searchTable(c) : dayTable(c);
}

/** แถวที่นับไม่ได้ต้องเห็น ไม่งั้นยอดที่หายไปจะดูเหมือนตัดไม่ตรง */
function dailyWarnings(c) {
  const out = [];
  const part = (p, text) => { if (p && p.rows) out.push(`${text} ${f(p.rows)} แถว${p.qty ? ` (${f(p.qty)} ชิ้น)` : ''} ไม่ได้นับ`); };
  if (!c.last) out.push('ไม่พบแถวที่ช่องรับ/เบิกเป็น "ขาย" ในสมุด Transaction');
  if (c.waiting.length) {
    const left = c.waiting.map((w) => `${dm(w.date)} (${L.x} ${f(w.x)} · ${L.t} ${f(w.t)})`).join(', ');
    out.push(`${L.s} ลงถึงวันที่ ${dm(c.last)} วันต่อจากนี้ยังเทียบไม่ได้: ${left}`);
  }
  part(LEDGER.noDate, `แถวขายใน ${L.s} ที่ไม่มีวันที่`);
  part(LEDGER.noSku, `แถวขายใน ${L.s} ที่ไม่มีรหัส SKU`);
  part(LEDGER.future, `แถวขายใน ${L.s} ที่วันที่เลยวันนี้ไป น่าจะพิมพ์ปีผิด`);
  if (LEDGER.badQty && LEDGER.badQty.rows) out.push(`แถวขายใน ${L.s} ที่จำนวนไม่ใช่ตัวเลข ${f(LEDGER.badQty.rows)} แถว นับเป็นศูนย์`);
  part(RAW.daily.skippedX, `แถวใน ${L.x} ที่ไม่มีวันที่หรือ SKU`);
  part(RAW.daily.skippedT, `แถวใน ${L.t} ที่ไม่มีวันที่หรือ SKU`);
  return out.map((w) => `<div class="tx-warn">⚠️ ${esc(w)}</div>`).join('');
}

function dailyHtml() {
  const c = dailyResult();
  if (!c) return dailyWaiting();
  const n = c.counts;
  const stat = (label, v, cls, sub) => `<div class="tx-stat"><small>${esc(label)}</small><b class="${cls}">${f(v)}</b><i>${esc(sub)}</i></div>`;
  const when = new Date(LEDGER.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const opt = (v, label) => `<button class="tx-opt ${VIEW === v ? 'on' : ''}" data-view="${v}">${label}</button>`;
  return `${LEDGER_ERR ? `<div class="tx-warn">⚠️ ดึงยอดขายรอบล่าสุดไม่สำเร็จ ตัวเลขนี้เป็นของรอบก่อน: ${esc(LEDGER_ERR)}</div>` : ''}
    ${dailyWarnings(c)}
    <div class="tx-why">ยอดออกของแต่ละ SKU ในแต่ละวัน เทียบสามที่: ${L.s} คือแถว "ขาย" ในสต๊อกราย Location, ${L.x} คือแท็บตัด Transaction และ ${L.t} (${dm(c.from)} ถึง ${dm(c.to)})</div>
    <div class="tx-stats">
      ${stat('วันที่ตรงทุก SKU', n.daysOk, 'tx-ok', `จาก ${f(c.days.length)} วัน`)}
      ${stat('วันที่ไม่ตรง', n.daysBad, n.daysBad ? 'tx-neg' : 'tx-ok', 'กดที่วันเพื่อดูราย SKU')}
      ${stat('รายการน่าจะลงคนละวัน', n.shiftKeys, n.shiftKeys ? 'tx-mid' : 'tx-ok', 'รวมสองวันติดกันแล้วเท่ากัน')}
      ${stat('SKU ที่รวมทั้งช่วงยังไม่ตรง', n.skusBad, n.skusBad ? 'tx-neg' : 'tx-ok', `รายวันตรง ${f(n.equal)} จาก ${f(n.keys)} รายการ`)}
    </div>
    <div class="tx-bar">
      <input class="tx-input" id="q" type="search" placeholder="ค้น SKU หรือชื่อสินค้า" value="${esc(Q)}">
      ${opt('day', 'รายวัน')}${opt('sku', 'ราย SKU รวมทั้งช่วง')}
      <span class="sp"></span>
      <span>ดึงยอดขายเมื่อ ${esc(when)}</span>
      ${ledgerBtn('🔄 ดึงยอดขายใหม่')}
    </div>
    <div id="list"></div>
    <div class="tx-note">ตัวเลขสีแดงคือช่องที่ต่างจากอีกสองช่อง สีส้มคือไม่เท่ากันทั้งสามช่อง<br>
      ไม่ได้เทียบกับ Report เพราะวันที่ใน Report คือวันที่ขนส่งออก ไม่ใช่วันที่ลงตัดสต๊อก</div>`;
}

/* ── รวมหน้า ────────────────────────────────────────────────────────────── */

function renderBody() {
  if (!RAW) {
    $('body').innerHTML = `<div class="tx-empty ${BUSY ? '' : WmsSettings.cutUrl() ? 'art-data' : 'art-link'}">
      ${BUSY ? '<b>กำลังตรวจ</b><br>สคริปต์ต้องอ่านข้อมูลหลายแสนแถว อาจใช้เวลา 1-3 นาที' : ''}
      ${!BUSY && WmsSettings.cutUrl() ? 'กด <b>เริ่มตรวจ</b> เพื่อเทียบรายการตัดสต๊อกกับ Report ของเดือน' : ''}
      ${!BUSY && !WmsSettings.cutUrl() ? 'ยังไม่ได้ตั้ง URL ของสคริปต์ <b>cut-api.gs</b><br>ดูวิธีติดตั้งใน README หัวข้อ Stock Cut Check' : ''}
    </div>`;
    return;
  }
  if (TAB === 'recon') { $('body').innerHTML = warnings() + reconHtml(); return; }
  if (TAB === 'daily') { $('body').innerHTML = dailyHtml(); renderList(); return; }
  const top = TAB === 'fix' ? cards(FIX_KINDS) : RAW.gaps.map(gapBlock).join('');
  $('body').innerHTML = warnings() + top + filterBar() + '<div id="list"></div>';
  renderList();
}

function render() { renderSrc(); renderSum(); renderTabs(); renderBody(); }

$('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  TAB = b.dataset.tab;
  KIND = '';
  Q = '';   // รหัสที่ค้นค้างจากแท็บอื่นจะทำให้แท็บนี้ดูเหมือนว่างเปล่า
  render();
});

$('body').addEventListener('click', (e) => {
  if (e.target.closest('[data-reload]')) { loadLedger(); return; }
  const view = e.target.closest('[data-view]');
  if (view) {
    VIEW = view.dataset.view;
    renderBody();
    return;
  }
  const sku = e.target.closest('[data-sku]');
  if (sku) {
    VIEW = 'day';
    Q = sku.dataset.sku;
    renderBody();
    return;
  }
  const day = e.target.closest('[data-day]');
  if (day) {
    OPEN_DAY = OPEN_DAY === day.dataset.day ? '' : day.dataset.day;
    renderList();
    return;
  }
  const card = e.target.closest('[data-kind]');
  if (card) {
    KIND = KIND === card.dataset.kind ? '' : card.dataset.kind;
    renderBody();
    return;
  }
  const opt = e.target.closest('[data-sys]');
  if (opt) {
    SYS = opt.dataset.sys;
    renderBody();
  }
});

$('body').addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  Q = e.target.value.trim().toUpperCase();
  renderList();   // ไม่วาดช่องค้นใหม่ ไม่งั้นเคอร์เซอร์จะหลุดระหว่างพิมพ์
});

readCache();
render();
</script>
</body>
</html>
