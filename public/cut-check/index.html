<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เช็ครายการตัดสต๊อก — WMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── แถบแหล่งข้อมูล ── */
.tx-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--wms-surface2);border-bottom:1px solid var(--wms-border);font-size:12px}
.tx-src .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--wms-surface);border:1px solid var(--wms-border);color:var(--wms-muted)}
.tx-src .pill b{color:var(--wms-text);font-weight:600}
.tx-src .pill.warn{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.tx-src .pill.ok{background:#ECFDF5;border-color:#A7F3D0;color:#047857;font-weight:600}
.tx-src .sp{flex:1}
.tx-src button{padding:4px 12px;border-radius:999px;border:1px solid var(--wms-border2);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:13px;color:#334155;cursor:pointer}
.tx-src button:hover:not(:disabled){background:var(--wms-primary-light);border-color:var(--wms-primary);
  color:var(--wms-primary-dark)}
.tx-src button.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff}
.tx-src button.p:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.tx-src button:disabled{opacity:.6;cursor:default}
.tx-err{width:100%;font-size:13px;color:#B91C1C;font-weight:600}

/* ── ยอดรวม ── */
.tx-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;padding:12px 20px;
  background:var(--wms-surface);border-bottom:1px solid var(--wms-border)}
.tx-sum:empty{display:none}
.tx-stat{padding:8px 11px;border-radius:var(--wms-radius-sm);background:var(--wms-surface2)}
.tx-stat small{display:block;font-size:12px;color:var(--wms-muted)}
.tx-stat b{font-size:20px;font-weight:700;color:var(--wms-text);font-variant-numeric:tabular-nums}
.tx-stat i{display:block;font-style:normal;font-size:12px;color:var(--wms-muted)}
/* ปุ่มพับภาพรวมเดือน มีแค่บนมือถือ จอคอมเห็นการ์ดครบอยู่แล้ว */
.tx-sum-t{display:none;align-items:center;gap:10px;width:100%;min-height:44px;padding:4px 2px;border:0;background:none;
  font-family:var(--wms-font);text-align:left;color:var(--wms-text);cursor:pointer}
.tx-sum-t span{flex:1;min-width:0}
.tx-sum-t b{display:block;font-size:13px;font-weight:700}
.tx-sum-t small{display:block;font-size:12px;color:var(--wms-muted)}
.tx-sum-t i{font-style:normal;font-size:14px;color:var(--wms-muted)}

/* ── แท็บ ติดขอบบนจอตอนเลื่อน เปลี่ยนแท็บได้ตลอดโดยไม่ต้องเลื่อนกลับขึ้นไป
      เฉพาะจอที่เมนูแอปอยู่ด้านข้าง จอเล็กเมนูแอปติดขอบบนอยู่แล้ว ซ้อนอีกแถบจะกินจอเกินไป ── */
@media (min-width:1024px){
  .tx-tabs{position:sticky;top:0;z-index:30}
}
.tx-tab .sh{display:none}

/* ── เนื้อหา ── */
.tx-body{padding:14px 20px 60px}
.tx-empty{padding:44px 20px;text-align:center;color:var(--wms-muted);font-size:14px;line-height:1.7}
.tx-empty b{color:var(--wms-text)}
.tx-note{margin-top:10px;font-size:12px;color:var(--wms-muted);line-height:1.6}
.tx-warn{margin-bottom:12px;padding:10px 13px;border-radius:var(--wms-radius-sm);background:#FEF3C7;
  border:1px solid #FDE68A;color:#92400E;font-size:13px;line-height:1.6}
.tx-warn b{font-weight:700}
.tx-pass{margin-bottom:12px;padding:10px 13px;border-radius:var(--wms-radius-sm);background:#DCFCE7;
  border:1px solid #BBF7D0;color:#166534;font-size:13px;font-weight:600;line-height:1.6}
.tx-h{margin:20px 0 4px;font-size:14px;font-weight:700;color:var(--wms-text)}
.tx-h:first-child{margin-top:0}
.tx-h .n{margin-left:6px;font-size:12px;font-weight:500;color:var(--wms-muted)}
.tx-why{margin-bottom:8px;font-size:13px;color:var(--wms-muted);line-height:1.5}

/* ตารางกว้างกว่าจอมือถือ เลื่อนเฉพาะตาราง หน้าทั้งหน้าไม่ต้องเลื่อนตาม */
.tx-wrap{overflow-x:auto;background:var(--wms-surface);border:1px solid var(--wms-border);border-radius:var(--wms-radius)}
.tx-tbl{width:100%;border-collapse:collapse;font-size:13px}
.tx-tbl th{text-align:left;padding:9px 11px;background:var(--wms-surface2);font-size:12px;
  font-weight:600;color:var(--wms-muted);border-bottom:1px solid var(--wms-border);white-space:nowrap}
.tx-tbl td{padding:8px 11px;border-bottom:1px solid #F1F5F9;vertical-align:top;line-height:1.45}
.tx-tbl tr:last-child td{border-bottom:0}
.tx-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-tbl th.num{text-align:right}
.tx-tbl .nw{white-space:nowrap}
.tx-tbl .sum td{background:var(--wms-surface2);font-weight:700}
.tx-sub{display:block;font-size:12px;color:var(--wms-muted);line-height:1.5}
.tx-name{min-width:170px}   /* จอมือถือบีบชื่อสินค้าจนเรียงทีละคำ ให้ตารางเลื่อนข้างแทน */
.tx-res{min-width:190px}
.tx-ref{font-weight:600}
.tx-sub.tx-in{display:inline}
.tx-need{font-size:16px;font-variant-numeric:tabular-nums}
.tx-neg{color:#B91C1C;font-weight:700}
.tx-mid{color:#B45309;font-weight:600}
.tx-ok{color:#166534;font-weight:600}
/* บอกด้วยเครื่องหมายด้วย ไม่ใช่สีอย่างเดียว ลูกศรข้างตัวเลขที่ต่าง และถูกหน้าคำว่าตรง */
.tx-up::after,.tx-dn::after{margin-left:2px;font-size:.7em;vertical-align:.12em}
.tx-up::after{content:'▲'}
.tx-dn::after{content:'▼'}
span.tx-ok::before{content:'✓ '}
/* แถววันที่ไม่ตรงมีแถบสีซ้าย วันที่ตรงแล้วตัวเลขจางลง ตาจะไปหาวันที่ต้องดูก่อน */
.tx-tbl tr.is-bad td:first-child{box-shadow:inset 3px 0 0 #F87171}
.tx-tbl tr.is-warn td:first-child{box-shadow:inset 3px 0 0 #FBBF24}
.tx-tbl tr.is-ok td.num{color:var(--wms-muted)}

.tx-int{margin-top:8px}
/* บันทึกการแก้ สถานะบอกด้วยคำ สีช่วยแยกเฉยๆ แถวที่แก้แล้วรอตรวจจางลง ตาจะไปหาแถวที่ยังต้องทำ */
.k-log{min-width:150px}
.lg{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5}
.lg-wait{background:#E0E7FF;color:#3730A3}
.lg-still{background:#FEF3C7;color:#92400E}
.lg-flip{background:#FEE2E2;color:#991B1B}
.lg-btn{display:block;margin-top:4px;white-space:nowrap}
.lg-btn:disabled,.tx-opt:disabled{opacity:.6;cursor:default}
.tx-tbl tr.lg-dim td:not(.k-log){opacity:.55}
.lg-done{margin-top:16px}
.lg-done .tx-wrap{margin-top:8px}
.tx-int summary{cursor:pointer;font-size:13px;font-weight:600}
.tx-int p{margin-top:6px;font-size:12px;line-height:1.7;word-break:break-word}

/* ── ตัวเลือก ── */
.tx-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--wms-muted)}
.tx-opt{padding:5px 13px;border-radius:999px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px;color:#334155;cursor:pointer}
.tx-opt:hover{border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.tx-opt.on{background:var(--wms-primary-light);border-color:var(--wms-primary);color:var(--wms-primary-dark);font-weight:600}
.tx-input{flex:1;min-width:180px;max-width:460px;padding:9px 13px;border-radius:10px;border:1.5px solid var(--wms-border2);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:14px;color:var(--wms-text);outline:none}
.tx-input:focus{border-color:var(--wms-primary)}

/* ── ติ๊กเลือกออเดอร์ แล้ว Export แถวใน Report ของออเดอร์นั้น แถบปุ่มลอยติดล่างจอระหว่างเลื่อนดูรายการ ── */
.pk{display:inline-flex;align-items:flex-start;gap:8px;padding:6px;margin:-6px;border-radius:8px;cursor:pointer}
.pk>span{min-width:0}
.pk input,.pk-all input{flex-shrink:0;width:18px;height:18px;margin:1px 0 0;accent-color:var(--wms-primary);cursor:pointer}
.tx-tbl tr.pk-on td{background:var(--wms-primary-light)}
.pk-all{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:12px;font-weight:500;
  color:var(--wms-muted);cursor:pointer;vertical-align:middle}
.pk-bar{position:sticky;bottom:12px;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  margin-top:14px;padding:10px 12px;background:var(--wms-surface);border:1px solid var(--wms-primary);
  border-radius:var(--wms-radius);box-shadow:0 8px 24px rgba(15,23,42,.14);font-size:13px}
.pk-bar:empty{display:none}
.pk-bar .sp{flex:1}
.pk-n b{font-size:16px;font-variant-numeric:tabular-nums}
.pk-go{padding:7px 16px;border-radius:999px;border:1px solid var(--wms-primary);background:var(--wms-primary);
  color:#fff;font-family:var(--wms-font);font-size:13px;font-weight:600;cursor:pointer}
.pk-go:hover:not(:disabled){filter:brightness(1.08)}
.pk-go:disabled{opacity:.6;cursor:default}
.pk-msg{flex-basis:100%;font-size:12px;color:var(--wms-muted);line-height:1.5}
.pk-msg.bad{color:#B91C1C;font-weight:600}

/* ── การ์ดแต่ละประเภท กดเพื่อดูเฉพาะประเภทนั้น ── */
.tx-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tx-card{padding:9px 12px;border-radius:var(--wms-radius-sm);background:var(--wms-surface);
  border:1px solid var(--wms-border);text-align:left;font-family:var(--wms-font);cursor:pointer}
.tx-card small{display:block;font-size:12px;color:var(--wms-muted)}
.tx-card b{font-size:20px;font-weight:700;color:var(--wms-text);font-variant-numeric:tabular-nums}
.tx-card b.tx-neg{color:#B91C1C}
.tx-card b.tx-mid{color:#B45309}
.tx-card b.tx-ok{color:#166534}
.tx-card i{display:block;font-style:normal;font-size:12px;color:var(--wms-muted)}
.tx-card:hover{border-color:var(--wms-primary)}
.tx-card-ic{display:flex;align-items:center;gap:10px}
.tx-card-ic img{flex-shrink:0;width:34px;height:34px;border-radius:24%}
.tx-card-ic span{min-width:0}
/* ไอคอนระบบตัวเล็กหน้าชื่อระบบ */
.tx-ic{width:18px;height:18px;margin-right:6px;border-radius:24%;vertical-align:-4px}
.tx-card.on{border-color:var(--wms-primary);background:var(--wms-primary-light)}

/* ── เทียบรายวัน ── */
.tx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tx-stats .tx-stat{background:var(--wms-surface);border:1px solid var(--wms-border)}
.tx-stat b.tx-neg{color:#B91C1C}
.tx-stat b.tx-mid{color:#B45309}
.tx-stat b.tx-ok{color:#166534}
.tx-bar .sp{flex:1}
.tx-tbl tr[data-day],.tx-tbl tr[data-sku]{cursor:pointer}
/* จอสัมผัสไม่มีเมาส์ชี้ แถวที่แตะแล้วจะค้างสีไว้ถ้าไม่กันไว้ */
@media (hover:hover){
  .tx-tbl tr[data-day]:hover td,.tx-tbl tr[data-sku]:hover td,.tx-tbl tr[data-cell]:hover td{background:var(--wms-primary-light)}
}
.tx-more{padding:0;border:0;background:none;font:inherit;color:inherit;white-space:nowrap}
button.tx-more{cursor:pointer}
.tx-more i{display:inline-block;width:12px;font-style:normal;color:var(--wms-muted)}
.tx-tag{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:999px;background:#FEF3C7;
  color:#92400E;font-size:12px;font-weight:600;white-space:nowrap}

/* ── รายละเอียดของหนึ่งช่อง วัน + SKU ── */
.tx-tbl tr[data-cell]{cursor:pointer}
.tx-cell{display:grid;gap:8px}
.tx-cell .tx-h{margin:6px 0 0}
/* ช่องออเดอร์ไม่ให้ถูกบีบจนคำขาด จอแคบให้ตารางเลื่อนข้างแทน */
.tx-ords td:first-child{min-width:150px}
.tx-hint{font-size:13px;font-weight:600;color:var(--wms-text);line-height:1.5}
.tx-row{font-weight:600;color:var(--wms-primary-dark)}

/* ── หน้าต่างรายละเอียด ฉากหลังเบลอให้ตาอยู่ที่ข้อมูล ชื่อคลาสเดียวกับหน้าเทียบ Order ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;padding:16px;
  background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex;animation:wms-fade-in .2s ease both}
.modal-box{display:flex;flex-direction:column;width:min(1080px,100%);max-height:calc(100vh - 32px);
  background:var(--wms-surface);border-radius:14px;box-shadow:0 25px 60px rgba(0,0,0,.25)}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--wms-border)}
.modal-header h3{font-size:16px;font-weight:700;color:var(--wms-text);line-height:1.35}
.modal-header p{margin-top:2px;font-size:13px;color:var(--wms-muted)}
.modal-close{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-10px -12px 0 0;
  padding:0;border:0;border-radius:10px;background:none;font-size:20px;line-height:1;
  color:var(--wms-muted);cursor:pointer}
.modal-close:hover{background:var(--wms-surface2);color:var(--wms-text)}
.modal-body{overflow-y:auto;padding:16px 20px 20px}
.pop-back{margin-bottom:6px;padding:0;border:0;background:none;font-family:var(--wms-font);font-size:13px;
  font-weight:600;color:var(--wms-primary-dark);cursor:pointer}
.pop-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:14px;
  font-size:13px;font-weight:600;color:var(--wms-text)}
.pop-res small{display:block;font-size:12px;font-weight:400;color:var(--wms-muted)}
html.pop-open{overflow:hidden}

@media (max-width:640px){
  .tx-body{padding:12px 12px 60px}
  .tx-src,.tx-sum,.tx-tabs{padding-left:12px;padding-right:12px}
  .modal-overlay{padding:8px}
  .modal-box{max-height:calc(100vh - 16px)}
  .modal-header,.modal-body{padding-left:14px;padding-right:14px}

  /* ส่วนหัวเตี้ยลง รายการที่ต้องแก้จะได้ขึ้นมาในจอแรก */
  .mod-head{padding:10px 12px}
  .mod-title{gap:8px}
  .mod-title .ic{width:30px;height:30px;border-radius:9px}
  .mod-title h2{font-size:16px}
  .mod-title h2 .en,.mod-title p{display:none}
  .tx-src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding-top:8px;padding-bottom:8px}
  .tx-src .sp{display:none}
  .tx-src .pill{grid-column:1;justify-self:start}
  .tx-src .pill:not(.warn){padding:0;border:0;background:none}
  .tx-src button{grid-column:2;grid-row:1 / span 2;align-self:center;min-height:44px;padding:0 16px;font-size:13px}
  .tx-src .tx-err{grid-column:1/-1}
  .tx-sum{grid-template-columns:repeat(2,minmax(0,1fr));padding-top:6px;padding-bottom:6px}
  .tx-sum-t{display:flex;grid-column:1/-1}
  .tx-sum:not(.open) .tx-stat{display:none}
  .tx-sum.open{padding-bottom:12px}

  /* ปุ่มและช่องที่ต้องแตะ สูงอย่างน้อย 44px นิ้วจะได้ไม่พลาด */
  .tx-opt{display:inline-flex;align-items:center;min-height:44px;padding:0 15px}
  .tx-input{min-height:44px;font-size:16px}   /* ต่ำกว่า 16px iPhone จะซูมหน้าเองตอนแตะช่องค้น */
  .pk{padding:10px;margin:-10px}
  .pk-all{min-height:44px}
  .pk-go,.pk-bar .tx-opt{min-height:44px}
  .pk-bar{bottom:8px}
  .pk-go{flex:1 0 100%}   /* จอแคบปุ่มตกลงบรรทัดล่างอยู่แล้ว เต็มแถวไปเลย เห็นชัดว่าเป็นปุ่มหลัก */
  .tx-int summary{padding:12px 0}
  .pop-back{display:flex;align-items:center;min-height:44px;margin:-10px 0 0}
  .tx-row{display:inline-block;padding:10px 6px;margin:-10px -6px}

  /* ห้าแท็บแบ่งจอเท่ากัน ไอคอนบน ชื่อสั้นล่าง ตัวเลขเกาะมุมไอคอน ไม่มีแท็บซ่อนอยู่นอกจอ */
  .tx-tabs{gap:4px;padding:6px 6px 0;overflow:visible}
  .tx-tab{position:relative;flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:7px 2px 6px;
    border-radius:10px 10px 0 0;font-size:12px;line-height:1.25;white-space:normal;text-align:center}
  .tx-tab img{width:24px;height:24px}
  .tx-tab .lb{display:none}
  .tx-tab .sh{display:block}
  .tx-tab .n{position:absolute;top:2px;left:calc(50% + 6px);padding:0 5px;font-size:12px;line-height:1.4}
  .tx-tab:not(.on) .n{background:var(--wms-primary);color:#fff}

  /* การ์ดสามระบบอยู่แถวเดียวกัน ไอคอนขึ้นบน ไม่มีใบไหนตกไปอยู่แถวล่างคนเดียว */
  .tx-cards.tx-who{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tx-who .tx-card-ic{flex-direction:column;align-items:flex-start;gap:6px;padding:9px 10px}
  .tx-who .tx-card-ic img{width:28px;height:28px}

  /* ตารางกลายเป็นการ์ดทีละรายการ ตัวเลขเป็นกล่องมีชื่อกำกับ ไม่ต้องเลื่อนข้าง
     k-top บนซ้าย, k-side บนขวา, k-main ทั้งแถว, ตัวเลข, k-res และ k-res2 ผลเทียบ */
  .tx-tbl.tx-mc,.tx-mc tbody{display:block}
  .tx-mc thead{display:none}
  .tx-tbl.tx-mc tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:6px;padding:12px;
    border-bottom:1px solid var(--wms-border)}
  .tx-tbl.tx-mc.mc-4 tr{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tx-tbl.tx-mc tr:last-child{border-bottom:0}
  .tx-tbl.tx-mc tr.sum{background:var(--wms-surface2)}
  .tx-tbl.tx-mc tr.pk-on{background:var(--wms-primary-light)}
  .tx-tbl.tx-mc td{display:block;min-width:0;padding:0;border:0;white-space:normal}
  .tx-tbl.tx-mc td:empty{display:none}
  .tx-tbl.tx-mc .k-top{grid-row:1;grid-column:1/-2}
  .tx-tbl.tx-mc .k-side{grid-row:1;grid-column:-2/-1;text-align:right}
  .tx-tbl.tx-mc .k-main{grid-row:2;grid-column:1/-1;margin-top:2px}
  /* ชื่อกำกับเต็มบรรทัด ตัวเลขกับลูกศรอยู่บรรทัดล่างด้วยกัน ชิดล่างให้ตัวเลขทุกกล่องอยู่แนวเดียวกัน */
  .tx-tbl.tx-mc td.num{grid-row:3;display:flex;flex-wrap:wrap;align-content:flex-end;align-items:baseline;
    justify-content:center;margin-top:8px;
    padding:5px 6px;border-radius:8px;background:var(--wms-bg);text-align:center;font-size:16px;font-weight:700}
  .tx-tbl.tx-mc tr.sum td.num{background:var(--wms-surface)}
  .tx-tbl.tx-mc td.num::before{content:attr(data-label);flex-basis:100%;margin-bottom:1px;font-size:12px;font-weight:500;
    line-height:1.3;color:var(--wms-muted)}
  .tx-tbl.tx-mc td.num.tx-neg{background:#FEE2E2}
  .tx-tbl.tx-mc td.num.tx-mid{background:#FEF3C7;color:#92400E}
  .tx-tbl.tx-mc td.num.tx-neg::before,.tx-tbl.tx-mc td.num.tx-mid::before{color:inherit}
  .tx-tbl.tx-mc .k-res{grid-row:4;grid-column:1/-1;margin-top:8px}
  .tx-tbl.tx-mc .k-res2{grid-row:5;grid-column:1/-1;margin-top:4px}
  /* แท็บแก้แยกตามระบบ ไม่มีกล่องตัวเลข ช่องต้องทำอยู่ขวาบน */
  .tx-tbl.tx-mc.mc-fix tr{grid-template-columns:minmax(0,1fr) auto;column-gap:12px}
  .tx-tbl.tx-mc.mc-fix .k-top{color:var(--wms-muted);font-size:12px}
  .tx-tbl.tx-mc.mc-fix .k-top .tx-sub{display:inline;margin-left:6px}
  .tx-tbl.tx-mc.mc-fix .k-main{grid-column:1}
  .tx-tbl.tx-mc.mc-fix .k-side{grid-row:1 / span 2}
  .tx-tbl.tx-mc.mc-fix .k-log{grid-row:5;grid-column:1/-1;margin-top:8px}
  .lg-btn{display:inline-flex;margin:6px 0 0}

  /* เทียบรายวัน ตัวเลขเรียงตรงหัวคอลัมน์ให้ไล่ดูทีละวันได้ ผลเทียบลงบรรทัดถัดไป */
  .tx-tbl.tx-m2,.tx-m2 thead,.tx-m2 tbody{display:block}
  .tx-tbl.tx-m2 tr{display:grid;grid-template-columns:minmax(0,.9fr) repeat(3,minmax(0,1fr));column-gap:6px;
    padding:9px 12px;border-bottom:1px solid #F1F5F9}
  .tx-tbl.tx-m2.mc-4 tr{grid-template-columns:minmax(0,.9fr) repeat(4,minmax(0,1fr))}
  .tx-tbl.tx-m2 thead tr{align-items:end;background:var(--wms-surface2);border-bottom-color:var(--wms-border)}
  .tx-tbl.tx-m2 tr:last-child{border-bottom:0}
  .tx-tbl.tx-m2 tr.sum{background:var(--wms-surface2)}
  .tx-tbl.tx-m2 th,.tx-tbl.tx-m2 td{display:block;min-width:0;padding:0;border:0;background:none;white-space:normal}
  .tx-tbl.tx-m2 th{line-height:1.3;overflow-wrap:anywhere}
  .tx-tbl.tx-m2 th:not(.num):not(:first-child){display:none}
  .tx-tbl.tx-m2 .k-res,.tx-tbl.tx-m2 .k-res2{grid-column:1/-1;margin-top:5px}
  .tx-tbl.tx-m2 tr.is-bad{box-shadow:inset 3px 0 0 #F87171}
  .tx-tbl.tx-m2 tr.is-warn{box-shadow:inset 3px 0 0 #FBBF24}
  .tx-tbl.tx-m2 tr td:first-child{box-shadow:none}
  .tx-tbl td[data-label].k-res::before,.tx-tbl td[data-label].k-res2::before{content:attr(data-label);
    margin-right:6px;font-size:12px;font-weight:600;color:var(--wms-muted)}
}
</style>
</head>
<body data-wms-module="cutcheck">

<div class="wms-shell">
<div data-wms-shell="cutcheck" data-root="../"></div>
<div class="wms-main">

  <div class="mod-head">
    <div class="mod-title">
      <div class="ic"><img src="../icons/cut-check.png" alt="" width="38" height="38"></div>
      <div>
        <h2>เช็ครายการตัดสต๊อก<span class="en"> · Stock Cut Check</span></h2>
        <p>เทียบรายการตัดใน Transaction และ TRcloud กับ Report ออเดอร์ของเดือน และเทียบยอดออกรายวันกับสต๊อกราย Location — ไม่แก้ข้อมูลตัดสต๊อก เขียนแค่บันทึกการแก้</p>
      </div>
    </div>
  </div>

  <div class="tx-src" id="src"></div>
  <div class="tx-sum" id="sum"></div>
  <div class="tx-tabs" id="tabs" role="tablist"></div>
  <div class="tx-body" id="body"></div>

</div><!-- /.wms-main -->
<div class="modal-overlay" id="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle"></div>
</div><!-- /.wms-shell -->

<script type="module" src="../wms-shell.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-shared.js"></script>
<script src="../wms-cut.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f = n => Math.round(n).toLocaleString('en-US');
const plus = n => (n > 0 ? '+' : n < 0 ? '−' : '') + f(Math.abs(n));
const dm = d => { const p = String(d || '').split('-'); return p.length === 3 ? `${+p[2]}/${+p[1]}` : ''; };

const CACHE = 'wms:cut:result';   // ผลรอบล่าสุด สคริปต์อ่านชีตทั้งไฟล์ เปิดหน้ากลับมาจึงไม่ควรต้องรอใหม่
const LEDGER_CACHE = 'wms:cut:ledger';   // ยอดขายรายวันจากสต๊อกราย Location คนละสคริปต์กับด้านบน ดึงใหม่แยกกันได้
const TIMEOUT = 300000;           // อ่านสี่แท็บรวมหลายแสนแถว เผื่อเวลาให้ใกล้เพดาน 6 นาทีของ Apps Script
const L = WmsCut.LABEL;

const KINDS = {
  over: { label: 'ตัดเกิน', why: 'ตัดมากกว่าจำนวนใน Report ส่วนมากเกิดจากลงซ้ำ ดูวันที่ตัดในคอลัมน์วันที่', tone: 'tx-neg' },
  wrong: { label: 'ตัดผิด SKU', why: 'ออเดอร์นี้มีใน Report แต่ SKU นี้ไม่อยู่ในออเดอร์', tone: 'tx-neg' },
  ghost: { label: 'ตัดแต่ไม่มีใน Report', why: 'มีรายการตัด แต่ไม่พบเลขออเดอร์หรือเลขใบโอนย้ายนี้ใน Report', tone: 'tx-neg' },
  cancel: { label: 'ขนส่งยกเลิกแต่ตัดแล้ว', why: 'Report บอกว่ายกเลิกก่อนของออกจากคลัง (สถานะยังไม่ใช่จัดส่งแล้ว) ตัดไปแล้วต้องคืนยอด', tone: 'tx-mid' },
  blankCut: { label: 'สถานะขนส่งว่างแต่ตัดแล้ว', why: 'สถานะขนส่งว่างคือยังไม่ได้ส่ง แต่ตัดสต๊อกไปแล้ว ต้องคืนยอด', tone: 'tx-neg' },
  transferDiff: { label: 'โอนย้ายไม่ตรงกัน', why: 'งานโอนย้ายที่ยอดในสองระบบไม่เท่ากัน', tone: 'tx-neg' },
  under: { label: 'ยังไม่ตัดหรือตัดไม่ครบ', why: 'จำนวนใน Report มากกว่ายอดที่ตัด ดูคอลัมน์สุดท้ายว่าขาดฝั่งไหน', tone: 'tx-neg' },
};
const FIX_KINDS = ['over', 'wrong', 'ghost', 'cancel', 'blankCut', 'transferDiff'];
/* JST สถานะจัดส่งแล้วแต่ขนส่งยกเลิก ของออกจากคลังไปแล้ว ต้องตัดวันที่ออกเหมือนออเดอร์ปกติ */
const BACK = 'ส่งออกแล้ว ลูกค้ายกเลิก ตีกลับคลัง';
const TAB_TF = 'Report order ระบบโอนย้าย';

/* ครบทุกถังที่สคริปต์ส่งมา ถังที่ไม่อยู่ในนี้จะขึ้นชื่อถังดิบ เห็นได้ทันทีว่าลืมเพิ่ม */
const PARTS = {
  over: { label: 'ตัดเกิน', fix: true },
  wrong: { label: 'ตัดผิด SKU', fix: true },
  ghost: { label: 'ตัดแต่ไม่มีใน Report', fix: true },
  transferDiff: { label: 'โอนย้ายไม่ตรงกัน', fix: true },
  under: { label: 'ยังไม่ตัดหรือตัดไม่ครบ', fix: true },
  gap: { label: 'ขาดทั้งวัน', fix: true },
  nonstock: { label: 'รหัสที่ไม่ใช่ของในคลัง ไม่ได้ตัด' },
  blankOk: { label: 'สถานะขนส่งว่าง และยังไม่ตัด' },
  cancelOk: { label: 'ขนส่งยกเลิกก่อนของออก และไม่ได้ตัด' },
  transfer: { label: 'งานโอนย้าย ไม่มีใน Report' },
  outside: { label: 'ตัดนอกช่วงของ Report รอเทียบรอบถัดไป' },
  adjust: { label: 'TRcloud แผนก IV ปรับยอดคลัง' },
};

const SIDE = { tx: L.x, tr: L.t, both: 'ทั้งสองระบบ' };
/* ไอคอนประจำแต่ละระบบ ใช้ทุกจุดที่บอกชื่อระบบ คนจะจำรูปได้ก่อนอ่านชื่อ */
const ICON = { s: '../icons/sys-sheet.png', x: '../icons/sys-upload.png', t: '../icons/sys-trcloud.png' };

let RAW = null;
let BUSY = '';
let ERR = '';
/* ?tab= มาจากลิงก์บนหน้าภาพรวมสต๊อก */
let TAB = ['fix', 'under', 'daily', 'sys', 'recon'].includes(new URLSearchParams(location.search).get('tab')) ? new URLSearchParams(location.search).get('tab') : 'fix';
let KIND = '';    // การ์ดที่กดเลือก
let SYS = '';     // JST | CRM | โอนย้าย
let Q = '';
let LEDGER = null;      // คำตอบจาก tx-daily
let LEDGER_ERR = '';
let PICK = new Set();   // เลขออเดอร์ที่ติ๊กในแท็บตัดผิด / ตัดเกิน
let PICK_BUSY = '';     // ข้อความระหว่างกำลัง Export
let PICK_MSG = null;    // { text, bad } ผลการกด Export ครั้งล่าสุด
const PICK_MAX = 500;   // เท่ากับ REPORT_REFS_MAX ใน cut-api.gs
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let DAILY = null;       // ผลเทียบรายวัน คิดครั้งเดียวต่อข้อมูลหนึ่งชุด
let VIEW = 'day';       // day | sku
/* หน้าต่างที่เปิดอยู่: day = วันที่กดเข้ามา, cell = วัน|SKU ที่กดดูรายออเดอร์ ถ้ามีทั้งคู่จะมีปุ่มกลับไปรายการ SKU */
let POP = null;
let CELLS = null;       // ดัชนีรายละเอียดรายช่อง สร้างใหม่ทุกครั้งที่ DAILY ถูกล้าง
let FIX = null;         // รายการแก้แยกตามระบบ ล้างพร้อม DAILY
let WHO = '';           // ระบบที่เปิดดูในแท็บแก้แยกตามระบบ s | x | t
let SUM_OPEN = false;   // มือถือพับภาพรวมเดือนไว้ ให้รายการที่ต้องแก้ขึ้นมาในจอแรก
let BEFORE = null;      // ตัวเลขก่อนตรวจรอบนี้ ไว้เทียบว่าแก้ไปได้เท่าไร
let GAIN = 0;           // รายการที่ต้องแก้ลดลงเท่าไรจากรอบก่อน
let POP_AT = null;      // จุดที่กดเปิดหน้าต่าง หน้าต่างขยายออกจากตรงนั้นและหดกลับไปที่เดิม
/* บันทึกการแก้จากแท็บในไฟล์ตัดสต๊อก (cut-api.gs ?api=cut-fixlog) ทุกเครื่องเห็นชุดเดียวกัน null = ยังไม่ได้อ่าน */
let FIXLOG = null;
let FIXLOG_ERR = '';
let FIXLOG_OLD = false;  // สคริปต์รุ่นที่ยังไม่มีบันทึกการแก้
let SAVING = '';         // คีย์ที่กำลังบันทึก all = ทั้งชุด
let FSHOW = '';          // '' ทั้งหมด | open ยังไม่แก้ | wait รอตรวจใหม่ | again ต้องดูซ้ำ
let VERIFIED = 0;        // รอบนี้ยืนยันได้ว่าแก้แล้วกี่รายการ
let ARMED = 0;           // กดแก้แล้วทั้งชุดครั้งแรก รอกดยืนยัน
let CLOSING = false;
/* ข้อมูลกลาง (wms-shared.js): cut / tx = คนที่กำลังตรวจใหม่หรือดึงยอดขายชุดใหม่อยู่ fresh = เวลาที่ป้าย "อัปเดตแล้ว" ยังขึ้นอยู่ */
const SH = { cut: null, tx: null, err: null, fresh: 0 };

function readCache() {
  try {
    const r = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (r && r.app === 'cut' && r.kinds && r.recon) RAW = r;
    const l = JSON.parse(localStorage.getItem(LEDGER_CACHE) || 'null');
    if (l && l.cells) LEDGER = l;
  } catch (e) {}
}

function saveCache(key, r) {
  /* เก็บไม่ได้ก็แค่ต้องกดตรวจใหม่รอบหน้า ไม่กระทบผลรอบนี้ */
  try { localStorage.setItem(key, JSON.stringify(r)); } catch (e) {}
}

/* ── แถบแหล่งข้อมูล ─────────────────────────────────────────────────────── */

function renderSrc() {
  const url = WmsSettings.cutUrl();
  let html = '';
  if (BUSY) {
    html += `<span class="pill">⏳ ${esc(BUSY)}</span>`;
  } else if (RAW) {
    const when = new Date(RAW.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    html += `<span class="pill">📅 Report <b>${esc(dm(RAW.period.from))} ถึง ${esc(dm(RAW.period.to))}</b></span>`;
    const by = WmsShared.who(RAW);
    html += `<span class="pill" title="${esc(sharedTitle(RAW))}">🕐 ตรวจเมื่อ <b>${esc(when)}</b>${by ? ` · ${esc(by)}` : ''}</span>`;
    if (Date.now() < SH.fresh) html += `<span class="pill ok">✓ อัปเดตเป็นชุดล่าสุดแล้ว</span>`;
    if (GAIN) html += `<span class="pill ok">✓ ที่ต้องแก้ลดลง ${f(GAIN)} รายการจากรอบก่อน</span>`;
    if (VERIFIED) html += `<span class="pill ok">✓ ตรวจแล้วหาย ${f(VERIFIED)} รายการที่กดแก้ไว้</span>`;
  } else {
    html += `<span class="pill warn">⚠️ ยังไม่ได้ตรวจ</span>`;
  }
  const started = (run) => new Date(run.at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  if (!BUSY && SH.cut) html += `<span class="pill">⏳ ${esc(WmsShared.runner(SH.cut))} กำลังตรวจใหม่ (เริ่ม ${esc(started(SH.cut))}) เสร็จแล้วขึ้นให้เอง</span>`;
  else if (!BUSY && SH.tx) html += `<span class="pill">⏳ ${esc(WmsShared.runner(SH.tx))} กำลังดึงยอดขายชุดใหม่ เสร็จแล้วขึ้นให้เอง</span>`;
  if (SH.err && RAW && SH.err.at > WmsShared.stamp(RAW)) html += `<span class="pill warn" title="${esc(SH.err.msg)}">⚠️ รอบตรวจอัตโนมัติไม่สำเร็จ</span>`;
  html += `<span class="sp"></span>`;
  if (url) {
    const wait = BUSY || SH.cut;
    html += `<button id="runBtn" class="${RAW ? '' : 'p'}" ${wait ? 'disabled' : ''}>${BUSY ? 'กำลังตรวจ…' : SH.cut ? 'รอผลตรวจ…' : (RAW ? '🔄 ตรวจใหม่' : '▶️ เริ่มตรวจ')}</button>`;
  } else {
    html += `<span class="pill">ยังไม่ได้ตั้ง Apps Script URL — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a></span>`;
  }
  if (ERR) html += `<div class="tx-err">${esc(ERR)}</div>`;
  $('src').innerHTML = html;
  const btn = $('runBtn');
  if (btn) btn.onclick = run;
}

/** ป้ายบนเวลาที่ตรวจ บอกว่าทุกเครื่องเห็นชุดเดียวกัน และสคริปต์ใช้เวลาตรวจนานเท่าไร */
function sharedTitle(r) {
  const s = r && r.shared;
  if (!s) return 'ชุดนี้ตรวจในเครื่องนี้เอง เครื่องอื่นอาจเห็นคนละชุด';
  return `ข้อมูลกลาง ทุกเครื่องเห็นชุดเดียวกัน${s.ms ? ` · สคริปต์ใช้เวลา ${Math.round(s.ms / 1000)} วินาที` : ''}`;
}

/**
 * กดตรวจใหม่ สคริปต์ตรวจแล้วเก็บเป็นผลกลาง เครื่องอื่นจะได้ชุดนี้ภายในนาทีถัดไป
 * มีคนกดก่อนแล้วยังตรวจไม่เสร็จ รอผลของเขาแทน ได้ชุดเดียวกันและไม่ต้องตรวจซ้อน
 * สคริปต์รุ่นก่อนไม่รู้จักคำสั่งนี้ ถอยไปตรวจแบบเดิม
 */
async function run() {
  const url = WmsSettings.cutUrl();
  if (BUSY || SH.cut || !url) return;
  ERR = '';
  VERIFIED = 0;
  BEFORE = snapshot();
  BUSY = 'กำลังอ่านชีตทั้ง 4 แท็บ…';
  renderSrc();
  renderBody();
  try {
    const opts = {
      retries: 0,
      timeoutMs: TIMEOUT,
      onProgress: (sec) => { BUSY = `กำลังอ่านชีตทั้ง 4 แท็บ… ${sec} วินาที`; renderSrc(); },
    };
    let r = await WmsShared.press(url, 'cut-check', null, opts);
    if (r && r.error === WmsShared.OLD) r = await WmsGas.json(url, 'cut-check', opts);
    if (r.busy && !r.kinds) {
      SH.cut = r.busy;
      BUSY = '';
      BEFORE = null;
      render();
      WATCH.soon();
      return;
    }
    if (r.error) throw new Error(r.error);
    if (r.app !== 'cut' || !r.kinds) throw new Error('คำตอบไม่ใช่ของสคริปต์เช็คตัดสต๊อก ตรวจ URL ที่หน้าตั้งค่า');
    RAW = r;
    DAILY = null;
    CELLS = null;
    FIX = null;
    saveCache(CACHE, r);
  } catch (e) {
    ERR = e.message;
    BUSY = '';
    BEFORE = null;
    render();
    return;
  }
  await loadLedger(true);
}

/* ── ก่อนและหลังตรวจ ────────────────────────────────────────────────────── */

/** จำนวนรายการที่ต้องแก้ของแต่ละระบบ null = ยังไม่รู้ (ชีตทีมก่อนดึงยอดขาย) */
function perSystem() {
  const fx = fixResult();
  return Object.fromEntries(WHO_ORDER.map((k) => [k, fx[k] ? fx[k].length : null]));
}

function snapshot() {
  return { dom: window.WmsMotion?.counts(document) || {}, sys: RAW ? perSystem() : null };
}

/**
 * ตรวจรอบใหม่เสร็จ ตัวเลขวิ่งจากค่าเดิม ที่ลดลงกะพริบเขียว
 * ระบบไหนเพิ่งแก้ครบในรอบนี้ น้องกล่องขึ้นมาฉลอง เทียบเฉพาะระบบที่รู้ยอดทั้งสองรอบ
 */
function afterCheck(before) {
  GAIN = 0;
  if (!before || !RAW) return;
  window.WmsMotion?.countUp(document, before.dom);
  if (!before.sys) return;
  const now = perSystem();
  const known = WHO_ORDER.filter((k) => before.sys[k] !== null && now[k] !== null);
  const was = known.reduce((s, k) => s + before.sys[k], 0);
  const is = known.reduce((s, k) => s + now[k], 0);
  GAIN = Math.max(0, was - is);
  renderSrc();
  const done = known.filter((k) => before.sys[k] > 0 && now[k] === 0);
  if (!done.length) return;
  const left = WHO_ORDER.reduce((s, k) => s + (now[k] || 0), 0);
  window.WmsMotion?.cheer(
    left ? `${done.map((k) => WHO_INFO[k].label).join(' และ ')} แก้ครบแล้ว` : 'แก้ครบทุกระบบแล้ว',
    left ? `ระบบอื่นยังเหลืออีก ${f(left)} รายการ` : 'ไม่มีรายการค้างให้แก้ในเดือนนี้',
  );
}

const ledgerFits = () => !!(LEDGER && RAW && WmsShared.samePeriod(LEDGER, RAW.period));

/**
 * ดึงแยกจากการตรวจหลัก แก้สมุดแล้วเช็คซ้ำได้ในไม่กี่วินาที ไม่ต้องรอตรวจทั้งสี่แท็บ
 * fresh = ให้สคริปต์คิดใหม่แล้วเก็บเป็นยอดขายชุดกลาง ไม่ใส่ = อ่านชุดที่เก็บไว้ของช่วงวันที่เดียวกัน
 * (ยังไม่มีหรือเก่าเกินชั่วโมง สคริปต์คิดใหม่ให้เอง)
 */
async function loadLedger(fresh) {
  const url = WmsSettings.txUrl();
  LEDGER_ERR = '';
  if (!BEFORE) BEFORE = snapshot();   // กดดึงยอดขายใหม่อย่างเดียว ไม่ได้ผ่าน run
  if (url && RAW) {
    const say = (sec) => { BUSY = `กำลังอ่านยอดขายจากสต๊อกราย Location…${sec ? ` ${sec} วินาที` : ''}`; renderSrc(); };
    say(0);
    renderBody();
    try {
      const period = { from: RAW.period.from, to: RAW.period.to };
      const api = `tx-daily&from=${period.from}&to=${period.to}`;
      let r;
      if (fresh === true) {
        r = await WmsShared.press(url, 'tx-daily', period, { onProgress: say });
        if (r && r.error === WmsShared.OLD) r = await WmsGas.json(url, api, { retries: 1, onProgress: say });
      } else {
        r = await WmsShared.read(url, api, { retries: 1, onProgress: say });
      }
      if (r.busy && !r.cells) {
        SH.tx = r.busy;   // มีคนกำลังดึงยอดขายช่วงนี้อยู่ รอชุดของเขา
        WATCH.soon();
      } else {
        if (r.error) throw new Error(r.error);
        if (r.app !== 'transaction') throw new Error('URL ของ Transaction ในหน้าตั้งค่าไม่ใช่สคริปต์ tx-api.gs');
        if (!r.cells) throw new Error('สคริปต์ tx-api.gs ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version');
        LEDGER = r;
        DAILY = null;
        CELLS = null;
        FIX = null;
        saveCache(LEDGER_CACHE, r);
      }
    } catch (e) {
      LEDGER_ERR = e.message;
    }
  }
  finish();
}

/** ตรวจหรือโหลดชุดใหม่เสร็จ วาดใหม่ ตัวเลขวิ่งจากค่าเดิม แล้วอ่านบันทึกการแก้ (ตรวจแล้วหายบันทึกเอง) */
function finish() {
  BUSY = '';
  render();
  afterCheck(BEFORE);
  BEFORE = null;
  loadFixLog();
}

/** ป้าย "อัปเดตเป็นชุดล่าสุดแล้ว" ขึ้น 20 วินาทีหลังโหลดชุดของเครื่องอื่นมาให้ */
function flashFresh() {
  SH.fresh = Date.now() + 20000;
  setTimeout(renderSrc, 20500);
  renderSrc();
}

/**
 * ถามทุกนาที (WmsShared.watch) ว่ามีผลตรวจ ยอดขาย หรือบันทึกการแก้ชุดใหม่ไหม มีแล้วโหลดให้เอง
 * กำลังพิมพ์ค้น เปิดหน้าต่างรายละเอียด หรือกำลังบันทึกอยู่ ไม่วาดหน้าใหม่ ถามรอบถัดไปแทน
 * ตรวจแล้วหายของเครื่องอื่น สคริปต์กันไม่ให้ลงซ้ำอยู่แล้ว (fixAdd_) ทุกเครื่องเช็คพร้อมกันได้
 */
async function checkShared() {
  const cutUrl = WmsSettings.cutUrl(), txUrl = WmsSettings.txUrl();
  if (!cutUrl || BUSY) return false;
  const [cs, ts] = await Promise.all([WmsShared.status(cutUrl), txUrl ? WmsShared.status(txUrl) : null]);
  const okC = WmsShared.knows(cs, 'cut'), okT = WmsShared.knows(ts, 'transaction');
  const run = { cut: okC ? WmsShared.running(cs, 'cut-check') : null, tx: okT ? WmsShared.running(ts, 'tx-daily') : null };
  const err = (okC && cs.err && cs.err['cut-check']) || null;
  if (JSON.stringify([run.cut, run.tx, err]) !== JSON.stringify([SH.cut, SH.tx, SH.err])) {
    SH.cut = run.cut; SH.tx = run.tx; SH.err = err;
    renderSrc();
  }
  const waiting = !!(run.cut || run.tx);
  if (BUSY) return waiting;
  const newCut = okC && WmsShared.newer(cs, 'cut-check', RAW);
  const newTx = !newCut && okT && !!RAW && WmsShared.newer(ts, 'tx-daily', ledgerFits() ? LEDGER : null, RAW.period);
  const newLog = !newCut && okC && !!FIXLOG && FIXLOG.rows != null && cs.logRows !== FIXLOG.rows;
  if (!newCut && !newTx && !newLog) return waiting;
  if (SAVING || ARMED || POP || WmsShared.typing()) return true;
  if (newCut) {
    BEFORE = snapshot();
    BUSY = 'มีผลตรวจชุดใหม่ กำลังโหลด…';
    renderSrc();
    try {
      const r = await WmsShared.read(cutUrl, 'cut-check', { retries: 1, timeoutMs: TIMEOUT });
      if (r.error) throw new Error(r.error);
      if (r.app !== 'cut' || !r.kinds) throw new Error('คำตอบไม่ใช่ของสคริปต์เช็คตัดสต๊อก');
      if (WmsShared.stamp(r) > WmsShared.stamp(RAW)) {
        const had = !!RAW;   // เปิดมายังไม่มีอะไรเลย ไม่ต้องบอกว่าอัปเดต
        RAW = r;
        DAILY = null;
        CELLS = null;
        FIX = null;
        VERIFIED = 0;
        saveCache(CACHE, r);
        if (had) {
          SH.fresh = Date.now() + 20000;
          setTimeout(renderSrc, 20500);
        }
      }
    } catch (e) {
      console.warn('โหลดผลตรวจชุดใหม่ไม่สำเร็จ —', e.message);
      BUSY = '';
      BEFORE = null;
      renderSrc();
      return waiting;
    }
    /* ช่วงวันที่ของ Report เปลี่ยน หรือยอดขายชุดกลางใหม่กว่า ดึงยอดขายของช่วงนี้มาด้วย ไม่งั้นแท็บรายวันจะว่าง */
    if (txUrl && (!ledgerFits() || (okT && WmsShared.newer(ts, 'tx-daily', LEDGER, RAW.period)))) await loadLedger();
    else finish();
    return waiting;
  }
  if (newTx) {
    const had = WmsShared.stamp(LEDGER);
    await loadLedger();
    if (WmsShared.stamp(LEDGER) > had) flashFresh();
    return waiting;
  }
  await loadFixLog();
  return waiting;
}

/* ── บันทึกการแก้ ───────────────────────────────────────────────────────── */

function me() {
  try { return JSON.parse(localStorage.getItem('wms:session') || '{}').name || ''; } catch (e) { return ''; }
}

const atText = (ms) => new Date(ms).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

/**
 * สถานะของทุกรายการในแท็บแก้แยกตามระบบ เวลาที่ตรวจเป็นเวลาของสคริปต์ทั้งคู่ เทียบกับเวลาที่กดแก้แล้วได้ตรง
 * ชีตทีมเปลี่ยนเมื่อดึงยอดขายใหม่ อีกสองระบบเปลี่ยนเมื่อกดตรวจใหม่
 */
function logState() {
  if (!FIXLOG || !RAW) return null;
  const ms = (v) => (v ? +new Date(v) : 0);
  const capped = Object.keys(RAW.kinds).some((k) => RAW.kinds[k].shown < RAW.kinds[k].total);
  return WmsCut.fixState(fixResult(), FIXLOG.log, { s: ms(LEDGER && LEDGER.at), x: ms(RAW.at), t: ms(RAW.at) }, capped);
}

/** แท็บเดียว อ่านเร็ว อ่านทุกครั้งที่เปิดหน้าและหลังตรวจ จะได้เห็นที่คนอื่นกดไว้ */
async function loadFixLog() {
  const url = WmsSettings.cutUrl();
  if (!url || !RAW) return;
  try {
    const r = await WmsGas.json(url, 'cut-fixlog', { retries: 1 });
    if (r.error) throw new Error(r.error);
    if (r.app !== 'cut') throw new Error('คำตอบไม่ใช่ของสคริปต์เช็คตัดสต๊อก ตรวจ URL ที่หน้าตั้งค่า');
    FIXLOG_OLD = !r.log;
    FIXLOG = r.log ? r : null;
    FIXLOG_ERR = '';
  } catch (e) {
    FIXLOG_ERR = `อ่านบันทึกการแก้ไม่สำเร็จ: ${e.message}`;
  }
  await verifyGone();
  renderSrc();
  if (TAB === 'sys') renderBody();
}

/** กดแก้แล้วไว้ และการตรวจรอบหลังไม่พบรายการนั้น บันทึกว่าตรวจแล้วหายเอง ไม่ต้องรอคนกด */
async function verifyGone() {
  const st = logState();
  if (!st || !st.gone.length) return;
  const r = await saveLog('ตรวจแล้วหาย', st.gone);
  if (r) VERIFIED += r.added;
}

function logItem(k, e) {
  return { key: WmsCut.fixKey(k, e), k, date: e.date, ref: e.ref || '', sku: e.sku || '', sys: e.sys || '', what: fixWhy(e), need: e.need };
}

async function saveLog(act, items, key) {
  SAVING = key || 'all';
  if (TAB === 'sys') renderBody();
  try {
    const r = await WmsGas.post(WmsSettings.cutUrl(), { op: 'fix-log', act, by: me(), items }, { timeoutMs: 60000 });
    if (r.error) throw new Error(r.error);
    if (!r.log) throw new Error('สคริปต์ cut-api.gs ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version');
    FIXLOG = r;
    FIXLOG_ERR = '';
    return r;
  } catch (e) {
    FIXLOG_ERR = `บันทึกไม่สำเร็จ: ${e.message}`;
    return null;
  } finally {
    SAVING = '';
    if (TAB === 'sys') renderBody();
    if (FIXLOG_ERR && window.WmsMotion) setTimeout(() => window.WmsMotion.shake(document.querySelector('.lg-err')), 0);
  }
}

/* ── ยอดรวมและแท็บ ──────────────────────────────────────────────────────── */

function renderSum() {
  if (!RAW) { $('sum').innerHTML = ''; return; }
  const t = RAW.totals;
  /* ไม่มีชื่อ data-count-key ตั้งใจ ยอดรวมน้อยลงไม่ได้แปลว่าแก้แล้ว จึงไม่กะพริบเขียว */
  const stat = (label, n, sub) => `<div class="tx-stat"><small>${esc(label)}</small><b data-count="${n}">${f(n)}</b><i>${esc(sub)}</i></div>`;
  $('sum').classList.toggle('open', SUM_OPEN);
  $('sum').innerHTML =
    `<button class="tx-sum-t" data-sum aria-expanded="${SUM_OPEN}"><span><b>ภาพรวมเดือน · Report ${f(t.report)}</b>
      <small>ต่างจาก Report: Transaction ${plus(t.tx - t.report)} · TRcloud ${plus(t.tr - t.report)}</small></span><i>${SUM_OPEN ? '▴' : '▾'}</i></button>` +
    stat('Report ของเดือน', t.report, `JST ${f(t.jst)} · CRM ${f(t.crm)}${t.tf ? ` · โอนย้าย ${f(t.tf)}` : ''}`) +
    stat('ตัดใน Transaction', t.tx, `ต่างจาก Report ${plus(t.tx - t.report)}`) +
    stat('ตัดใน TRcloud', t.tr, `ต่างจาก Report ${plus(t.tr - t.report)}`) +
    stat('รายการที่ตรงกันทุกฝั่ง', RAW.info.matched.lines, `${f(RAW.info.matched.qty)} ชิ้น`);
}

function fixCount() { return FIX_KINDS.reduce((s, k) => s + RAW.kinds[k].total, 0); }
function underCount() { return RAW.kinds.under.total + RAW.gaps.length; }

/** รวมทุกระบบที่ต้องแก้ ชีตทีมยังไม่มีถ้ายังไม่ได้ดึงยอดขาย */
function sysCount() {
  const fx = fixResult();
  return WHO_ORDER.reduce((s, k) => s + (fx[k] ? fx[k].length : 0), 0);
}

function renderTabs() {
  if (!RAW) { $('tabs').innerHTML = ''; return; }
  /* short = ชื่อบนมือถือ ห้าแท็บต้องพอดีจอโดยไม่ต้องเลื่อน */
  const tab = (id, label, short, icon, n) => `<button class="tx-tab ${TAB === id ? 'on' : ''}" data-tab="${id}" role="tab" aria-selected="${TAB === id}" aria-label="${esc(label)}${n === null ? '' : ` ${f(n)}`}"><img src="${icon}" alt="" width="26" height="26"><span class="lb">${esc(label)}</span><span class="sh">${esc(short)}</span>${n === null ? '' : `<span class="n" data-count="${n}" data-count-key="tab-${id}">${f(n)}</span>`}</button>`;
  $('tabs').innerHTML =
    tab('fix', 'ตัดผิด / ตัดเกิน', 'ตัดผิด', '../icons/tab-cut.png', fixCount()) +
    tab('under', 'ยังไม่ตัด', 'ยังไม่ตัด', '../icons/tab-wait.png', underCount()) +
    tab('daily', 'เทียบรายวัน', 'รายวัน', '../icons/tab-daily.png', dailyResult() ? dailyResult().counts.daysBad : null) +
    tab('sys', 'แก้แยกตามระบบ', 'แก้ตามระบบ', '../icons/tab-fix.png', sysCount()) +
    tab('recon', 'ที่มาของยอด', 'ที่มา', '../icons/tab-source.png', null);
}

/* ── ตารางรายการ ────────────────────────────────────────────────────────── */

/** คอลัมน์สุดท้ายอ่านแล้วต้องรู้เลยว่าต่างกันยังไงและฝั่งไหน ไม่ต้องลบเลขเอง ไฟล์ Export ใช้คำเดียวกัน */
const diffText = WmsCut.rowDiff;

function cutDays(r) {
  const days = r.xd.length ? r.xd : r.td;
  if (!days.length) return 'ยังไม่มีรายการตัด';
  if (days.length === 1 && days[0] === r.date) return '';
  return 'ตัด ' + days.map(dm).join(', ');
}

function rowHtml(r) {
  const name = r.sku ? (RAW.names[r.sku] || '') : '';
  const cut = cutDays(r);
  const bad = (v) => (v !== r.goal ? 'tx-neg' + dir(v, r.goal) : '');
  const who = `<span class="tx-ref">${esc(r.ref || '(ไม่มีเลขออเดอร์)')}</span><span class="tx-sub">${esc(r.sys || '-')}${r.sup ? ' · ' + esc(r.sup) : ''}</span>`;
  /* แท็บตัดผิด / ตัดเกิน ติ๊กเลือกออเดอร์ไป Export ได้ แถวที่ไม่มีเลขออเดอร์หาใน Report ไม่ได้ จึงไม่มีช่องติ๊ก */
  const pick = TAB === 'fix' && r.ref;
  const on = pick && PICK.has(r.ref);
  return `<tr${on ? ' class="pk-on"' : ''}>
    <td class="nw k-top">${pick
      ? `<label class="pk"><input type="checkbox" data-pick="${esc(r.ref)}"${on ? ' checked' : ''} aria-label="เลือกออเดอร์ ${esc(r.ref)}"><span>${who}</span></label>`
      : who}</td>
    <td class="tx-name k-main">${r.sku ? `<b>${esc(r.sku)}</b><span class="tx-sub">${esc(name)}</span>` : `<b>ทั้งออเดอร์ ${f(r.lines)} SKU</b>`}</td>
    <td class="nw k-side">${esc(dm(r.date))}${cut ? `<span class="tx-sub">${esc(cut)}</span>` : ''}${r.ship ? `<span class="tx-sub">${esc(r.back ? BACK : r.ship)}</span>` : ''}</td>
    <td class="num" data-label="Report">${f(r.r)}</td>
    <td class="num ${bad(r.x)}" data-label="${esc(L.x)}">${f(r.x)}</td>
    <td class="num ${bad(r.t)}" data-label="${esc(L.t)}">${f(r.t)}</td>
    <td class="tx-res k-res">${esc(diffText(r))}${r.note ? `<span class="tx-sub">เหตุผลใน TRcloud: ${esc(r.note)}</span>` : ''}</td>
  </tr>`;
}

const TABLE_HEAD = `<tr><th>ออเดอร์</th><th>SKU</th><th>วันที่</th><th class="num">Report</th><th class="num">${L.x}</th><th class="num">${L.t}</th><th>ต่างกันยังไง</th></tr>`;

function matches(r) {
  if (SYS && r.sys !== SYS) return false;
  if (!Q) return true;
  const hay = `${r.ref} ${r.sku} ${RAW.names[r.sku] || ''}`.toUpperCase();
  return hay.includes(Q);
}

function section(kind) {
  const info = KINDS[kind], sum = RAW.kinds[kind];
  const rows = RAW.rows.filter((r) => r.k === kind && matches(r));
  if (!rows.length) return '';
  const capped = sum.shown < sum.total ? `<div class="tx-note">แสดง ${f(sum.shown)} รายการที่หนักสุด จากทั้งหมด ${f(sum.total)} รายการ</div>` : '';
  const all = TAB === 'fix' && rows.some((r) => r.ref)
    ? `<label class="pk-all"><input type="checkbox" data-pick-kind="${kind}" aria-label="เลือกทุกออเดอร์ในเรื่อง${esc(info.label)}"> เลือกทั้งหมด</label>` : '';
  return `<h3 class="tx-h">${esc(info.label)}<span class="n">${f(rows.length)} รายการ</span>${all}</h3>
    <div class="tx-why">${esc(info.why)}</div>
    <div class="tx-wrap"><table class="tx-tbl tx-mc"><thead>${TABLE_HEAD}</thead><tbody>${rows.map(rowHtml).join('')}</tbody></table></div>${capped}`;
}

function cards(kinds) {
  return `<div class="tx-cards">${kinds.map((k) => {
    const s = RAW.kinds[k], info = KINDS[k];
    return `<button class="tx-card ${KIND === k ? 'on' : ''}" data-kind="${k}"><small>${esc(info.label)}</small>
      <b class="${s.total ? info.tone : 'tx-ok'}" data-count="${s.total}" data-count-key="kind-${k}">${f(s.total)}</b><i>${s.total ? `${f(s.orders)} ออเดอร์ · ${f(s.qty)} ชิ้น` : 'ไม่มี'}</i></button>`;
  }).join('')}</div>`;
}

function filterBar() {
  const opt = (v, label) => `<button class="tx-opt ${SYS === v ? 'on' : ''}" data-sys="${v}">${label}</button>`;
  return `<div class="tx-bar">
    <input class="tx-input" id="q" type="search" placeholder="ค้นเลขออเดอร์ หรือ SKU" value="${esc(Q)}">
    ${opt('', 'ทุกระบบ')}${opt('JST', 'JST')}${opt('CRM', 'CRM')}${opt('โอนย้าย', 'โอนย้าย')}

function renderList() {
  const box = $('list');
  if (!box) return;
  if (TAB === 'daily') { box.innerHTML = dailyList(); return; }
  const kinds = TAB === 'fix' ? FIX_KINDS : ['under'];
  const shown = KIND ? [KIND] : kinds;
  const html = shown.map(section).join('');
  const total = TAB === 'fix' ? fixCount() : RAW.kinds.under.total;
  box.innerHTML = html || (total
    ? `<div class="tx-empty art-search">ไม่พบรายการที่ตรงกับตัวกรอง</div>`
    : `<div class="tx-empty art-done">${TAB === 'fix' ? 'ไม่พบรายการตัดผิดหรือตัดเกิน' : 'ไม่พบรายการที่ยังไม่ตัด'} — <b>เป็นเรื่องดี</b></div>`);
  if (TAB === 'fix') syncPicks();
}

/* ── ติ๊กเลือกออเดอร์ แล้ว Export ───────────────────────────────────────── */

/** เลขออเดอร์ที่ติ๊กไว้และยังอยู่ในผลตรวจรอบนี้ เรียงตามที่ขึ้นบนจอ ตรวจใหม่แล้วออเดอร์ที่หายไปก็หลุดเอง */
function picked() {
  const seen = new Set();
  for (const r of RAW ? RAW.rows : []) if (r.ref && PICK.has(r.ref)) seen.add(r.ref);
  return [...seen];
}

/** ออเดอร์ในเรื่องนั้นที่ขึ้นบนจอตามตัวกรองตอนนี้ ปุ่มเลือกทั้งหมดเลือกแค่ที่เห็น */
function sectionRefs(kind) {
  return [...new Set(RAW.rows.filter((r) => r.k === kind && r.ref && matches(r)).map((r) => r.ref))];
}

/** ติ๊กหนึ่งแถวคือเลือกทั้งออเดอร์ ทุกแถวของเลขเดียวกันติ๊กตาม ไม่วาดตารางใหม่ ตำแหน่งที่เลื่อนอยู่จะได้ไม่หลุด */
function syncPicks() {
  document.querySelectorAll('input[data-pick]').forEach((b) => {
    b.checked = PICK.has(b.dataset.pick);
    b.closest('tr').classList.toggle('pk-on', b.checked);
  });
  document.querySelectorAll('input[data-pick-kind]').forEach((b) => {
    const refs = sectionRefs(b.dataset.pickKind);
    const n = refs.filter((x) => PICK.has(x)).length;
    b.checked = refs.length > 0 && n === refs.length;
    b.indeterminate = n > 0 && n < refs.length;
  });
  renderPickBar();
}

function renderPickBar() {
  const bar = $('pkBar');
  if (!bar) return;
  const n = picked().length;
  if (!n && !PICK_MSG) { bar.innerHTML = ''; return; }
  const text = PICK_BUSY || (PICK_MSG ? PICK_MSG.text : '');
  const msg = text ? `<div class="pk-msg${!PICK_BUSY && PICK_MSG && PICK_MSG.bad ? ' bad' : ''}" role="status">${esc(text)}</div>` : '';
  const off = PICK_BUSY ? ' disabled' : '';
  bar.innerHTML = `<span class="pk-n">เลือก <b>${f(n)}</b> ออเดอร์</span><span class="sp"></span>${n
    ? `<button class="tx-opt" data-pick-clear${off}>ล้างที่เลือก</button><button class="pk-go" data-export${off}>${PICK_BUSY ? 'กำลังสร้างไฟล์…' : '⬇️ Export Excel'}</button>`
    : ''}${msg}`;
}

let XLSX_LOAD = null;
function xlsxLib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSX_LOAD) {
    XLSX_LOAD = new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = () => ok(window.XLSX);
      s.onerror = () => { XLSX_LOAD = null; bad(new Error('โหลดตัวสร้างไฟล์ Excel ไม่ได้ ลองใหม่อีกครั้ง')); };
      document.head.appendChild(s);
    });
  }
  return XLSX_LOAD;
}

/** แถวใน Report ทุกคอลัมน์ของออเดอร์ที่เลือก สคริปต์รุ่นเก่าไม่รู้จักคำสั่งนี้ ได้ null แล้วไฟล์มีแค่ชีตสรุป */
async function reportRows(refs, say) {
  const url = WmsSettings.cutUrl();
  if (!url) throw new Error('ยังไม่ได้ตั้ง URL ของสคริปต์ cut-api.gs');
  const r = await WmsGas.post(url, { op: 'report-rows', refs }, { timeoutMs: TIMEOUT, onProgress: say });
  if (r && r.error === 'ไม่รู้จักคำสั่งนี้') return null;
  if (!r || r.error) throw new Error(r ? r.error : 'สคริปต์ไม่ตอบ');
  return Array.isArray(r.tabs) ? r : null;
}

/** ไฟล์มีชีตสรุปปัญหาของออเดอร์ที่เลือก กับแถวใน Report ทุกคอลัมน์ทีละระบบ */
async function exportPicked() {
  const refs = picked();
  if (!refs.length || PICK_BUSY) return;
  if (refs.length > PICK_MAX) {
    PICK_MSG = { text: `Export ได้ครั้งละไม่เกิน ${f(PICK_MAX)} ออเดอร์ ตอนนี้เลือกไว้ ${f(refs.length)} ออเดอร์`, bad: true };
    renderPickBar();
    return;
  }
  const say = (s) => { PICK_BUSY = `กำลังดึงแถว Report ของ ${f(refs.length)} ออเดอร์${s ? ` · ${s} วินาที` : ''}`; renderPickBar(); };
  say(0);
  try {
    const [X, rep] = await Promise.all([xlsxLib(), reportRows(refs, say)]);
    const kinds = Object.fromEntries(Object.keys(KINDS).map((k) => [k, KINDS[k].label]));
    const sheets = WmsCut.exportSheets({ rows: RAW.rows, names: RAW.names, refs, kinds, back: BACK, rep });
    const wb = X.utils.book_new();
    sheets.forEach((s) => {
      const ws = X.utils.aoa_to_sheet(s.aoa);
      ws['!cols'] = s.widths.map((w) => ({ wch: w }));
      if (s.aoa.length > 1) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: s.aoa.length - 1, c: s.aoa[0].length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, s.name);
    });
    X.writeFile(wb, `ออเดอร์มีปัญหา_${RAW.period.from}_ถึง_${RAW.period.to}.xlsx`);
    const lines = sheets.slice(1).reduce((s, x) => s + x.aoa.length - 1, 0);
    PICK_MSG = !rep
      ? { text: 'ดาวน์โหลดแล้ว แต่มีแค่ชีตสรุป เพราะ cut-api.gs ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version ถึงจะได้แถวใน Report ครบทุกคอลัมน์', bad: true }
      : rep.cut
        ? { text: `ดาวน์โหลดแล้ว แต่แถวใน Report เยอะเกินที่สคริปต์ส่งได้ ได้มา ${f(lines)} แถว ไม่ครบ ให้เลือกออเดอร์น้อยลงแล้วกดใหม่`, bad: true }
        : { text: `ดาวน์โหลดแล้ว ${f(refs.length)} ออเดอร์ · แถวใน Report ${f(lines)} แถว`, bad: false };
  } catch (e) {
    PICK_MSG = { text: `Export ไม่สำเร็จ: ${e.message}`, bad: true };
  } finally {
    PICK_BUSY = '';
    renderPickBar();
  }
}

function gapBlock(g) {
  const who = g.side === 'both' ? `ทั้ง ${L.x} และ ${L.t}` : SIDE[g.side];
  const other = g.side === 'both' ? '' : ` แต่ ${SIDE[g.side === 'tx' ? 'tr' : 'tx']} ตัดแล้ว`;
  const carriers = Object.keys(g.carriers).map((c) => `${c} ${f(g.carriers[c])}`).join(', ');
  const more = g.orders > g.refs.length ? ` และอีก ${f(g.orders - g.refs.length)} ออเดอร์` : '';
  return `<div class="tx-warn">
    <b>${esc(dm(g.date))} · ${esc(g.sys)} ทั้งวันยังไม่ลง ${esc(who)}</b>${esc(other)}<br>
    ${f(g.orders)} ออเดอร์ · ${f(g.lines)} รายการ · ${f(g.qty)} ชิ้น (${esc(carriers)})
    <details class="tx-int"><summary>ดูเลขออเดอร์</summary><p>${g.refs.map(esc).join(', ')}${esc(more)}</p></details>
  </div>`;
}

function warnings() {
  return RAW.warnings.map((w) => `<div class="tx-warn">⚠️ ${esc(w)}</div>`).join('');
}

/* ── แท็บที่มาของยอด ────────────────────────────────────────────────────── */

function partLine(p) {
  const info = PARTS[p.id] || { label: p.id };
  return `<tr>
    <td>${esc(info.label)}${partNote(p.id)}</td>
    <td class="num">${f(p.lines)}</td>
    <td class="num ${info.fix && p.dx ? 'tx-neg' : ''}">${plus(p.dx) || '0'}</td>
    <td class="num ${info.fix && p.dt ? 'tx-neg' : ''}">${plus(p.dt) || '0'}</td>
  </tr>`;
}

function partNote(id) {
  const i = RAW.info;
  let text = '';
  if (id === 'nonstock') text = `ออเดอร์แฝงของงานโอนย้ายไปหน้าร้าน (รหัส STR) ${f(i.nonStock.qty)} ชิ้น · รหัสไม่ครบหรือว่าง ${f(i.badSku.qty)} ชิ้น`;
  if (id === 'blankOk') text = 'ยังไม่ได้ส่ง ถูกต้องแล้ว';
  if (id === 'cancelOk') text = 'ถูกต้องแล้ว';
  if (id === 'transfer') text = `${f(i.transfer.refs)} เลขงาน ยอดสองระบบตรงกัน`;
  if (id === 'outside') text = `${dm(i.outsideTx.from)}${i.outsideTx.to !== i.outsideTx.from ? ' ถึง ' + dm(i.outsideTx.to) : ''} · ${f(i.outsideTx.orders)} ออเดอร์`;
  if (id === 'adjust') text = `รับเข้า ${f(i.adjust.inq)} · เบิกออก ${f(i.adjust.outq)}`;
  return text ? `<span class="tx-sub">${esc(text)}</span>` : '';
}

/** ยังเทียบงานโอนย้ายกับรายงานไม่ได้เพราะอะไร '' = เทียบได้แล้ว หรือเดือนนี้ไม่มีงานโอนย้าย */
function tfNote() {
  if (RAW.totals.tf === undefined) return `<b>cut-api.gs</b> รุ่นนี้ยังไม่อ่านแท็บ ${TAB_TF} ให้วางโค้ดใหม่แล้ว Deploy เป็น New version`;
  if (!RAW.totals.tf && RAW.info.transfer.refs) return `ไม่พบข้อมูลในแท็บ ${TAB_TF} งานโอนย้ายจึงเทียบได้แค่ว่าสองระบบตรงกันเอง`;
  return '';
}

    <div class="tx-why">ยอดที่ต่างจาก Report มาจากไหนบ้าง บวกกันแล้วต้องเท่ายอดจริงในแท็บ</div>
    <div class="tx-wrap"><table class="tx-tbl">
      <thead><tr><th>เรื่อง</th><th class="num">รายการ</th><th class="num">Transaction</th><th class="num">TRcloud</th></tr></thead>
      <tbody>
        <tr class="sum"><td>ยอดตาม Report</td><td class="num"></td><td class="num">${f(c.report)}</td><td class="num">${f(c.report)}</td></tr>

      ${tfNote() ? `<br>${tfNote()}` : ''}
      ${RAW.kinds.cancel.total || RAW.kinds.blankCut.total ? '<br>รายการที่ขนส่งยกเลิกหรือสถานะว่างแต่ตัดแล้ว ยอดเท่า Report จึงไม่อยู่ในตารางนี้ ดูที่แท็บตัดผิด / ตัดเกิน' : ''}
      ${i.shippedBack?.lines ? `<br>${BACK} ${f(i.shippedBack.lines)} รายการ ${f(i.shippedBack.qty)} ชิ้น นับเป็นยอดที่ต้องตัดวันที่ออกจากคลังแล้ว` : ''}

      ${i.trIn ? `<br>TRcloud มีแถวรับเข้าทั้งหมด ${f(i.trIn)} ชิ้น ซึ่งหักออกจากยอดเบิกแล้ว` : ''}
    </div>`;
