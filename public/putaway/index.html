<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>จัดที่เก็บ — WMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── แถบแหล่งข้อมูล ชุดเดียวกับหน้า FIFO สต๊อกและสินค้าคงเหลือ ณ วันที่ ── */
.tx-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--wms-surface2);border-bottom:1px solid var(--wms-border);font-size:12px}
.tx-src .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--wms-surface);border:1px solid var(--wms-border);color:var(--wms-muted)}
.tx-src .pill b{color:var(--wms-text);font-weight:600}
.tx-src .pill.warn{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.tx-src .sp{flex:1}
.tx-src button{padding:4px 12px;border-radius:999px;border:1px solid var(--wms-border2);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:13px;color:#334155;cursor:pointer}
.tx-src button:hover:not(:disabled){background:var(--wms-primary-light);border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.tx-src button.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff}
.tx-src button.p:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.tx-src button:disabled{opacity:.6;cursor:default}
.tx-err{width:100%;font-size:13px;color:#B91C1C;font-weight:600}

/* ── วางแพลนรับเข้า: ตารางแบบ Excel กด Ctrl+V ที่ไหนก็ได้ในหน้า ── */
.pw-in{padding:12px 20px;background:var(--wms-surface);border-bottom:1px solid var(--wms-border)}
.pw-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;color:var(--wms-muted)}
.pw-h{font-size:15px;font-weight:700;color:var(--wms-text);margin-right:4px}
#planSt.bad{color:var(--wms-danger);font-weight:600}
.pw-grid{position:relative;max-height:236px;overflow:auto;border:1px solid var(--wms-border2);border-radius:8px;
  background:var(--wms-surface);outline:none;cursor:cell}
.pw-grid:focus{border-color:var(--wms-primary);box-shadow:0 0 0 3px var(--wms-primary-light)}
.pw-gt{border-collapse:separate;border-spacing:0;min-width:100%;font-size:12.5px}
.pw-gt th,.pw-gt td{height:24px;padding:2px 8px;border-right:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0;white-space:nowrap}
.pw-gt thead th{position:sticky;top:0;z-index:2;background:#F1F5F9;text-align:left;font-size:11px;font-weight:600;color:var(--wms-muted)}
.pw-gt thead th small{display:block;font-size:11.5px;font-weight:700;color:var(--wms-text)}
.pw-gt thead th.use small{color:var(--wms-primary-dark)}
.pw-gt .rn{position:sticky;left:0;z-index:1;min-width:34px;background:#F1F5F9;text-align:center;font-size:11px;color:var(--wms-muted)}
.pw-gt thead .rn{z-index:3}
.pw-gt td{max-width:300px;overflow:hidden;text-overflow:ellipsis;color:var(--wms-text)}
.pw-gt td.num{text-align:right;font-variant-numeric:tabular-nums}
.pw-gt tr.hd td{background:#F8FAFC;font-weight:600;color:var(--wms-muted)}
.pw-gt tr.skip td{color:#94A3B8;text-decoration:line-through}
.pw-gt tr.skip td.rn{text-decoration:none}
.pw-gempty{position:absolute;inset:28px 0 0;display:flex;align-items:center;justify-content:center;padding:10px;
  text-align:center;font-size:13.5px;color:var(--wms-muted);pointer-events:none}
.pw-gempty b{color:var(--wms-text)}
.pw-set{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:8px;font-size:12.5px;color:var(--wms-muted)}
.pw-set label{display:inline-flex;align-items:center;gap:6px}
.pw-set b{color:var(--wms-text)}
.pw-set .warn{color:#B45309;font-weight:600}
.pw-num{width:54px;padding:2px 6px;border-radius:6px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px;font-weight:700;color:var(--wms-text);text-align:center}
.pw-num:focus{outline:none;border-color:var(--wms-primary)}
.pw-link{background:none;border:0;padding:0;font:inherit;color:var(--wms-primary-dark);text-decoration:underline;cursor:pointer}
.pw-file{display:none}
.pw-drag{outline:2px dashed var(--wms-primary);outline-offset:3px;border-radius:6px}

/* ── ยอดรวม: แถบเดียว กดเพื่อดูเฉพาะกลุ่มนั้น ── */
.tx-sum{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:9px 20px;background:var(--wms-surface);
  border-bottom:1px solid var(--wms-border);font-size:13px;color:var(--wms-muted)}
.tx-sum:empty{display:none}
.pw-total{margin-right:6px}
.pw-total b{color:var(--wms-text)}
.pw-chip{display:inline-flex;align-items:baseline;gap:5px;padding:3px 11px;border-radius:999px;border:1px solid var(--wms-border);
  background:var(--wms-surface2);font-family:var(--wms-font);font-size:12.5px;color:var(--wms-muted);cursor:pointer}
.pw-chip b{font-size:14px;color:var(--wms-text);font-variant-numeric:tabular-nums}
.pw-chip:hover{border-color:var(--wms-primary)}
.pw-chip.on{border-color:var(--wms-primary);background:var(--wms-primary-light);color:var(--wms-primary-dark)}
.pw-chip.zero{opacity:.5}
.pw-chip.c-open b{color:var(--wms-primary-dark)}
.pw-chip.c-rib b{color:#C2410C}
.pw-chip.c-warn b{color:#B45309}
.pw-chip.c-red b{color:#B91C1C}

/* ── ผลลัพธ์: ตารางเดียว หนึ่งแถวต่อหนึ่งโล หน้าตาเหมือนแท็บ OUTPUT ── */
.tx-body{padding:12px 20px 60px}
.tx-empty{padding:34px 20px;text-align:center;color:var(--wms-muted);font-size:14px;line-height:1.75}
.tx-empty b{color:var(--wms-text)}
.tx-empty.bad{color:var(--wms-text)}
.tx-empty.bad > b:first-child{color:var(--wms-danger)}
.pw-why-list{display:inline-block;text-align:left;margin:6px auto 8px;padding-left:20px}
.tx-opt{padding:5px 13px;border-radius:999px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px;color:#334155;cursor:pointer}
.tx-opt:hover{border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.tx-opt.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff;font-weight:600}
.tx-opt.p:hover{filter:brightness(1.08);color:#fff}
.tx-opt:disabled{opacity:.6;cursor:default}
.pw-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--wms-muted)}
.pw-bar .sp{flex:1}
.pw-skip{font-size:12.5px;color:var(--wms-muted)}
.pw-skip summary{cursor:pointer;color:var(--wms-primary-dark);font-weight:600}
.pw-skip ul{margin:4px 0 0 18px}
.pw-edit{font-size:12px;font-weight:600;color:var(--wms-primary-dark)}

.pw-wrap{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--wms-border2);border-radius:8px;background:var(--wms-surface)}
.pw-xl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.pw-xl th{position:sticky;top:0;z-index:2;padding:6px 8px;background:#F1F5F9;text-align:left;font-size:11.5px;font-weight:600;
  color:var(--wms-muted);border-bottom:1px solid var(--wms-border2);border-right:1px solid #E2E8F0;white-space:nowrap}
.pw-xl td{height:32px;padding:0 6px;border-bottom:1px solid #EEF2F6;border-right:1px solid #EEF2F6;white-space:nowrap;
  vertical-align:middle;color:var(--wms-text)}
.pw-xl tr.g1 td{border-top:1px solid #CBD5E1}
.pw-xl tbody tr:first-child td{border-top:0}
.pw-xl .num{text-align:right;font-variant-numeric:tabular-nums}
.pw-xl .c-no{font-size:12px;color:var(--wms-muted)}
.pw-xl .c-sku{font-weight:700}
.pw-xl .c-nm{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.pw-xl .c-po{font-size:12px;color:var(--wms-muted)}
.pw-xl td.short{color:#B45309;font-weight:700}
.pw-xl tr.r-red td{background:#FEF2F2}
.pw-xl tr.r-rib td{background:#FFF7ED}
.pw-xl tr.r-move td{background:#F8FAFC;color:var(--wms-muted)}
.pw-loc,.pw-qty,.pw-rm{height:28px;padding:0 6px;border:1px solid transparent;border-radius:4px;background:transparent;
  font-family:var(--wms-font);font-size:13px;color:var(--wms-text)}
.pw-loc:hover,.pw-qty:hover,.pw-rm:hover{border-color:var(--wms-border2);background:var(--wms-surface)}
.pw-loc:focus,.pw-qty:focus,.pw-rm:focus{outline:none;border-color:var(--wms-primary);background:var(--wms-surface);box-shadow:0 0 0 2px var(--wms-primary-light)}
.pw-loc{width:118px;font-weight:700;text-transform:uppercase}
.pw-loc.empty{border-color:#FCD34D;background:#FEF3C7}
.pw-qty{width:64px;text-align:right;font-variant-numeric:tabular-nums}
.pw-rm{width:100%;min-width:120px}
.pw-xl .c-open{text-align:center}
.pw-ck{width:16px;height:16px;accent-color:var(--wms-primary);cursor:pointer;vertical-align:middle}
.pw-tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-rack{background:#ECFDF5;color:#065F46}
.t-open{background:var(--wms-primary-light);color:var(--wms-primary-dark)}
.t-rib{background:#FFEDD5;color:#9A3412}
.t-floor{background:#F0FDF4;color:#166534}
.t-manual{background:#FEF3C7;color:#92400E}
.t-move{background:var(--wms-surface2);color:var(--wms-muted)}
.pw-msg{display:inline-block;max-width:250px;margin-left:6px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-size:12px}
.l-red{color:#B91C1C;font-weight:700}
.l-warn{color:#B45309;font-weight:600}
.l-info{color:var(--wms-muted)}
.c-act{width:1%}
.pw-ic{width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:none;font-size:14px;line-height:1;
  color:var(--wms-muted);cursor:pointer;vertical-align:middle}
.pw-ic:hover{border-color:var(--wms-border2);background:var(--wms-surface2);color:var(--wms-primary-dark)}
.pw-ic.x:hover{border-color:#FCA5A5;background:#FEF2F2;color:#B91C1C}
.pw-ic.on{background:var(--wms-primary-light);color:var(--wms-primary-dark)}
.pw-more td{padding:7px 12px;background:#F8FAFC;white-space:normal;font-size:12.5px;line-height:1.65;color:var(--wms-muted)}
.pw-more b{color:var(--wms-text)}
.pw-more .low{color:#B45309;font-weight:600}
.pw-more .meta{display:flex;flex-wrap:wrap;gap:0 14px}
.pw-more .tip{color:var(--wms-text)}

@media (max-width:640px){
  .tx-src,.pw-in,.tx-sum,.tx-body{padding-left:16px;padding-right:16px}
  .tx-opt{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px}
  .pw-loc,.pw-qty,.pw-rm,.pw-num{font-size:16px}   /* ต่ำกว่า 16px iPhone จะซูมหน้าเองตอนแตะช่อง */
  .pw-wrap{max-height:none}
}
</style>
</head>
<body data-wms-module="putaway">

<div class="wms-shell">
<div data-wms-shell="putaway" data-root="../"></div>
<div class="wms-main">

  <div class="mod-head">
    <div class="mod-title">
      <div class="ic"><img src="../icons/boxes.png" alt="" width="38" height="38"></div>
      <div>
        <h2>จัดที่เก็บ</h2>
        <button type="button" class="mod-info" aria-expanded="false" aria-label="คำอธิบายหน้านี้">i</button>
        <p>วางแพลนรับเข้า (Ctrl+V) ได้โลเคชั่นทันที แก้ได้ทุกช่อง แล้วคัดลอกไปวางแท็บ OUTPUT</p>
      </div>
    </div>
  </div>

  <div class="tx-src" id="src"></div>
  <div class="pw-in" id="inp"></div>
  <div class="tx-sum" id="sum"></div>
  <div class="tx-body" id="body"></div>
  <datalist id="pwLocs"></datalist>

</div><!-- /.wms-main -->
</div><!-- /.wms-shell -->

<script type="module" src="../wms-shell.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-shared.js"></script>
<script src="../wms-putaway.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f = n => (Math.round(n * 1000) / 1000).toLocaleString('en-US');
const dm = d => { const p = String(d || '').split('-'); return p.length === 3 ? `${+p[2]}/${+p[1]}` : ''; };
const P = WmsPutaway;
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const DRAFT = 'wms:putaway:draft';     // แพลนที่วางกับแถวที่แก้เอง ปิดหน้าแล้วเปิดใหม่ยังอยู่ (เครื่องนี้เท่านั้น)
const SET = 'wms:putaway:set';         // เกณฑ์ที่ตั้งไว้
const CAPFILE = 'wms:putaway:cap';     // ไฟล์ความจุที่ลากใส่หน้าเว็บ ใช้แทนแท็บในชีต

/* tx-fifo ราวหนึ่งเมกะไบต์ เก็บแค่ในหน่วยความจำ เหมือนหน้า FIFO สต๊อก */
let RES = null;     // คำตอบ tx-fifo (ข้อมูลกลาง)
let SNAP = null;    // WmsPutaway.stock(RES)
let FILECAP = null; // { name, at, rows, blank }
let TEXT = '';
let PLAN = { lines: [], skipped: [] };
let MANUAL = {};    // { ลำดับบรรทัด: แถวที่คนแก้เอง }
let OUT = [];
let CHK = null;
let OPT = { ...P.DEFAULTS };
let BUSY = '';
let ERR = '';
let WAIT = null;
let LOADING = false;
let XLSX_LOAD = null;
let FILTER = '';        // ดูเฉพาะกลุ่ม (แร็ค เข้าโลเปิด RIB พื้น เลือกเอง ผิดกติกา) '' = ทั้งหมด
const MORE = new Set(); // บรรทัดที่กางรายละเอียดอยู่

function readJson(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function writeJson(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

(function restore() {
  const s = readJson(SET);
  if (s && s.coverDays >= 0) OPT.coverDays = +s.coverDays;
  FILECAP = readJson(CAPFILE);
  const d = readJson(DRAFT);
  if (d && typeof d.text === 'string') { TEXT = d.text; MANUAL = d.manual || {}; }
})();

function saveDraft() { writeJson(DRAFT, { text: TEXT, manual: MANUAL, at: Date.now() }); }

/** ความจุที่ใช้อยู่: ไฟล์ที่ลากใส่มาก่อน (ตั้งใจแทนแท็บ) ไม่มีก็แท็บในชีต */
function capSrc() {
  if (FILECAP && FILECAP.rows) return { from: 'file', ...FILECAP };
  if (RES && RES.cap && !RES.cap.missing) return { from: 'tab', ...RES.cap };
  return null;
}
function capNow() { const c = capSrc(); return c ? P.capMap(c.rows) : {}; }

let CERR = '';      // คิดแผนไม่สำเร็จ บอกบนหน้า ไม่เงียบ

function compute() {
  CERR = '';
  try {
    PLAN = P.parsePlan(TEXT);
    if (!SNAP) { OUT = []; CHK = null; return; }
    const cap = capNow();
    OUT = P.plan(PLAN.lines, SNAP, cap, OPT, MANUAL);
    CHK = P.check(PLAN.lines, OUT, SNAP, cap);
  } catch (e) {
    CERR = e.message || String(e);
    OUT = []; CHK = null;
    if (!PLAN || !PLAN.lines) PLAN = { lines: [], skipped: [] };
  }
}

/* ── โหลดสต๊อก ─────────────────────────────────────────────────────────── */

async function load(fresh, quiet) {
  const url = WmsSettings.txUrl();
  if (LOADING || !url) return;
  LOADING = true;
  ERR = '';
  const say = (sec) => { BUSY = fresh ? `กำลังอ่านสมุด Transaction ทั้งชีต…${sec ? ` ${sec} วินาที` : ''}` : 'กำลังโหลดชุดล่าสุด…'; renderSrc(); };
  const opts = { retries: 1, timeoutMs: 240000, onProgress: quiet ? undefined : say };
  if (!quiet) say(0);
  try {
    let res;
    if (fresh) {
      res = await WmsShared.press(url, 'tx-fifo', null, opts);
      if (res && res.error === WmsShared.OLD) res = await WmsGas.json(url, 'tx-fifo', opts);
    } else {
      res = await WmsShared.read(url, 'tx-fifo', opts);
    }
    if (res && res.busy && !res.rows) {
      WAIT = res.busy;
      WATCH.soon();
      BUSY = '';
      LOADING = false;
      render();
      return;
    }
    WAIT = null;
    if (res.error) throw new Error(res.error);
    if (res.app !== 'transaction') throw new Error('URL ของ Transaction ในหน้าตั้งค่าไม่ใช่สคริปต์ tx-api.gs');
    if (!res.rows) throw new Error('สคริปต์ tx-api.gs ยังเป็นรุ่นที่ไม่ส่งแถวของสมุด ให้วางโค้ดใหม่แล้ว Deploy เป็น New version');
    RES = res;
    SNAP = P.stock(res);
    fillLocs();
    compute();
  } catch (e) {
    ERR = e.message;
  }
  BUSY = '';
  LOADING = false;
  render();
}

/** รายชื่อโลให้ช่อง Location เลือก: ช่องว่างก่อน แล้วโลอื่นที่เคยมีในสมุด */
function fillLocs() {
  const empty = SNAP.emptyR.concat(...Object.values(SNAP.emptyFloor));
  const seen = new Set(empty.map((l) => l.toUpperCase()));
  const rest = (RES.locs || []).filter((l) => !seen.has(String(l).toUpperCase())).sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true }));
  $('pwLocs').innerHTML = empty.map((l) => `<option value="${esc(l)}">ว่าง</option>`).join('') +
    ['RIB', 'DOCKLOAD'].concat(rest).map((l) => `<option value="${esc(l)}"></option>`).join('');
}

/* ── แถบบน ─────────────────────────────────────────────────────────────── */

function renderSrc() {
  const url = WmsSettings.txUrl();
  let html = '';
  if (RES && !BUSY) {
    const when = new Date(WmsShared.stamp(RES)).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const who = WmsShared.who(RES);
    html += `<span class="pill" title="ทุกเครื่องเห็นชุดเดียวกัน กดดึงใหม่เมื่อเพิ่งลงสมุด">🕐 สต๊อกเมื่อ <b>${esc(when)}</b>${who ? ` · ${esc(who)}` : ''}</span>`;
    if (RES.last) html += `<span class="pill">สมุดลงขายถึง <b>${esc(dm(RES.last))}</b></span>`;
    if (SNAP) html += `<span class="pill" title="ช่องที่เคยมีในสมุดแต่ตอนนี้ไม่มีของ ช่องที่ไม่เคยลงสมุดเลยระบบไม่รู้จัก">ช่อง R ว่าง <b>${f(SNAP.emptyR.length)}</b></span>`;
  }
  if (BUSY) html += `<span class="pill">⏳ ${esc(BUSY)}</span>`;
  if (WAIT && !BUSY) {
    const at = new Date(WAIT.at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    html += `<span class="pill warn">⏳ ${esc(WmsShared.runner(WAIT))} กำลังดึงชุดใหม่ (เริ่ม ${esc(at)}) เสร็จแล้วขึ้นให้เอง</span>`;
  }
  html += '<span class="sp"></span>';
  if (url) {
    html += `<button id="loadBtn" class="${RES ? '' : 'p'}" ${BUSY || WAIT ? 'disabled' : ''}>${BUSY ? 'กำลังดึง…' : WAIT ? 'รอชุดใหม่…' : RES ? '🔄 ดึงสต๊อกใหม่' : '▶️ ดึงสต๊อก'}</button>`;
  } else {
    html += `<span class="pill">ยังไม่ได้ตั้ง Apps Script URL ของ Transaction — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a></span>`;
  }
  if (ERR) html += `<div class="tx-err">ดึงข้อมูลไม่สำเร็จ: ${esc(ERR)}</div>`;
  $('src').innerHTML = html;
  const btn = $('loadBtn');
  if (btn) btn.onclick = () => load(!!RES);
}

/** ข้อความที่วางแสดงเป็นตาราง หัวคอลัมน์บอกว่าระบบอ่านช่องไหนเป็นอะไร แถวที่ข้ามขีดฆ่าไว้ */
function renderGrid() {
  const box = $('grid');
  if (!box) return;
  const grid = TEXT.replace(/\r/g, '').split('\n').map((l) => l.split('\t'));
  const blank = (r) => !r.some((v) => String(v).trim());
  if (grid.every(blank)) {
    box.innerHTML = `<table class="pw-gt"><thead><tr><th class="rn"></th>${EMPTY_COLS.map((k, j) => `<th>${colL(j)}<small>${COLNAME[k]}</small></th>`).join('')}</tr></thead>
      <tbody>${[1, 2, 3, 4, 5, 6].map((n) => `<tr><td class="rn">${n}</td>${EMPTY_COLS.map(() => '<td></td>').join('')}</tr>`).join('')}</tbody></table>
      <div class="pw-gempty"><span>คัดลอกตารางจากแท็บ <b>INPUT</b> แล้วกด <b>Ctrl+V</b> (หรือปุ่ม 📋 วาง)</span></div>`;
    return;
  }
  const cols = PLAN.cols || {};
  const keyAt = {};
  Object.keys(cols).forEach((k) => { if (cols[k] >= 0 && keyAt[cols[k]] === undefined) keyAt[cols[k]] = k; });
  let n = 0;
  grid.forEach((r) => { for (let j = r.length - 1; j >= n; j--) if (String(r[j]).trim()) { n = j + 1; break; } });
  const skip = {};
  PLAN.skipped.forEach((s) => { skip[s.n] = s.why; });
  let body = '', shown = 0;
  grid.forEach((r, i) => {
    if (blank(r) || shown++ >= GRID_MAX) return;
    const hd = i === PLAN.head;
    const why = skip[i + 1];
    let cells = '';
    for (let j = 0; j < n; j++) {
      const v = String(r[j] ?? '').trim();
      const num = !hd && (keyAt[j] === 'qty' || keyAt[j] === 'no');
      cells += `<td${num ? ' class="num"' : ''}${keyAt[j] === 'name' ? ` title="${esc(v)}"` : ''}>${esc(v)}</td>`;
    }
    body += `<tr${hd ? ' class="hd"' : why ? ` class="skip" title="ข้าม: ${esc(why)}"` : ''}><td class="rn">${i + 1}</td>${cells}</tr>`;
  });
  let head = '<th class="rn"></th>';
  for (let j = 0; j < n; j++) {
    const k = keyAt[j];
    head += `<th${USED.includes(k) ? ' class="use"' : ''}>${colL(j)}<small>${k ? COLNAME[k] : '&nbsp;'}</small></th>`;
  }
  box.innerHTML = `<table class="pw-gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function xlsxLib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSX_LOAD) {
    XLSX_LOAD = new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = () => ok(window.XLSX);
      s.onerror = () => { XLSX_LOAD = null; bad(new Error('โหลดตัวอ่านไฟล์ Excel ไม่ได้ ลองใหม่อีกครั้ง')); };
      document.head.appendChild(s);
    });
  }
  return XLSX_LOAD;
}

async function readCapFile(file) {
  try {
    const X = await xlsxLib();
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    let best = null;
    for (const tab of wb.SheetNames) {
      const grid = X.utils.sheet_to_json(wb.Sheets[tab], { header: 1, defval: '', raw: true });
      const r = P.capFromRows(grid);
      if (!r.missing && (!best || r.rows.length > best.rows.length)) best = r;
    }
    if (!best) throw new Error('ไม่เจอหัวตาราง SKU กับ STD / pallet ในไฟล์นี้');
    FILECAP = { name: file.name, at: Date.now(), rows: best.rows, blank: best.blank };
    writeJson(CAPFILE, FILECAP);
    compute();
    render();
  } catch (e) {
    alert('อ่านไฟล์ความจุไม่ได้: ' + e.message);
  }
}

/* ── ยอดรวม: แถบเดียว กดเพื่อดูเฉพาะกลุ่ม ─────────────────────────────── */

const GROUPS = [
  ['rack', 'แร็ค', 'ช่อง', ''], ['open', 'เข้าโลเปิด', 'ชิ้น', 'c-open'], ['rib', 'RIB', 'ชิ้น', 'c-rib'],
  ['floor', 'พื้น', 'ชิ้น', ''], ['manual', 'เลือกเอง', 'แถว', 'c-warn'], ['red', 'ผิดกติกา', 'แถว', 'c-red'],
];

/** แถวนี้อยู่กลุ่มไหน ใช้ทั้งนับและกรอง */
function groupsOf(r, msgs) {
  const g = [];
  if ((msgs || []).some((m) => m.level === 'red')) g.push('red');
  if (r.move) return g;
  if (!r.loc) g.push('manual');
  else if (r.open) g.push('open');
  else if (String(r.loc).toUpperCase() === 'RIB') g.push('rib');
  else if (r.tag === 'rack' || P.zoneOf(r.loc) === 'R') g.push('rack');
  else if (P.isFloor(r.loc)) g.push('floor');
  return g;
}

function counts() {
  const c = {};
  GROUPS.forEach(([k]) => { c[k] = { rows: 0, qty: 0, lines: new Set() }; });
  OUT.forEach((o, i) => o.rows.forEach((r, j) => groupsOf(r, CHK.lines[i].rows[j]).forEach((g) => {
    c[g].rows++;
    c[g].qty += +r.qty || 0;
    c[g].lines.add(i);
  })));
  return c;
}

function renderSum() {
  if (!SNAP || !PLAN.lines.length || !CHK) { $('sum').innerHTML = ''; return; }
  const qty = PLAN.lines.reduce((a, ln) => a + ln.qty, 0);
  const c = counts();
  if (FILTER && !c[FILTER].rows) FILTER = '';
  $('sum').innerHTML = `<span class="pw-total"><b>${f(PLAN.lines.length)}</b> บรรทัด · <b>${f(qty)}</b> ชิ้น</span>` +
    GROUPS.map(([k, label, unit, cls]) => {
      const n = unit === 'ชิ้น' ? c[k].qty : c[k].rows;
      return `<button class="pw-chip ${cls}${FILTER === k ? ' on' : ''}${n ? '' : ' zero'}" data-filter="${k}" aria-pressed="${FILTER === k}" ${n ? '' : 'disabled'}>${label} <b>${f(n)}</b> ${unit}</button>`;
    }).join('') +
    (FILTER ? ' <button class="pw-link" data-filter="">ดูทั้งหมด</button>' : '');
}

/* ── ตารางผล: หนึ่งแถวต่อหนึ่งโล บรรทัดแพลนเดียวกันอยู่ติดกัน ─────────────── */

/** รายละเอียดของบรรทัด ซ่อนไว้ กด ⓘ / 💡 ถึงแสดง */
function lineMeta(o, ln) {
  const bits = [];
  bits.push(`<span>${esc(o.kind.label)}</span>`);
  bits.push(o.cap > 0 ? `<span>พาเลทละ <b>${f(o.cap)}</b></span>` : `<span class="low">${o.cap === 0 ? 'ความจุเป็น 0' : 'ไม่มีความจุ'}</span>`);
  if (o.sup) bits.push(`<span>Supplier <b>${esc(o.sup)}</b></span>`);
  const x = o.info;
  if (o.s < 0) bits.push('<span class="low">ไม่มี SKU นี้ในสมุด</span>');
  if (x) {
    if (x.regular) {
      const cover = x.perDay > 0 ? x.openQty / x.perDay : Infinity;
      const low = cover < OPT.coverDays;
      const sups = Object.keys(x.openSup || {}).filter((k) => k && x.openSup[k] > 0);
      bits.push(`<span>${x.openQty > 0 ? 'โลเปิด' : 'โลเปิดล่าสุด'} <b>${esc(x.regular)}</b>${sups.length === 1 ? ` ของ ${esc(sups[0])}` : ''}</span>`);
      if (sups.length > 1) bits.push(`<span class="low">เปิดขายอยู่ ${f(sups.length)} Supplier: ${esc(sups.join(', '))}</span>`);
      bits.push(`<span class="${low ? 'low' : ''}">โลเปิดมี ${f(x.openQty)}${x.perDay > 0 ? ` · ขายวันละ ${f(Math.round(x.perDay * 10) / 10)} · พอขาย ${cover === Infinity ? '-' : cover.toFixed(1)} วัน` : ' · ช่วงนี้ไม่มีขาย'}</span>`);
    }
    if (x.reserve > 0) bits.push(`<span>สำรอง <b>${f(x.reserve)}</b></span>`);
    if (x.rib > 0) bits.push(`<span>ใน RIB <b>${f(x.rib)}</b></span>`);
    bits.push(`<span>ทั้งคลัง ${f(x.total)}</span>`);
  }
  return bits.join('');
}

function lineCells(o, ln, ck) {
  const short = ck.issues.length;
  return `<td class="c-no">${esc(ln.no || ln.n)}${o.manual ? ' <span class="pw-edit" title="แก้เองแล้ว ระบบไม่คิดบรรทัดนี้ใหม่">✎</span>' : ''}</td>
    <td class="c-sku">${esc(ln.sku || ln.pid)}</td>
    <td class="c-nm" title="${esc(o.name || ln.name)}">${esc(o.name || ln.name)}</td>
    <td class="c-po">${esc(ln.po)}</td>
    <td class="num${short ? ' short' : ''}"${short ? ` title="${esc(ck.issues.join(' · '))}"` : ''}>${short ? '⚠️ ' : ''}${f(ln.qty)}</td>`;
}

/** ปุ่มของบรรทัด อยู่แถวแรก: ดูรายละเอียด และคืนค่าที่ระบบเสนอ */
function lineBtns(i, o) {
  return `<button class="pw-ic${MORE.has(i) ? ' on' : ''}" data-more="${i}" title="${o.hint ? esc(o.hint) : 'ดูรายละเอียด'}" aria-label="ดูรายละเอียด">${o.hint ? '💡' : 'ⓘ'}</button>` +
    (o.manual ? `<button class="pw-ic" data-reset="${i}" title="คืนค่าที่ระบบเสนอ" aria-label="คืนค่าที่ระบบเสนอ">↺</button>` : '');
}

function rowHtml(i, j, o, ln, ck) {
  const r = o.rows[j], msgs = ck.rows[j] || [];
  const first = j === 0, last = j === o.rows.length - 1;
  const red = msgs.filter((m) => m.level === 'red'), warn = msgs.filter((m) => m.level === 'warn');
  const lv = red.length ? 'r-red' : r.tag === 'rib' ? 'r-rib' : r.move ? 'r-move' : '';
  const k = (fld) => `data-i="${i}" data-j="${j}" data-f="${fld}" data-k="${i}.${j}.${fld}"`;
  const tip = [r.why].concat(msgs.map((m) => m.text)).filter(Boolean).join(' · ');
  return `<tr class="${first ? 'g1' : ''} ${lv}">
    ${first ? lineCells(o, ln, ck) : '<td></td><td></td><td></td><td></td><td></td>'}
    <td><input class="pw-loc${r.loc ? '' : ' empty'}" list="pwLocs" value="${esc(r.loc)}" placeholder="เลือกโล" ${k('loc')} aria-label="Location"></td>
    <td class="num"><input class="pw-qty" type="number" min="0" step="any" value="${esc(r.qty)}" ${k('qty')} aria-label="จำนวน"></td>
    <td class="c-open"><input class="pw-ck" type="checkbox" ${r.open ? 'checked' : ''} ${k('open')} aria-label="OPEN"></td>
    <td class="c-tag"${tip ? ` title="${esc(tip)}"` : ''}><span class="pw-tag t-${esc(r.tag || 'manual')}">${esc(r.move ? 'ย้ายจาก ' + (r.from || 'RIB') : P.TAG_TEXT[r.tag] || 'แก้เอง')}</span>${
      red.length ? `<span class="pw-msg l-red">⛔ ${esc(red[0].text)}</span>` : warn.length ? '<span class="pw-msg l-warn">⚠️</span>' : ''}</td>
    <td><input class="pw-rm" value="${esc(r.remark || '')}" ${k('remark')} aria-label="REMARK"></td>
    <td class="c-act">${first ? lineBtns(i, o) : ''}<button class="pw-ic x" data-del="${i}.${j}" title="ลบแถวนี้" aria-label="ลบแถว">×</button>${
      last ? `<button class="pw-ic" data-add="${i}" title="เพิ่มแถว" aria-label="เพิ่มแถว">+</button>` : ''}</td>
  </tr>`;
}

/** บรรทัดที่ลบแถวหมดแล้ว เหลือแถวเดียวไว้กดเพิ่ม */
function emptyLineRow(i, o, ln, ck) {
  return `<tr class="g1 r-red">${lineCells(o, ln, ck)}<td colspan="5" class="l-red">ยังไม่มีแถว กด + เพื่อเพิ่ม</td>
    <td class="c-act">${lineBtns(i, o)}<button class="pw-ic" data-add="${i}" title="เพิ่มแถว" aria-label="เพิ่มแถว">+</button></td></tr>`;
}

/** แถวรายละเอียดใต้บรรทัด: ข้อมูลสต๊อก คำแนะนำ และเหตุผลของแต่ละแถว */
function moreRow(o, ln, ck) {
  const why = o.rows.map((r, j) => {
    const t = [r.why].concat((ck.rows[j] || []).map((m) => (m.level === 'red' ? '⛔ ' : m.level === 'warn' ? '⚠️ ' : '') + m.text)).filter(Boolean);
    return t.length ? `<div><b>${esc(r.loc || 'ยังไม่เลือกโล')}</b> ${esc(t.join(' · '))}</div>` : '';
  }).join('');
  return `<tr class="pw-more"><td colspan="11">
      <div class="meta">${lineMeta(o, ln)}</div>
      ${o.hint ? `<div class="tip">💡 ${esc(o.hint)}</div>` : ''}
      ${ck.issues.map((t) => `<div class="low">⚠️ ${esc(t)}</div>`).join('')}
      ${why}
    </td></tr>`;
}

function renderBody() {
  const body = $('body');
  if (!WmsSettings.txUrl()) {
    body.innerHTML = `<div class="tx-empty">ตั้ง <b>Apps Script URL ของ Transaction</b> ที่<a href="../settings/">หน้าตั้งค่า</a>ก่อน</div>`;
    return;
  }
  if (!SNAP) {
    body.innerHTML = `<div class="tx-empty">${BUSY ? 'กำลังโหลดสต๊อก…' : 'กด <b>ดึงสต๊อก</b> ด้านบนก่อน'}</div>`;
    return;
  }
  if (CERR) {
    body.innerHTML = `<div class="tx-empty bad">คิดที่เก็บไม่สำเร็จ: ${esc(CERR)}<br>ลองวางแพลนใหม่ ถ้ายังไม่ได้ ส่งภาพหน้านี้ให้คนดูแลระบบ</div>`;
    return;
  }
  if (!PLAN.lines.length && TEXT.trim()) {
    const why = {};
    PLAN.skipped.forEach((s) => { why[s.why] = (why[s.why] || 0) + 1; });
    const list = Object.entries(why).map(([w, n]) => `<li>${esc(w)} ${f(n)} แถว</li>`).join('');
    body.innerHTML = `<div class="tx-empty bad"><b>อ่านแพลนไม่ได้สักบรรทัด</b>${list ? `<ul class="pw-why-list">${list}</ul>` : '<br>'}
      ลองคัดลอกให้ติดแถวหัวตาราง (NO., Product ID, PO, SKU, QTY) มาด้วย</div>`;
    return;
  }
  if (!PLAN.lines.length) { body.innerHTML = ''; return; }
  const edited = Object.keys(MANUAL).length;
  const only = FILTER ? counts()[FILTER].lines : null;
  let rows = '';
  OUT.forEach((o, i) => {
    if (only && !only.has(i)) return;
    const ln = PLAN.lines[i], ck = CHK.lines[i];
    rows += o.rows.length ? o.rows.map((r, j) => rowHtml(i, j, o, ln, ck)).join('') : emptyLineRow(i, o, ln, ck);
    if (MORE.has(i)) rows += moreRow(o, ln, ck);
  });
  body.innerHTML = `<div class="pw-bar">
      <button class="tx-opt p" id="copyBtn">📋 คัดลอกไปวางในชีต</button>
      <button class="tx-opt" id="xlsxBtn">⬇️ Excel</button>
      ${PLAN.skipped.length ? `<details class="pw-skip"><summary>ข้าม ${f(PLAN.skipped.length)} แถว</summary><ul>${PLAN.skipped.map((s) => `<li>${esc(s.label || 'แถว ' + s.n)}${s.code ? ` (${esc(s.code)})` : ''}: ${esc(s.why)}</li>`).join('')}</ul></details>` : ''}
      <span class="sp"></span>
      ${edited ? `<span class="pw-edit">✎ แก้เอง ${f(edited)} บรรทัด</span> <button class="tx-opt" id="resetAll">คืนค่าทั้งหมด</button>` : ''}
    </div>
    <div class="pw-wrap"><table class="pw-xl"><thead><tr>
      <th>NO.</th><th>SKU</th><th>ชื่อสินค้า</th><th>PO</th><th class="num">แพลน</th>
      <th>Location</th><th class="num">QTY</th><th>OPEN</th><th>ผล</th><th>REMARK</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderPlanSt() {
  const el = $('planSt');
  if (!el) return;
  el.classList.toggle('bad', !!(TEXT.trim() && !PLAN.lines.length));
  el.textContent = PLAN.lines.length ? `อ่านได้ ${f(PLAN.lines.length)} บรรทัด${PLAN.skipped.length ? ` · ข้าม ${f(PLAN.skipped.length)}` : ''}`
    : TEXT.trim() ? 'อ่านแพลนไม่ได้ ดูด้านล่าง' : 'กด Ctrl+V ที่ไหนก็ได้ในหน้านี้';
}

function render() {
  renderSrc();
  renderGrid();
  renderCap();
  renderSup();
  renderPlanSt();
  renderSum();
  renderBody();
}

/* ── แก้แถว ────────────────────────────────────────────────────────────── */

/** แก้บรรทัดไหนครั้งแรก คัดลอกแถวที่ระบบเสนอไว้เป็นของคนแก้ ต่อจากนั้นระบบไม่คิดบรรทัดนั้นใหม่ */
function own(i) {
  if (!MANUAL[i]) MANUAL[i] = OUT[i].rows.map((r) => ({ ...r }));
  return MANUAL[i];
}

/** วาดใหม่แล้วคืนเคอร์เซอร์ไปช่องที่คนกดไปต่อ (Tab ไปช่องถัดไปจะได้ไม่หลุด) */
function redraw() {
  setTimeout(() => {
    const a = document.activeElement;
    const key = a && a.dataset ? a.dataset.k : '';
    compute();
    saveDraft();
    renderSum();
    renderBody();
    if (key) {
      const el = document.querySelector(`[data-k="${key}"]`);
      if (el) { el.focus(); if (el.select && el.type !== 'checkbox') el.select(); }
    }
  }, 0);
}

$('body').addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.i === undefined) return;
  const rows = own(+t.dataset.i);
  const r = rows[+t.dataset.j];
  const fld = t.dataset.f;
  if (fld === 'loc') {
    r.loc = t.value.trim().toUpperCase();
    r.tag = r.move ? 'move' : r.loc === 'RIB' ? 'rib' : P.zoneOf(r.loc) === 'R' ? 'rack' : P.isFloor(r.loc) ? 'floor' : r.loc ? (r.open ? 'open' : 'floor') : 'manual';
    r.why = '';
  } else if (fld === 'qty') r.qty = Math.max(0, Number(t.value) || 0);
  else if (fld === 'open') { r.open = t.checked; if (!r.move && r.loc) r.tag = r.open ? 'open' : (P.zoneOf(r.loc) === 'R' ? 'rack' : r.loc === 'RIB' ? 'rib' : 'floor'); }
  else if (fld === 'remark') r.remark = t.value;
  redraw();
});

$('body').addEventListener('click', (e) => {
  const more = e.target.closest('[data-more]');
  if (more) {
    const i = +more.dataset.more;
    if (MORE.has(i)) MORE.delete(i); else MORE.add(i);
    renderBody();
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    const [i, j] = del.dataset.del.split('.').map(Number);
    own(i).splice(j, 1);
    redraw();
    return;
  }
  const add = e.target.closest('[data-add]');
  if (add) {
    const i = +add.dataset.add;
    const rows = own(i);
    const left = Math.max(0, PLAN.lines[i].qty - rows.reduce((a, r) => a + (r.move ? 0 : +r.qty || 0), 0));
    rows.push({ loc: '', qty: left, open: false, tag: 'manual', why: '' });
    redraw();
    setTimeout(() => document.querySelector(`[data-k="${i}.${rows.length - 1}.loc"]`)?.focus(), 30);
    return;
  }
  const reset = e.target.closest('[data-reset]');
  if (reset) { delete MANUAL[+reset.dataset.reset]; redraw(); return; }
  if (e.target.closest('#resetAll')) {
    if (!confirm('คืนค่าที่ระบบเสนอทุกบรรทัด ที่แก้เองไว้จะหาย')) return;
    MANUAL = {};
    redraw();
    return;
  }
  if (e.target.closest('#copyBtn')) {
    const btn = $('copyBtn');
    const rows = P.exportRows(PLAN.lines, OUT, true).slice(1).map((r) => r.slice(0, 8));
    copyText(rows.map((r) => r.map((v) => String(v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n')).then((ok) => {
      btn.textContent = ok ? 'คัดลอกแล้ว วางในแท็บ OUTPUT ได้เลย' : 'คัดลอกไม่ได้ ลองกดอีกครั้ง';
      if (ok) window.WmsMotion?.saved(btn); else window.WmsMotion?.shake(btn);
    });
    return;
  }
  if (e.target.closest('#xlsxBtn')) downloadXlsx();
});

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => false);
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return Promise.resolve(ok);
}

async function downloadXlsx() {
  const btn = $('xlsxBtn');
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'กำลังสร้างไฟล์…';
  try {
    const X = await xlsxLib();
    const ws = X.utils.aoa_to_sheet(P.exportRows(PLAN.lines, OUT, false));
    ws['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 6 }, { wch: 5 }, { wch: 16 }, { wch: 10 }, { wch: 48 }, { wch: 7 }, { wch: 12 }];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'OUTPUT');
    const d = new Date();
    X.writeFile(wb, `จัดที่เก็บ-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.xlsx`);
  } catch (e) {
    alert(e.message);
  }
  btn.disabled = false;
  btn.textContent = label;
}

/* ── วางแพลนกับเกณฑ์ ───────────────────────────────────────────────────── */

/** แพลนใหม่: ที่แก้เองไว้ผูกกับลำดับบรรทัด แพลนเปลี่ยนจึงต้องล้าง */
function setPlan(text) {
  text = String(text || '').replace(/\r/g, '').replace(/\n+$/, '');
  if (text === TEXT) return;
  if (Object.keys(MANUAL).length && !confirm('วางแพลนใหม่ ที่แก้เองไว้จะถูกล้าง แล้วจัดใหม่ทั้งหมด')) return;
  MANUAL = {};
  MORE.clear();
  FILTER = '';
  TEXT = text;
  compute();
  saveDraft();
  render();
  if (!SNAP && WmsSettings.txUrl() && !LOADING) load(false);
}

/* Ctrl+V ที่ไหนก็ได้ในหน้า (ยกเว้นตอนอยู่ในช่องกรอก) คือวางแพลน ข้อความช่องเดียวไม่นับ กันวางพลาด */
document.addEventListener('paste', (e) => {
  const t = e.target;
  if (t && t.closest && t.closest('input, textarea, select, [contenteditable="true"]')) return;
  const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  if (!text || !/[\t\n]/.test(text.trim())) return;
  e.preventDefault();
  setPlan(text);
});

$('sum').addEventListener('click', (e) => {
  const b = e.target.closest('[data-filter]');
  if (!b || b.disabled) return;
  FILTER = FILTER === b.dataset.filter ? '' : b.dataset.filter;
  renderSum();
  renderBody();
});

$('inp').addEventListener('click', async (e) => {
  if (e.target.closest('#pasteBtn')) {
    try {
      const text = await navigator.clipboard.readText();
      if (!/[\t\n]/.test(String(text).trim())) throw new Error('ไม่ใช่ตาราง');
      setPlan(text);
    } catch (err) {
      const el = $('planSt');
      el.classList.add('bad');
      el.textContent = 'อ่านคลิปบอร์ดไม่ได้ คลิกที่ตารางแล้วกด Ctrl+V แทน';
      $('grid').focus();
    }
    return;
  }
  if (e.target.closest('#clearBtn')) {
    if (!TEXT || !confirm('ล้างแพลนและที่แก้เองทั้งหมด')) return;
    TEXT = '';
    MANUAL = {};
    MORE.clear();
    FILTER = '';
    compute();
    saveDraft();
    render();
    return;
  }
  if (e.target.closest('[data-capfile]')) { $('capFile').click(); return; }
  if (e.target.closest('[data-captab]')) {
    FILECAP = null;
    try { localStorage.removeItem(CAPFILE); } catch (err) {}
    compute();
    render();
  }
});

$('inp').addEventListener('change', (e) => {
  if (e.target.id === 'cover') {
    const v = Number(e.target.value);
    OPT.coverDays = v >= 0 ? v : P.DEFAULTS.coverDays;
    e.target.value = OPT.coverDays;
    writeJson(SET, { coverDays: OPT.coverDays });
    compute();
    render();
    return;
  }
  if (e.target.id === 'capFile' && e.target.files[0]) {
    readCapFile(e.target.files[0]);
    e.target.value = '';
  }
});

/* ลากไฟล์ความจุมาวางที่แถบตั้งค่าใต้ตาราง */
$('inp').addEventListener('dragover', (e) => {
  const box = e.target.closest('#set');
  if (!box) return;
  e.preventDefault();
  box.classList.add('pw-drag');
});
$('inp').addEventListener('dragleave', (e) => { e.target.closest('#set')?.classList.remove('pw-drag'); });
$('inp').addEventListener('drop', (e) => {
  const box = e.target.closest('#set');
  if (!box) return;
  e.preventDefault();
  box.classList.remove('pw-drag');
  const file = e.dataTransfer.files[0];
  if (file) readCapFile(file);
});

/* ── ข้อมูลกลาง: มีคนดึงสต๊อกชุดใหม่ ขึ้นให้เอง ── */

async function checkShared() {
  const url = WmsSettings.txUrl();
  if (!url || LOADING) return false;
  const st = await WmsShared.status(url);
  if (!WmsShared.knows(st, 'transaction')) return false;
  const run = WmsShared.running(st, 'tx-fifo');
  const had = !!WAIT;
  WAIT = run;
  if (run) { if (!had) renderSrc(); return true; }
  if (!RES || !WmsShared.newer(st, 'tx-fifo', RES)) { if (had) renderSrc(); return false; }
  if (WmsShared.typing()) { if (had) renderSrc(); return true; }
  await load(false, true);
  return false;
}

renderInput();
compute();
render();
const WATCH = WmsShared.watch(checkShared);
if (WmsSettings.txUrl()) load(false);
</script>
</body>
</html>
