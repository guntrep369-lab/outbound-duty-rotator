const GCLS = { 'ขาด': 'short', 'เกิน': 'over', 'วางผิดโล': 'moved', 'LOT/PO ผิด': 'lotpo', 'น่าจะพิมพ์ผิด': 'typo', 'ยังไม่นับ': 'left', 'Inv≠Audit': 'audit', 'ตรง': 'ok', 'หัวหน้าแก้': 'edit' };
const AN_LIMIT = 300;   // แถวที่วาดต่อครั้ง เกินนี้ให้กรองเพิ่ม หน้าไม่หน่วง

/** คิดจากยอดตั้งต้นกับบันทึกนับที่มีในหน้าอยู่แล้ว ไม่ต้องถามสคริปต์ คิดใหม่เมื่อมีแถวใหม่หรือข้อมูลรอบเปลี่ยน */
function analysis() {
  if (AN && AN.head === S.head && AN.n === S.log.length && AN.since === S.since) return AN.res;
  const res = ST.analyze({ piles: S.head.piles, entries: S.log, teams: S.head.teams, locs: countLocs(), skus: S.head.skus, skip: R().settings.skip || [], pass: 1, day2: day2() });
  AN = { head: S.head, n: S.log.length, since: S.since, res };
  return res;
}

const signed = (n) => (n > 0 ? '+' : '') + f(n);

/** แถวในสมุดที่น่าจะเป็นต้นเหตุ อ่านสมุด (ข้อมูลกลาง) ครั้งแรกที่กาง ⓘ */
function ledgerHtml(l) {
  if (!FIFO) {
    if (!FIFO_BUSY && WmsSettings.txUrl()) {
      FIFO_BUSY = true;
      loadFifo(false).catch(() => { FIFO = { data: null, at: Date.now() }; }).finally(() => { FIFO_BUSY = false; if (TAB === 'analyze' || TAB === 'close') paintBody(); });
    }
    return WmsSettings.txUrl() ? '<div class="st-led">⏳ กำลังอ่านสมุด…</div>' : '';
  }
  if (!FIFO.data) return '<div class="st-led">อ่านสมุดไม่ได้</div>';
  const rows = ST.suspects(FIFO.data, l, 5);
  if (!rows.length) return '<div class="st-led">ไม่มีแถวในสมุดที่ SKU นี้เข้า-ออกโลนี้</div>';
  const sh = FIFO.data.sheet;
  const link = (row) => sh && sh.url
    ? `<a href="${esc(String(sh.url).split('#')[0] + '#gid=' + sh.gid + '&range=A' + row)}" target="_blank" rel="noopener">แถว ${row}</a>` : `แถว ${row}`;
  return '<div class="st-led">' + rows.map(x => `${link(x.row)} · ${esc(x.date || 'ไม่มีวันที่')} · ${esc(x.type)} ${esc(x.from || '')}${x.from && x.to ? ' → ' : ''}${esc(x.to || '')} × ${f(x.qty)} · LOT ${esc(x.lot || '-')} PO ${esc(x.po || '-')}`).join('<br>') + '</div>';
}

function analyzeView() {
  const r = R();
  if (!r.pass) return `<div class="st-empty">ยังไม่เริ่มนับ<br><button class="st-btn" data-go="setup">ไปหน้าตั้งรอบ</button></div>`;
  const a = analysis();
  const T = a.teamName;
  const G = ST.G;
  const problems = a.lines.filter(l => l.group !== G.OK).concat(a.audit);
  const order = (g) => { const i = ST.GROUPS.indexOf(g); return i < 0 ? 99 : i; };
  const q = ST.up(AQ);
  /* โลที่หลายคนนับในงานเดียวกัน ยอดอาจซ้ำ (หรือแค่แบ่งกันนับคนละกอง) */
  const mloc = new Map();
  (a.multi || []).forEach(m => mloc.set(m.loc, (mloc.get(m.loc) || []).concat([`${m.kind === 'Audit' ? 'Audit ' : ''}${m.who.join(', ')}`])));
  const base = FILTER === 'ok' ? a.lines.filter(l => l.group === G.OK)
    : FILTER === 'm' ? a.lines.concat(a.audit).filter(l => mloc.has(l.loc)) : problems;
  const list = base.filter(l => {
    if (FILTER.startsWith('g:') && l.group !== FILTER.slice(2)) return false;
    if (FILTER.startsWith('h:')) { const [row, lv] = FILTER.slice(2).split('|'); if (l.row !== row || (+lv && l.level !== +lv)) return false; }
    if (FILTER.startsWith('p:')) { const [tm, w] = FILTER.slice(2).split('|'); if (l.team !== tm || !(l.who || []).includes(w)) return false; }
    return !q || l.loc.includes(q) || ST.up(l.sku).includes(q) || ST.up(l.long).includes(q) || ST.up(l.name).includes(q);
  }).sort((x, y) => order(x.group) - order(y.group) || ST.locCmp(x.loc, y.loc) || ST.natCmp(x.sku, y.sku));
  const chip = (key, label, val, cls) => `<button class="st-chip ${cls || ''} ${FILTER === key ? 'on' : ''}" data-filter="${esc(key)}">${esc(label)} <b>${val}</b></button>`;
  const gcls = { 'ขาด': 'red', 'เกิน': 'amber', 'วางผิดโล': 'amber', 'LOT/PO ผิด': 'amber', 'น่าจะพิมพ์ผิด': 'amber', 'ยังไม่นับ': 'red', 'Inv≠Audit': 'amber' };
  const t = a.totals;
  const closed = r.status === 'ปิดแล้ว';
  const band = r.status === 'นับรอบ 1'
    ? `<div class="st-warn">ยังรับผลนับอยู่ ตัวเลขเปลี่ยนได้ · <button class="st-btn p" data-act="close1">ปิดรับนับรอบ 1 → วิเคราะห์</button></div>`
    : r.status === 'ตั้งค่า' ? ''
    : `<div class="st-note" style="margin:0 0 8px">ผลรอบ 1${r.status === 'วิเคราะห์' && r.pass < 2 ? ' · ปิดรับแล้ว (เครื่องที่ค้างส่งยังส่งเข้ามาได้) <button class="st-btn" data-act="reopen">กลับไปนับต่อ</button>' : ''}
        ${closed ? '' : ' · <button class="st-btn p" data-go="round2">ทำแผนรอบ 2 →</button>'}</div>`;
  const hot = a.hot.slice(0, 5).map(h => chip(`h:${h.row}|${h.level}`, h.row + (h.level ? ' ชั้น ' + h.level : ''), h.n)).join('');
  const ppl = a.people.filter(p => p.bad).slice(0, 5).map(p => chip(`p:${p.team}|${p.who}`, `${p.who} · ${p.teamName}`, `${p.bad}/${p.checked}`, 'amber')).join('');
  const rows = list.slice(0, AN_LIMIT).map(l => {
    const open = OPEN.has('a:' + l.id);
    const pair = (l.pairs || []).map(p => `${esc(p.group)} คู่กับ ${esc(p.loc)} ${esc(p.sku)} LOT ${esc(p.lot || '-')} PO ${esc(p.po || '-')} × ${f(p.qty)}`).join('<br>');
    return `<tr><td><span class="st-g ${GCLS[l.group] || ''}">${esc(l.group)}</span></td><td class="k">${esc(l.loc)}</td><td>${esc(l.sku || '—')}</td>
      <td class="mu">${esc(l.name)}</td><td>${esc(l.lot)}</td><td>${esc(l.po)}</td><td class="num">${f(l.book)}</td>
      <td class="num">${l.inv === null ? '—' : f(l.inv)}</td><td class="num ${l.diff < 0 ? 'neg' : l.diff > 0 ? 'pos' : ''}">${l.diff === null || l.diff === undefined ? '' : signed(l.diff)}</td>
      <td class="num">${l.aud === null || l.aud === undefined ? '' : f(l.aud)}</td>
      <td><button class="st-i ${open ? 'on' : ''}" data-open="a:${esc(l.id)}" aria-label="รายละเอียด ${esc(l.loc)} ${esc(l.sku)}">i</button></td></tr>` +
      (open ? `<tr class="info"><td colspan="11"><b>${esc(l.note || l.group)}</b><br>
        ทีม ${esc(T[l.team] || l.team || '—')} · คนนับ ${esc((l.who || []).join(', ') || '—')}${l.auditor ? ' · Audit ' + esc(l.auditor.join(', ')) : ''} · แถว ${esc(l.row)}${l.level ? ' ชั้น ' + l.level : ''}
        ${pair ? '<br>' + pair : ''}${l.fix ? `<br>แก้: <b>${esc(l.fix)}</b>` : ''}
        ${mloc.has(l.loc) ? `<br>หลายคนนับโลนี้ (${esc(mloc.get(l.loc).join(' · '))}) ถามว่านับกองเดียวกันซ้ำไหม` : ''}${l.sku ? ledgerHtml(l) : ''}</td></tr>` : '');
  }).join('');
  return `${band}<div class="st-tot">
      <span>สมุด <b>${f(t.book)}</b></span><span>นับได้ <b>${f(t.inv)}</b></span><span>ต่าง <b>${signed(t.diff)}</b></span>
      <span>นับแล้ว <b>${f(t.counted)}/${f(t.locs)}</b> โล</span><span class="sp"></span>
      ${r.settings.summaryAt && !closed ? `<span>บันทึกล่าสุด ${esc(r.settings.summaryAt)}</span>` : ''}
      ${closed ? '' : `<button class="st-btn" data-act="summary" ${S.busy ? 'disabled' : ''}>บันทึกผลลงชีต</button>`}
    </div>
    <div class="st-bar">
      ${chip('', 'ปัญหาทั้งหมด', f(problems.length))}
      ${ST.GROUPS.filter(g => a.counts[g].n).map(g => chip('g:' + g, g, f(a.counts[g].n), gcls[g])).join('')}
      ${chip('ok', 'ตรง', f(a.counts[G.OK].n), 'green')}
      ${mloc.size ? chip('m', 'หลายคนนับ', f(mloc.size), 'amber') : ''}
      <span class="sp"></span><input class="st-q" id="anQ" placeholder="ค้นหา โล / SKU / ชื่อ" value="${esc(AQ)}" aria-label="ค้นหาในผลวิเคราะห์">
    </div>
    ${hot ? `<div class="st-bar"><span class="st-lbl">ผิดบ่อย</span>${hot}</div>` : ''}
    ${ppl ? `<div class="st-bar"><span class="st-lbl">ต่างกับ Audit บ่อย</span>${ppl}</div>` : ''}
    <div class="st-wrap"><table class="st-xl"><thead><tr><th>กลุ่ม</th><th>Location</th><th>SKU</th><th>ชื่อ</th><th>LOT</th><th>PO</th>
      <th class="num">สมุด</th><th class="num">นับ</th><th class="num">ต่าง</th><th class="num">Audit</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="11" class="mu">${problems.length ? 'ไม่มีรายการตามที่กรอง' : 'ยังไม่เจอปัญหา นับตรงกับสมุดทุกกอง'}</td></tr>`}</tbody></table></div>
    ${list.length > AN_LIMIT ? `<div class="st-note">แสดง ${AN_LIMIT} จาก ${f(list.length)} รายการ — กดชิปหรือค้นหาเพื่อกรอง</div>` : ''}
    <div class="st-note">กดชิปเพื่อกรอง · ⓘ = คนนับ โลคู่ วิธีแก้ และแถวในสมุดที่น่าสงสัย · ตัวเลขคิดสดจากบันทึกนับ ชีตผลสรุปเก็บภาพตอนกดบันทึก</div>`;
}

async function saveSummary() {
  const lines = ST.summaryRows(analysis());
  await job('กำลังบันทึกผลสรุปลงชีต…', async () => {
    const res = await post({ op: 'st-summary', round: S.rid, lines });
    Object.assign(R(), res.round);
    S.ok = `✓ บันทึกผลสรุปลงชีตแล้ว ${f(res.saved)} แถว`;
  });
}

/* ── แท็บรอบ 2: ระบบเลือกโลที่ต้องนับซ้ำ หัวหน้าปรับเกณฑ์ / ตัด / เพิ่ม / เปลี่ยนทีม ── */

/** แผนที่บันทึกในชีตแล้ว (ที่คนนับเห็น) */
function planSaved() {
  return ((S.head && S.head.plan) || []).map(p => ({ loc: p[0], row: p[1], why: p[2], team: p[3], forbid: p[4] || [], r1team: p[5] }));
}
function r2Draft() {
  if (!R2D || R2D.rid !== S.rid) R2D = { rid: S.rid, opts: ST.r2Opts(R().settings.r2) };
  return R2D;
}
function planNow() {
  const a = analysis(), key = JSON.stringify(r2Draft().opts);
  if (PN && PN.a === a && PN.key === key && PN.head === S.head) return PN.p;
  const p = ST.plan2(a, { teams: S.head.teams, locs: countLocs(), opts: r2Draft().opts });
  PN = { a, key, head: S.head, p };
  return p;
}
/** แผนที่คิดตอนนี้ต่างจากที่บันทึกไหม (โลหรือทีมเปลี่ยน) */
function planDiff(p) {
  const now = new Map(ST.planRows(p).map(r => [r[0], r[3]]));
  const saved = planSaved();
  return now.size !== saved.length || saved.some(s => now.get(s.loc) !== s.team);
}
function tName(id) { const t = S.head.teams.find(x => x.id === id && x.pass === 1); return t ? t.name : id || '—'; }
function after1() { const r = R(); return r.pass > 0 && r.status !== 'ตั้งค่า' && r.status !== 'นับรอบ 1'; }

function round2View() {
  const r = R();
  if (!after1()) return `<div class="st-empty">ปิดรับนับรอบ 1 ก่อน แล้วระบบจะเลือกโลที่ต้องนับซ้ำให้<br><button class="st-btn" data-go="analyze">ไปแท็บวิเคราะห์</button></div>`;
  const closed = r.status === 'ปิดแล้ว';
  const d = r2Draft(), o = d.opts;
  const p = planNow();
  const saved = planSaved();
  const savedMap = new Map(saved.map(x => [x.loc, x.team]));
  const pr = ST.progress2(saved, S.log);
  const changed = planDiff(p) || JSON.stringify(o) !== JSON.stringify(ST.r2Opts(r.settings.r2));
  const inv = ST.teamsOf(S.head.teams, 1).filter(t => t.kind === 'Inventory');
  const chip = (key, label, val, cls) => `<button class="st-chip ${cls || ''} ${FILTER === key ? 'on' : ''}" data-filter="${esc(key)}">${esc(label)} <b>${val}</b></button>`;
  const picked = p.locs.filter(l => !l.drop);

  let band = '';
  if (closed) band = `<div class="st-done">ปิดรอบแล้ว · อนุมัติโดย <b>${esc(r.approvedBy)}</b> เมื่อ ${esc(r.approvedAt)}</div>`;
  else if (r.status === 'นับรอบ 2') band = `<div class="st-warn"><b>กำลังนับรอบ 2</b> · นับแล้ว ${f(pr.done)}/${f(pr.total)} โล (${pr.pct}%) · คนนับเปิดลิงก์เดิม เลือกทีมใหม่
      <button class="st-btn p" data-act="stop2">ปิดรับนับรอบ 2</button></div>`;
  else if (r.pass >= 2) band = `<div class="st-note" style="margin:0 0 8px">ปิดรับนับรอบ 2 แล้ว · นับได้ ${f(pr.done)}/${f(pr.total)} โล
      <button class="st-btn" data-act="start2">เปิดนับรอบ 2 ต่อ</button> <button class="st-btn p" data-go="close">ไปปิดรอบ →</button></div>`;
  else if (saved.length && !changed) band = `<div class="st-warn">บันทึกแผนแล้ว ${f(saved.length)} โล · ส่งลิงก์คนนับเดิมได้เลย
      <button class="st-btn p" data-act="start2">เปิดนับรอบ 2</button></div>`;
  else band = `<div class="st-note" style="margin:0 0 8px">ระบบเลือกโลจากผลรอบ 1 ตามเกณฑ์ข้างล่าง · ทีมที่นับรอบ 2 ไม่ใช่ทีมเดิม และคนที่นับโลนั้นในรอบ 1 นับซ้ำไม่ได้
      · ไม่ต้องนับซ้ำ <button class="st-btn" data-go="close">ข้ามไปปิดรอบ</button></div>`;

  const multiN = (analysis().multi || []).filter(m => m.kind !== 'Audit').length;
  const gchips = ST.GROUPS.map(g => `<button class="st-chip ${o.groups.includes(g) ? 'on' : ''}" data-r2g="${esc(g)}" ${closed ? 'disabled' : ''}>${esc(g)} <b>${f(p.counts.tags[g] || 0)}</b></button>`).join('') +
    (multiN ? `<button class="st-chip ${o.multi ? 'on' : ''}" data-r2m="1" ${closed ? 'disabled' : ''} title="โลที่ Inventory หลายคนนับในรอบ 1 ยอดอาจซ้ำ">${esc(ST.R2_MULTI)} <b>${f(multiN)}</b></button>` : '');
  const hot = p.hot.filter(h => h.bad).slice(0, 6).map(h =>
    `<span class="st-chip plain ${h.on ? 'amber' : ''}">${esc(h.row)} <b>${h.bad}/${h.checked}</b> ${h.pct}%${h.on ? ' · ทั้งแถว' : ''}</span>`).join('');
  const teamChips = inv.map(t => {
    const n = picked.filter(l => l.team === t.id).length;
    const tp = pr.teams.find(x => x.id === t.id);
    return n || tp ? chip('t:' + t.id, t.name, r.pass >= 2 && tp ? `${tp.done}/${tp.n}` : f(n)) : '';
  }).join('');
  const dropN = p.counts.dropped;
  const leftN = r.pass >= 2 ? pr.left.length : 0;

  const show = p.locs.filter(l => {
    if (FILTER === 'drop') return l.drop;
    if (l.drop) return false;
    if (FILTER.startsWith('t:')) return l.team === FILTER.slice(2);
    if (FILTER === 'left') return savedMap.has(l.loc) && !pr.isDone[l.loc];
    return true;
  });
  /* โลในแผนที่บันทึกแต่ไม่อยู่ในแผนที่คิดตอนนี้ (เกณฑ์เปลี่ยน) ยังแสดงให้เห็นว่าคนนับยังเห็นอยู่ */
  const gone = saved.filter(s => !p.locs.some(l => l.loc === s.loc));
  const opt = (v) => inv.map(t => `<option value="${esc(t.id)}" ${v === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  const rows = show.slice(0, AN_LIMIT).map(l => {
    const st = !savedMap.has(l.loc) ? '<td class="mu">ยังไม่บันทึก</td>'
      : savedMap.get(l.loc) !== l.team ? '<td class="mu">ทีมเปลี่ยน</td>'
      : r.pass < 2 ? '<td class="mu">รอเปิด</td>'
      : pr.isDone[l.loc] ? '<td class="ok">✓ นับแล้ว</td>' : '<td>รอนับ</td>';
    return `<tr class="${l.drop ? 'off' : ''}"><td><input type="checkbox" class="st-chk" data-r2drop="${esc(l.loc)}" ${l.drop ? '' : 'checked'} ${closed ? 'disabled' : ''} aria-label="นับซ้ำ ${esc(l.loc)}"></td>
      <td class="k">${esc(l.loc)}</td><td style="white-space:normal">${esc(l.why)}</td><td class="mu">${esc(tName(l.r1team))}</td>
      <td>${l.drop ? '' : `<select class="st-in ${l.team ? '' : 'none'}" data-r2team="${esc(l.loc)}" ${closed ? 'disabled' : ''} aria-label="ทีมรอบ 2 ${esc(l.loc)}">${l.team ? '' : '<option value="">ไม่มีทีม</option>'}${opt(l.team)}</select>`}</td>
      <td class="mu">${esc(l.forbid.join(', ') || '—')}</td>${l.drop ? '<td></td>' : st}</tr>`;
  }).join('') + (FILTER ? '' : gone.map(s => `<tr class="off"><td></td><td class="k">${esc(s.loc)}</td><td>${esc(s.why)}</td><td class="mu">${esc(tName(s.r1team))}</td>
      <td class="mu">${esc(tName(s.team))}</td><td class="mu">${esc(s.forbid.join(', ') || '—')}</td><td class="mu">หลุดเกณฑ์ (บันทึกใหม่จะเอาออก)</td></tr>`).join(''));

  return `${band}
    <div class="st-bar"><span class="st-lbl">นับซ้ำ</span>${gchips}
      <span class="st-lbl">ต่าง ≥</span><input class="st-num" id="r2Min" type="number" min="0" step="1" value="${esc(o.minQty)}" ${closed ? 'disabled' : ''} aria-label="ต่างกันกี่ชิ้นขึ้นไปถึงนับซ้ำ">
      <span class="st-lbl">นับทั้งแถวเมื่อ Audit ไม่ตรง ≥</span><input class="st-num" id="r2Hot" type="number" min="0" max="100" step="5" value="${esc(o.hotPct)}" ${closed ? 'disabled' : ''} aria-label="เปอร์เซ็นต์ที่ Audit ไม่ตรงในแถว"><span class="st-lbl">%</span>
      <span class="st-lbl">สุ่ม ≥</span><input class="st-num" id="r2HotMin" type="number" min="1" step="1" value="${esc(o.hotMin)}" ${closed ? 'disabled' : ''} aria-label="Audit ต้องสุ่มอย่างน้อยกี่โล"><span class="st-lbl">โล</span>
    </div>
    ${hot ? `<div class="st-bar"><span class="st-lbl">Audit ไม่ตรงในแถว</span>${hot}</div>` : ''}
    ${p.warn.length ? `<div class="st-warn">${p.warn.slice(0, 5).map(esc).join('<br>')}${p.warn.length > 5 ? `<br>และอีก ${p.warn.length - 5} ข้อ` : ''}</div>` : ''}
    <div class="st-bar">
      ${chip('', 'นับซ้ำ', f(picked.length))}${teamChips}
      ${leftN ? chip('left', 'ยังไม่นับ', f(leftN), 'red') : ''}
      ${dropN ? chip('drop', 'ตัดออก', f(dropN)) : ''}
      <span class="sp"></span>
      ${closed ? '' : '<input class="st-add" id="r2Add" placeholder="+ โล เช่น R1-07-01" aria-label="เพิ่มโลที่ต้องนับซ้ำ">'}
    </div>
    <div class="st-wrap"><table class="st-xl"><thead><tr><th></th><th>Location</th><th>เหตุผล</th><th>ทีมรอบ 1</th><th>ไปนับรอบ 2</th><th>ห้ามนับ</th><th>รอบ 2</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="mu">${p.locs.length ? 'ไม่มีโลตามที่กรอง' : 'ไม่มีโลที่ต้องนับซ้ำตามเกณฑ์นี้'}</td></tr>`}</tbody></table></div>
    ${show.length > AN_LIMIT ? `<div class="st-note">แสดง ${AN_LIMIT} จาก ${f(show.length)} โล — กดชิปเพื่อกรอง</div>` : ''}
    ${pr.extra.length ? `<div class="st-note">นับรอบ 2 นอกแผน (ไม่เอามาคิด): ${pr.extra.map(esc).join(', ')}</div>` : ''}
    ${closed ? '' : `<div class="st-save"><span>${changed ? '<b>แผนเปลี่ยน ยังไม่บันทึก</b>' : saved.length ? `บันทึกแล้ว ${esc(r.settings.planAt || '')}` : 'ยังไม่ได้บันทึกแผน'}</span><span class="sp"></span>
      ${changed && saved.length ? '<button class="st-btn" data-act="r2-undo">กลับไปแผนที่บันทึก</button>' : ''}
      <button class="st-btn p" data-act="plan-save" ${S.busy || !picked.length ? 'disabled' : ''}>บันทึกแผน ${f(picked.filter(l => l.team).length)} โล</button></div>`}`;
}

function r2Set(fn) {
  const d = r2Draft();
  fn(d.opts);
  d.opts = ST.r2Opts(d.opts);
  paintBody();
}

function addR2(list) {
  if (!list.length) return;
  r2Set(o => {
    list.forEach(l => {
      if (!o.add.includes(l)) o.add.push(l);
      o.drop = o.drop.filter(x => x !== l);
    });
  });
  TOAST = '';
}

async function savePlan() {
  const p = planNow();
  const rows = ST.planRows(p);
  if (!rows.length) { S.err = 'ไม่มีโลในแผน'; paintSrc(); return; }
  const noTeam = p.locs.filter(l => !l.drop && !l.team).length;
  if (noTeam && !confirm(`มี ${noTeam} โลที่ยังไม่มีทีม จะไม่อยู่ในแผน บันทึกต่อไหม?`)) return;
  await job('กำลังบันทึกแผนรอบ 2…', async () => {
    const res = await post({ op: 'st-plan', round: S.rid, plan: rows, opts: r2Draft().opts });
    S.head = await get('st-head', { round: S.rid });
    R2D = null;
    S.ok = `✓ บันทึกแผนรอบ 2 แล้ว ${f(res.plan.length)} โล${res.added ? ` · เพิ่มโลใหม่ในรายการ ${res.added}` : ''}`;
  });
}

/* ── แท็บปิดรอบ: ยอดสุดท้าย หัวหน้าแก้ได้ อนุมัติแล้วได้ไฟล์ปรับยอด ── */

function analysis2() {
  const plan = planSaved();
  if (!plan.length) return null;
  if (AN2 && AN2.head === S.head && AN2.n === S.log.length && AN2.since === S.since) return AN2.res;
  const locs = plan.map(x => x.loc);
  const res = ST.analyze({ piles: S.head.piles, entries: S.log, teams: S.head.teams, locs: locs.map(loc => ({ loc })), skus: S.head.skus, pass: 2, only: locs });
  AN2 = { head: S.head, n: S.log.length, since: S.since, res };
  return res;
}
function editKey() { return 'wms:st:edit:' + S.rid; }
function edits() {
  if (!EDITS || EDITS.rid !== S.rid) {
    let map = {};
    try { map = JSON.parse(load(editKey()) || '{}') || {}; } catch (e) { map = {}; }
    EDITS = { rid: S.rid, map };
  }
  return EDITS.map;
}
function setEdit(id, v) {
  const m = edits();
  if (v === null) delete m[id]; else m[id] = v;
  save(editKey(), JSON.stringify(m));
}
function finals() { return ST.finalLines(analysis(), analysis2(), planSaved(), edits()); }

/** แถวผลสรุปที่เก็บตอนปิดรอบ → หน้าตาเดียวกับ finalLines ไว้วาดตาราง (อ่านอย่างเดียว) */
function fromSum(r, i) {
  const n = (v) => (v === '' || v === null || v === undefined ? null : +v);
  const src = (String(r[13]).match(/^ยอดจาก(\S+ ?\d?)/) || [])[1] || '';
  return { id: 's' + i, loc: r[0], sku: r[1], long: r[2], name: r[3], lot: r[4], po: r[5], book: +r[6] || 0, r1: n(r[7]), aud: n(r[8]), r2: n(r[9]),
    final: +r[10] || 0, adj: +r[11] || 0, group: r[12], note: r[13], src: src.trim(),
    flag: Object.values(ST.FLAG).find(x => String(r[13]).includes(' · ' + x)) || '', teamText: r[14], whoText: r[15] };
}

function closeView() {
  const r = R();
  if (!after1()) return `<div class="st-empty">ปิดรับนับรอบ 1 ก่อน แล้วค่อยตรวจยอดสุดท้าย<br><button class="st-btn" data-go="analyze">ไปแท็บวิเคราะห์</button></div>`;
  const closed = r.status === 'ปิดแล้ว';
  const fin = closed ? (S.head.sum || []).map(fromSum) : finals();
  const t = ST.finalTotals(fin);
  const ed = closed ? {} : edits();
  const T = analysis().teamName;
  const chip = (key, label, val, cls) => `<button class="st-chip ${cls || ''} ${FILTER === key ? 'on' : ''}" data-filter="${esc(key)}">${esc(label)} <b>${val}</b></button>`;
  const q = ST.up(AQ);
  const list = fin.filter(l => {
    if (FILTER === 'all') { /* ทุกรายการ */ }
    else if (FILTER === 'ok') { if (l.adj) return false; }
    else if (FILTER.startsWith('s:')) { if (l.src !== FILTER.slice(2)) return false; }
    else if (FILTER.startsWith('f:')) { if (l.flag !== FILTER.slice(2)) return false; }
    else if (!l.adj && !l.flag && l.src !== ST.SRC.EDIT) return false;
    return !q || ST.up(l.loc).includes(q) || ST.up(l.sku).includes(q) || ST.up(l.long).includes(q) || ST.up(l.name).includes(q);
  });
  const cell = (v) => (v === null || v === undefined ? '' : f(v));
  const rows = list.slice(0, AN_LIMIT).map(l => {
    const open = OPEN.has('c:' + l.id);
    const edited = !closed && l.src === ST.SRC.EDIT;
    const fcell = closed ? `<td class="num k">${f(l.final)}</td>`
      : `<td><input class="st-in num ${edited ? 'ed' : ''}" data-edit="${esc(l.id)}" value="${esc(l.final)}" inputmode="decimal" aria-label="ยอดสุดท้าย ${esc(l.loc)} ${esc(l.sku)}"></td>`;
    const who = closed ? `${esc(l.teamText || '—')} · ${esc(l.whoText || '—')}`
      : `${l.who2 && l.who2.length ? `รอบ 2: ${esc(T[l.team2] || l.team2)} · ${esc(l.who2.join(', '))} · ` : ''}รอบ 1: ${esc(T[l.team] || l.team || '—')} · ${esc((l.who || []).join(', ') || '—')}`;
    return `<tr><td><span class="st-g ${GCLS[l.group] || ''}">${esc(l.group)}</span>${l.flag ? `<span class="st-flag">${esc(l.flag)}</span>` : ''}</td>
      <td class="k">${esc(l.loc)}</td><td>${esc(l.sku)}</td><td class="mu">${esc(l.name)}</td><td>${esc(l.lot)}</td><td>${esc(l.po)}</td>
      <td class="num">${f(l.book)}</td><td class="num">${cell(l.r1)}</td><td class="num">${cell(l.aud)}</td><td class="num">${cell(l.r2)}</td>
      ${fcell}<td class="num ${l.adj < 0 ? 'neg' : l.adj > 0 ? 'pos' : ''}">${l.adj ? signed(l.adj) : ''}</td><td class="mu">${esc(l.src)}</td>
      <td><button class="st-i ${open ? 'on' : ''}" data-open="c:${esc(l.id)}" aria-label="รายละเอียด ${esc(l.loc)} ${esc(l.sku)}">i</button></td></tr>` +
      (open ? `<tr class="info"><td colspan="14">${closed ? esc(l.note) : `<b>ยอดจาก${esc(l.src)}</b>${l.flag ? ' · ' + esc(l.flag) : ''}${edited ? ` · ระบบคิดได้ ${f(l.auto)} <button class="st-btn" data-unedit="${esc(l.id)}">ใช้ค่าระบบ</button>` : ''}${l.note ? '<br>' + esc(l.note) : ''}`}
        <br>${who}${l.sku && !closed ? ledgerHtml(l) : ''}</td></tr>` : '');
  }).join('');
  const sc = (s) => (t.src[s] ? chip('s:' + s, s, f(t.src[s]), s === ST.SRC.EDIT ? 'amber' : '') : '');
  const fc = (x, cls) => (t.flag[x] ? chip('f:' + x, x, f(t.flag[x]), cls) : '');
  const band = closed
    ? `<div class="st-done">ปิดรอบแล้ว · อนุมัติโดย <b>${esc(r.approvedBy)}</b> เมื่อ ${esc(r.approvedAt)} · ${f(t.lines)} รายการ ต้องปรับ ${f(t.adjLines)} · แอปไม่ได้แก้สมุด ลงปรับยอดตามไฟล์ Excel</div>`
    : r.status === 'นับรอบ 2' ? `<div class="st-warn">ยังเปิดนับรอบ 2 อยู่ ตัวเลขยังเปลี่ยนได้ · <button class="st-btn" data-go="round2">ดูรอบ 2</button></div>`
    : !planSaved().length ? '<div class="st-note" style="margin:0 0 8px">ไม่มีแผนรอบ 2 — ยอดสุดท้ายใช้ผลรอบ 1 · ⓘ ดูคนนับ แก้ตัวเลขในช่องยอดสุดท้ายได้</div>' : '';
  return `${band}<div class="st-tot">
      <span>สมุด <b>${f(t.book)}</b></span><span>ยอดสุดท้าย <b>${f(t.final)}</b></span>
      <span>ปรับเพิ่ม <b>+${f(t.plus)}</b></span><span>ปรับลด <b>−${f(t.minus)}</b></span><span>สุทธิ <b>${signed(t.net)}</b></span><span class="sp"></span>
      <button class="st-btn" data-act="xlsx" ${S.busy ? 'disabled' : ''}>Excel ปรับยอด${closed ? '' : ' (ร่าง)'}</button>
    </div>
    <div class="st-bar">
      ${chip('', 'ต้องดู', f(fin.filter(l => l.adj || l.flag || l.src === ST.SRC.EDIT).length), 'red')}

async function closeRound() {
  const name = ($('apName') && $('apName').value.trim()) || '';
  if (!name) { S.err = 'ใส่ชื่อคนอนุมัติก่อน'; paintSrc(); if ($('apName')) $('apName').focus(); return; }
  const fin = finals();
  const t = ST.finalTotals(fin);
  const warn = [];
  if (R().status === 'นับรอบ 2') warn.push('ยังเปิดนับรอบ 2 อยู่ ปิดแล้วเครื่องที่ค้างส่งจะส่งไม่ได้');
  if (t.flag[ST.FLAG.WAIT]) warn.push(`ค้างรอบ 2 ${f(t.flag[ST.FLAG.WAIT])} รายการ (ใช้ยอดรอบ 1)`);
  if (t.flag[ST.FLAG.NONE]) warn.push(`ไม่ได้นับ ${f(t.flag[ST.FLAG.NONE])} รายการ (ใช้ยอดสมุด)`);
  if (!confirm(`อนุมัติยอดสุดท้ายและปิดรอบ?\n\nผู้อนุมัติ: ${name}\n${f(t.lines)} รายการ · ต้องปรับ ${f(t.adjLines)}\nปรับเพิ่ม +${f(t.plus)} · ปรับลด −${f(t.minus)} · สุทธิ ${signed(t.net)}\n` +
    (warn.length ? '\n⚠ ' + warn.join('\n⚠ ') + '\n' : '') + '\nปิดแล้วแก้ไม่ได้ คนนับส่งผลไม่ได้อีก')) return;
  await job('กำลังปิดรอบ…', async () => {
    const res = await post({ op: 'st-close', round: S.rid, approver: name, lines: ST.closeRows(fin, analysis().teamName), totals: t });
    S.head = await get('st-head', { round: S.rid });
    S.rounds = (await get('st-rounds')).rounds;
    S.ok = `✓ ปิดรอบแล้ว อนุมัติโดย ${res.round.approvedBy} · ${f(res.saved)} รายการ — โหลด Excel ปรับยอดได้เลย`;
  });
}

function xlsxLib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSX_LOAD) {
    XLSX_LOAD = new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = () => ok(window.XLSX);
      s.onerror = () => { XLSX_LOAD = null; bad(new Error('โหลดตัวสร้างไฟล์ Excel ไม่ได้ ลองใหม่อีกครั้ง')); };
      document.head.appendChild(s);
    });
  }
  return XLSX_LOAD;
}

/** สามชีต: ปรับยอด · จับคู่ย้ายโล/แก้ LOT · สรุป (ปิดแล้วใช้ผลสรุปที่อนุมัติ ยังไม่ปิด = ร่างจากตัวเลขตอนนี้) */
async function downloadXlsx() {
  const r = R();
  const closed = r.status === 'ปิดแล้ว';
  const rows = closed ? (S.head.sum || []) : ST.closeRows(finals(), analysis().teamName);
  await job('กำลังสร้างไฟล์ Excel…', async () => {
    const X = await xlsxLib();
    const wb = X.utils.book_new();
    ST.adjustBook(rows, { id: r.id, name: r.name, date: r.date, cutoff: r.cutoff, approvedBy: closed ? r.approvedBy : '', approvedAt: closed ? r.approvedAt : '' }).forEach(sh => {
      const ws = X.utils.aoa_to_sheet(sh.aoa);
      ws['!cols'] = sh.cols.map(w => ({ wch: w }));
      if (sh.aoa.length > 1 && sh.aoa[0].length > 2) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: sh.aoa.length - 1, c: sh.aoa[0].length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, sh.name);
    });
    X.writeFile(wb, `ปรับยอด-${r.id}${closed ? '' : '-ร่าง'}.xlsx`);
    S.ok = closed ? '✓ โหลด Excel ปรับยอดแล้ว' : '✓ โหลด Excel ร่างแล้ว (ยังไม่อนุมัติ)';
  });
}

/* ── แท็บรายงาน: สรุปปิดรอบหน้าเดียวให้เจ้านาย พิมพ์ / PDF / รูปส่ง LINE ──
   ปิดรอบแล้วใช้ยอดที่อนุมัติ ยังไม่ปิด = ร่างจากตัวเลขตอนนี้ (ตัวเลขเดียวกับแท็บปิดรอบ รวมที่หัวหน้าแก้)
   ราคาต่อชิ้นไม่มีในสมุด หัวหน้าวางจาก Excel เอง เก็บในเครื่องนี้ ใช้ได้ทุกรอบ ไม่มีราคา = ไม่ขึ้นมูลค่า */

const PRICE_KEY = 'wms:st:price';
let PRICE_OPEN = false;
let RP = null;   // รายงานที่คิดไว้ คิดใหม่เมื่อข้อมูลรอบ บันทึกนับ ตัวเลขที่แก้ หรือราคาเปลี่ยน

function prices() {
  try { const p = JSON.parse(load(PRICE_KEY) || '{}'); return p && p.map ? p : { map: {}, at: '' }; }
  catch (e) { return { map: {}, at: '' }; }
}
function setPrices(map) { save(PRICE_KEY, JSON.stringify({ map, at: new Date().toISOString() })); RP = null; }
/** วางราคาเพิ่ม: SKU เดิมใช้ราคาใหม่ SKU อื่นเก็บไว้เหมือนเดิม */
function addPrices(text) {
  const p = ST.parsePrices(text);
  if (p.n) setPrices({ ...prices().map, ...p.map });
  return p;
}

function report() {
  const r = R(), closed = r.status === 'ปิดแล้ว', pm = prices();
  const ed = closed ? '' : JSON.stringify(edits());
  if (RP && RP.head === S.head && RP.n === S.log.length && RP.since === S.since && RP.closed === closed && RP.at === pm.at && RP.ed === ed && RP.trc === TRC) return RP.rep;
  const fin = closed ? (S.head.sum || []).map(fromSum) : finals();
  const rep = ST.closeReport({ lines: fin, entries: S.log, teams: S.head.teams, prices: { ...trcCost(), ...pm.map }, top: 10 });
  RP = { head: S.head, n: S.log.length, since: S.since, closed, at: pm.at, ed, rep, trc: TRC };
  return rep;
}
/** ราคาทุนจากแท็บ ราคาทุน ในชีตสต๊อก (stock-api) ถ้าโหลดแล้ว */
function trcCost() { return (TRC && TRC.data && TRC.data.cost) || {}; }

const pctText = (v) => (v === null || v === undefined ? '—' : v + '%');
const lvlOf = (v) => (v === null || v === undefined ? 'none' : v >= 98 ? 'good' : v >= 95 ? 'mid' : 'bad');
const baht = (v) => (v < 0 ? '−' : v > 0 ? '+' : '') + '฿' + Math.abs(Math.round(v)).toLocaleString('en-US');
const cutText = (s) => String(s || '').replace('T', ' ');
function durText(min) { if (!min) return '—'; const h = Math.floor(min / 60), m = min % 60; return h ? `${h} ชม.${m ? ` ${m} นาที` : ''}` : `${m} นาที`; }
function dt(ms) { return ms ? new Date(ms).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '—'; }
function rangeText(a, b) { if (!a) return '—'; return new Date(a).toDateString() === new Date(b).toDateString() ? `${dt(a)}–${hm(b)}` : `${dt(a)} – ${dt(b)}`; }

        <td class="num">${f(t.locs)}</td>${V ? `<td class="num mu">${t.price === null ? 'ไม่มีราคา' : f(t.price)}</td><td class="num k ${nc(t.val)}">${t.price === null ? '—' : baht(t.val)}</td>` : ''}</tr>`).join('')}
      </tbody></table></div></div>` : '';

  const foot = `<div class="rp-foot">ความแม่นยำคิดเฉพาะรายการที่มีคนนับ ·
      <b>Location</b> = โลที่ทุกรายการตรงสมุด · <b>SKU</b> = รวมทุกโลแล้วยอดตรง (ของวางผิดโลหักกันได้) ·
      <b>ยอดตรง</b> = 1 − ชิ้นที่ต่าง (ไม่สนบวกลบ) ÷ ชิ้นในสมุด · <b>นับครั้งแรกถูก</b> = รอบ 1 ตรงกับยอดสุดท้าย ·
      สี: เขียว ≥ 98% เหลือง 95–98% แดง &lt; 95% · แอปไม่ได้แก้สมุด ลงปรับยอดตามไฟล์ Excel ปรับยอด ·
      ทำรายงานเมื่อ ${esc(new Date().toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }))}</div>`;

  return `${tools}${price}<div class="rp-page" id="rpPage">${head}${kpi}${sum}
    <div class="rp-grid"><div class="rp-sec"><h3>ปัญหาที่เจอ <small>รายการที่ต้องปรับ แยกตามสาเหตุ</small></h3>${groups}</div>

/* ── แท็บกระทบ TRcloud: ปรับ WH-02 / WH-QA ให้เท่ายอดนับ ส่วนต่างโอนไป-กลับ WH-Loss ──
   ยอด TRcloud จากชีตสต๊อก (stock-api.gs ?api=stock-all: แท็บ Stock, WH-Loss, ราคาทุน) แอปไม่แก้ TRcloud เอง
   ไฟล์แบบเดียวกับ TRcloud เทียบ Report ในหน้าเช็คตัดสต๊อก ลงได้ทันที */

let TRC = null;        // {data: trcParse, at, err}
let TRC_BUSY = false;
let TRR = null;        // ผลเทียบที่คิดไว้
const T3CLS = { 'ตรง': 'ok', 'ย้าย QA ↔ WH-02': 'moved', 'เจอของที่เคยหาย': 'over', 'หายเพิ่ม': 'short', 'เกินเพิ่ม': 'typo',
  'หักกับที่เคยเกิน': 'audit', 'ไม่มีในไฟล์ TRcloud': 'lotpo', 'ไม่เจอในคลัง': 'short' };

async function loadTrc() {
  const url = WmsSettings.stockUrl();
  if (!url) throw new Error('ยังไม่มี URL สต๊อกในหน้าตั้งค่า');
  const json = await WmsGas.json(url, 'stock-all', { retries: 1 });
  TRC = { data: ST.trcParse(json), at: Date.now() };
  return TRC;
}
/** โหลดสต๊อก TRcloud เบื้องหลังครั้งแรก (แท็บกระทบ TRcloud กับราคาทุนในแท็บรายงาน) */
function trcNeed() {
  if (TRC || TRC_BUSY || !WmsSettings.stockUrl()) return;
  TRC_BUSY = true;
  loadTrc().catch(e => { TRC = { data: null, at: Date.now(), err: e.message }; })
    .finally(() => { TRC_BUSY = false; if (TAB === 'trc' || TAB === 'report') paintBody(); });
}

function trcRes() {
  const r = R(), closed = r.status === 'ปิดแล้ว', ed = closed ? '' : JSON.stringify(edits()), pm = prices();
  if (TRR && TRR.head === S.head && TRR.n === S.log.length && TRR.since === S.since && TRR.closed === closed && TRR.ed === ed
    && TRR.trc === TRC && TRR.fifo === FIFO && TRR.pat === pm.at) return TRR.res;
  const res = ST.trcRecon({ lines: opFinals(), trc: TRC.data, convert: FIFO && FIFO.data ? FIFO.data.convert : null, prices: pm.map,
    date: String(r.cutoff || r.date || '').slice(0, 10), ref: r.id });
  TRR = { head: S.head, n: S.log.length, since: S.since, closed, ed, trc: TRC, fifo: FIFO, pat: pm.at, res };
  return res;
}

function trcView() {
  const r = R();

  if (!WmsSettings.stockUrl()) return '<div class="st-empty">ต้องใช้ยอด TRcloud จากชีตสต๊อก (stock-api)<br>ใส่ <b>URL สต๊อก</b> ในหน้าตั้งค่าก่อน</div>';

  const warn = d.v < 3 ? `<div class="st-warn"><b>stock-api.gs ยังเป็นรุ่นเก่า</b> อ่านแท็บ WH-Loss กับ ราคาทุน ไม่ได้ · เปิดชีตสต๊อก › ส่วนขยาย › Apps Script › วางไฟล์ stock-api.gs ล่าสุดทับ › ทำให้ใช้งานได้ › จัดการ › แก้ไข › เวอร์ชันใหม่</div>`
    : !d.loss ? '<div class="st-warn"><b>ไม่เจอแท็บ WH-Loss ในชีตสต๊อก</b> — ยังหักลบกับของในคลัง Loss ไม่ได้ (ถือว่า Loss เป็น 0) · เพิ่มแท็บชื่อ WH-Loss (SKU กับยอดคงเหลือจาก TRcloud) แล้วกดโหลดใหม่</div>' : '';
  const wh = (w) => { const x = t.wh[w]; return `<b>${x.plus ? '+' + f(x.plus) : '0'}</b>${x.minus ? ` <b class="neg">−${f(x.minus)}</b>` : ''}`; };
  const money = (v) => '฿' + Math.round(v).toLocaleString('en-US');

    const a02 = adjOf(x, ST.WH.MAIN), aqa = adjOf(x, ST.WH.QA);
    const parts = [];
    if (x.found) parts.push(`เจอของที่เคยหาย ${f(x.found)}`);
    if (x.back) parts.push(`หักกับที่เคยเกิน ${f(x.back)}`);

      <td class="num mu">${x.loss ? f(x.loss) : ''}</td><td class="num">${sg(a02)}</td><td class="num">${sg(aqa)}</td>
      <td class="num ${x.lossAfter < 0 ? 'neg' : ''}">${x.loss || x.lossAfter ? f(x.lossAfter) : ''}</td>

        ${parts.length ? '<br><b>WH-Loss:</b> เดิม ' + f(x.loss) + ' · ' + parts.join(' · ') + ' · หลังปรับ ' + f(x.lossAfter) : ''}
        <br><b>นับได้:</b> ${x.locs.map(l => `${esc(l.loc)} ${f(l.qty)}${l.wh === ST.WH.QA ? ' (QA)' : ''}`).join(', ') || 'ไม่เจอในคลัง'}
        ${x.conv.length ? `<br>นับเป็น ${esc(x.conv.join(', '))} (SKU แปลง) รวมเข้า SKU ตอนซื้อตาม MASTER แปลงสินค้า` : ''}
        ${!x.inTrc ? '<br><b>ไม่มีในไฟล์ TRcloud</b> — เช็ครหัสใน TRcloud ก่อนลง ถ้ารหัสไม่มีจริง ลงไม่ได้' : ''}
        ${x.price !== null && x.toLoss ? `<br>ราคาทุน ${f(x.price)} · มูลค่าเข้า Loss ${money(x.toLoss * x.price)}` : ''}</td></tr>` : '');
  }).join('');
  const intRows = showInt ? k.internal.filter(i => !q || ST.up(i.sku).includes(q) || ST.up(i.name).includes(q)).map(i =>
    `<tr><td class="k">${esc(i.sku)}</td><td class="mu">${esc(i.name)}</td><td class="num">${f(i.qty)}</td><td class="mu">${esc(i.locs.map(l => l.loc + ' ' + f(l.qty)).join(', '))}</td></tr>`).join('') : '';
  const g = (x) => (t.g[x] ? chip('g:' + x, x, f(t.g[x]), T3CLS[x] === 'short' ? 'red' : T3CLS[x] === 'ok' ? 'green' : 'amber') : '');
  const table = showInt
    ? `<div class="st-wrap"><table class="st-xl"><thead><tr><th>SKU</th><th>ชื่อ</th><th class="num">นับได้</th><th>Location</th></tr></thead>
        <tbody>${intRows || '<tr><td colspan="4" class="mu">ไม่มี</td></tr>'}</tbody></table></div>
        <div class="st-note">รหัสที่มีตัวอักษรไทยและไม่มีใน TRcloud = ของใช้ภายใน ไม่เทียบ ไม่ลง TRcloud (ยังลงสมุดใหม่ตามยอดนับ)</div>`
    : `<div class="st-wrap"><table class="st-xl"><thead><tr><th>SKU</th><th>ชื่อ</th><th class="num">นับ WH-02</th><th class="num">TRcloud</th>
        <th class="num">นับ QA</th><th class="num">TRcloud</th><th class="num">Loss เดิม</th><th class="num">ปรับ WH-02</th><th class="num">ปรับ QA</th>
        <th class="num">Loss หลัง</th><th>กลุ่ม</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="12" class="mu">${k.items.length ? 'ไม่มีรายการตามที่กรอง' : 'ยังไม่มียอด'}</td></tr>`}</tbody></table></div>
        ${list.length > AN_LIMIT ? `<div class="st-note">แสดง ${AN_LIMIT} จาก ${f(list.length)} SKU — กดชิปหรือค้นหาเพื่อกรอง (Excel มีครบ)</div>` : ''}`;
  return `${band}${warn}
    <div class="st-tot">

    </div>
    <div class="st-bar">
      ${chip('', 'ต้องปรับ', f(t.adj), 'red')}${chip('all', 'ทั้งหมด', f(t.skus))}

      ${k.internal.length ? chip('int', 'ของใช้ภายใน', f(k.internal.length)) : ''}
      <span class="sp"></span><input class="st-q" id="anQ" placeholder="ค้นหา SKU / ชื่อ / โล" value="${esc(AQ)}" aria-label="ค้นหาในกระทบ TRcloud">

}

async function downloadTrc() {
  const r = R(), closed = r.status === 'ปิดแล้ว';
  if (!TRC || !TRC.data) return;
  const d = TRC.data;
  if (!d.loss && !confirm('ไม่มียอด WH-Loss (แท็บ WH-Loss ในชีตสต๊อก หรือสคริปต์รุ่นเก่า)\nไฟล์จะไม่ได้หักลบกับของในคลัง Loss — ถือว่า Loss เป็น 0\n\nโหลดไฟล์ต่อไหม?')) return;
  const k = trcRes();
  await job('กำลังสร้างไฟล์ Excel…', async () => {
    const X = await xlsxLib();
    const wb = X.utils.book_new();
    ST.trcBook(k, {
      id: r.id, name: r.name, date: String(r.cutoff || r.date || '').slice(0, 10), cutoff: r.cutoff,
      approvedBy: closed ? r.approvedBy : '', approvedAt: closed ? r.approvedAt : '',
      trcAt: new Date(TRC.at).toLocaleString('th-TH'), tabs: d.tabs, noLoss: !d.loss,
    }).forEach(sh => {
      const ws = X.utils.aoa_to_sheet(sh.aoa);
      ws['!cols'] = sh.cols.map(w => ({ wch: w }));
      if (sh.name !== 'TRcloud' && sh.aoa.length > 1 && sh.aoa[0].length > 2) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: sh.aoa.length - 1, c: sh.aoa[0].length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, sh.name);
    });
    X.writeFile(wb, `ลงTRcloud-นับสต๊อก-${r.id}${closed ? '' : '-ร่าง'}.xlsx`);
    S.ok = closed ? `✓ โหลด Excel ลง TRcloud แล้ว — ${f(k.rows.length)} แถว ลงจากชีต TRcloud` : '✓ โหลด Excel ร่างแล้ว (ยังไม่อนุมัติ ห้ามลง TRcloud)';
  });
}

/* ── แท็บตั้งต้นสมุด: ยอดที่นับได้เป็นยอดตั้งต้นของสมุด Transaction ใหม่ ──
   สำรองสมุดเดิม ลบแถวข้อมูล แล้ววางแถวจากไฟล์นี้ (Note "Stock Count Q4/26" กองละแถว) แอปไม่แตะสมุดเอง
   LOT/PO ที่ไม่รู้เติมจาก GR ล่าสุดในสมุดเดิม วันรับแรกของ PO พ่วงใน Note ให้หน้า FIFO เรียงต่อได้
   ตอนโหลด Excel เก็บแถวย่อไว้ในเครื่อง หลังวางสมุดใหม่ (แถว GR เดิมหายแล้ว คิดซ้ำไม่ได้) เช็คกับชุดนั้น */

const OP_KEY = 'wms:st:open:';   // + รหัสรอบ → {note, name, at, closed, rows: [[SKU, SKU เต็ม, '', LOT, PO, '', Location, จำนวน]]}
let OPR = null;     // แถวตั้งต้นที่คิดไว้
let OPCHK = null;   // ผลเช็คสมุดใหม่ {at, res, mode: 'file' | 'sku', file: {at, closed}, reset}

function opSaved() { try { return JSON.parse(load(OP_KEY + S.rid) || '{}') || {}; } catch (e) { return {}; } }
function opSet(o) { try { localStorage.setItem(OP_KEY + S.rid, JSON.stringify({ ...opSaved(), ...o })); return true; } catch (e) { return false; } }
function opNote() { return opSaved().note || ST.countLabel(R().date); }
function opName() { return opSaved().name || who(); }
/** สมุดที่อ่านมาตั้งต้นใหม่แล้วไหม: แถวสุดท้ายน้อยกว่าแถวตอนดึงยอดตั้งต้น = แถวเดิมถูกลบไปแล้ว */
function opReset(fifo) {
  const last = ((fifo && fifo.rows) || []).reduce((m, r) => Math.max(m, r[0]), 0);
  return !!(R().lastRow && last < R().lastRow);
}
function opFinals() { return R().status === 'ปิดแล้ว' ? (S.head.sum || []).map(fromSum) : finals(); }

function opening() {
  const closed = R().status === 'ปิดแล้ว', ed = closed ? '' : JSON.stringify(edits());
  const note = opNote(), name = opName();
  if (OPR && OPR.head === S.head && OPR.n === S.log.length && OPR.since === S.since && OPR.closed === closed && OPR.ed === ed
    && OPR.fifo === FIFO && OPR.note === note && OPR.name === name) return OPR.res;
  const res = ST.openingRows({ lines: opFinals(), fifo: FIFO.data, piles: S.head.piles, note, name });
  OPR = { head: S.head, n: S.log.length, since: S.since, closed, ed, fifo: FIFO, note, name, res };
  return res;
}

function opCheckHtml() {
  if (!OPCHK) return '';
  const c = OPCHK.res, at = new Date(OPCHK.at).toLocaleTimeString('th-TH');
  const by = OPCHK.mode === 'file' ? `เทียบกับไฟล์ที่โหลดเมื่อ ${dt(OPCHK.file.at)}${OPCHK.file.closed ? '' : ' <b>(ไฟล์ร่าง)</b>'}`
    : 'เทียบ Location × SKU กับยอดสุดท้าย (เครื่องนี้ไม่มีไฟล์ที่โหลดไว้ LOT/PO จึงไม่ได้เทียบ)';
  if (c.ok) return `<div class="st-done">✓ <b>สมุดใหม่ตรงกับยอดตั้งต้นทุกกอง</b> · ${f(c.rows)} แถวนับ · ${f(c.got)} ชิ้น · ${by} · เช็คเมื่อ ${at} — เปิดคลังได้</div>`;
  if (!OPCHK.reset) return `<div class="st-warn">สมุดยังเป็นของเดิม (แถวสุดท้ายยังเกินแถวตอนดึงยอดตั้งต้น ${f(R().lastRow)}) — ยังไม่ได้วาง หรือสำเนาที่หน้าเว็บอ่านยังไม่อัปเดต รอ 1–2 นาทีแล้วเช็คใหม่ · เช็คเมื่อ ${at}</div>`;
  const lim = 30;
  const rows = c.diff.slice(0, lim).map(d => `<tr><td class="k">${esc(d.loc)}</td><td>${esc(d.sku)}</td><td>${esc(d.lot)}</td><td>${esc(d.po)}</td>
    <td class="num">${f(d.want)}</td><td class="num">${f(d.got)}</td><td class="num ${d.got - d.want < 0 ? 'neg' : 'pos'}">${signed(d.got - d.want)}</td></tr>`).join('');
  return `<div class="st-warn"><b>สมุดใหม่ยังไม่ตรง</b> · ควรได้ ${f(c.want)} ชิ้น สมุดมี ${f(c.got)} ชิ้น (${f(c.rows)} แถวนับ) · ${by} · เช็คเมื่อ ${at}
      ${c.mixed ? `<br>มีแถวอื่น ${f(c.mixed)} แถวอยู่ก่อนแถวตั้งต้น (เริ่มแถว ${f(c.first)}) — ของเดิมยังลบไม่หมด หรือวางแทรกกลาง` : ''}
      ${!c.rows ? '<br>สมุดไม่มีแถว Stock Count เลย — ยังไม่ได้วางแถวตั้งต้น' : ''}</div>
    ${c.diff.length ? `<div class="st-wrap" style="margin-bottom:10px"><table class="st-xl"><thead><tr><th>Location</th><th>SKU</th><th>LOT</th><th>PO</th>
      <th class="num">ควรได้</th><th class="num">สมุดใหม่</th><th class="num">ต่าง</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${c.diff.length > lim ? `<div class="st-note">แสดง ${lim} จาก ${f(c.diff.length)} กองที่ไม่ตรง</div>` : ''}` : ''}`;
}

function openingView() {
  const r = R();
  if (!after1()) return `<div class="st-empty">ตั้งต้นสมุดได้หลังปิดรับนับรอบ 1<br><button class="st-btn" data-go="analyze">ไปแท็บวิเคราะห์</button></div>`;
  if (!WmsSettings.txUrl()) return '<div class="st-empty">ต้องอ่านสมุด Transaction เดิมเพื่อหาวันรับและ LOT/PO<br>ใส่ <b>URL Transaction</b> ในหน้าตั้งค่าก่อน</div>';
  if (!FIFO) {
    if (!FIFO_BUSY) {
      FIFO_BUSY = true;
      loadFifo(false).catch(() => { FIFO = { data: null, at: Date.now() }; }).finally(() => { FIFO_BUSY = false; if (TAB === 'opening') paintBody(); });
    }
    return '<div class="st-empty">⏳ กำลังอ่านสมุด Transaction…</div>';
  }
  if (!FIFO.data) return '<div class="st-empty">อ่านสมุดไม่ได้<br><button class="st-btn" data-act="op-fifo">ลองใหม่</button></div>';
  const closed = r.status === 'ปิดแล้ว', sv = opSaved();
  const checkBtn = `<button class="st-btn ${OPCHK && OPCHK.res.ok ? '' : 'p'}" data-act="op-check" ${S.busy ? 'disabled' : ''}>เช็คสมุดใหม่</button>`;

  /* วางสมุดใหม่แล้ว: แถว GR เดิมหายไป คิดแถวตั้งต้นซ้ำไม่ได้ เหลือแค่เช็ค */
  if (opReset(FIFO.data)) {
    return `<div class="st-done">สมุดถูกตั้งต้นใหม่แล้ว (แถวสุดท้ายตอนนี้น้อยกว่าแถวตอนดึงยอดตั้งต้น ${f(r.lastRow)}) ·
        ${sv.rows ? `เครื่องนี้มีไฟล์ที่โหลดเมื่อ ${dt(sv.at)} ${f(sv.rows.length)} แถว${sv.closed ? '' : ' (ร่าง)'}` : 'เครื่องนี้ไม่มีไฟล์ที่โหลดไว้ เช็คได้แค่ Location × SKU'}</div>
      <div class="st-tot"><span>กดเช็คหลังวางแถวตั้งต้นครบ ต้องขึ้น ✓ ก่อนเปิดคลัง</span><span class="sp"></span>${checkBtn}</div>${opCheckHtml()}`;
  }

  const o = opening(), t = o.tot;
  const fin = ST.finalTotals(opFinals());
  const mv = r.lastRow ? ST.movesAfter(FIFO.data, r.lastRow, r.cutoff) : [];
  const q = ST.up(AQ);
  const ix = o.rows.map((_, i) => i).filter(i => {
    const x = o.info[i], row = o.rows[i];
    if (FILTER === 'est' && x.kind !== 'est') return false;
    if (FILTER === 'left' && x.kind !== 'left') return false;
    if (FILTER === 'book' && x.src !== ST.SRC.BOOK) return false;
    if (FILTER === 'open' && !x.open) return false;
    return !q || [row[0], row[1], row[2], row[3], row[4], row[6]].some(v => ST.up(v).includes(q));
  });
  const chip = (key, label, val, cls) => `<button class="st-chip ${cls || ''} ${FILTER === key ? 'on' : ''}" data-filter="${esc(key)}">${esc(label)} <b>${val}</b></button>`;
  const cnt = (fn) => o.info.filter(fn).length;
  const body = ix.slice(0, AN_LIMIT).map(i => {
    const x = o.info[i], v = o.rows[i];
    const lp = x.kind === 'est' ? 'est' : x.kind === 'left' ? 'unk' : '';
    return `<tr><td class="mu num">${i + 2}</td><td class="k">${esc(v[0])}</td><td>${esc(v[1])}</td><td class="mu">${esc(v[2])}</td>
      <td class="${lp}">${esc(v[3])}</td><td class="${lp}">${esc(v[4])}</td><td></td><td class="k">${esc(v[6])}</td><td class="num">${f(v[7])}</td>
      <td>${esc(v[8])}</td><td class="nt" title="${esc(v[9])}">${esc(v[9])}</td><td>${esc(v[10])}</td><td class="mu">${esc(v[11])}</td></tr>`;
  }).join('');
  const sumOk = Math.abs(t.qty - (fin.final - t.neg.qty)) < 0.001;
  const band = closed
    ? `<div class="st-done">ยอดที่อนุมัติแล้ว · ${esc(r.approvedBy)} · ${esc(r.approvedAt)} — โหลด Excel แล้ววางตามชีต <b>วิธีวาง</b> ก่อนเปิดคลัง · แอปไม่แตะสมุดเอง</div>`
    : '<div class="st-warn"><b>ร่าง</b> — ยังไม่อนุมัติยอด ตัวเลขยังเปลี่ยนได้ ห้ามวางลงสมุดจริงจนกว่าจะอนุมัติและปิดรอบ</div>';
  const when = {};
  mv.forEach(m => { when[m.when || 'ไม่มีวันที่'] = (when[m.when || 'ไม่มีวันที่'] || 0) + 1; });
  const moves = mv.length ? `<div class="st-warn">สมุดเดิมมี <b>${f(mv.length)} แถวหลังดึงยอดตั้งต้น</b> (แถว ${f(mv[0].row)}${mv.length > 1 ? `–${f(mv[mv.length - 1].row)}` : ''} ·${Object.keys(when).map(k => `${esc(k)} ${f(when[k])}`).join(' · ')}) —
      ของที่ขยับหลังนับเสร็จ คัดลอกจากไฟล์สำรองมาต่อท้ายสมุดใหม่ · ระหว่างนับ ยอดนับรวมไว้แล้ว ไม่ต้องคัดลอก</div>` : '';
  return `${band}${moves}${opCheckHtml()}
    <div class="st-tot">
      <label>Note <input class="op-in" id="opNote" maxlength="60" value="${esc(opNote())}" aria-label="Note ของแถวตั้งต้น"></label>
      <label>NAME <input class="op-in nm" id="opName" maxlength="40" value="${esc(opName())}" aria-label="ชื่อในช่อง NAME"></label>
      <span>แถว <b>${f(t.rows)}</b></span><span>ชิ้น <b>${f(t.qty)}</b>${sumOk ? ' <span class="mu">= ยอดสุดท้าย ✓</span>' : ` <b class="neg">≠ ยอดสุดท้าย ${f(fin.final)}</b>`}</span>
      <span class="sp"></span>
      <button class="st-btn p" data-act="op-xlsx" ${S.busy || !t.rows ? 'disabled' : ''}>Excel ตั้งต้นสมุด${closed ? '' : ' (ร่าง)'}</button>${checkBtn}
    </div>
    ${/\bQ\s*[1-4]\s*[\/\-]\s*(\d{4}|\d{2})\b/i.test(opNote()) ? '' : `<div class="st-warn">Note ต้องมีรอบนับ เช่น <b>${esc(ST.countLabel(R().date))}</b> — กองที่ไม่รู้วันรับ แอปใช้ Q กับปีตรงนี้บอกปีของ LOT</div>`}
    ${t.neg.lines ? `<div class="st-note" style="margin:0 0 8px">ยอดติดลบ ${f(t.neg.lines)} รายการ (${f(t.neg.qty)} ชิ้น) ที่โลไม่ได้นับ ไม่ลงสมุดใหม่ = ถือเป็น 0</div>` : ''}
    <div class="st-bar">
      ${chip('', 'ทั้งหมด', f(t.rows))}
      ${chip('est', 'ประมาณ LOT/PO', `${f(cnt(x => x.kind === 'est'))} · ${f(t.est.qty)} ชิ้น`, 'amber')}
      ${t.est.left ? chip('left', 'ยังไม่รู้ LOT/PO', `${f(cnt(x => x.kind === 'left'))} · ${f(t.est.left)} ชิ้น`, 'red') : ''}
      ${t.book ? chip('book', 'ไม่ได้นับ (ยอดสมุด)', f(cnt(x => x.src === ST.SRC.BOOK)), 'red') : ''}
      ${chip('open', 'โลเปิด', `${f(t.open)} โล`)}
      <span class="sp"></span><input class="st-q" id="anQ" placeholder="ค้นหา โล / SKU / LOT / PO" value="${esc(AQ)}" aria-label="ค้นหาในแถวตั้งต้น">
    </div>
    <div class="st-wrap"><table class="st-xl"><thead><tr><th class="num">แถว</th>${ST.OPEN_HEAD.map(h => `<th${h === 'QTY' ? ' class="num"' : ''}>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${body || `<tr><td colspan="13" class="mu">${t.rows ? 'ไม่มีแถวตามที่กรอง' : 'ยังไม่มียอดสุดท้าย'}</td></tr>`}</tbody></table></div>
    ${ix.length > AN_LIMIT ? `<div class="st-note">แสดง ${AN_LIMIT} จาก ${f(ix.length)} แถว — กดชิปหรือค้นหาเพื่อกรอง (Excel มีครบทุกแถว)</div>` : ''}
    <div class="st-note">กองละแถว เป็นแถว <b>รับ</b> เข้า Location รับ · ช่องเหลือง = LOT/PO ที่ไม่มีป้าย เติมจาก GR ล่าสุดในสมุดเดิม (ของที่เหลือหลังขายแบบ FIFO คือของที่รับเข้าล่าสุด) ·
      ช่องแดง = GR ไม่พอ คง LOT/PO เดิม · วันรับแรกของ PO พ่วงใน Note (· GR dd-mm-yy) หน้า FIFO เรียง PO ต่อได้ · Status เปิด ตามโลเปิดตอนดึงยอดตั้งต้น</div>`;
}

async function downloadOpening() {
  const r = R(), closed = r.status === 'ปิดแล้ว';
  if (!FIFO || !FIFO.data || opReset(FIFO.data)) { S.err = 'สมุดถูกตั้งต้นใหม่แล้ว ทำไฟล์จากสมุดนี้ไม่ได้ (ไม่มีแถว GR เดิม) ใช้ไฟล์ที่โหลดไว้'; paintSrc(); return; }
  const o = opening(), fin = ST.finalTotals(opFinals());
  await job('กำลังสร้างไฟล์ Excel…', async () => {
    const X = await xlsxLib();
    const wb = X.utils.book_new();
    ST.openingBook(o, {
      id: r.id, name: r.name, date: r.date, cutoff: r.cutoff, approvedBy: closed ? r.approvedBy : '', approvedAt: closed ? r.approvedAt : '',
      note: opNote(), who: opName(), final: fin.final, lastRow: r.lastRow, moves: r.lastRow ? ST.movesAfter(FIFO.data, r.lastRow, r.cutoff) : [],
    }).forEach(sh => {
      const ws = X.utils.aoa_to_sheet(sh.aoa);
      ws['!cols'] = sh.cols.map(w => ({ wch: w }));
      if (sh.aoa.length > 1 && sh.aoa[0].length > 2) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: sh.aoa.length - 1, c: sh.aoa[0].length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, sh.name);
    });
    X.writeFile(wb, `ตั้งต้นสมุด-${r.id}${closed ? '' : '-ร่าง'}.xlsx`);
    const kept = opSet({ at: Date.now(), closed, rows: o.rows.map(x => [x[0], x[1], '', x[3], x[4], '', x[6], x[7]]) });
    S.ok = (closed ? '✓ โหลด Excel ตั้งต้นสมุดแล้ว — วางตามชีตวิธีวาง แล้วกดเช็คสมุดใหม่' : '✓ โหลด Excel ร่างแล้ว (ยังไม่อนุมัติ ห้ามวางลงสมุดจริง)')
      + (kept ? '' : ' · เก็บแถวไว้เช็คในเครื่องนี้ไม่ได้ (พื้นที่เต็ม) จะเช็คได้แค่ Location × SKU');
  });
}

/** อ่านสมุดสด แล้วเทียบแถวนับ (Stock Count) กับไฟล์ที่โหลดไว้ ไม่มีไฟล์ในเครื่อง = เทียบ Location × SKU กับยอดสุดท้าย */
async function checkOpening() {
  await job('กำลังอ่านสมุด Transaction…', async () => {
    const fifo = await loadFifo(true);
    const sv = opSaved(), reset = opReset(fifo);
    let rows, mode;
    if (sv.rows && sv.rows.length) { rows = sv.rows; mode = 'file'; }
    else if (!reset) { rows = opening().rows; mode = 'file'; sv.at = Date.now(); sv.closed = R().status === 'ปิดแล้ว'; }
    else { rows = opFinals().filter(l => l.final > 0).map(l => [l.sku, l.long, '', l.lot, l.po, '', l.loc, l.final]); mode = 'sku'; }
    const res = ST.openingCheck(fifo, rows, mode === 'sku');
    OPCHK = { at: Date.now(), res, mode, file: { at: sv.at, closed: sv.closed }, reset };
    if (res.ok) S.ok = '✓ สมุดใหม่ตรงกับยอดตั้งต้นทุกกอง'; else S.err = reset ? 'สมุดใหม่ยังไม่ตรงกับยอดตั้งต้น ดูรายการในแท็บ' : 'สมุดยังเป็นของเดิม ยังไม่ได้วางแถวตั้งต้น';
  });
}

/* ── รูปสรุปส่ง LINE: วาดลง canvas เป็น PNG (แบบเดียวกับหน้า MFG) คัดลอกไปวาง / แชร์จากมือถือ / โหลดเก็บ ── */

const CARD_W = 540, CARD_PAD = 26, CARD_SCALE = 2;   // กว้าง 540 วาดสองเท่า = รูป 1080 px คมบนมือถือ
const CARD_FONT = "'Inter','Noto Sans Thai',sans-serif";
/* รูปพื้นขาวเสมอ (ไม่ตามโหมดมืด) */
const CC = {
  text: '#0F172A', muted: '#64748B', faint: '#94A3B8', line: '#E2E8F0', pri: '#4F46E5', neg: '#B91C1C', pos: '#1D4ED8',
  good: ['#ECFDF5', '#047857'], mid: ['#FFFBEB', '#B45309'], bad: ['#FEF2F2', '#B91C1C'], none: ['#F1F5F9', '#334155'],
};
const GCOL = { short: ['#FEF2F2', '#B91C1C'], over: ['#EFF6FF', '#1D4ED8'], moved: ['#F5F3FF', '#6D28D9'], lotpo: ['#FFF7ED', '#C2410C'],
  typo: ['#FEF3C7', '#92400E'], left: ['#F1F5F9', '#475569'], audit: ['#ECFEFF', '#0E7490'], ok: ['#ECFDF5', '#047857'], edit: ['#FDF4FF', '#A21CAF'] };
let SHOT = null;   // รูปที่เปิดอยู่ {blob, file, url, name}

function cardFont(px, w) { return `${w || 400} ${px}px ${CARD_FONT}`; }

/** วาดรายงานลง canvas ขนาดพอดีเนื้อหา  k = closeReport  m = {name, date, cutoff, closed, by} */
function drawReport(k, m) {
  const W = CARD_W, P = CARD_PAD, IW = W - P * 2, H0 = 2600;
  const big = document.createElement('canvas');
  big.width = W * CARD_SCALE; big.height = H0 * CARD_SCALE;
  const c = big.getContext('2d');
  c.scale(CARD_SCALE, CARD_SCALE);
  c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, W, H0);
  c.textBaseline = 'top';
  const txt = (s, x, y, px, w, color, align) => {
    c.font = cardFont(px, w); c.fillStyle = color || CC.text; c.textAlign = align || 'left'; c.fillText(String(s), x, y);
    return c.measureText(String(s)).width;
  };
  const fit = (s, max, px, w) => {
    c.font = cardFont(px, w);
    let t = String(s == null ? '' : s);
    if (c.measureText(t).width <= max) return t;
    while (t.length > 1 && c.measureText(t + '…').width > max) t = t.slice(0, -1);
    return t + '…';
  };
  const box = (x, y, w, h, r, fill) => {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
    c.fillStyle = fill; c.fill();
  };
  const hr = (y) => { c.fillStyle = CC.line; c.fillRect(P, y, IW, 1); };
  const col = (n) => (n < 0 ? CC.neg : n > 0 ? CC.pos : CC.text);
  const V = k.value.has;

  c.fillStyle = CC.pri; c.fillRect(0, 0, W, 6);
  let y = 22;
  txt('สรุปนับสต๊อก', P, y, 22, 700);
  const st = m.closed ? 'อนุมัติแล้ว' : 'ร่าง ยังไม่อนุมัติ', [sb, sf] = m.closed ? CC.good : CC.mid;
  c.font = cardFont(12, 700);
  const sw = c.measureText(st).width + 20;
  box(W - P - sw, y + 4, sw, 24, 12, sb);
  txt(st, W - P - sw / 2, y + 9, 12, 700, sf, 'center');
  y += 34;
  txt(fit(m.name, IW, 15, 600), P, y, 15, 600);
  y += 23;
  txt(fit(`นับ ${m.date} · ตัดยอด ${m.cutoff}${m.closed && m.by ? ` · อนุมัติโดย ${m.by}` : ''}`, IW, 12), P, y, 12, 400, CC.muted);
  y += 28;

  /* สี่กล่องความแม่นยำ */
  const tiles = [
    ['ความแม่นยำ Location', k.acc.loc.pct, `ตรง ${f(k.acc.loc.ok)} / ${f(k.acc.loc.n)} โล`],
    ['ความแม่นยำ SKU', k.acc.sku.pct, `ตรง ${f(k.acc.sku.ok)} / ${f(k.acc.sku.n)} SKU`],
    ['ยอดตรง (ชิ้น)', k.acc.qty, `ต่าง ${f(k.acc.diff)} จาก ${f(k.acc.book)} ชิ้น`],
    k.first.checked ? ['นับครั้งแรกถูก', k.first.pct, `แก้หลังนับ ${f(k.first.n - k.first.ok)} รายการ`]
      : ['Audit ตรงกับ Inventory', k.audit.pct, k.audit.n ? `ตรง ${f(k.audit.ok)} / ${f(k.audit.n)} รายการที่สุ่ม` : 'ยังไม่มีผล Audit'],
  ];
  const gap = 10, tw = (IW - gap) / 2, th = 78;
  tiles.forEach(([lb, v, s], i) => {
    const x = P + (i % 2) * (tw + gap), yy = y + Math.floor(i / 2) * (th + gap);
    const [bg, fg] = CC[lvlOf(v)];
    box(x, yy, tw, th, 12, bg);
    txt(lb, x + 12, yy + 10, 12, 600, fg);
    txt(pctText(v), x + 12, yy + 27, 27, 700, fg);
    txt(fit(s, tw - 24, 11), x + 12, yy + 60, 11, 400, fg);
  });
  y += th * 2 + gap + 22;

  /* ยอดรวม */
  txt('ยอดรวม', P, y, 15, 700);
  txt(`ต้องปรับ ${f(k.tot.adjLines)} จาก ${f(k.tot.lines)} รายการ`, W - P, y + 3, 11, 400, CC.muted, 'right');
  y += 26;
  const cols = [['สมุด', f(k.tot.book), CC.text], ['นับได้', f(k.tot.final), CC.text], ['ขาด', '−' + f(k.tot.minus), CC.neg],
    ['เกิน', '+' + f(k.tot.plus), CC.pos], ['สุทธิ', signed(k.tot.net), col(k.tot.net)]];
  const cw = IW / cols.length;
  cols.forEach(([lb, v, cl], i) => { txt(lb, P + i * cw, y, 11, 400, CC.muted); txt(fit(v, cw - 6, 17, 700), P + i * cw, y + 15, 17, 700, cl); });
  y += 42;
  if (V) {
    txt('มูลค่า', P, y + 1, 11, 400, CC.muted);
    [[2, baht(-k.value.minus), CC.neg], [3, baht(k.value.plus), CC.pos], [4, baht(k.value.net), col(k.value.net)]]
      .forEach(([i, v, cl]) => txt(fit(v, cw - 6, 13, 700), P + i * cw, y, 13, 700, cl));
    y += 20;
    if (k.value.missing) { txt(`ไม่มีราคา ${f(k.value.missing)} SKU ที่ต่าง (ยังไม่รวมในมูลค่า)`, P, y, 11, 400, CC.muted); y += 18; }
  }
  y += 12;

  /* ปัญหาที่เจอ */
  if (k.groups.length) {
    txt('ปัญหาที่เจอ', P, y, 15, 700);
    y += 26;
    let x = P;
    k.groups.forEach(g => {
      const [bg, fg] = GCOL[GCLS[g.group]] || CC.none;
      const s = `${g.group} ${f(g.n)} · ${f(g.qty)} ชิ้น`;
      c.font = cardFont(12, 600);
      const w = c.measureText(s).width + 16;
      if (x > P && x + w > W - P) { x = P; y += 28; }
      box(x, y, w, 22, 11, bg);
      txt(s, x + 8, y + 4, 12, 600, fg);
      x += w + 6;
    });
    y += 40;
  }

  /* ตารางเล็ก: xs = [[x, align, กว้างสุด]] */
  const table = (title, note, head, rows, xs) => {
    txt(title, P, y, 15, 700);
    if (note) txt(note, W - P, y + 3, 11, 400, CC.muted, 'right');
    y += 26;
    head.forEach((h, i) => txt(h, xs[i][0], y, 11, 400, CC.muted, xs[i][1]));
    y += 18; hr(y);
    rows.forEach(r => {
      r.forEach((v, i) => {
        const cell = v && typeof v === 'object' ? v : { s: v };
        const w = cell.w || (i ? 400 : 600);
        txt(fit(cell.s, xs[i][2] || 120, 13, w), xs[i][0], y + 6, 13, w, cell.c || CC.text, xs[i][1]);
      });
      y += 26; hr(y);
    });
    y += 20;
  };

  if (k.zones.length) {
    const zs = k.zones.slice(0, 12);
    const xs = V
      ? [[P, 'left', 80], [P + 120, 'right'], [P + 185, 'right'], [P + 255, 'right'], [P + 320, 'right'], [P + 385, 'right'], [W - P, 'right', 96]]
      : [[P, 'left', 100], [P + 150, 'right'], [P + 230, 'right'], [P + 310, 'right'], [P + 390, 'right'], [W - P, 'right']];
    table('แยกตามโซน', k.zones.length > zs.length ? `แสดง ${zs.length} จาก ${k.zones.length} โซน` : '', ['โซน', 'โล', 'ตรง', 'ขาด', 'เกิน', 'สุทธิ'].concat(V ? ['มูลค่า'] : []),
      zs.map(z => [z.zone, f(z.locs), { s: pctText(z.pct), w: 700, c: CC[lvlOf(z.pct)][1] }, { s: z.minus ? '−' + f(z.minus) : '', c: CC.neg },
        { s: z.plus ? '+' + f(z.plus) : '', c: CC.pos }, { s: z.net ? signed(z.net) : '0', w: 700, c: col(z.net) }]
        .concat(V ? [{ s: z.val ? baht(z.val) : '—', c: col(z.val) }] : [])), xs);
  }

  if (k.teams.length) {
    const ts = k.teams.slice(0, 10);
    table('แยกตามทีม (รอบ 1)', k.first.checked ? 'ถูกครั้งแรก = รอบ 1 ตรงยอดสุดท้าย' : 'ยังไม่มีรอบ 2 ให้เทียบ', ['ทีม', 'คน', 'โล', 'โล/ชม.', 'ถูกครั้งแรก'],
      ts.map(t => [t.name, f(t.people.length), f(t.locs), t.pace === null ? '—' : f(t.pace), { s: pctText(t.first), w: 700, c: CC[lvlOf(t.first)][1] }]),
      [[P, 'left', 180], [P + 230, 'right'], [P + 290, 'right'], [P + 370, 'right'], [W - P, 'right']]);
  }

  if (k.top.length) {
    const tp = k.top.slice(0, 5);
    txt('SKU ที่ต่างมากสุด', P, y, 15, 700);
    txt(V ? 'สุทธิรวมทุกโล · มูลค่า' : 'สุทธิรวมทุกโล', W - P, y + 3, 11, 400, CC.muted, 'right');
    y += 26; hr(y);
    tp.forEach(t => {
      txt(fit(t.sku || t.long, 300, 14, 700), P, y + 7, 14, 700);
      txt(fit(t.name, 330, 11), P, y + 26, 11, 400, CC.muted);
      txt(signed(t.net), W - P, y + 7, 14, 700, col(t.net), 'right');
      if (V) txt(t.price === null ? 'ไม่มีราคา' : baht(t.val), W - P, y + 26, 11, 600, t.price === null ? CC.faint : col(t.val), 'right');
      else txt(`${f(t.locs)} โล`, W - P, y + 26, 11, 400, CC.muted, 'right');
      y += 46; hr(y);
    });
    y += 10;
  }

  y += 6; hr(y); y += 10;
  txt('WMS · นับสต๊อกใหญ่', P, y, 11, 400, CC.faint);
  txt(`${f(k.counted.locs)} โล · ${f(k.span.people)} คน · ใช้เวลา ${durText(k.span.workMin)}`, W - P, y, 11, 600, CC.muted, 'right');
  y += 26;

  const out = document.createElement('canvas');
  out.width = W * CARD_SCALE; out.height = Math.ceil(y * CARD_SCALE);
  out.getContext('2d').drawImage(big, 0, 0);
  return out;
}

async function openShot() {
  const r = R(), closed = r.status === 'ปิดแล้ว', k = report();
  /* รอฟอนต์ไทยก่อนวาด ไม่งั้นรูปแรกได้ฟอนต์สำรอง */
  try { await Promise.all([400, 600, 700].map(w => document.fonts.load(cardFont(16, w), 'กขค ABC 123'))); } catch (e) {}
  const blob = await new Promise(ok => drawReport(k, { name: r.name, date: r.date, cutoff: cutText(r.cutoff), closed, by: r.approvedBy }).toBlob(ok, 'image/png'));
  if (!blob) { S.err = 'สร้างรูปไม่ได้ ลองใหม่อีกครั้ง'; paintSrc(); return; }
  closeShot();
  const name = `สรุปนับสต๊อก-${r.id}${closed ? '' : '-ร่าง'}.png`;
  const file = new File([blob], name, { type: 'image/png' });
  let share = false;
  try { share = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
  const phone = share && matchMedia('(pointer:coarse)').matches;   // มือถือ: แชร์ไป LINE ตรง ๆ เป็นปุ่มหลัก
  SHOT = { blob, file, url: URL.createObjectURL(blob), name };
  const el = document.createElement('div');
  el.className = 'st-shot'; el.id = 'shot';
  el.innerHTML = `<div class="st-shot-box" role="dialog" aria-modal="true" aria-label="รูปสรุปนับสต๊อก">
    <div class="st-shot-bar"><b>รูปสรุปส่ง LINE</b><span class="sp"></span>
      <button class="st-btn ${phone ? '' : 'p'}" data-act="shotcopy">📋 คัดลอกรูป</button>
      ${share ? `<button class="st-btn ${phone ? 'p' : ''}" data-act="shotshare">📤 แชร์</button>` : ''}
      <button class="st-btn" data-act="shotsave">⬇️ โหลดรูป</button>
      <button class="st-btn" data-act="shotclose" aria-label="ปิด">✕</button></div>
    <div class="st-shot-msg" id="shotMsg">${phone ? 'กดแชร์แล้วเลือก LINE' : 'คัดลอกแล้วไปกด Ctrl+V ในแชท LINE'}${closed ? '' : ' · ยังเป็นร่าง ตัวเลขยังเปลี่ยนได้'}</div>
    <img src="${SHOT.url}" alt="รูปสรุปผลนับสต๊อก"></div>`;
  el.addEventListener('click', (e) => { if (e.target === el) closeShot(); });
  document.body.appendChild(el);
  el.querySelector('[data-act="shotclose"]').focus();
}

function closeShot() {
  const el = $('shot');
  if (el) el.remove();
  if (SHOT) URL.revokeObjectURL(SHOT.url);
  SHOT = null;
}

function shotMsg(s, cls) { const m = $('shotMsg'); if (m) { m.textContent = s; m.className = 'st-shot-msg ' + (cls || ''); } }

async function shotCopy() {
  if (!SHOT) return;
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': SHOT.blob })]);
    shotMsg('✓ คัดลอกรูปแล้ว ไปกด Ctrl+V ในแชท LINE ได้เลย', 'ok');
  } catch (e) { shotMsg('เบราว์เซอร์นี้คัดลอกรูปไม่ได้ กด "โหลดรูป" หรือ "แชร์" แทน', 'err'); }
}

async function shotShare() {
  if (!SHOT) return;
  try { await navigator.share({ files: [SHOT.file], title: SHOT.name }); shotMsg('✓ แชร์แล้ว', 'ok'); }
  catch (e) { if (e.name !== 'AbortError') shotMsg('แชร์ไม่ได้ กด "โหลดรูป" แทน', 'err'); }
}

function shotSave() {
  if (!SHOT) return;
  const a = document.createElement('a');
  a.href = SHOT.url; a.download = SHOT.name;
  document.body.appendChild(a); a.click(); a.remove();
  shotMsg('✓ โหลดรูปแล้ว', 'ok');
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && SHOT) closeShot(); });

/* ── ปุ่มและช่อง ─────────────────────────────────────────────────────── */

async function copyLink() {
  const text = link();
  try { await navigator.clipboard.writeText(text); S.ok = '✓ คัดลอกลิงก์คนนับแล้ว ส่งใน LINE ได้เลย'; }
  catch (e) { prompt('คัดลอกลิงก์นี้', text); }
  S.err = ''; paintSrc();
}

async function saveRound() {
  const r = S.rid === 'new' ? null : R();
  const body = {
    id: r ? r.id : '', name: $('fName').value, date: $('fDate').value, cutoff: $('fCut').value,
    settings: { ...(r ? r.settings : {}), auditMin: Math.max(0, Math.min(100, +$('fAud').value || 0)) },
  };
  await job(r ? 'กำลังบันทึกรอบ…' : 'กำลังสร้างรอบ…', async () => {
    const res = await post({ op: 'st-round-save', round: body });
    S.rid = res.round.id;
    S.rounds = (await get('st-rounds')).rounds;
    await loadHead();
    S.ok = r ? '✓ บันทึกรอบแล้ว' : `✓ สร้างรอบ ${res.round.id} แล้ว ต่อไปดึงยอดตั้งต้น`;
  });
}

async function delRound() {
  const r = R();
  const typed = (($('delName') || {}).value || '').trim();
  if (!r || typed !== r.name) return;
  await job('กำลังลบรอบ…', async () => {
    const res = await post({ op: 'st-round-del', round: r.id, confirm: typed });
    DEL = false;
    S.rounds = (await get('st-rounds')).rounds;
    S.rid = S.rounds[0] ? S.rounds[0].id : 'new';
    S.head = null;
    if (S.rid !== 'new') await loadHead(); else save(KEY_ROUND, 'new');
    TAB = 'setup';
    history.replaceState(null, '', '?tab=setup');
    const n = (res.rows && res.rows['บันทึกนับ']) || 0;
    S.ok = `✓ ลบรอบ ${r.name} (${res.deleted}) แล้ว · บันทึกนับ ${f(n)} แถว${res.inPlace && n ? ' ล้างในที่เดิม (มีรอบอื่นเปิดอยู่ เลขแถวของรอบนั้นจะได้ไม่ขยับ)' : ''}`;
  });
}

async function setStatus(status) {
  const was = R() && R().status;
  await job('กำลังเปลี่ยนสถานะ…', async () => {
    await post({ op: 'st-status', round: S.rid, status });
    S.head = await get('st-head', { round: S.rid });
    S.rounds = (await get('st-rounds')).rounds;
    S.ok = status === 'ตั้งค่า' ? 'กลับไปตั้งค่าแล้ว ผลนับที่ส่งมาแล้วยังอยู่ครบ'
      : status === 'วิเคราะห์' ? (was === 'นับรอบ 2' ? '✓ ปิดรับนับรอบ 2 แล้ว ตรวจยอดสุดท้ายในแท็บปิดรอบ' : '✓ ปิดรับนับรอบ 1 แล้ว ดูผลในแท็บวิเคราะห์')
      : status === 'นับรอบ 2' ? '✓ เปิดนับรอบ 2 แล้ว คนนับเปิดลิงก์เดิมแล้วเลือกทีมใหม่'
      : was === 'วิเคราะห์' ? '✓ เปิดนับรอบ 1 ต่อแล้ว' : '✓ เริ่มนับรอบ 1 แล้ว ส่งลิงก์ให้คนนับได้เลย';
  });
}

async function saveCfg() {
  const url = $('cfgUrl').value.trim(), tok = $('cfgTok').value.trim();
  if (!url || !tok) { S.err = 'ใส่ทั้ง URL และรหัสหัวหน้า'; paint(); return; }
  WmsSettings.setStUrl(url); WmsSettings.setStToken(tok);
  await job('กำลังทดสอบ…', async () => {
    const hi = await WmsGas.json(url, 'x', { retries: 0 });
    if (!hi || hi.app !== 'stocktake') throw new Error('URL นี้ไม่ใช่สคริปต์นับสต๊อก (stocktake-api.gs)');
    S.rounds = (await get('st-rounds')).rounds;
    S.rid = S.rounds[0] ? S.rounds[0].id : 'new';
    if (S.rid !== 'new') await loadHead();
    S.ok = '✓ เชื่อมชีตนับสต๊อกแล้ว';
  });
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.tab) {
    if (d.tab === TAB) return;
    TAB = d.tab; FILTER = ''; TOAST = ''; AQ = '';
    history.replaceState(null, '', '?tab=' + TAB);
    paint();
    if ((TAB === 'progress' || TAB === 'control') && S.head && !MOVES) checkMoves(false);
    return;
  }
  if (d.go) { TAB = d.go; FILTER = ''; AQ = ''; history.replaceState(null, '', '?tab=' + TAB); paint(); return; }
  if (d.filter !== undefined) { FILTER = FILTER === d.filter ? '' : d.filter; paintBody(); return; }
  if (d.open) { OPEN.has(d.open) ? OPEN.delete(d.open) : OPEN.add(d.open); paintBody(); return; }
  if (d.r2g) { r2Set(o => { o.groups = o.groups.includes(d.r2g) ? o.groups.filter(g => g !== d.r2g) : o.groups.concat([d.r2g]); }); return; }
  if (d.r2m) { r2Set(o => { o.multi = !o.multi; }); return; }
  if (d.unedit) { setEdit(d.unedit, null); paintBody(); return; }
  if (d.addTeam) {
    const id = nextId(d.addTeam);
    D().teams.push({ id, kind: d.addTeam, name: d.addTeam === 'Audit' ? '' : 'ทีม ' + id.replace('INV', ''), members: '' });
    touch();
    return;
  }
  if (d.delTeam !== undefined) {
    const t = D().teams[+d.delTeam];
    if (!confirm(`ลบ ${t.name || t.id}? แถวที่ทีมนี้ได้จะกลับเป็นยังไม่มีทีม`)) return;
    D().teams.splice(+d.delTeam, 1);
    [D().inv, D().aud].forEach(m => Object.keys(m).forEach(g => { if (m[g] === t.id) delete m[g]; }));
    touch();
    return;
  }
  if (d.auto) {
    const dd = D();
    const gl = ST.groups(dd.locs).filter(g => dd.inv[g.group] !== ST.SKIP);
    const ids = dd.teams.filter(t => t.kind === (d.auto === 'aud' ? 'Audit' : 'Inventory')).map(t => t.id);
    const split = ST.autoSplit(gl, ids);
    Object.assign(d.auto === 'aud' ? dd.aud : dd.inv, split);
    touch(`✓ แบ่ง ${d.auto === 'aud' ? 'Audit' : 'Inventory'} ${ids.length} ${d.auto === 'aud' ? 'คน' : 'ทีม'} แล้ว ตรวจแล้วกดบันทึก`);
    return;
  }
  if (d.day2) {
    const dd = D();
    if (dd.day2 && dd.day2.on) return;
    const zs = new Set(dd.locs.map(l => l.zone));
    dd.day2 = d.day2 === 'on' ? (dd.day2 || { zones: ['S', 'A', 'B'].filter(z => zs.has(z)), open: true }) : null;
    touch();
    return;
  }
  if (d.day2z) {
    const dd = D();
    if (!dd.day2 || dd.day2.on) return;
    const i = dd.day2.zones.indexOf(d.day2z);
    if (i < 0) dd.day2.zones.push(d.day2z); else dd.day2.zones.splice(i, 1);
    touch();
    return;
  }
  if (d.cell) { CT.sel = CT.sel === d.cell ? '' : d.cell; paintBody(); return; }
  if (d.ctTeam) { CT.team = CT.team === d.ctTeam ? '' : d.ctTeam; paintBody(); return; }
  const act = d.act;
  if (act === 'reload') loadRounds();
  else if (act === 'copy') copyLink();
  else if (act === 'share') navigator.share({ title: 'ลิงก์นับสต๊อก ' + (R() ? R().name : ''), url: link() }).catch(() => {});
  else if (act === 'base') pullBase();
  else if (act === 'start') setStatus('นับรอบ 1');
  else if (act === 'pause') { if (confirm('กลับไปตั้งค่า? คนนับจะยังส่งผลที่ค้างในเครื่องได้ แต่หน้ากรอกจะขึ้นว่ายังไม่เปิดนับ')) setStatus('ตั้งค่า'); }
  else if (act === 'round-save') saveRound();
  else if (act === 'teams-save') saveTeams();
  else if (act === 'undo') { DRAFT = null; TOAST = ''; paint(); }
  else if (act === 'cfg') saveCfg();
  else if (act === 'moves') checkMoves(true);
  else if (act === 'summary') saveSummary();
  else if (act === 'close1') {
    const d2 = day2();
    if (d2 && !d2.on) { alert('ยังไม่ได้เปิดนับวันที่ 2\nโลที่รอวันที่ 2 ยังไม่ได้นับ — กด "เปิดนับวันที่ 2" ในแท็บตั้งรอบก่อน'); return; }
    if (confirm('ปิดรับนับรอบ 1?\nเครื่องที่ยังค้างส่งจะยังส่งเข้ามาได้ ย้อนกลับไปนับต่อได้' + unsentText(1))) setStatus('วิเคราะห์');
  }
  else if (act === 'day2-open') openDay2();
  else if (act === 'tv') setTv(true);
  else if (act === 'tv-exit') setTv(false);
  else if (act === 'tv-full') { try { const p = document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* เบราว์เซอร์นี้เต็มจอไม่ได้ */ } wake(); }
  else if (act === 'ct-clear') { CT.sel = ''; paintBody(); }
  else if (act === 'ct-analyze') {
    /* แท็บวิเคราะห์ขึ้นเฉพาะรายการที่มีปัญหา โลที่ตรงทั้งโลต้องกดชิป "ตรง" ให้ด้วย ไม่งั้นค้นแล้วไม่เจอ */
    const bad = CT.cm && CT.cm.lines.some(x => x.loc === CT.sel && x.group !== ST.G.OK);
    AQ = CT.sel; FILTER = bad ? '' : 'ok'; TAB = 'analyze';
    history.replaceState(null, '', '?tab=analyze');
    paint();
  }
  else if (act === 'reopen') setStatus('นับรอบ 1');
  else if (act === 'plan-save') savePlan();
  else if (act === 'r2-undo') { R2D = null; paintBody(); }
  else if (act === 'start2') {
    const n = planSaved().length;
    if (planDiff(planNow()) && !confirm('แผนที่แสดงอยู่ยังไม่ได้บันทึก คนนับจะเห็นแผนที่บันทึกล่าสุด เปิดนับต่อไหม?')) return;
    if (confirm(`เปิดนับรอบ 2 (${n} โล)?\nคนนับเปิดลิงก์เดิม เลือกทีมใหม่ ระบบห้ามคนที่นับโลนั้นในรอบ 1 นับซ้ำ\nเปิดแล้วกลับไปนับรอบ 1 ไม่ได้`)) setStatus('นับรอบ 2');
  }
  else if (act === 'stop2') { if (confirm('ปิดรับนับรอบ 2?\nเครื่องที่ค้างส่งยังส่งเข้ามาได้ เปิดนับต่อได้' + unsentText(2))) setStatus('วิเคราะห์'); }
  else if (act === 'xlsx') downloadXlsx();
  else if (act === 'close') closeRound();
  else if (act === 'del-open') { DEL = true; paintBody(); const el = $('delName'); if (el) el.focus(); }
  else if (act === 'del-cancel') { DEL = false; paintBody(); }
  else if (act === 'del-go') delRound();
  else if (act === 'rp-print') window.print();
  else if (act === 'op-xlsx') downloadOpening();
  else if (act === 'trc-xlsx') downloadTrc();
  else if (act === 'trc-load') {
    TRC = null; S.err = ''; S.ok = '';
    job('กำลังโหลดสต๊อก TRcloud…', async () => { try { await loadTrc(); } catch (e) { TRC = { data: null, at: Date.now(), err: e.message }; } RP = null; });
  }
  else if (act === 'op-check') checkOpening();
  else if (act === 'op-fifo') { FIFO = null; paintBody(); }
  else if (act === 'rp-shot') openShot();
  else if (act === 'rp-price') { PRICE_OPEN = !PRICE_OPEN; paintBody(); const el = $('rpPrice'); if (el) el.focus(); }
  else if (act === 'rp-price-save') savePriceBox();
  else if (act === 'rp-price-clear') {
    if (!confirm(`ล้างราคาต่อชิ้นทั้งหมด ${f(Object.keys(prices().map).length)} SKU ในเครื่องนี้?`)) return;
    setPrices({}); S.ok = '✓ ล้างราคาแล้ว'; S.err = ''; paint();
  }
  else if (act === 'shotcopy') shotCopy();
  else if (act === 'shotshare') shotShare();
  else if (act === 'shotsave') shotSave();
  else if (act === 'shotclose') closeShot();
});

document.addEventListener('change', (e) => {
  const t = e.target, d = t.dataset;
  if (t.id === 'rsel') {
    S.rid = t.value; S.err = ''; S.ok = '';
    if (S.rid === 'new') { S.head = null; TAB = 'setup'; paint(); return; }
    job('กำลังโหลดรอบ…', loadHead);
    return;
  }
  if (t.id === 'ctTarget') { setTarget(t.value); paintBody(); return; }
  if (t.id === 'opNote' || t.id === 'opName') {
    const v = t.value.trim();
    opSet(t.id === 'opNote' ? { note: v } : { name: v });
    paintBody();
    return;
  }
  if (d.day2open !== undefined) {
    const dd = D();
    if (dd.day2 && !dd.day2.on) { dd.day2.open = t.checked; touch(); }
    return;
  }
  if (d.r2drop !== undefined) { r2Set(o => { o.drop = t.checked ? o.drop.filter(l => l !== d.r2drop) : o.drop.concat([d.r2drop]); }); return; }
  if (d.r2team !== undefined) {
    const l = planNow().locs.find(x => x.loc === d.r2team);
    r2Set(o => { if (!t.value || (l && t.value === l.auto)) delete o.set[d.r2team]; else o.set[d.r2team] = t.value; });
    return;
  }
  if (t.id === 'r2Min' || t.id === 'r2Hot' || t.id === 'r2HotMin') {
    const k = { r2Min: 'minQty', r2Hot: 'hotPct', r2HotMin: 'hotMin' }[t.id];
    r2Set(o => { o[k] = t.value === '' ? undefined : +t.value; });
    return;
  }
  if (d.edit !== undefined) {
    const raw = t.value.replace(/,/g, '').trim();
    const v = Number(raw);
    if (raw === '') setEdit(d.edit, null);
    else if (!isFinite(v) || v < 0) { S.err = 'ยอดสุดท้ายต้องเป็นตัวเลขไม่ติดลบ'; paintSrc(); t.focus(); return; }
    else setEdit(d.edit, v);
    S.err = '';
    paintBody(); paintSrc();
    return;
  }
  if (d.inv !== undefined) { D().inv[d.inv] = t.value; if (!t.value) delete D().inv[d.inv]; touch(); return; }
  if (d.aud !== undefined) { D().aud[d.aud] = t.value; if (!t.value) delete D().aud[d.aud]; touch(); return; }
  if (d.zoneInv !== undefined || d.zoneAud !== undefined) {
    if (!t.value) return;
    const dd = D(), zone = d.zoneInv ?? d.zoneAud, map = d.zoneInv !== undefined ? dd.inv : dd.aud;
    ST.groups(dd.locs).filter(g => g.zone === zone).forEach(g => {
      if (t.value === ST.SKIP && map === dd.aud) delete map[g.group]; else map[g.group] = t.value;
    });
    touch();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'delName') {
    const g = $('delGo'), r = R();
    if (g && r) g.disabled = !!S.old || e.target.value.trim() !== r.name;
    return;
  }
  if (e.target.id === 'anQ') {
    AQ = e.target.value;
    const pos = e.target.selectionStart;
    paintBody();
    const el = $('anQ'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }
  const d = e.target.dataset;
  if (d.team === undefined) return;
  const team = D().teams[+d.team];
  team[d.f] = e.target.value;
  if (!D().dirtyTyping) { D().dirtyTyping = 1; D().dirty++; }
  const bar = document.querySelector('.st-save span');
  if (bar) bar.innerHTML = `<b>แก้แล้ว ${D().dirty} อย่าง ยังไม่บันทึก</b>`;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'addLoc') {
    addLocs(ST.parseLocList(e.target.value));
    setTimeout(() => { const el = $('addLoc'); if (el) el.focus(); }, 0);
  }
  if (e.key === 'Enter' && e.target.id === 'r2Add') {
    addR2(ST.parseLocList(e.target.value));
    setTimeout(() => { const el = $('r2Add'); if (el) el.focus(); }, 0);
  }
  /* Enter ในช่องยอดสุดท้าย = ไปช่องถัดลงไป เหมือนกรอกในชีต */
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.edit !== undefined) {
    e.preventDefault();
    const all = [...document.querySelectorAll('[data-edit]')];
    const next = all[all.indexOf(e.target) + 1];
    const id = next && next.dataset.edit;
    e.target.blur();
    if (id) setTimeout(() => { const el = document.querySelector(`[data-edit="${CSS.escape(id)}"]`); if (el) { el.focus(); el.select(); } }, 0);
  }
});

/* วางรายการ Location ที่ไหนก็ได้บนแท็บทีม/โซน หรือแท็บรอบ 2 (นอกช่องพิมพ์) เหมือนวางลงชีต */
document.addEventListener('paste', (e) => {
  if ((TAB !== 'teams' && TAB !== 'round2') || !S.head) return;
  const box = TAB === 'teams' ? 'addLoc' : 'r2Add';
  const tag = (e.target.tagName || '').toLowerCase();
  if ((tag === 'input' && e.target.id !== box) || tag === 'textarea' || tag === 'select') return;
  if (TAB === 'round2' && (!after1() || R().status === 'ปิดแล้ว')) return;
  const list = ST.parseLocList((e.clipboardData || window.clipboardData).getData('text'));
  if (!list.length) return;
  e.preventDefault();
  if (TAB === 'teams') addLocs(list); else addR2(list);
  if (e.target.id === box) e.target.value = '';
});

/* แท็บรายงาน: วางราคาต่อชิ้น (SKU กับราคาจาก Excel) ที่ไหนก็ได้นอกช่องพิมพ์ */
document.addEventListener('paste', (e) => {
  if (TAB !== 'report' || !S.head) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const p = addPrices((e.clipboardData || window.clipboardData).getData('text'));
  if (!p.n) return;
  e.preventDefault();
  S.err = ''; S.ok = `✓ เก็บราคา ${f(p.n)} SKU แล้ว${p.bad ? ` · ข้าม ${f(p.bad)} บรรทัดที่ไม่มีราคา` : ''}`;
  paint();
});

/* ความคืบหน้าสด: ขอเฉพาะแถวใหม่ทุกนาทีตอนเปิดแท็บนี้อยู่ */
/* ไม่วาดใหม่ตอนกำลังพิมพ์ในช่องของตาราง (ยอดสุดท้าย / ค่าตั้งรอบ 2) ตัวที่พิมพ์จะได้ไม่หาย */
function typing() { const a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.closest('#body') && a.id !== 'anQ'; }
let POLL_N = 0;
setInterval(async () => {
  /* ห้องควบคุมถามทุก 20 วินาที ผังกับจุดคนนับจะได้ขยับทัน แท็บอื่นทุกนาทีเหมือนเดิม */
  if (++POLL_N % 3 && TAB !== 'control') return;
  if (!LIVE_TABS.includes(TAB) || document.hidden || S.busy || !S.head || S.rid === 'new' || R().status === 'ปิดแล้ว') return;
  try { await loadLog(true); if (!typing()) paintBody(); paintTabs(); } catch (e) { /* รอบหน้าค่อยลองใหม่ */ }
}, POLL_MS / 3);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && LIVE_TABS.includes(TAB) && S.head && R().status !== 'ปิดแล้ว' && Date.now() - S.at > POLL_MS) loadLog(true).then(() => { paintBody(); paintTabs(); }).catch(() => {});
});
window.addEventListener('beforeunload', (e) => { if (DRAFT && DRAFT.dirty) { e.preventDefault(); e.returnValue = ''; } });

paint();
loadRounds().then(() => { if ((TAB === 'progress' || TAB === 'control') && S.head) checkMoves(false); });
</script>
</body>
</html>
