<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>นับสต๊อกใหญ่ — WMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── แถบรอบนับ: เลือกรอบ สถานะ ลิงก์คนนับ ── */
.st-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--wms-surface2);border-bottom:1px solid var(--wms-border);font-size:12.5px;color:var(--wms-muted)}
.st-src .sp{flex:1}
.st-src select{max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13.5px;font-weight:600;color:var(--wms-text)}
.st-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--wms-border);
  background:var(--wms-surface);font-size:12px;color:var(--wms-muted);white-space:nowrap}
.st-pill b{color:var(--wms-text);font-weight:600}
.st-pill.go{background:#ECFDF5;border-color:#A7F3D0;color:#047857;font-weight:600}
.st-pill.warn{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.st-btn{padding:5px 12px;border-radius:999px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px;color:#334155;cursor:pointer;white-space:nowrap}
.st-btn:hover:not(:disabled){border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.st-btn.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff;font-weight:600}
.st-btn.p:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.st-btn:disabled{opacity:.55;cursor:default}
.st-msg{width:100%;font-size:12.5px;line-height:1.5}
.st-msg.err{color:#B91C1C;font-weight:600}
.st-msg.ok{color:#047857;font-weight:600}
.st-msg.busy{color:var(--wms-primary-dark)}

/* ── เนื้อหา ── */
.st-body{padding:14px 20px 90px}
.st-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:18px 0 6px;font-size:13.5px;font-weight:700;color:var(--wms-text)}
.st-h:first-child{margin-top:0}
.st-sub{font-size:12px;font-weight:400;color:var(--wms-muted)}
.st-empty{padding:40px 20px;text-align:center;color:var(--wms-muted);font-size:14px;line-height:1.7}
.st-empty b{color:var(--wms-text)}
.st-note{margin-top:8px;font-size:12px;color:var(--wms-muted);line-height:1.6}
.st-note code{font-size:11.5px;background:var(--wms-surface2);padding:0 4px;border-radius:4px}
.st-warn{margin-bottom:10px;padding:8px 12px;border-radius:var(--wms-radius-sm);background:#FEF3C7;border:1px solid #FDE68A;
  color:#92400E;font-size:13px;line-height:1.6}
.st-warn b{font-weight:700}

/* ── ตารางแบบ Excel: แถวเตี้ย เส้นบาง ช่องแก้ได้ในตัว ── */
.st-wrap{overflow:auto;border:1px solid var(--wms-border2);border-radius:8px;background:var(--wms-surface)}
.st-xl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.st-xl th{position:sticky;top:0;z-index:1;padding:6px 8px;background:#F1F5F9;text-align:left;font-size:11.5px;font-weight:600;
  color:var(--wms-muted);border-bottom:1px solid var(--wms-border2);white-space:nowrap}
.st-xl td{height:32px;padding:0 8px;border-bottom:1px solid #EEF2F6;border-right:1px solid #EEF2F6;white-space:nowrap;color:var(--wms-text)}
.st-xl td:last-child{border-right:0}
.st-xl tbody tr:last-child td{border-bottom:0}
.st-xl .num{text-align:right;font-variant-numeric:tabular-nums}
.st-xl .k{font-weight:700}
.st-xl .mu{color:var(--wms-muted)}
.st-xl tr.z td{background:#F8FAFC;font-weight:700;border-top:1px solid var(--wms-border2)}
.st-xl tr.info td{height:auto;padding:8px 10px;background:#F8FAFC;white-space:normal;font-size:12.5px;line-height:1.7;color:var(--wms-muted)}
.st-xl tr.info b{color:var(--wms-text)}
.st-xl tr.bad td.c{color:#B91C1C;font-weight:700}
.st-xl tr.low td.c{color:#B45309;font-weight:700}
.st-xl tr.ok td.c{color:#047857;font-weight:700}
.st-xl td.full{color:#047857;font-weight:700}
.st-in{width:100%;min-width:60px;height:28px;padding:0 6px;border:1px solid transparent;border-radius:5px;background:transparent;
  font-family:var(--wms-font);font-size:13px;color:var(--wms-text)}
.st-in:hover{border-color:var(--wms-border2)}
.st-in:focus{outline:none;border-color:var(--wms-primary);background:var(--wms-surface)}
select.st-in{cursor:pointer;padding-right:2px}
.st-in.none{color:#B91C1C;font-weight:600}
.st-in.skip{color:var(--wms-faint)}
.st-x{padding:0 6px;border:0;background:none;font-size:16px;line-height:1;color:var(--wms-faint);cursor:pointer}
.st-x:hover{color:#B91C1C}
.st-i{width:24px;height:24px;border:1px solid var(--wms-border2);border-radius:999px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12px;font-weight:700;color:var(--wms-muted);cursor:pointer}
.st-i.on,.st-i:hover{border-color:var(--wms-primary);color:var(--wms-primary-dark);background:var(--wms-primary-light)}

/* ── ฟอร์มตั้งรอบ: ป้ายซ้าย ช่องขวา เหมือนชีตสองคอลัมน์ ── */
.st-form{max-width:560px}
.st-form td:first-child{width:130px;color:var(--wms-muted);font-size:12.5px}
.st-form .st-in{border-color:var(--wms-border);height:30px}
.st-form input[type=number]{width:80px}

/* ── ชิปสรุป กดกรองได้ ── */
.st-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;font-size:12.5px;color:var(--wms-muted)}
.st-bar .sp{flex:1}
.st-chip{display:inline-flex;align-items:baseline;gap:5px;padding:3px 11px;border-radius:999px;border:1px solid var(--wms-border);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:12px;color:var(--wms-muted);cursor:pointer;white-space:nowrap}
.st-chip b{font-size:13.5px;color:var(--wms-text);font-variant-numeric:tabular-nums}
.st-chip:hover{border-color:var(--wms-primary)}
.st-chip.on{border-color:var(--wms-primary);background:var(--wms-primary-light);color:var(--wms-primary-dark)}
.st-chip.red b{color:#B91C1C}
.st-chip.amber b{color:#B45309}
.st-chip.green b{color:#047857}
.st-chip.plain{cursor:default}
.st-chip.plain:hover{border-color:var(--wms-border)}

/* ── ขั้นตอนเตรียมรอบ ── */
.st-steps td:first-child{width:28px;text-align:center;color:var(--wms-muted);font-size:12px}
.st-steps td.what{font-weight:700;width:120px}
.st-steps td.st-do{width:1%;text-align:right}
.st-steps td.st-do .st-btn{margin-left:4px}
.st-steps td.dt{white-space:normal;font-size:12.5px;color:var(--wms-muted);line-height:1.5;padding:6px 8px}
.st-steps td.dt b{color:var(--wms-text)}
.st-steps .yes{color:#047857;font-weight:700}
.st-steps .no{color:#B91C1C;font-weight:700}
.st-link{display:block;margin-top:4px;padding:5px 8px;border-radius:6px;background:var(--wms-surface2);font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;color:var(--wms-text);word-break:break-all;user-select:all}

.st-save{position:sticky;bottom:8px;display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 12px;
  background:var(--wms-surface);border:1px solid var(--wms-border);border-radius:var(--wms-radius);box-shadow:0 4px 14px rgba(15,23,42,.1);
  font-size:13px;color:var(--wms-muted)}
.st-save .sp{flex:1}
.st-save b{color:#B45309}
.st-add{width:130px;height:28px;padding:0 8px;border:1px dashed var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px}
.st-add:focus{outline:none;border-style:solid;border-color:var(--wms-primary)}
.st-toast{font-size:12.5px;font-weight:600;color:#047857}
.st-cfg{max-width:640px;padding:12px 14px;border:1px solid var(--wms-border);border-radius:var(--wms-radius);background:var(--wms-surface)}
.st-cfg .row{display:flex;gap:6px;margin-top:6px}
.st-cfg .row .st-in{flex:1;border-color:var(--wms-border2);height:32px}
.st-cfg ol{margin:8px 0 0 18px;font-size:12.5px;color:var(--wms-muted);line-height:1.7}
.st-more{margin-top:16px;font-size:12.5px;color:var(--wms-muted)}
.st-more summary{cursor:pointer;font-weight:600}
.st-more .st-cfg{margin-top:8px}

/* ── แท็บวิเคราะห์: ป้ายกลุ่มปัญหา ── */
.st-g{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--wms-surface2);color:var(--wms-muted);white-space:nowrap}
.st-g.short{background:#FEF2F2;color:#B91C1C}
.st-g.over{background:#EFF6FF;color:#1D4ED8}
.st-g.moved{background:#F5F3FF;color:#6D28D9}
.st-g.lotpo{background:#FFF7ED;color:#C2410C}
.st-g.typo{background:#FEF3C7;color:#92400E}
.st-g.left{background:#F1F5F9;color:#475569}
.st-g.audit{background:#ECFEFF;color:#0E7490}
.st-g.ok{background:#ECFDF5;color:#047857}
.st-xl td.neg{color:#B91C1C;font-weight:700}
.st-xl td.pos{color:#1D4ED8;font-weight:700}
.st-lbl{font-size:12px;font-weight:600;color:var(--wms-muted)}
.st-tot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:8px;font-size:13px;color:var(--wms-muted)}
.st-tot b{color:var(--wms-text);font-variant-numeric:tabular-nums}
.st-tot .sp{flex:1}
.st-q{width:190px;height:28px;padding:0 9px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px}
.st-q:focus{outline:none;border-color:var(--wms-primary)}
.st-led{margin-top:4px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7;color:var(--wms-text)}
.st-led a{color:var(--wms-primary-dark)}

/* ── รอบ 2 และปิดรอบ ── */
.st-g.edit{background:#FDF4FF;color:#A21CAF}
.st-xl td.ok{color:#047857;font-weight:700}
.st-xl tr.off td{color:var(--wms-faint)}
.st-in.num{text-align:right;font-variant-numeric:tabular-nums;border-color:var(--wms-border)}
.st-in.ed{background:#FEF3C7;border-color:#FDE68A;font-weight:700}
.st-num{width:58px;height:26px;padding:0 6px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px;text-align:right}
.st-num:focus{outline:none;border-color:var(--wms-primary)}
.st-flag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:#FEF3C7;color:#92400E;font-size:11px;font-weight:600;white-space:nowrap}
.st-done{margin-bottom:10px;padding:8px 12px;border-radius:var(--wms-radius-sm);background:#ECFDF5;border:1px solid #A7F3D0;color:#047857;font-size:13px;line-height:1.6}
.st-done b{font-weight:700}
.st-chk{width:16px;height:16px;cursor:pointer;accent-color:var(--wms-primary);vertical-align:middle}
.st-ap{width:150px;height:30px;padding:0 9px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px}
.st-ap:focus{outline:none;border-color:var(--wms-primary)}

@media (max-width:640px){
  .st-src{padding:8px 12px}
  .st-body{padding:12px 12px 90px}
  .st-steps td.what{width:auto}
}
</style>
</head>
<body data-wms-module="stocktake">

<div class="wms-shell">
<div data-wms-shell="stocktake" data-root="../"></div>
<div class="wms-main">

  <div class="mod-head">
    <div class="mod-title">
      <div class="ic"><img src="../icons/list-checks.png" alt="" width="38" height="38"></div>
      <div>
        <h2>นับสต๊อกใหญ่</h2>
        <button type="button" class="mod-info" aria-expanded="false" aria-label="คำอธิบายหน้านี้">i</button>
        <p>นับทั้งคลังเป็นรอบ: ตั้งรอบ ดึงยอดตั้งต้นจากสมุด แบ่งโซนให้ทีม Inventory กับ Audit ส่งลิงก์ให้คนนับกรอกบนมือถือ แล้วดูความคืบหน้าสด ๆ — ไม่แก้ชีต Transaction</p>
      </div>
    </div>
  </div>

  <div class="st-src" id="src"></div>
  <div class="tx-tabs" id="tabs" role="tablist"></div>
  <div class="st-body" id="body"></div>

</div><!-- /.wms-main -->
</div><!-- /.wms-shell -->

<script type="module" src="../wms-shell.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-sup.js"></script>
<script src="../wms-stocktake.js"></script>
<script>
const $ = id => document.getElementById(id);
/* ค่าทุกตัวมาจากชีตที่คนกรอก บางตัวไปอยู่ใน data-* จึงต้องหนีเครื่องหมายคำพูดด้วย */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
const ST = window.WmsStocktake;
const KEY_ROUND = 'wms:st:round';
const POLL_MS = 60000;
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ?tab= ไว้ส่งลิงก์ตรงไปหน้าความคืบหน้า */
const TABS = [['setup', 'ตั้งรอบ', '../icons/settings.png'], ['teams', 'ทีม/โซน', '../icons/list-checks.png'], ['progress', 'ความคืบหน้า', '../icons/tab-count.png'],
  ['analyze', 'วิเคราะห์', '../icons/tab-compare.png'], ['round2', 'รอบ 2', '../icons/tab-refill.png'], ['close', 'ปิดรอบ', '../icons/tab-fix.png']];
const LIVE_TABS = ['progress', 'analyze', 'round2', 'close'];   // แท็บที่ดึงบันทึกนับใหม่ทุกนาที
let TAB = TABS.some(t => t[0] === new URLSearchParams(location.search).get('tab')) ? new URLSearchParams(location.search).get('tab') : 'setup';

const S = { rounds: null, rid: load(KEY_ROUND), head: null, log: [], since: 0, at: 0, busy: '', err: '', ok: '', fresh: false };
let DRAFT = null;      // ทีม/โซนที่กำลังแก้ ยังไม่บันทึก
let MOVES = null;      // แถวสมุดหลังดึงยอดตั้งต้น {list, at, err}
let FIFO = null;       // สมุดที่อ่านไว้ {data, at} ใช้ทั้งเช็คแถวใหม่และหาแถวที่น่าสงสัย
let FIFO_BUSY = false;
let AN = null;         // ผลวิเคราะห์ที่คิดไว้ คิดใหม่เมื่อบันทึกนับหรือข้อมูลรอบเปลี่ยน
let AQ = '';           // ช่องค้นหาในแท็บวิเคราะห์
let FILTER = '';       // ชิปที่กดกรองอยู่
const OPEN = new Set();   // แถวที่กาง ⓘ
let TOAST = '';
let R2D = null;        // ค่าตั้งแผนรอบ 2 ที่กำลังแก้ {rid, opts} เริ่มจากที่บันทึกไว้ในรอบ
let PN = null;         // แผนรอบ 2 ที่คิดไว้
let AN2 = null;        // ผลวิเคราะห์รอบ 2 (เฉพาะโลในแผนที่บันทึก)
let EDITS = null;      // ตัวเลขที่หัวหน้าแก้ในแท็บปิดรอบ {rid, map} เก็บในเครื่องจนกว่าจะอนุมัติ
let XLSX_LOAD = null;
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

function cfg() { return { url: WmsSettings.stUrl(), t: WmsSettings.stToken() }; }
function who() {
  try { return JSON.parse(localStorage.getItem('wms:session') || '{}').name || WmsSettings.me() || 'หัวหน้า'; }
  catch (e) { return WmsSettings.me() || 'หัวหน้า'; }
}

/* ── คุยกับสคริปต์ ───────────────────────────────────────────────────── */

function urlOf(api, params) {
  const c = cfg();
  const q = new URLSearchParams({ api, t: c.t, ...(params || {}) });
  return c.url + (c.url.includes('?') ? '&' : '?') + q.toString();
}

async function get(api, params, quiet) {
  const res = await WmsGas.json(urlOf(api, params), api, quiet ? { retries: 1 } : {
    onProgress: (sec) => { if (sec > 3) { S.busy = S.busy.replace(/ \d+ วิ$/, '') + ` ${sec} วิ`; paintSrc(); } },
  });
  if (res && res.error) throw new Error(res.error);
  return res;
}

async function post(body) {
  const c = cfg();
  const res = await WmsGas.post(c.url, { t: c.t, by: who(), ...body }, { timeoutMs: 120000, busy: true });
  if (res && res.error) throw new Error(res.error);
  return res;
}

async function job(label, fn) {
  S.busy = label; S.err = ''; S.ok = ''; paint();
  try { await fn(); }
  catch (e) { S.err = e.message; }
  S.busy = ''; paint();
}

function loadRounds() {
  if (!cfg().url || !cfg().t) { paint(); return Promise.resolve(); }
  return job('กำลังโหลดรอบนับ…', async () => {
    S.rounds = (await get('st-rounds')).rounds;
    if (S.rid !== 'new' && !S.rounds.some(r => r.id === S.rid)) S.rid = S.rounds[0] ? S.rounds[0].id : 'new';
    if (S.rid !== 'new') await loadHead();
  });
}

async function loadHead() {
  S.head = await get('st-head', { round: S.rid });
  save(KEY_ROUND, S.rid);
  S.log = []; S.since = 0; DRAFT = null; MOVES = null; OPEN.clear(); FILTER = '';
  await loadLog();
}

async function loadLog(quiet) {
  const r = await get('st-log', { round: S.rid, since: S.since }, quiet);
  S.log = ST.merge(S.log, r.rows.map(ST.fromRow));
  S.since = r.last;
  S.at = Date.now();
  if (r.round && S.head) Object.assign(S.head.round, r.round);
}

/* ── ค่าที่คิดจากข้อมูลของรอบ ────────────────────────────────────────── */

function R() { return S.head && S.head.round; }
function locList() { return S.head ? S.head.locs.map(l => ({ loc: l[0], zone: l[1], group: l[2], src: l[3] })) : []; }
function skipSet() { return new Set(((R() && R().settings.skip) || []).map(ST.up)); }
/** โลที่นับจริงในรอบนี้ ไม่รวมแถวที่ตั้งไม่นับ */
function countLocs() { const sk = skipSet(); return locList().filter(l => !sk.has(ST.up(l.group))); }
function auditMin() { const m = R() && R().settings.auditMin; return m === undefined || m === '' ? ST.AUDIT_MIN : +m; }
function prog() { return ST.progress(countLocs(), S.head.teams, S.log, { pass: 1, auditMin: auditMin() }); }
function counting() { return R() && /^นับรอบ/.test(R().status); }
function link() {
  return ST.countLink(new URL('count.html', location.href).href, new URL(cfg().url, location.href).href, S.head.countKey, S.rid);
}
function pilesByLoc() {
  const m = {};
  (S.head ? S.head.piles : []).forEach(p => { m[p[0]] = (m[p[0]] || 0) + 1; });
  return m;
}

/* ── วาดหน้า ─────────────────────────────────────────────────────────── */

function paint() { paintSrc(); paintTabs(); paintBody(); }

function paintSrc() {
  const box = $('src');
  const msg = S.busy ? `<div class="st-msg busy">⏳ ${esc(S.busy)}</div>` : S.err ? `<div class="st-msg err">${esc(S.err)}</div>` : S.ok ? `<div class="st-msg ok">${esc(S.ok)}</div>` : '';
  if (!cfg().url || !cfg().t) { box.innerHTML = `<span class="st-pill warn">ยังไม่ได้เชื่อมชีตนับสต๊อก</span>${msg}`; return; }
  const opts = (S.rounds || []).map(r => `<option value="${esc(r.id)}" ${r.id === S.rid ? 'selected' : ''}>${esc(r.name)} · ${esc(r.date)}</option>`).join('');
  const r = R();
  const pill = !r || S.rid === 'new' ? '' : r.status === 'ตั้งค่า' ? '<span class="st-pill">ตั้งค่า</span>'
    : counting() ? `<span class="st-pill go">● ${esc(r.status)}</span>` : `<span class="st-pill">${esc(r.status)}</span>`;
  box.innerHTML = `<select id="rsel" aria-label="รอบนับ">${opts}<option value="new" ${S.rid === 'new' ? 'selected' : ''}>+ รอบใหม่</option></select>` +
    pill + (r && S.rid !== 'new' ? `<span>${esc(r.id)}</span>` : '') + `<span class="sp"></span>` +
    (r && S.rid !== 'new' ? `<button class="st-btn" data-act="copy">คัดลอกลิงก์คนนับ</button>` : '') +
    `<button class="st-btn" data-act="reload" ${S.busy ? 'disabled' : ''}>ดึงใหม่</button>` + msg;
}

function paintTabs() {
  const n = {};
  if (S.head && S.rid !== 'new') {
    const p = prog();
    n.progress = `${p.pct}%`;
    n.teams = ST.teamsOf(S.head.teams, 1).length || '';
    if (R().pass) { const a = analysis(); n.analyze = a.lines.filter(l => l.group !== ST.G.OK).length + a.audit.length || ''; }
    n.round2 = (S.head.plan || []).length || '';
    n.close = R().status === 'ปิดแล้ว' ? '✓' : '';
  }
  $('tabs').innerHTML = TABS.map(([id, label, icon]) =>
    `<button class="tx-tab ${id === TAB ? 'on' : ''}" role="tab" aria-selected="${id === TAB}" data-tab="${id}"><img src="${icon}" alt="" width="18" height="18">` +
    `<span class="lb">${label}</span>${n[id] !== undefined && n[id] !== '' ? ` <span class="n">${n[id]}</span>` : ''}</button>`).join('');
}

function paintBody() {
  const box = $('body');
  if (!cfg().url || !cfg().t) { box.innerHTML = cfgBox(true); return; }
  if (!S.rounds) { box.innerHTML = S.busy ? '<div class="st-empty">⏳ กำลังโหลด…</div>' : `<div class="st-empty">โหลดรอบนับไม่ได้<br><button class="st-btn" data-act="reload">ลองใหม่</button></div>` + cfgMore(); return; }
  if (S.rid === 'new' || !S.head) { box.innerHTML = TAB === 'setup' || S.rid === 'new' ? setupNew() : '<div class="st-empty">⏳ กำลังโหลด…</div>'; return; }
  if (TAB === 'teams') box.innerHTML = teamsView();
  else if (TAB === 'progress') box.innerHTML = progressView();
  else if (TAB === 'analyze') box.innerHTML = analyzeView();
  else if (TAB === 'round2') box.innerHTML = round2View();
  else if (TAB === 'close') box.innerHTML = closeView();
  else box.innerHTML = setupView();
}

      <tr><td>เวลาตัดยอด</td><td>${esc(x.cutoff)}</td></tr><tr><td>อนุมัติ</td><td>${esc(r.approvedBy)} · ${esc(r.approvedAt)}</td></tr>

    <tr><td>Audit ขั้นต่ำ</td><td><input class="st-in" id="fAud" type="number" min="0" max="100" step="1" value="${esc(x.settings.auditMin ?? ST.AUDIT_MIN)}"> % ของโลในแต่ละแถว</td></tr>

  <div class="st-bar" style="margin-top:8px"><button class="st-btn p" data-act="round-save">${r ? 'บันทึกรอบ' : 'สร้างรอบ'}</button>

    : c1 ? `กำลังนับ · นับแล้ว <b>${f(p.done)}/${f(p.total)}</b> โล (${p.pct}%) · <button class="st-btn" data-go="progress">ดูความคืบหน้า</button>`
    : `ปิดรับแล้ว · นับได้ <b>${f(p.done)}/${f(p.total)}</b> โล`;

/* ── ดึงยอดตั้งต้น ───────────────────────────────────────────────────── */

function cutoffMs(c) { return new Date(String(c).replace(' ', 'T') + ':00+07:00').getTime(); }

/**
 * อ่านสมุดผ่าน tx-api.gs (สำเนา IMPORTRANGE อ่านอย่างเดียว) แบบสด ไม่ใช้ข้อมูลกลางที่อาจเก่าหลายชั่วโมง
 * คิดยอดในเบราว์เซอร์ด้วยกติกาเดียวกับสคริปต์ แล้วส่งไปเก็บในชีตนับสต๊อก
 * รายการ Location เติมโลที่มีของเพิ่มเข้าไป โลที่หัวหน้าเพิ่มเองหรือแบ่งทีมไว้แล้วไม่หาย
 */
async function pullBase() {
  const tx = WmsSettings.txUrl();
  if (!tx) { S.err = 'ใส่ URL Transaction ในหน้าตั้งค่าก่อน'; paint(); return; }
  const r = R();
  if (Date.now() < cutoffMs(r.cutoff) && !confirm(`ยังไม่ถึงเวลาตัดยอด (${r.cutoff})\nของที่ขายหลังจากนี้จะไม่อยู่ในยอดตั้งต้น ดึงตอนนี้เลยไหม?`)) return;
  if (r.set && !confirm(`มียอดตั้งต้นชุดที่ ${r.set} แล้ว ดึงใหม่เป็นชุดที่ ${r.set + 1}?\nชุดเดิมยังเก็บไว้ในชีต`)) return;
  await job('กำลังอ่านสมุด Transaction…', async () => {
    const fifo = await WmsGas.json(tx, 'tx-fifo', { onProgress: (sec) => { S.busy = `กำลังอ่านสมุด Transaction… ${sec} วิ`; paintSrc(); } });
    if (fifo.error) throw new Error('สมุด Transaction: ' + fifo.error);
    if (!fifo.rows) throw new Error('URL Transaction ไม่ได้ตอบสมุดมา ตรวจในหน้าตั้งค่า');
    const sm = WmsSup.map(fifo.sup);
    const b = ST.baseline(fifo, (po) => WmsSup.of(sm, po));
    S.busy = 'กำลังบันทึกยอดตั้งต้น…'; paintSrc();
    await post({ op: 'st-baseline', round: r.id, piles: b.piles, skus: b.skus, pos: b.pos, lastRow: b.lastRow, lastDate: b.lastDate });
    const have = new Map(S.head.locs.map(l => [ST.up(l[0]), l]));
    ST.locations(b).forEach(l => { if (!have.has(l.loc)) have.set(l.loc, [l.loc, l.zone, l.group, l.src]); });
    const locs = [...have.values()].sort((a, c) => ST.locCmp(a[0], c[0]));
    const teams = ST.teamsOf(S.head.teams, 1).map(t => ({ ...t, locs: t.locs }));
    await post({ op: 'st-teams', round: r.id, pass: 1, teams, locs });
    await loadHead();
    S.ok = `✓ ดึงยอดตั้งต้นชุดที่ ${R().set} แล้ว ${f(b.piles.length)} กอง · Location ${f(locs.length)} โล`;
  });
}

/* ── แท็บทีม/โซน ─────────────────────────────────────────────────────── */

function draftFrom(h) {
  const t1 = ST.teamsOf(h.teams, 1);
  const inv = {}, aud = {};
  t1.forEach(t => t.zones.forEach(z => { if (t.kind === 'Audit') aud[z] = t.id; else inv[z] = t.id; }));
  ((h.round.settings && h.round.settings.skip) || []).forEach(z => { inv[z] = ST.SKIP; });
  return {
    teams: t1.map(t => ({ id: t.id, kind: t.kind, name: t.name, members: t.members.join(', ') })),
    inv, aud,
    locs: h.locs.map(l => ({ loc: l[0], zone: l[1], group: l[2], src: l[3] })),
    dirty: 0,
  };
}
function D() { if (!DRAFT) DRAFT = draftFrom(S.head); return DRAFT; }
function nextId(kind) {
  const pre = kind === 'Audit' ? 'AUD' : 'INV';
  let n = 1;
  while (D().teams.some(t => t.id === pre + n)) n++;
  return pre + n;
}
function teamName(id) { const t = D().teams.find(x => x.id === id); return t ? t.name : id; }

function teamsView() {
  const d = D();
  const gl = ST.groups(d.locs);
  const pile = pilesByLoc();
  const gp = {};
  gl.forEach(g => { gp[g.group] = g.locs.reduce((s, l) => s + (pile[l] || 0), 0); });
  const invT = d.teams.filter(t => t.kind === 'Inventory'), audT = d.teams.filter(t => t.kind === 'Audit');
  /* แถวที่ตั้งไม่นับ ไม่นับเป็นงานของใคร ทั้ง Inventory และ Audit */
  const cnt = (map, id) => gl.filter(g => map[g.group] === id && d.inv[g.group] !== ST.SKIP).reduce((s, g) => s + g.n, 0);
  const none = gl.filter(g => !d.inv[g.group]).reduce((s, g) => s + g.n, 0);
  const skipN = gl.filter(g => d.inv[g.group] === ST.SKIP).reduce((s, g) => s + g.n, 0);
  const chip = (key, label, n, cls) => `<button class="st-chip ${cls || ''} ${FILTER === key ? 'on' : ''}" data-filter="${esc(key)}">${esc(label)} <b>${f(n)}</b></button>`;
  const opt = (list, v, blank) => `<option value="" ${!v ? 'selected' : ''}>${blank}</option>` +
    list.map(t => `<option value="${esc(t.id)}" ${v === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('');

  const teamRows = d.teams.map((t, i) => `<tr>
      <td class="k">${esc(t.id)}</td><td class="mu">${t.kind}</td>
      <td><input class="st-in" data-team="${i}" data-f="name" value="${esc(t.name)}" maxlength="60"></td>
      <td><input class="st-in" data-team="${i}" data-f="members" value="${esc(t.members)}" placeholder="${t.kind === 'Audit' ? 'ชื่อคน Audit' : 'สมชาย, สมหญิง'}"></td>
      <td class="num">${f(t.kind === 'Audit' ? cnt(d.aud, t.id) : cnt(d.inv, t.id))}</td>
      <td><button class="st-x" data-del-team="${i}" aria-label="ลบทีม ${esc(t.name)}">×</button></td></tr>`).join('');

  let rows = '';
  let zone = '';
  const show = (g) => !FILTER || (FILTER === 'none' ? !d.inv[g.group] : FILTER === 'skip' ? d.inv[g.group] === ST.SKIP
    : FILTER.startsWith('a:') ? d.aud[g.group] === FILTER.slice(2) : d.inv[g.group] === FILTER);
  gl.filter(show).forEach(g => {
    if (g.zone !== zone) {
      zone = g.zone;
      const zg = gl.filter(x => x.zone === zone);
      rows += `<tr class="z"><td>โซน ${esc(zone)}</td><td class="num">${f(zg.reduce((s, x) => s + x.n, 0))}</td><td class="num">${f(zg.reduce((s, x) => s + gp[x.group], 0))}</td>
        <td><select class="st-in" data-zone-inv="${esc(zone)}" aria-label="ทีม Inventory ทั้งโซน ${esc(zone)}"><option value="">ทั้งโซน…</option>${invT.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}<option value="${ST.SKIP}">ไม่นับ</option></select></td>
        <td><select class="st-in" data-zone-aud="${esc(zone)}" aria-label="Audit ทั้งโซน ${esc(zone)}"><option value="">ทั้งโซน…</option>${audT.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}<option value="${ST.SKIP}">ไม่มี</option></select></td></tr>`;
    }

function touch(msg) { D().dirty++; TOAST = msg || ''; paintBody(); paintTabs(); }

function addLocs(list) {
  const d = D();
  const have = new Set(d.locs.map(l => ST.up(l.loc)));
  let added = 0, dup = 0;
  list.forEach(loc => {
    if (have.has(loc)) { dup++; return; }
    have.add(loc);
    const p = ST.parseLoc(loc);
    d.locs.push({ loc, zone: p.zone, group: p.group, src: 'เพิ่มเอง' });
    added++;
  });
  d.locs.sort((a, b) => ST.locCmp(a.loc, b.loc));
  if (added) touch(`✓ เพิ่ม ${added} โล${dup ? ` (มีอยู่แล้ว ${dup})` : ''}`);
  else { TOAST = dup ? `มีอยู่แล้วทั้ง ${dup} โล` : ''; paintBody(); }
}

async function saveTeams() {
  const d = D();
  const bad = d.teams.find(t => !t.name.trim());
  if (bad) { S.err = `ทีม ${bad.id} ยังไม่มีชื่อ`; paint(); return; }
  const gl = ST.groups(d.locs);
  const teams = d.teams.map(t => {
    const map = t.kind === 'Audit' ? d.aud : d.inv;
    /* แถวที่ไม่นับไม่ส่งให้ใคร แม้จะเคยแบ่ง Audit ไว้ก่อนตั้งไม่นับ หน้ากรอกจะได้ไม่มีโลที่ไม่ต้องไป */
    const zones = gl.filter(g => map[g.group] === t.id && d.inv[g.group] !== ST.SKIP).map(g => g.group);
    const members = t.members.split(',').map(s => s.trim()).filter(Boolean);
    return { id: t.id, kind: t.kind, name: t.name.trim(), members: members.length ? members : (t.kind === 'Audit' ? [t.name.trim()] : []), zones, locs: zones.reduce((s, z) => s + gl.find(g => g.group === z).n, 0) };
  });
  const skip = gl.filter(g => d.inv[g.group] === ST.SKIP).map(g => g.group);
  const locs = d.locs.map(l => [l.loc, l.zone, l.group, l.src]);
  await job('กำลังบันทึกทีม/โซน…', async () => {
    await post({ op: 'st-teams', round: S.rid, pass: 1, teams, locs, skip });
    S.head = await get('st-head', { round: S.rid });
    DRAFT = null; TOAST = '';
    S.ok = `✓ บันทึกทีม/โซนแล้ว ${teams.length} ทีม`;
  });
}

/**
 * เช็คว่าสมุดมีแถวใหม่หลังดึงยอดตั้งต้นไหม หยุดรับ-จ่ายแล้วไม่ควรมี
 * ตอนเปิดแท็บใช้ข้อมูลกลาง (เร็ว อาจช้ากว่าสมุดไม่กี่ชั่วโมง) กดปุ่ม = อ่านสมุดสด
 */
async function loadFifo(fresh) {
  const tx = WmsSettings.txUrl();
  if (!tx) throw new Error('ยังไม่มี URL Transaction ในหน้าตั้งค่า');
  let fifo = fresh ? null : await WmsGas.json(tx, 'tx-fifo&shared=1', { retries: 0 }).catch(() => null);
  if (!fifo || fifo.error || !fifo.rows) fifo = await WmsGas.json(tx, 'tx-fifo', { retries: 0 });
  if (fifo.error) throw new Error(fifo.error);
  FIFO = { data: fifo, at: Date.now() };
  return fifo;
}

async function checkMoves(fresh) {
  const tx = WmsSettings.txUrl();
  if (!tx || !R() || !R().lastRow) return;
  const run = async () => {
    const fifo = await loadFifo(fresh);
    MOVES = { list: ST.movesAfter(fifo, R().lastRow, R().cutoff), at: Date.now() };
  };
  if (!fresh) { try { await run(); } catch (e) { MOVES = { list: [], err: e.message, at: Date.now() }; } paintBody(); return; }
  await job('กำลังอ่านสมุด Transaction…', async () => { try { await run(); } catch (e) { MOVES = { list: [], err: e.message, at: Date.now() }; } });
}

function analysis() {
  if (AN && AN.head === S.head && AN.n === S.log.length && AN.since === S.since) return AN.res;
  const res = ST.analyze({ piles: S.head.piles, entries: S.log, teams: S.head.teams, locs: countLocs(), skus: S.head.skus, skip: R().settings.skip || [], pass: 1 });
  AN = { head: S.head, n: S.log.length, since: S.since, res };
  return res;
}

function ledgerHtml(l) {
  if (!FIFO) {
    if (!FIFO_BUSY && WmsSettings.txUrl()) {
      FIFO_BUSY = true;
      loadFifo(false).catch(() => { FIFO = { data: null, at: Date.now() }; }).finally(() => { FIFO_BUSY = false; if (TAB === 'analyze' || TAB === 'close') paintBody(); });

    return WmsSettings.txUrl() ? '<div class="st-led">⏳ กำลังอ่านสมุด…</div>' : '';
  }

  const a = analysis();

  const order = (g) => { const i = ST.GROUPS.indexOf(g); return i < 0 ? 99 : i; };

      <td class="num">${l.inv === null ? '—' : f(l.inv)}</td><td class="num ${l.diff < 0 ? 'neg' : l.diff > 0 ? 'pos' : ''}">${l.diff === null || l.diff === undefined ? '' : signed(l.diff)}</td>

/* ── แท็บรอบ 2: ระบบเลือกโลที่ต้องนับซ้ำ หัวหน้าปรับเกณฑ์ / ตัด / เพิ่ม / เปลี่ยนทีม ── */

/** แผนที่บันทึกในชีตแล้ว (ที่คนนับเห็น) */
function planSaved() {
  return ((S.head && S.head.plan) || []).map(p => ({ loc: p[0], row: p[1], why: p[2], team: p[3], forbid: p[4] || [], r1team: p[5] }));
}
function r2Draft() {
  if (!R2D || R2D.rid !== S.rid) R2D = { rid: S.rid, opts: ST.r2Opts(R().settings.r2) };
  return R2D;
}
function planNow() {
  const a = analysis(), key = JSON.stringify(r2Draft().opts);
  if (PN && PN.a === a && PN.key === key && PN.head === S.head) return PN.p;
  const p = ST.plan2(a, { teams: S.head.teams, locs: countLocs(), opts: r2Draft().opts });
  PN = { a, key, head: S.head, p };
  return p;
}
/** แผนที่คิดตอนนี้ต่างจากที่บันทึกไหม (โลหรือทีมเปลี่ยน) */
function planDiff(p) {
  const now = new Map(ST.planRows(p).map(r => [r[0], r[3]]));
  const saved = planSaved();
  return now.size !== saved.length || saved.some(s => now.get(s.loc) !== s.team);
}
function tName(id) { const t = S.head.teams.find(x => x.id === id && x.pass === 1); return t ? t.name : id || '—'; }
function after1() { const r = R(); return r.pass > 0 && r.status !== 'ตั้งค่า' && r.status !== 'นับรอบ 1'; }

function round2View() {
  const r = R();
  if (!after1()) return `<div class="st-empty">ปิดรับนับรอบ 1 ก่อน แล้วระบบจะเลือกโลที่ต้องนับซ้ำให้<br><button class="st-btn" data-go="analyze">ไปแท็บวิเคราะห์</button></div>`;
  const closed = r.status === 'ปิดแล้ว';
  const d = r2Draft(), o = d.opts;
  const p = planNow();
  const saved = planSaved();
  const savedMap = new Map(saved.map(x => [x.loc, x.team]));
  const pr = ST.progress2(saved, S.log);
  const changed = planDiff(p) || JSON.stringify(o) !== JSON.stringify(ST.r2Opts(r.settings.r2));
  const inv = ST.teamsOf(S.head.teams, 1).filter(t => t.kind === 'Inventory');
  const chip = (key, label, val, cls) => `<button class="st-chip ${cls || ''} ${FILTER === key ? 'on' : ''}" data-filter="${esc(key)}">${esc(label)} <b>${val}</b></button>`;

  else if (r.status === 'นับรอบ 2') band = `<div class="st-warn"><b>กำลังนับรอบ 2</b> · นับแล้ว ${f(pr.done)}/${f(pr.total)} โล (${pr.pct}%) · คนนับเปิดลิงก์เดิม เลือกทีมใหม่

  else if (saved.length && !changed) band = `<div class="st-warn">บันทึกแผนแล้ว ${f(saved.length)} โล · ส่งลิงก์คนนับเดิมได้เลย
      <button class="st-btn p" data-act="start2">เปิดนับรอบ 2</button></div>`;
  else band = `<div class="st-note" style="margin:0 0 8px">ระบบเลือกโลจากผลรอบ 1 ตามเกณฑ์ข้างล่าง · ทีมที่นับรอบ 2 ไม่ใช่ทีมเดิม และคนที่นับโลนั้นในรอบ 1 นับซ้ำไม่ได้

  const gchips = ST.GROUPS.map(g => `<button class="st-chip ${o.groups.includes(g) ? 'on' : ''}" data-r2g="${esc(g)}" ${closed ? 'disabled' : ''}>${esc(g)} <b>${f(p.counts.tags[g] || 0)}</b></button>`).join('');
  const hot = p.hot.filter(h => h.bad).slice(0, 6).map(h =>
    `<span class="st-chip plain ${h.on ? 'amber' : ''}">${esc(h.row)} <b>${h.bad}/${h.checked}</b> ${h.pct}%${h.on ? ' · ทั้งแถว' : ''}</span>`).join('');
  const teamChips = inv.map(t => {
    const n = picked.filter(l => l.team === t.id).length;

  const show = p.locs.filter(l => {

    return true;
  });
  /* โลในแผนที่บันทึกแต่ไม่อยู่ในแผนที่คิดตอนนี้ (เกณฑ์เปลี่ยน) ยังแสดงให้เห็นว่าคนนับยังเห็นอยู่ */
  const gone = saved.filter(s => !p.locs.some(l => l.loc === s.loc));

      : savedMap.get(l.loc) !== l.team ? '<td class="mu">ทีมเปลี่ยน</td>'

    return `<tr class="${l.drop ? 'off' : ''}"><td><input type="checkbox" class="st-chk" data-r2drop="${esc(l.loc)}" ${l.drop ? '' : 'checked'} ${closed ? 'disabled' : ''} aria-label="นับซ้ำ ${esc(l.loc)}"></td>

      <td>${l.drop ? '' : `<select class="st-in ${l.team ? '' : 'none'}" data-r2team="${esc(l.loc)}" ${closed ? 'disabled' : ''} aria-label="ทีมรอบ 2 ${esc(l.loc)}">${l.team ? '' : '<option value="">ไม่มีทีม</option>'}${opt(l.team)}</select>`}</td>
      <td class="mu">${esc(l.forbid.join(', ') || '—')}</td>${l.drop ? '<td></td>' : st}</tr>`;
  }).join('') + (FILTER ? '' : gone.map(s => `<tr class="off"><td></td><td class="k">${esc(s.loc)}</td><td>${esc(s.why)}</td><td class="mu">${esc(tName(s.r1team))}</td>
      <td class="mu">${esc(tName(s.team))}</td><td class="mu">${esc(s.forbid.join(', ') || '—')}</td><td class="mu">หลุดเกณฑ์ (บันทึกใหม่จะเอาออก)</td></tr>`).join(''));

  return `${band}
    <div class="st-bar"><span class="st-lbl">นับซ้ำ</span>${gchips}
      <span class="st-lbl">ต่าง ≥</span><input class="st-num" id="r2Min" type="number" min="0" step="1" value="${esc(o.minQty)}" ${closed ? 'disabled' : ''} aria-label="ต่างกันกี่ชิ้นขึ้นไปถึงนับซ้ำ">
      <span class="st-lbl">นับทั้งแถวเมื่อ Audit ไม่ตรง ≥</span><input class="st-num" id="r2Hot" type="number" min="0" max="100" step="5" value="${esc(o.hotPct)}" ${closed ? 'disabled' : ''} aria-label="เปอร์เซ็นต์ที่ Audit ไม่ตรงในแถว"><span class="st-lbl">%</span>
      <span class="st-lbl">สุ่ม ≥</span><input class="st-num" id="r2HotMin" type="number" min="1" step="1" value="${esc(o.hotMin)}" ${closed ? 'disabled' : ''} aria-label="Audit ต้องสุ่มอย่างน้อยกี่โล"><span class="st-lbl">โล</span>
    </div>
    ${hot ? `<div class="st-bar"><span class="st-lbl">Audit ไม่ตรงในแถว</span>${hot}</div>` : ''}
    ${p.warn.length ? `<div class="st-warn">${p.warn.slice(0, 5).map(esc).join('<br>')}${p.warn.length > 5 ? `<br>และอีก ${p.warn.length - 5} ข้อ` : ''}</div>` : ''}
    <div class="st-bar">
      ${chip('', 'นับซ้ำ', f(picked.length))}${teamChips}
      ${leftN ? chip('left', 'ยังไม่นับ', f(leftN), 'red') : ''}
      ${dropN ? chip('drop', 'ตัดออก', f(dropN)) : ''}
      <span class="sp"></span>
      ${closed ? '' : '<input class="st-add" id="r2Add" placeholder="+ โล เช่น R1-07-01" aria-label="เพิ่มโลที่ต้องนับซ้ำ">'}
    </div>
    <div class="st-wrap"><table class="st-xl"><thead><tr><th></th><th>Location</th><th>เหตุผล</th><th>ทีมรอบ 1</th><th>ไปนับรอบ 2</th><th>ห้ามนับ</th><th>รอบ 2</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="mu">${p.locs.length ? 'ไม่มีโลตามที่กรอง' : 'ไม่มีโลที่ต้องนับซ้ำตามเกณฑ์นี้'}</td></tr>`}</tbody></table></div>
    ${show.length > AN_LIMIT ? `<div class="st-note">แสดง ${AN_LIMIT} จาก ${f(show.length)} โล — กดชิปเพื่อกรอง</div>` : ''}
    ${pr.extra.length ? `<div class="st-note">นับรอบ 2 นอกแผน (ไม่เอามาคิด): ${pr.extra.map(esc).join(', ')}</div>` : ''}
    ${closed ? '' : `<div class="st-save"><span>${changed ? '<b>แผนเปลี่ยน ยังไม่บันทึก</b>' : saved.length ? `บันทึกแล้ว ${esc(r.settings.planAt || '')}` : 'ยังไม่ได้บันทึกแผน'}</span><span class="sp"></span>
      ${changed && saved.length ? '<button class="st-btn" data-act="r2-undo">กลับไปแผนที่บันทึก</button>' : ''}
      <button class="st-btn p" data-act="plan-save" ${S.busy || !picked.length ? 'disabled' : ''}>บันทึกแผน ${f(picked.filter(l => l.team).length)} โล</button></div>`}`;
}

function r2Set(fn) {
  const d = r2Draft();
  fn(d.opts);
  d.opts = ST.r2Opts(d.opts);
  paintBody();
}

function addR2(list) {
  if (!list.length) return;
  r2Set(o => {
    list.forEach(l => {
      if (!o.add.includes(l)) o.add.push(l);
      o.drop = o.drop.filter(x => x !== l);
    });
  });
  TOAST = '';
}

async function savePlan() {
  const p = planNow();
  const rows = ST.planRows(p);
  if (!rows.length) { S.err = 'ไม่มีโลในแผน'; paintSrc(); return; }
  const noTeam = p.locs.filter(l => !l.drop && !l.team).length;
  if (noTeam && !confirm(`มี ${noTeam} โลที่ยังไม่มีทีม จะไม่อยู่ในแผน บันทึกต่อไหม?`)) return;
  await job('กำลังบันทึกแผนรอบ 2…', async () => {
    const res = await post({ op: 'st-plan', round: S.rid, plan: rows, opts: r2Draft().opts });
    S.head = await get('st-head', { round: S.rid });
    R2D = null;
    S.ok = `✓ บันทึกแผนรอบ 2 แล้ว ${f(res.plan.length)} โล${res.added ? ` · เพิ่มโลใหม่ในรายการ ${res.added}` : ''}`;
  });
}

/* ── แท็บปิดรอบ: ยอดสุดท้าย หัวหน้าแก้ได้ อนุมัติแล้วได้ไฟล์ปรับยอด ── */

function analysis2() {
  const plan = planSaved();
  if (!plan.length) return null;
  if (AN2 && AN2.head === S.head && AN2.n === S.log.length && AN2.since === S.since) return AN2.res;
  const locs = plan.map(x => x.loc);
  const res = ST.analyze({ piles: S.head.piles, entries: S.log, teams: S.head.teams, locs: locs.map(loc => ({ loc })), skus: S.head.skus, pass: 2, only: locs });
  AN2 = { head: S.head, n: S.log.length, since: S.since, res };
  return res;
}
function editKey() { return 'wms:st:edit:' + S.rid; }
function edits() {
  if (!EDITS || EDITS.rid !== S.rid) {
    let map = {};
    try { map = JSON.parse(load(editKey()) || '{}') || {}; } catch (e) { map = {}; }
    EDITS = { rid: S.rid, map };
  }
  return EDITS.map;
}
function setEdit(id, v) {
  const m = edits();
  if (v === null) delete m[id]; else m[id] = v;
  save(editKey(), JSON.stringify(m));
}
function finals() { return ST.finalLines(analysis(), analysis2(), planSaved(), edits()); }

/** แถวผลสรุปที่เก็บตอนปิดรอบ → หน้าตาเดียวกับ finalLines ไว้วาดตาราง (อ่านอย่างเดียว) */
function fromSum(r, i) {
  const n = (v) => (v === '' || v === null || v === undefined ? null : +v);
  const src = (String(r[13]).match(/^ยอดจาก(\S+ ?\d?)/) || [])[1] || '';
  return { id: 's' + i, loc: r[0], sku: r[1], long: r[2], name: r[3], lot: r[4], po: r[5], book: +r[6] || 0, r1: n(r[7]), aud: n(r[8]), r2: n(r[9]),
    final: +r[10] || 0, adj: +r[11] || 0, group: r[12], note: r[13], src: src.trim(),
    flag: Object.values(ST.FLAG).find(x => String(r[13]).includes(' · ' + x)) || '', teamText: r[14], whoText: r[15] };
}

function closeView() {
  const r = R();
  if (!after1()) return `<div class="st-empty">ปิดรับนับรอบ 1 ก่อน แล้วค่อยตรวจยอดสุดท้าย<br><button class="st-btn" data-go="analyze">ไปแท็บวิเคราะห์</button></div>`;
  const closed = r.status === 'ปิดแล้ว';
  const fin = closed ? (S.head.sum || []).map(fromSum) : finals();
  const t = ST.finalTotals(fin);
  const ed = closed ? {} : edits();
  const T = analysis().teamName;
  const chip = (key, label, val, cls) => `<button class="st-chip ${cls || ''} ${FILTER === key ? 'on' : ''}" data-filter="${esc(key)}">${esc(label)} <b>${val}</b></button>`;
  const q = ST.up(AQ);
  const list = fin.filter(l => {
    if (FILTER === 'all') { /* ทุกรายการ */ }
    else if (FILTER === 'ok') { if (l.adj) return false; }
    else if (FILTER.startsWith('s:')) { if (l.src !== FILTER.slice(2)) return false; }
    else if (FILTER.startsWith('f:')) { if (l.flag !== FILTER.slice(2)) return false; }
    else if (!l.adj && !l.flag && l.src !== ST.SRC.EDIT) return false;
    return !q || ST.up(l.loc).includes(q) || ST.up(l.sku).includes(q) || ST.up(l.long).includes(q) || ST.up(l.name).includes(q);
  });
  const cell = (v) => (v === null || v === undefined ? '' : f(v));
  const rows = list.slice(0, AN_LIMIT).map(l => {
    const open = OPEN.has('c:' + l.id);
    const edited = !closed && l.src === ST.SRC.EDIT;
    const fcell = closed ? `<td class="num k">${f(l.final)}</td>`
      : `<td><input class="st-in num ${edited ? 'ed' : ''}" data-edit="${esc(l.id)}" value="${esc(l.final)}" inputmode="decimal" aria-label="ยอดสุดท้าย ${esc(l.loc)} ${esc(l.sku)}"></td>`;
    const who = closed ? `${esc(l.teamText || '—')} · ${esc(l.whoText || '—')}`
      : `${l.who2 && l.who2.length ? `รอบ 2: ${esc(T[l.team2] || l.team2)} · ${esc(l.who2.join(', '))} · ` : ''}รอบ 1: ${esc(T[l.team] || l.team || '—')} · ${esc((l.who || []).join(', ') || '—')}`;
    return `<tr><td><span class="st-g ${GCLS[l.group] || ''}">${esc(l.group)}</span>${l.flag ? `<span class="st-flag">${esc(l.flag)}</span>` : ''}</td>
      <td class="k">${esc(l.loc)}</td><td>${esc(l.sku)}</td><td class="mu">${esc(l.name)}</td><td>${esc(l.lot)}</td><td>${esc(l.po)}</td>
      <td class="num">${f(l.book)}</td><td class="num">${cell(l.r1)}</td><td class="num">${cell(l.aud)}</td><td class="num">${cell(l.r2)}</td>
      ${fcell}<td class="num ${l.adj < 0 ? 'neg' : l.adj > 0 ? 'pos' : ''}">${l.adj ? signed(l.adj) : ''}</td><td class="mu">${esc(l.src)}</td>
      <td><button class="st-i ${open ? 'on' : ''}" data-open="c:${esc(l.id)}" aria-label="รายละเอียด ${esc(l.loc)} ${esc(l.sku)}">i</button></td></tr>` +
      (open ? `<tr class="info"><td colspan="14">${closed ? esc(l.note) : `<b>ยอดจาก${esc(l.src)}</b>${l.flag ? ' · ' + esc(l.flag) : ''}${edited ? ` · ระบบคิดได้ ${f(l.auto)} <button class="st-btn" data-unedit="${esc(l.id)}">ใช้ค่าระบบ</button>` : ''}${l.note ? '<br>' + esc(l.note) : ''}`}
        <br>${who}${l.sku && !closed ? ledgerHtml(l) : ''}</td></tr>` : '');
  }).join('');
  const sc = (s) => (t.src[s] ? chip('s:' + s, s, f(t.src[s]), s === ST.SRC.EDIT ? 'amber' : '') : '');

    : r.status === 'นับรอบ 2' ? `<div class="st-warn">ยังเปิดนับรอบ 2 อยู่ ตัวเลขยังเปลี่ยนได้ · <button class="st-btn" data-go="round2">ดูรอบ 2</button></div>`
    : !planSaved().length ? '<div class="st-note" style="margin:0 0 8px">ไม่มีแผนรอบ 2 — ยอดสุดท้ายใช้ผลรอบ 1 · ⓘ ดูคนนับ แก้ตัวเลขในช่องยอดสุดท้ายได้</div>' : '';
  return `${band}<div class="st-tot">
      <span>สมุด <b>${f(t.book)}</b></span><span>ยอดสุดท้าย <b>${f(t.final)}</b></span>
      <span>ปรับเพิ่ม <b>+${f(t.plus)}</b></span><span>ปรับลด <b>−${f(t.minus)}</b></span><span>สุทธิ <b>${signed(t.net)}</b></span><span class="sp"></span>
      <button class="st-btn" data-act="xlsx" ${S.busy ? 'disabled' : ''}>Excel ปรับยอด${closed ? '' : ' (ร่าง)'}</button>
    </div>
    <div class="st-bar">
      ${chip('', 'ต้องดู', f(fin.filter(l => l.adj || l.flag || l.src === ST.SRC.EDIT).length), 'red')}
      ${chip('all', 'ทั้งหมด', f(t.lines))}${chip('ok', 'ตรง', f(t.lines - t.adjLines), 'green')}
      ${closed ? '' : sc(ST.SRC.R2) + sc(ST.SRC.R1) + sc(ST.SRC.EDIT) + fc(ST.FLAG.WAIT, 'amber') + fc(ST.FLAG.ODD, 'amber') + fc(ST.FLAG.NONE, 'red')}
      <span class="sp"></span><input class="st-q" id="anQ" placeholder="ค้นหา โล / SKU / ชื่อ" value="${esc(AQ)}" aria-label="ค้นหาในยอดสุดท้าย">
    </div>
    <div class="st-wrap"><table class="st-xl"><thead><tr><th>กลุ่ม</th><th>Location</th><th>SKU</th><th>ชื่อ</th><th>LOT</th><th>PO</th>
      <th class="num">สมุด</th><th class="num">รอบ 1</th><th class="num">Audit</th><th class="num">รอบ 2</th><th class="num">ยอดสุดท้าย</th><th class="num">ปรับ</th><th>จาก</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="14" class="mu">${fin.length ? 'ไม่มีรายการตามที่กรอง' : 'ยังไม่มีผลนับ'}</td></tr>`}</tbody></table></div>
    ${list.length > AN_LIMIT ? `<div class="st-note">แสดง ${AN_LIMIT} จาก ${f(list.length)} รายการ — กดชิปหรือค้นหาเพื่อกรอง</div>` : ''}
    ${closed ? '' : `<div class="st-save"><span>${Object.keys(ed).length ? `<b>แก้ตัวเลขเอง ${Object.keys(ed).length} รายการ</b> (เก็บในเครื่องนี้จนกว่าจะอนุมัติ)` : 'ยอดจากรอบ 2 ถ้านับซ้ำ ไม่งั้นรอบ 1 · แก้ได้ในช่องยอดสุดท้าย'}</span><span class="sp"></span>
      <input class="st-ap" id="apName" maxlength="60" placeholder="ชื่อคนอนุมัติ" value="${esc(who())}" aria-label="ชื่อคนอนุมัติ">
      <button class="st-btn p" data-act="close" ${S.busy || !fin.length ? 'disabled' : ''}>อนุมัติและปิดรอบ</button></div>`}`;
}

async function closeRound() {
  const name = ($('apName') && $('apName').value.trim()) || '';
  if (!name) { S.err = 'ใส่ชื่อคนอนุมัติก่อน'; paintSrc(); if ($('apName')) $('apName').focus(); return; }
  const fin = finals();
  const t = ST.finalTotals(fin);
  const warn = [];
  if (R().status === 'นับรอบ 2') warn.push('ยังเปิดนับรอบ 2 อยู่ ปิดแล้วเครื่องที่ค้างส่งจะส่งไม่ได้');
  if (t.flag[ST.FLAG.WAIT]) warn.push(`ค้างรอบ 2 ${f(t.flag[ST.FLAG.WAIT])} รายการ (ใช้ยอดรอบ 1)`);
  if (t.flag[ST.FLAG.NONE]) warn.push(`ไม่ได้นับ ${f(t.flag[ST.FLAG.NONE])} รายการ (ใช้ยอดสมุด)`);
  if (!confirm(`อนุมัติยอดสุดท้ายและปิดรอบ?\n\nผู้อนุมัติ: ${name}\n${f(t.lines)} รายการ · ต้องปรับ ${f(t.adjLines)}\nปรับเพิ่ม +${f(t.plus)} · ปรับลด −${f(t.minus)} · สุทธิ ${signed(t.net)}\n` +
    (warn.length ? '\n⚠ ' + warn.join('\n⚠ ') + '\n' : '') + '\nปิดแล้วแก้ไม่ได้ คนนับส่งผลไม่ได้อีก')) return;
  await job('กำลังปิดรอบ…', async () => {
    const res = await post({ op: 'st-close', round: S.rid, approver: name, lines: ST.closeRows(fin, analysis().teamName), totals: t });
    S.head = await get('st-head', { round: S.rid });
    S.rounds = (await get('st-rounds')).rounds;
    S.ok = `✓ ปิดรอบแล้ว อนุมัติโดย ${res.round.approvedBy} · ${f(res.saved)} รายการ — โหลด Excel ปรับยอดได้เลย`;
  });
}

function xlsxLib() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSX_LOAD) {
    XLSX_LOAD = new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = XLSX_URL;
      s.onload = () => ok(window.XLSX);
      s.onerror = () => { XLSX_LOAD = null; bad(new Error('โหลดตัวสร้างไฟล์ Excel ไม่ได้ ลองใหม่อีกครั้ง')); };
      document.head.appendChild(s);
    });
  }
  return XLSX_LOAD;
}

/** สามชีต: ปรับยอด · จับคู่ย้ายโล/แก้ LOT · สรุป (ปิดแล้วใช้ผลสรุปที่อนุมัติ ยังไม่ปิด = ร่างจากตัวเลขตอนนี้) */
async function downloadXlsx() {
  const r = R();
  const closed = r.status === 'ปิดแล้ว';
  const rows = closed ? (S.head.sum || []) : ST.closeRows(finals(), analysis().teamName);
  await job('กำลังสร้างไฟล์ Excel…', async () => {
    const X = await xlsxLib();
    const wb = X.utils.book_new();
    ST.adjustBook(rows, { id: r.id, name: r.name, date: r.date, cutoff: r.cutoff, approvedBy: closed ? r.approvedBy : '', approvedAt: closed ? r.approvedAt : '' }).forEach(sh => {
      const ws = X.utils.aoa_to_sheet(sh.aoa);
      ws['!cols'] = sh.cols.map(w => ({ wch: w }));
      if (sh.aoa.length > 1 && sh.aoa[0].length > 2) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: sh.aoa.length - 1, c: sh.aoa[0].length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, sh.name);
    });
    X.writeFile(wb, `ปรับยอด-${r.id}${closed ? '' : '-ร่าง'}.xlsx`);
    S.ok = closed ? '✓ โหลด Excel ปรับยอดแล้ว' : '✓ โหลด Excel ร่างแล้ว (ยังไม่อนุมัติ)';
  });
}

async function copyLink() {
  const text = link();
  try { await navigator.clipboard.writeText(text); S.ok = '✓ คัดลอกลิงก์คนนับแล้ว ส่งใน LINE ได้เลย'; }
  catch (e) { prompt('คัดลอกลิงก์นี้', text); }
  S.err = ''; paintSrc();
}

async function saveRound() {
  const r = S.rid === 'new' ? null : R();
  const body = {
    id: r ? r.id : '', name: $('fName').value, date: $('fDate').value, cutoff: $('fCut').value,
    settings: { ...(r ? r.settings : {}), auditMin: Math.max(0, Math.min(100, +$('fAud').value || 0)) },
  };
  await job(r ? 'กำลังบันทึกรอบ…' : 'กำลังสร้างรอบ…', async () => {
    const res = await post({ op: 'st-round-save', round: body });
    S.rid = res.round.id;
    S.rounds = (await get('st-rounds')).rounds;
    await loadHead();

  });
}

async function setStatus(status) {
  const was = R() && R().status;
  await job('กำลังเปลี่ยนสถานะ…', async () => {
    await post({ op: 'st-status', round: S.rid, status });
    S.head = await get('st-head', { round: S.rid });
    S.rounds = (await get('st-rounds')).rounds;
    S.ok = status === 'ตั้งค่า' ? 'กลับไปตั้งค่าแล้ว ผลนับที่ส่งมาแล้วยังอยู่ครบ'
      : status === 'วิเคราะห์' ? (was === 'นับรอบ 2' ? '✓ ปิดรับนับรอบ 2 แล้ว ตรวจยอดสุดท้ายในแท็บปิดรอบ' : '✓ ปิดรับนับรอบ 1 แล้ว ดูผลในแท็บวิเคราะห์')
      : status === 'นับรอบ 2' ? '✓ เปิดนับรอบ 2 แล้ว คนนับเปิดลิงก์เดิมแล้วเลือกทีมใหม่'
      : was === 'วิเคราะห์' ? '✓ เปิดนับรอบ 1 ต่อแล้ว' : '✓ เริ่มนับรอบ 1 แล้ว ส่งลิงก์ให้คนนับได้เลย';
  });
}

async function saveCfg() {
  const url = $('cfgUrl').value.trim(), tok = $('cfgTok').value.trim();
  if (!url || !tok) { S.err = 'ใส่ทั้ง URL และรหัสหัวหน้า'; paint(); return; }
  WmsSettings.setStUrl(url); WmsSettings.setStToken(tok);
  await job('กำลังทดสอบ…', async () => {
    const hi = await WmsGas.json(url, 'x', { retries: 0 });
    if (!hi || hi.app !== 'stocktake') throw new Error('URL นี้ไม่ใช่สคริปต์นับสต๊อก (stocktake-api.gs)');
    S.rounds = (await get('st-rounds')).rounds;
    S.rid = S.rounds[0] ? S.rounds[0].id : 'new';
    if (S.rid !== 'new') await loadHead();
    S.ok = '✓ เชื่อมชีตนับสต๊อกแล้ว';
  });
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.tab) {
    if (d.tab === TAB) return;
    TAB = d.tab; FILTER = ''; TOAST = ''; AQ = '';
    history.replaceState(null, '', '?tab=' + TAB);
    paint();
    if (TAB === 'progress' && S.head && !MOVES) checkMoves(false);
    return;
  }
  if (d.go) { TAB = d.go; FILTER = ''; AQ = ''; history.replaceState(null, '', '?tab=' + TAB); paint(); return; }
  if (d.filter !== undefined) { FILTER = FILTER === d.filter ? '' : d.filter; paintBody(); return; }
  if (d.open) { OPEN.has(d.open) ? OPEN.delete(d.open) : OPEN.add(d.open); paintBody(); return; }
  if (d.r2g) { r2Set(o => { o.groups = o.groups.includes(d.r2g) ? o.groups.filter(g => g !== d.r2g) : o.groups.concat([d.r2g]); }); return; }
  if (d.unedit) { setEdit(d.unedit, null); paintBody(); return; }
  if (d.addTeam) {
    const id = nextId(d.addTeam);
    D().teams.push({ id, kind: d.addTeam, name: d.addTeam === 'Audit' ? '' : 'ทีม ' + id.replace('INV', ''), members: '' });
    touch();
    return;
  }
  if (d.delTeam !== undefined) {
    const t = D().teams[+d.delTeam];
    if (!confirm(`ลบ ${t.name || t.id}? แถวที่ทีมนี้ได้จะกลับเป็นยังไม่มีทีม`)) return;
    D().teams.splice(+d.delTeam, 1);
    [D().inv, D().aud].forEach(m => Object.keys(m).forEach(g => { if (m[g] === t.id) delete m[g]; }));
    touch();
    return;
  }
  if (d.auto) {
    const dd = D();
    const gl = ST.groups(dd.locs).filter(g => dd.inv[g.group] !== ST.SKIP);
    const ids = dd.teams.filter(t => t.kind === (d.auto === 'aud' ? 'Audit' : 'Inventory')).map(t => t.id);
    const split = ST.autoSplit(gl, ids);
    Object.assign(d.auto === 'aud' ? dd.aud : dd.inv, split);
    touch(`✓ แบ่ง ${d.auto === 'aud' ? 'Audit' : 'Inventory'} ${ids.length} ${d.auto === 'aud' ? 'คน' : 'ทีม'} แล้ว ตรวจแล้วกดบันทึก`);
    return;
  }
  const act = d.act;
  if (act === 'reload') loadRounds();
  else if (act === 'copy') copyLink();
  else if (act === 'share') navigator.share({ title: 'ลิงก์นับสต๊อก ' + (R() ? R().name : ''), url: link() }).catch(() => {});
  else if (act === 'base') pullBase();
  else if (act === 'start') setStatus('นับรอบ 1');
  else if (act === 'pause') { if (confirm('กลับไปตั้งค่า? คนนับจะยังส่งผลที่ค้างในเครื่องได้ แต่หน้ากรอกจะขึ้นว่ายังไม่เปิดนับ')) setStatus('ตั้งค่า'); }
  else if (act === 'round-save') saveRound();
  else if (act === 'teams-save') saveTeams();
  else if (act === 'undo') { DRAFT = null; TOAST = ''; paint(); }
  else if (act === 'cfg') saveCfg();
  else if (act === 'moves') checkMoves(true);
  else if (act === 'summary') saveSummary();
  else if (act === 'close1') { if (confirm('ปิดรับนับรอบ 1?\nเครื่องที่ยังค้างส่งจะยังส่งเข้ามาได้ ย้อนกลับไปนับต่อได้')) setStatus('วิเคราะห์'); }
  else if (act === 'reopen') setStatus('นับรอบ 1');
  else if (act === 'plan-save') savePlan();
  else if (act === 'r2-undo') { R2D = null; paintBody(); }
  else if (act === 'start2') {
    const n = planSaved().length;
    if (planDiff(planNow()) && !confirm('แผนที่แสดงอยู่ยังไม่ได้บันทึก คนนับจะเห็นแผนที่บันทึกล่าสุด เปิดนับต่อไหม?')) return;
    if (confirm(`เปิดนับรอบ 2 (${n} โล)?\nคนนับเปิดลิงก์เดิม เลือกทีมใหม่ ระบบห้ามคนที่นับโลนั้นในรอบ 1 นับซ้ำ\nเปิดแล้วกลับไปนับรอบ 1 ไม่ได้`)) setStatus('นับรอบ 2');
  }
  else if (act === 'stop2') { if (confirm('ปิดรับนับรอบ 2?\nเครื่องที่ค้างส่งยังส่งเข้ามาได้ เปิดนับต่อได้')) setStatus('วิเคราะห์'); }
  else if (act === 'xlsx') downloadXlsx();
  else if (act === 'close') closeRound();
});

document.addEventListener('change', (e) => {
  const t = e.target, d = t.dataset;
  if (t.id === 'rsel') {
    S.rid = t.value; S.err = ''; S.ok = '';
    if (S.rid === 'new') { S.head = null; TAB = 'setup'; paint(); return; }
    job('กำลังโหลดรอบ…', loadHead);
    return;
  }
  if (d.r2drop !== undefined) { r2Set(o => { o.drop = t.checked ? o.drop.filter(l => l !== d.r2drop) : o.drop.concat([d.r2drop]); }); return; }
  if (d.r2team !== undefined) {
    const l = planNow().locs.find(x => x.loc === d.r2team);
    r2Set(o => { if (!t.value || (l && t.value === l.auto)) delete o.set[d.r2team]; else o.set[d.r2team] = t.value; });
    return;
  }
  if (t.id === 'r2Min' || t.id === 'r2Hot' || t.id === 'r2HotMin') {
    const k = { r2Min: 'minQty', r2Hot: 'hotPct', r2HotMin: 'hotMin' }[t.id];
    r2Set(o => { o[k] = t.value === '' ? undefined : +t.value; });
    return;
  }
  if (d.edit !== undefined) {
    const raw = t.value.replace(/,/g, '').trim();
    const v = Number(raw);
    if (raw === '') setEdit(d.edit, null);
    else if (!isFinite(v) || v < 0) { S.err = 'ยอดสุดท้ายต้องเป็นตัวเลขไม่ติดลบ'; paintSrc(); t.focus(); return; }
    else setEdit(d.edit, v);
    S.err = '';
    paintBody(); paintSrc();
    return;
  }
  if (d.inv !== undefined) { D().inv[d.inv] = t.value; if (!t.value) delete D().inv[d.inv]; touch(); return; }
  if (d.aud !== undefined) { D().aud[d.aud] = t.value; if (!t.value) delete D().aud[d.aud]; touch(); return; }
  if (d.zoneInv !== undefined || d.zoneAud !== undefined) {
    if (!t.value) return;
    const dd = D(), zone = d.zoneInv ?? d.zoneAud, map = d.zoneInv !== undefined ? dd.inv : dd.aud;
    ST.groups(dd.locs).filter(g => g.zone === zone).forEach(g => {
      if (t.value === ST.SKIP && map === dd.aud) delete map[g.group]; else map[g.group] = t.value;
    });
    touch();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'anQ') {
    AQ = e.target.value;
    const pos = e.target.selectionStart;
    paintBody();
    const el = $('anQ'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    return;
  }
  const d = e.target.dataset;
  if (d.team === undefined) return;
  const team = D().teams[+d.team];
  team[d.f] = e.target.value;
  if (!D().dirtyTyping) { D().dirtyTyping = 1; D().dirty++; }
  const bar = document.querySelector('.st-save span');
  if (bar) bar.innerHTML = `<b>แก้แล้ว ${D().dirty} อย่าง ยังไม่บันทึก</b>`;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'addLoc') {
    addLocs(ST.parseLocList(e.target.value));
    setTimeout(() => { const el = $('addLoc'); if (el) el.focus(); }, 0);
  }
  if (e.key === 'Enter' && e.target.id === 'r2Add') {
    addR2(ST.parseLocList(e.target.value));
    setTimeout(() => { const el = $('r2Add'); if (el) el.focus(); }, 0);
  }
  /* Enter ในช่องยอดสุดท้าย = ไปช่องถัดลงไป เหมือนกรอกในชีต */
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.edit !== undefined) {
    e.preventDefault();
    const all = [...document.querySelectorAll('[data-edit]')];
    const next = all[all.indexOf(e.target) + 1];
    const id = next && next.dataset.edit;
    e.target.blur();
    if (id) setTimeout(() => { const el = document.querySelector(`[data-edit="${CSS.escape(id)}"]`); if (el) { el.focus(); el.select(); } }, 0);
  }
});

/* วางรายการ Location ที่ไหนก็ได้บนแท็บทีม/โซน หรือแท็บรอบ 2 (นอกช่องพิมพ์) เหมือนวางลงชีต */
document.addEventListener('paste', (e) => {
  if ((TAB !== 'teams' && TAB !== 'round2') || !S.head) return;
  const box = TAB === 'teams' ? 'addLoc' : 'r2Add';
  const tag = (e.target.tagName || '').toLowerCase();
  if ((tag === 'input' && e.target.id !== box) || tag === 'textarea' || tag === 'select') return;
  if (TAB === 'round2' && (!after1() || R().status === 'ปิดแล้ว')) return;
  const list = ST.parseLocList((e.clipboardData || window.clipboardData).getData('text'));
  if (!list.length) return;
  e.preventDefault();
  if (TAB === 'teams') addLocs(list); else addR2(list);
  if (e.target.id === box) e.target.value = '';
});

/* ความคืบหน้าสด: ขอเฉพาะแถวใหม่ทุกนาทีตอนเปิดแท็บนี้อยู่ */
/* ไม่วาดใหม่ตอนกำลังพิมพ์ในช่องของตาราง (ยอดสุดท้าย / ค่าตั้งรอบ 2) ตัวที่พิมพ์จะได้ไม่หาย */
function typing() { const a = document.activeElement; return !!a && a.tagName === 'INPUT' && a.closest('#body') && a.id !== 'anQ'; }
setInterval(async () => {
  if (!LIVE_TABS.includes(TAB) || document.hidden || S.busy || !S.head || S.rid === 'new' || R().status === 'ปิดแล้ว') return;
  try { await loadLog(true); if (!typing()) paintBody(); paintTabs(); } catch (e) { /* รอบหน้าค่อยลองใหม่ */ }
}, POLL_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && LIVE_TABS.includes(TAB) && S.head && R().status !== 'ปิดแล้ว' && Date.now() - S.at > POLL_MS) loadLog(true).then(() => { paintBody(); paintTabs(); }).catch(() => {});
});
window.addEventListener('beforeunload', (e) => { if (DRAFT && DRAFT.dirty) { e.preventDefault(); e.returnValue = ''; } });

paint();
loadRounds().then(() => { if (TAB === 'progress' && S.head) checkMoves(false); });
</script>
