<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>นับสต๊อกใหญ่ — WMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── แถบรอบนับ: เลือกรอบ สถานะ ลิงก์คนนับ ── */
.st-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--wms-surface2);border-bottom:1px solid var(--wms-border);font-size:12.5px;color:var(--wms-muted)}
.st-src .sp{flex:1}
.st-src select{max-width:260px;padding:5px 10px;border-radius:8px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13.5px;font-weight:600;color:var(--wms-text)}
.st-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--wms-border);
  background:var(--wms-surface);font-size:12px;color:var(--wms-muted);white-space:nowrap}
.st-pill b{color:var(--wms-text);font-weight:600}
.st-pill.go{background:#ECFDF5;border-color:#A7F3D0;color:#047857;font-weight:600}
.st-pill.warn{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.st-btn{padding:5px 12px;border-radius:999px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px;color:#334155;cursor:pointer;white-space:nowrap}
.st-btn:hover:not(:disabled){border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.st-btn.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff;font-weight:600}
.st-btn.p:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.st-btn:disabled{opacity:.55;cursor:default}
.st-btn.r{color:#B91C1C;border-color:#FECACA}
.st-btn.r:hover:not(:disabled){border-color:#DC2626;color:#991B1B}
.st-btn.rp{background:#DC2626;border-color:#DC2626;color:#fff;font-weight:600}
.st-btn.rp:hover:not(:disabled){filter:brightness(1.08);color:#fff}
/* ลบรอบ: กล่องแดง ต้องพิมพ์ชื่อรอบให้ตรงก่อน */
.st-del{margin-top:14px;max-width:620px;padding:10px 12px;border:1px solid #FECACA;border-radius:var(--wms-radius-sm);background:#FEF2F2;
  font-size:12.5px;line-height:1.6;color:#7F1D1D}
.st-del b{display:block;font-size:13.5px;color:#991B1B}
.st-del label{display:block;margin-top:8px;font-weight:600}
.st-del .st-in{display:block;max-width:380px;margin:4px 0 8px;height:30px;border-color:#FCA5A5;background:#fff}
.st-del .no{margin-top:6px;font-weight:700;color:#B91C1C}
.st-msg{width:100%;font-size:12.5px;line-height:1.5}
.st-msg.err{color:#B91C1C;font-weight:600}
.st-msg.ok{color:#047857;font-weight:600}
.st-msg.busy{color:var(--wms-primary-dark)}

/* ── เนื้อหา ── */
.st-body{padding:14px 20px 90px}
.st-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:18px 0 6px;font-size:13.5px;font-weight:700;color:var(--wms-text)}
.st-h:first-child{margin-top:0}
.st-sub{font-size:12px;font-weight:400;color:var(--wms-muted)}
.st-empty{padding:40px 20px;text-align:center;color:var(--wms-muted);font-size:14px;line-height:1.7}
.st-empty b{color:var(--wms-text)}
.st-note{margin-top:8px;font-size:12px;color:var(--wms-muted);line-height:1.6}
.st-note code{font-size:11.5px;background:var(--wms-surface2);padding:0 4px;border-radius:4px}
.st-warn{margin-bottom:10px;padding:8px 12px;border-radius:var(--wms-radius-sm);background:#FEF3C7;border:1px solid #FDE68A;
  color:#92400E;font-size:13px;line-height:1.6}
.st-warn b{font-weight:700}

/* ── ตารางแบบ Excel: แถวเตี้ย เส้นบาง ช่องแก้ได้ในตัว ── */
.st-wrap{overflow:auto;border:1px solid var(--wms-border2);border-radius:8px;background:var(--wms-surface)}
.st-xl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.st-xl th{position:sticky;top:0;z-index:1;padding:6px 8px;background:#F1F5F9;text-align:left;font-size:11.5px;font-weight:600;
  color:var(--wms-muted);border-bottom:1px solid var(--wms-border2);white-space:nowrap}
.st-xl td{height:32px;padding:0 8px;border-bottom:1px solid #EEF2F6;border-right:1px solid #EEF2F6;white-space:nowrap;color:var(--wms-text)}
.st-xl td:last-child{border-right:0}
.st-xl tbody tr:last-child td{border-bottom:0}
.st-xl .num{text-align:right;font-variant-numeric:tabular-nums}
.st-xl .k{font-weight:700}
.st-xl .mu{color:var(--wms-muted)}
.st-xl tr.z td{background:#F8FAFC;font-weight:700;border-top:1px solid var(--wms-border2)}
.st-xl tr.info td{height:auto;padding:8px 10px;background:#F8FAFC;white-space:normal;font-size:12.5px;line-height:1.7;color:var(--wms-muted)}
.st-xl tr.info b{color:var(--wms-text)}
.st-xl tr.bad td.c{color:#B91C1C;font-weight:700}
.st-xl tr.low td.c{color:#B45309;font-weight:700}
.st-xl tr.ok td.c{color:#047857;font-weight:700}
.st-xl td.full{color:#047857;font-weight:700}
.st-in{width:100%;min-width:60px;height:28px;padding:0 6px;border:1px solid transparent;border-radius:5px;background:transparent;
  font-family:var(--wms-font);font-size:13px;color:var(--wms-text)}
.st-in:hover{border-color:var(--wms-border2)}
.st-in:focus{outline:none;border-color:var(--wms-primary);background:var(--wms-surface)}
select.st-in{cursor:pointer;padding-right:2px}
.st-in.none{color:#B91C1C;font-weight:600}
.st-in.skip{color:var(--wms-faint)}
.st-x{padding:0 6px;border:0;background:none;font-size:16px;line-height:1;color:var(--wms-faint);cursor:pointer}
.st-x:hover{color:#B91C1C}
.st-i{width:24px;height:24px;border:1px solid var(--wms-border2);border-radius:999px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12px;font-weight:700;color:var(--wms-muted);cursor:pointer}
.st-i.on,.st-i:hover{border-color:var(--wms-primary);color:var(--wms-primary-dark);background:var(--wms-primary-light)}

/* ── ฟอร์มตั้งรอบ: ป้ายซ้าย ช่องขวา เหมือนชีตสองคอลัมน์ ── */
.st-form{max-width:560px}
.st-form td:first-child{width:130px;color:var(--wms-muted);font-size:12.5px}
.st-form .st-in{border-color:var(--wms-border);height:30px}
.st-form input[type=number]{width:80px}

/* ── ชิปสรุป กดกรองได้ ── */
.st-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px;font-size:12.5px;color:var(--wms-muted)}
.st-bar .sp{flex:1}
.st-chip{display:inline-flex;align-items:baseline;gap:5px;padding:3px 11px;border-radius:999px;border:1px solid var(--wms-border);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:12px;color:var(--wms-muted);cursor:pointer;white-space:nowrap}
.st-chip b{font-size:13.5px;color:var(--wms-text);font-variant-numeric:tabular-nums}
.st-chip:hover{border-color:var(--wms-primary)}
.st-chip:disabled{opacity:.6;cursor:default}
.st-ck{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--wms-muted);cursor:pointer}
.st-ck b{color:var(--wms-text)}
.st-chip.on{border-color:var(--wms-primary);background:var(--wms-primary-light);color:var(--wms-primary-dark)}
.st-chip.red b{color:#B91C1C}
.st-chip.amber b{color:#B45309}
.st-chip.green b{color:#047857}
.st-chip.plain{cursor:default}
.st-chip.plain:hover{border-color:var(--wms-border)}

/* ── ขั้นตอนเตรียมรอบ ── */
.st-steps td:first-child{width:28px;text-align:center;color:var(--wms-muted);font-size:12px}
.st-steps td.what{font-weight:700;width:120px}
.st-steps td.st-do{width:1%;text-align:right}
.st-steps td.st-do .st-btn{margin-left:4px}
.st-steps td.dt{white-space:normal;font-size:12.5px;color:var(--wms-muted);line-height:1.5;padding:6px 8px}
.st-steps td.dt b{color:var(--wms-text)}
.st-steps .yes{color:#047857;font-weight:700}
.st-steps .no{color:#B91C1C;font-weight:700}
.st-link{display:block;margin-top:4px;padding:5px 8px;border-radius:6px;background:var(--wms-surface2);font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;color:var(--wms-text);word-break:break-all;user-select:all}

.st-save{position:sticky;bottom:8px;display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 12px;
  background:var(--wms-surface);border:1px solid var(--wms-border);border-radius:var(--wms-radius);box-shadow:0 4px 14px rgba(15,23,42,.1);
  font-size:13px;color:var(--wms-muted)}
.st-save .sp{flex:1}
.st-save b{color:#B45309}
.st-add{width:130px;height:28px;padding:0 8px;border:1px dashed var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px}
.st-add:focus{outline:none;border-style:solid;border-color:var(--wms-primary)}
.st-toast{font-size:12.5px;font-weight:600;color:#047857}
.st-cfg{max-width:640px;padding:12px 14px;border:1px solid var(--wms-border);border-radius:var(--wms-radius);background:var(--wms-surface)}
.st-cfg .row{display:flex;gap:6px;margin-top:6px}
.st-cfg .row .st-in{flex:1;border-color:var(--wms-border2);height:32px}
.st-cfg ol{margin:8px 0 0 18px;font-size:12.5px;color:var(--wms-muted);line-height:1.7}
.st-more{margin-top:16px;font-size:12.5px;color:var(--wms-muted)}
.st-more summary{cursor:pointer;font-weight:600}
.st-more .st-cfg{margin-top:8px}

/* ── แท็บวิเคราะห์: ป้ายกลุ่มปัญหา ── */
.st-g{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--wms-surface2);color:var(--wms-muted);white-space:nowrap}
.st-g.short{background:#FEF2F2;color:#B91C1C}
.st-g.over{background:#EFF6FF;color:#1D4ED8}
.st-g.moved{background:#F5F3FF;color:#6D28D9}
.st-g.lotpo{background:#FFF7ED;color:#C2410C}
.st-g.typo{background:#FEF3C7;color:#92400E}
.st-g.left{background:#F1F5F9;color:#475569}
.st-g.audit{background:#ECFEFF;color:#0E7490}
.st-g.ok{background:#ECFDF5;color:#047857}
.st-xl td.neg{color:#B91C1C;font-weight:700}
.st-xl td.pos{color:#1D4ED8;font-weight:700}
.st-lbl{font-size:12px;font-weight:600;color:var(--wms-muted)}
.st-tot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:8px;font-size:13px;color:var(--wms-muted)}
.st-tot b{color:var(--wms-text);font-variant-numeric:tabular-nums}
.st-tot .sp{flex:1}
.st-q{width:190px;height:28px;padding:0 9px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px}
.st-q:focus{outline:none;border-color:var(--wms-primary)}
.st-led{margin-top:4px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7;color:var(--wms-text)}
.st-led a{color:var(--wms-primary-dark)}

/* ── รอบ 2 และปิดรอบ ── */
.st-g.edit{background:#FDF4FF;color:#A21CAF}
.st-xl td.ok{color:#047857;font-weight:700}
.st-xl tr.off td{color:var(--wms-faint)}
.st-in.num{text-align:right;font-variant-numeric:tabular-nums;border-color:var(--wms-border)}
.st-in.ed{background:#FEF3C7;border-color:#FDE68A;font-weight:700}
.st-num{width:58px;height:26px;padding:0 6px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px;text-align:right}
.st-num:focus{outline:none;border-color:var(--wms-primary)}
.st-flag{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:#FEF3C7;color:#92400E;font-size:11px;font-weight:600;white-space:nowrap}
.st-done{margin-bottom:10px;padding:8px 12px;border-radius:var(--wms-radius-sm);background:#ECFDF5;border:1px solid #A7F3D0;color:#047857;font-size:13px;line-height:1.6}
.st-done b{font-weight:700}
.st-chk{width:16px;height:16px;cursor:pointer;accent-color:var(--wms-primary);vertical-align:middle}
.st-ap{width:150px;height:30px;padding:0 9px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px}
.st-ap:focus{outline:none;border-color:var(--wms-primary)}
/* แท็บตั้งต้นสมุด: ช่อง LOT/PO ที่ประมาณจาก GR สีเหลือง ที่ยังไม่รู้สีแดง */
.op-in{width:170px;height:28px;padding:0 8px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12.5px}
.op-in:focus{outline:none;border-color:var(--wms-primary)}
.op-in.nm{width:110px}
.st-xl td.est{background:#FEF3C7}
.st-xl td.unk{color:#B91C1C;font-weight:600}
.st-xl td.nt{max-width:340px;overflow:hidden;text-overflow:ellipsis}

/* ── ห้องควบคุมการนับ: ตัวเลขสรุป ผังคลังสด ช่องทีม เรื่องที่ต้องดู ── */
.ct-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
.ct-kpi{min-width:0;padding:10px 14px;border-radius:var(--wms-radius-sm);background:var(--wms-surface);border:1px solid var(--wms-border)}
.ct-kpi .lb{font-size:12px;color:var(--wms-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-kpi .v{font-size:26px;font-weight:700;line-height:1.25;color:var(--wms-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.ct-kpi .sub{min-height:18px;font-size:12px;color:var(--wms-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-kpi .bar,.ct-team .bar{height:5px;border-radius:3px;background:#E2E8F0;overflow:hidden}
.ct-kpi .bar{margin-top:6px}
.ct-kpi .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6366F1,#22C55E);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ct-kpi .tg{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--wms-muted)}
.ct-kpi .tg input{height:24px;padding:0 4px;border:1px solid var(--wms-border2);border-radius:6px;background:var(--wms-surface);
  font-family:var(--wms-font);font-size:12px;color:var(--wms-text)}
.ct-alerts{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.ct-al{display:flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:8px;font-size:13px;line-height:1.5}
.ct-al.warn{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E}
.ct-al.info{background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3}
.ct-al.ok{background:#ECFDF5;border:1px solid #A7F3D0;color:#047857}
.ct-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
/* แร็คที่ช่องเยอะกว่าความกว้างจอ (มือถือ) เลื่อนซ้ายขวาในกรอบผัง หน้าไม่ล้น */
.ct-map{min-width:0;overflow-x:auto;padding:12px 14px;border-radius:var(--wms-radius-sm);background:var(--wms-surface);border:1px solid var(--wms-border);--c:12px}
/* โซนเล็ก (QA, RIB, ชั้นวาง) อยู่ข้างกันได้ โซนใหญ่กินทั้งบรรทัดเอง */
.ct-zones{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-start;margin-bottom:10px}
.ct-zone{min-width:0;max-width:100%}
.ct-zone > .zh{margin-bottom:6px;font-size:12px;font-weight:700;color:var(--wms-muted)}
.ct-zone > .zh b{color:var(--wms-text)}
.ct-rows{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
.ct-g .gh{margin-bottom:3px;font-size:11.5px;color:var(--wms-muted);white-space:nowrap}
.ct-g .gh b{font-size:12px;color:var(--wms-text)}
.ct-g.full .gh b{color:#047857}
.ct-g.dim{opacity:.22}
.ct-cells{display:grid;gap:2px;grid-auto-rows:var(--c)}
.ct-c{display:block;width:var(--c);height:var(--c);padding:0;border:1px solid #CBD5E1;border-radius:3px;background:#F1F5F9}
button.ct-c{cursor:pointer}
.ct-c.ok{background:#22C55E;border-color:#16A34A}
.ct-c.bad{background:#F59E0B;border-color:#D97706}
.ct-c.again{background:#FEE2E2;border-color:#EF4444}
.ct-c.wait{background:transparent;border-style:dashed}
.ct-c.off{opacity:.18}
.ct-c.here{position:relative;z-index:1;outline:2px solid #6366F1;outline-offset:1px}
.ct-c.sel{position:relative;z-index:2;outline:2px solid #0F172A;outline-offset:1px}
@media (prefers-reduced-motion:no-preference){
  .ct-c.flip{animation:ct-flip .5s cubic-bezier(.34,1.56,.64,1)}
  .ct-c.here:not(.sel){animation:ct-here 1.4s ease-in-out infinite}
}
@keyframes ct-flip{from{transform:scale(.3);opacity:.3}}
@keyframes ct-here{50%{outline-color:rgba(99,102,241,.2)}}
.ct-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:12px;color:var(--wms-muted)}
.ct-legend span{display:inline-flex;align-items:center;gap:5px}
.ct-side{display:flex;flex-direction:column;gap:8px}
.ct-team{display:block;width:100%;padding:9px 12px;border-radius:var(--wms-radius-sm);border:1px solid var(--wms-border);background:var(--wms-surface);
  font-family:var(--wms-font);color:var(--wms-text);text-align:left;cursor:pointer}
.ct-team:hover{border-color:var(--wms-border2)}
.ct-team.on{border-color:var(--wms-primary);box-shadow:0 0 0 2px rgba(79,70,229,.15)}
.ct-team .tn{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700}
.ct-team .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#CBD5E1}
.ct-team .dot.live{background:#22C55E}
.ct-team .dot.idle{background:#F59E0B}
.ct-team .pc{margin-left:auto;font-variant-numeric:tabular-nums}
.ct-team .bar{margin:6px 0}
.ct-team .bar i{display:block;height:100%;border-radius:3px;background:#6366F1;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ct-team.done .bar i{background:#22C55E}
.ct-team .ln{font-size:12px;line-height:1.55;color:var(--wms-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-team .ln b{font-weight:600;color:var(--wms-text)}
.ct-aud{padding:8px 12px;border-radius:var(--wms-radius-sm);border:1px dashed var(--wms-border2);font-size:12.5px;color:var(--wms-muted)}
.ct-aud b{color:var(--wms-text)}

<body data-wms-module="stocktake">

<div class="wms-shell">
<div data-wms-shell="stocktake" data-root="../"></div>
<div class="wms-main">

  <div class="mod-head">
    <div class="mod-title">
      <div class="ic"><img src="../icons/list-checks.png" alt="" width="38" height="38"></div>
      <div>
        <h2>นับสต๊อกใหญ่</h2>
        <button type="button" class="mod-info" aria-expanded="false" aria-label="คำอธิบายหน้านี้">i</button>
        <p>นับทั้งคลังเป็นรอบ: ตั้งรอบ ดึงยอดตั้งต้นจากสมุด แบ่งโซนให้ทีม Inventory กับ Audit ส่งลิงก์ให้คนนับกรอกบนมือถือ แล้วดูความคืบหน้าสด ๆ — ไม่แก้ชีต Transaction</p>
      </div>
    </div>
  </div>

  <div class="st-src" id="src"></div>
  <div class="tx-tabs" id="tabs" role="tablist"></div>
  <div class="st-body" id="body"></div>

</div><!-- /.wms-main -->
</div><!-- /.wms-shell -->

<script type="module" src="../wms-shell.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-sup.js"></script>
<script src="../wms-stocktake.js"></script>
<script>
const $ = id => document.getElementById(id);
/* ค่าทุกตัวมาจากชีตที่คนกรอก บางตัวไปอยู่ใน data-* จึงต้องหนีเครื่องหมายคำพูดด้วย */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });
const ST = window.WmsStocktake;
const KEY_ROUND = 'wms:st:round';
const POLL_MS = 60000;
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ?tab= ไว้ส่งลิงก์ตรงไปหน้าความคืบหน้า */
const TABS = [['setup', 'ตั้งรอบ', '../icons/settings.png'], ['teams', 'ทีม/โซน', '../icons/list-checks.png'], ['control', 'ห้องควบคุม', '../icons/boxes.png'],
  ['progress', 'ความคืบหน้า', '../icons/tab-count.png'],
  ['analyze', 'วิเคราะห์', '../icons/tab-compare.png'], ['round2', 'รอบ 2', '../icons/tab-refill.png'], ['close', 'ปิดรอบ', '../icons/tab-fix.png'],
  ['report', 'รายงาน', '../icons/clipboard-list.png'],
  ['trc', 'กระทบ TRcloud', '../icons/sys-sheet.png'], ['opening', 'ตั้งต้นสมุด', '../icons/notebook.png']];
const LIVE_TABS = ['control', 'progress', 'analyze', 'round2', 'close', 'report'];   // แท็บที่ดึงบันทึกนับใหม่เอง (ห้องควบคุมทุก 20 วินาที ที่เหลือทุกนาที)
let TAB = TABS.some(t => t[0] === new URLSearchParams(location.search).get('tab')) ? new URLSearchParams(location.search).get('tab') : 'setup';

const S = { rounds: null, rid: load(KEY_ROUND), head: null, log: [], raw: [], since: 0, at: 0, busy: '', err: '', ok: '', fresh: false };
let DRAFT = null;      // ทีม/โซนที่กำลังแก้ ยังไม่บันทึก
let MOVES = null;      // แถวสมุดหลังดึงยอดตั้งต้น {list, at, err}
let FIFO = null;       // สมุดที่อ่านไว้ {data, at} ใช้ทั้งเช็คแถวใหม่และหาแถวที่น่าสงสัย
let FIFO_BUSY = false;
let AN = null;         // ผลวิเคราะห์ที่คิดไว้ คิดใหม่เมื่อบันทึกนับหรือข้อมูลรอบเปลี่ยน
let AQ = '';           // ช่องค้นหาในแท็บวิเคราะห์
let FILTER = '';       // ชิปที่กดกรองอยู่
const OPEN = new Set();   // แถวที่กาง ⓘ
let TOAST = '';
let DEL = false;       // กล่องยืนยันลบรอบกางอยู่
let R2D = null;        // ค่าตั้งแผนรอบ 2 ที่กำลังแก้ {rid, opts} เริ่มจากที่บันทึกไว้ในรอบ
let PN = null;         // แผนรอบ 2 ที่คิดไว้
let AN2 = null;        // ผลวิเคราะห์รอบ 2 (เฉพาะโลในแผนที่บันทึก)
let EDITS = null;      // ตัวเลขที่หัวหน้าแก้ในแท็บปิดรอบ {rid, map} เก็บในเครื่องจนกว่าจะอนุมัติ
let XLSX_LOAD = null;
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

function cfg() { return { url: WmsSettings.stUrl(), t: WmsSettings.stToken() }; }
function who() {
  try { return JSON.parse(localStorage.getItem('wms:session') || '{}').name || WmsSettings.me() || 'หัวหน้า'; }
  catch (e) { return WmsSettings.me() || 'หัวหน้า'; }
}

/* ── คุยกับสคริปต์ ───────────────────────────────────────────────────── */

function urlOf(api, params) {
  const c = cfg();
  const q = new URLSearchParams({ api, t: c.t, ...(params || {}) });
  return c.url + (c.url.includes('?') ? '&' : '?') + q.toString();
}

async function get(api, params, quiet) {
  const res = await WmsGas.json(urlOf(api, params), api, quiet ? { retries: 1 } : {
    onProgress: (sec) => { if (sec > 3) { S.busy = S.busy.replace(/ \d+ วิ$/, '') + ` ${sec} วิ`; paintSrc(); } },
  });
  if (res && res.error) throw new Error(res.error);
  if (api === 'st-rounds' || api === 'st-head') S.old = ST.oldScript(res);
  /* รอบเช็คความเสี่ยง MFG (หน้า mfg/) อยู่ในชีตเดียวกัน แต่เปิดดูที่หน้านั้น ไม่ขึ้นในรายการรอบนับใหญ่ */
  if (api === 'st-rounds' && res.rounds) res.rounds = res.rounds.filter(r => !(r.settings && r.settings.kind === 'mfg'));
  return res;
}

async function post(body) {
  const c = cfg();
  const res = await WmsGas.post(c.url, { t: c.t, by: who(), ...body }, { timeoutMs: 120000, busy: true });
  if (res && res.error) throw new Error(res.error);
  return res;
}

async function job(label, fn) {
  S.busy = label; S.err = ''; S.ok = ''; paint();
  try { await fn(); }
  catch (e) { S.err = e.message; }
  S.busy = ''; paint();
}

function loadRounds() {
  if (!cfg().url || !cfg().t) { paint(); return Promise.resolve(); }
  return job('กำลังโหลดรอบนับ…', async () => {
    S.rounds = (await get('st-rounds')).rounds;
    if (S.rid !== 'new' && !S.rounds.some(r => r.id === S.rid)) S.rid = S.rounds[0] ? S.rounds[0].id : 'new';
    if (S.rid !== 'new') await loadHead();
  });
}

async function loadHead() {
  S.head = await get('st-head', { round: S.rid });
  save(KEY_ROUND, S.rid);
  S.log = []; S.raw = []; S.since = 0; DRAFT = null; MOVES = null; OPEN.clear(); FILTER = ''; DEL = false; OPCHK = null;
  await loadLog();
}

async function loadLog(quiet) {
  const r = await get('st-log', { round: S.rid, since: S.since }, quiet);
  S.raw = ST.merge(S.raw, r.rows.map(ST.fromRow));
  S.log = ST.voidMoved(S.raw, day2());   // นับ 2 วัน: โลวันแรกที่ขยับ ผลนับวันแรกไม่ใช้ รอนับใหม่วันที่ 2
  S.since = r.last;
  S.at = Date.now();
  S.devices = r.devices || null;   // มือถือที่ติดต่อมา ยังค้างส่งกี่แถว (สคริปต์รุ่นเก่าไม่มี = ไม่รู้)
  if (r.round && S.head) Object.assign(S.head.round, r.round);
}

/* ── ค่าที่คิดจากข้อมูลของรอบ ────────────────────────────────────────── */

function R() { return S.head && S.head.round; }
function locList() { return S.head ? S.head.locs.map(l => ({ loc: l[0], zone: l[1], group: l[2], src: l[3] })) : []; }
function skipSet() { return new Set(((R() && R().settings.skip) || []).map(ST.up)); }
/** นับ 2 วัน: ค่าแบ่งวันของรอบ (null = นับวันเดียว) */
function day2() { return R() ? ST.day2Of(R().settings) : null; }
/** โลที่นับจริงในรอบนี้ทั้งสองวัน ไม่รวมแถวที่ตั้งไม่นับ */
function countLocsAll() { const sk = skipSet(); return locList().filter(l => !sk.has(ST.up(l.group))); }
/** โลที่นับได้ตอนนี้: ก่อนเปิดวันที่ 2 ไม่รวมโลที่รอวันที่ 2 (ความคืบหน้ากับผลวิเคราะห์ของวันแรกจึงคิดจากโลวันแรกเท่านั้น) */
function countLocs() { const w = ST.day2Wait(day2()); return countLocsAll().filter(l => !w(l.loc)); }
function auditMin() { const m = R() && R().settings.auditMin; return m === undefined || m === '' ? ST.AUDIT_MIN : +m; }
function prog() { return ST.progress(countLocs(), S.head.teams, S.log, { pass: 1, auditMin: auditMin() }); }
function counting() { return R() && /^นับรอบ/.test(R().status); }
function link() {
  return ST.countLink(new URL('count.html', location.href).href, new URL(cfg().url, location.href).href, S.head.countKey, S.rid);
}
function pilesByLoc() {
  const m = {};
  (S.head ? S.head.piles : []).forEach(p => { m[p[0]] = (m[p[0]] || 0) + 1; });
  return m;
}

/* ── วาดหน้า ─────────────────────────────────────────────────────────── */

function paint() { paintSrc(); paintTabs(); paintBody(); }

function paintSrc() {
  const box = $('src');
  const msg = S.busy ? `<div class="st-msg busy">⏳ ${esc(S.busy)}</div>` : S.err ? `<div class="st-msg err">${esc(S.err)}</div>` : S.ok ? `<div class="st-msg ok">${esc(S.ok)}</div>` : '';
  if (!cfg().url || !cfg().t) { box.innerHTML = `<span class="st-pill warn">ยังไม่ได้เชื่อมชีตนับสต๊อก</span>${msg}`; return; }
  const opts = (S.rounds || []).map(r => `<option value="${esc(r.id)}" ${r.id === S.rid ? 'selected' : ''}>${esc(r.name)} · ${esc(r.date)}</option>`).join('');
  const r = R();
  const pill = !r || S.rid === 'new' ? '' : r.status === 'ตั้งค่า' ? '<span class="st-pill">ตั้งค่า</span>'
    : counting() ? `<span class="st-pill go">● ${esc(r.status)}</span>` : `<span class="st-pill">${esc(r.status)}</span>`;
  box.innerHTML = `<select id="rsel" aria-label="รอบนับ">${opts}<option value="new" ${S.rid === 'new' ? 'selected' : ''}>+ รอบใหม่</option></select>` +
    pill + (r && S.rid !== 'new' ? `<span>${esc(r.id)}</span>` : '') + `<span class="sp"></span>` +
    (r && S.rid !== 'new' ? `<button class="st-btn" data-act="copy">คัดลอกลิงก์คนนับ</button>` : '') +
    `<button class="st-btn" data-act="reload" ${S.busy ? 'disabled' : ''}>ดึงใหม่</button>` + msg +
    (S.old ? `<div class="st-msg err"><b>สคริปต์นับสต๊อกยังเป็นรุ่นเก่า</b> (รุ่น ${S.old.have || 'ไม่มีเลขรุ่น'} ต้องรุ่น ${S.old.need}) ·
      เปิดชีตนับสต๊อก › ส่วนขยาย › Apps Script › วางไฟล์ stocktake-api.gs ล่าสุดทับ › ทำให้ใช้งานได้ › จัดการ › แก้ไข › เวอร์ชันใหม่</div>` : '');
}

function paintTabs() {
  const n = {};
  if (S.head && S.rid !== 'new') {
    const p = prog();
    n.progress = `${p.pct}%`;
    n.teams = ST.teamsOf(S.head.teams, 1).length || '';
    if (R().pass) { const a = analysis(); n.analyze = a.lines.filter(l => l.group !== ST.G.OK).length + a.audit.length || ''; }
    n.round2 = (S.head.plan || []).length || '';
    n.close = R().status === 'ปิดแล้ว' ? '✓' : '';
    n.opening = OPCHK && OPCHK.res.ok ? '✓' : '';
  }
  $('tabs').innerHTML = TABS.map(([id, label, icon]) =>
    `<button class="tx-tab ${id === TAB ? 'on' : ''}" role="tab" aria-selected="${id === TAB}" data-tab="${id}"><img src="${icon}" alt="" width="18" height="18">` +
    `<span class="lb">${label}</span>${n[id] !== undefined && n[id] !== '' ? ` <span class="n">${n[id]}</span>` : ''}</button>`).join('');
}

function paintBody() {
  const box = $('body');
  /* จอทีวีซ่อนเมนูกับแท็บ ใช้ได้เฉพาะตอนมีรอบให้ดู ไม่งั้นจะไม่มีทางกดออก */
  document.body.classList.toggle('st-tv', CT.tv && TAB === 'control' && !!S.head && S.rid !== 'new' && !!cfg().url && !!cfg().t);
  if (!cfg().url || !cfg().t) { box.innerHTML = cfgBox(true); return; }
  if (!S.rounds) { box.innerHTML = S.busy ? '<div class="st-empty">⏳ กำลังโหลด…</div>' : `<div class="st-empty">โหลดรอบนับไม่ได้<br><button class="st-btn" data-act="reload">ลองใหม่</button></div>` + cfgMore(); return; }
  if (S.rid === 'new' || !S.head) { box.innerHTML = TAB === 'setup' || S.rid === 'new' ? setupNew() : '<div class="st-empty">⏳ กำลังโหลด…</div>'; return; }
  if (TAB === 'control') { box.innerHTML = controlView(); controlAfter(); return; }
  if (TAB === 'teams') box.innerHTML = teamsView();
  else if (TAB === 'progress') box.innerHTML = progressView();
  else if (TAB === 'analyze') box.innerHTML = analyzeView();
  else if (TAB === 'round2') box.innerHTML = round2View();
  else if (TAB === 'close') box.innerHTML = closeView();
  else if (TAB === 'report') box.innerHTML = reportView();
  else if (TAB === 'opening') box.innerHTML = openingView();
  else if (TAB === 'trc') box.innerHTML = trcView();
  else box.innerHTML = setupView();
}

/* ── ดึงยอดตั้งต้น ───────────────────────────────────────────────────── */

function cutoffMs(c) { return new Date(String(c).replace(' ', 'T') + ':00+07:00').getTime(); }

/**
 * อ่านสมุดผ่าน tx-api.gs (สำเนา IMPORTRANGE อ่านอย่างเดียว) แบบสด ไม่ใช้ข้อมูลกลางที่อาจเก่าหลายชั่วโมง
 * คิดยอดในเบราว์เซอร์ด้วยกติกาเดียวกับสคริปต์ แล้วส่งไปเก็บในชีตนับสต๊อก
 * รายการ Location เติมโลที่มีของเพิ่มเข้าไป โลที่หัวหน้าเพิ่มเองหรือแบ่งทีมไว้แล้วไม่หาย
 */
/** อ่านสมุด คิดยอดตั้งต้น เก็บเป็นชุดใหม่ และเพิ่มโลใหม่เข้ารายการ ใช้ทั้งตอนดึงยอดปกติและตอนเปิดนับวันที่ 2 → {fifo, b, locs} */
async function pullCore(r) {
  const tx = WmsSettings.txUrl();
  const fifo = await WmsGas.json(tx, 'tx-fifo', { onProgress: (sec) => { S.busy = `กำลังอ่านสมุด Transaction… ${sec} วิ`; paintSrc(); } });
  if (fifo.error) throw new Error('สมุด Transaction: ' + fifo.error);
  if (!fifo.rows) throw new Error('URL Transaction ไม่ได้ตอบสมุดมา ตรวจในหน้าตั้งค่า');
  /* สำเนาสมุดพังครึ่งเดียว = ยอดตั้งต้นขาดเป็นก้อน เกือบทุกโลจะดูเหมือนของเกิน · ไม่ผ่านไม่ดึง สงสัยถามก่อน */
  const chk = ST.ledgerCheck(fifo, { cutoff: r.cutoff, prevRow: r.set ? r.lastRow : 0 });
  if (chk.stop.length) throw new Error('ยังไม่ดึงยอด สมุดดูไม่ครบ: ' + chk.stop.join(' · ') + ' — แก้สูตรในไฟล์สำเนาแล้วกดดึงใหม่');
  if (chk.ask.length && !confirm('สมุดอาจไม่ครบ\n\n• ' + chk.ask.join('\n• ') + '\n\nเช็คแล้วว่าสมุดถูกต้อง ดึงยอดต่อเลยไหม?')) throw new Error('ยกเลิกการดึงยอด: ' + chk.ask[0]);
  const sm = WmsSup.map(fifo.sup);
  const b = ST.baseline(fifo, (po) => WmsSup.of(sm, po));
  S.busy = 'กำลังบันทึกยอดตั้งต้น…'; paintSrc();
  await post({ op: 'st-baseline', round: r.id, piles: b.piles, skus: b.skus, pos: b.pos, lastRow: b.lastRow, lastDate: b.lastDate });
  const have = new Map(S.head.locs.map(l => [ST.up(l[0]), l]));
  ST.locations(b).forEach(l => { if (!have.has(l.loc)) have.set(l.loc, [l.loc, l.zone, l.group, l.src]); });
  const locs = [...have.values()].sort((a, c) => ST.locCmp(a[0], c[0]));
  const teams = ST.teamsOf(S.head.teams, 1).map(t => ({ ...t, locs: t.locs }));
  await post({ op: 'st-teams', round: r.id, pass: 1, teams, locs });
  return { fifo, b, locs, chk };
}

/**
 * เปิดนับวันที่ 2: ดึงยอดสมุดชุดใหม่ (ตัดยอดเช้าวันที่ 2) แล้วเช็คว่าโลวันแรกโลไหนมีรายการในสมุดหลังเริ่มนับ
 * โลที่ขยับนับใหม่วันนี้ ผลนับวันแรกของโลนั้นไม่ใช้ · หน้ากรอกของคนนับจะเห็นโลวันที่ 2 เองภายในหนึ่งนาที
 */
async function openDay2() {
  const r = R(), d = day2();
  if (!r || !d || d.on) return;
  if (!WmsSettings.txUrl()) { S.err = 'ใส่ URL Transaction ในหน้าตั้งค่าก่อน'; paint(); return; }
  if (!confirm('เปิดนับวันที่ 2?\n\n• รายการขายของวันแรกต้องลงสมุดครบแล้ว และหยุดส่งของแล้ว\n• ระบบจะดึงยอดสมุดใหม่ แล้วเช็คว่าโลวันแรกโลไหนขยับ (โลนั้นนับใหม่วันนี้)\n\nเปิดแล้วย้อนกลับไม่ได้')) return;
  await job('กำลังอ่านสมุด Transaction…', async () => {
    const { fifo, locs } = await pullCore(r);
    const sk = skipSet();
    const moved = ST.day2Moved(fifo, d, locs.filter(l => !sk.has(ST.up(l[2]))).map(l => l[0]));
    S.busy = 'กำลังเปิดนับวันที่ 2…'; paintSrc();
    await post({ op: 'st-day2-open', round: r.id, moved: moved.map(m => m.loc) });
    await loadHead();
    S.ok = `✓ เปิดนับวันที่ 2 แล้ว · ยอดตั้งต้นชุดที่ ${R().set} · ` + (!d.row1 ? 'เช็คโลที่ขยับไม่ได้ (ไม่รู้แถวสมุดตอนเริ่มวันแรก)'
      : moved.length ? `โลวันแรกที่ขยับ ${f(moved.length)} โล ให้นับใหม่วันนี้` : 'โลวันแรกไม่มีโลไหนขยับ');
  });
}

async function pullBase() {
  const tx = WmsSettings.txUrl();
  if (!tx) { S.err = 'ใส่ URL Transaction ในหน้าตั้งค่าก่อน'; paint(); return; }
  const r = R();
  if (Date.now() < cutoffMs(r.cutoff) && !confirm(`ยังไม่ถึงเวลาตัดยอด (${r.cutoff})\nของที่ขายหลังจากนี้จะไม่อยู่ในยอดตั้งต้น ดึงตอนนี้เลยไหม?`)) return;
  const d2 = day2();
  if (r.set && !confirm(`มียอดตั้งต้นชุดที่ ${r.set} แล้ว ดึงใหม่เป็นชุดที่ ${r.set + 1}?\nชุดเดิมยังเก็บไว้ในชีต` +
    (d2 && !d2.on && r.status === 'นับรอบ 1' ? '\n\nถ้าจะเริ่มนับวันที่ 2 ให้กด "เปิดนับวันที่ 2" แทน (ดึงยอดให้เอง และเช็คโลวันแรกที่ขยับ)' : ''))) return;
  await job('กำลังอ่านสมุด Transaction…', async () => {
    const { b, locs, chk } = await pullCore(r);
    /* นับ 2 วัน: โลเปิดที่นับวันที่ 2 คิดจากยอดชุดล่าสุด อัปเดตให้เฉพาะตอนยังไม่เริ่มนับ (เริ่มแล้วห้ามเปลี่ยน คนนับวันแรกนับตามชุดเดิมอยู่) */
    const fresh = d2 && !d2.on && d2.openToo && r.status === 'ตั้งค่า' ? ST.day2Plan(b.piles, d2.zones, true) : null;
    if (fresh) await post({ op: 'st-day2', round: r.id, day2: fresh });
    await loadHead();
    S.ok = `✓ ดึงยอดตั้งต้นชุดที่ ${R().set} แล้ว ${f(b.piles.length)} กอง · Location ${f(locs.length)} โล${fresh ? ` · โลเปิดที่นับวันที่ 2 ${f(fresh.locs.length)} โล` : ''}` +
      ` · สมุด ${f(chk.info.rows)} แถว ถึงแถว ${f(chk.info.lastRow)}${chk.info.lastDate ? ` · ขายล่าสุด ${chk.info.lastDate.slice(8, 10)}/${chk.info.lastDate.slice(5, 7)}` : ''}`;
  });
}

/* ── แท็บทีม/โซน ─────────────────────────────────────────────────────── */

function draftFrom(h) {
  const t1 = ST.teamsOf(h.teams, 1);
  const inv = {}, aud = {};
  t1.forEach(t => t.zones.forEach(z => { if (t.kind === 'Audit') aud[z] = t.id; else inv[z] = t.id; }));
  ((h.round.settings && h.round.settings.skip) || []).forEach(z => { inv[z] = ST.SKIP; });
  return {
    teams: t1.map(t => ({ id: t.id, kind: t.kind, name: t.name, members: t.members.join(', ') })),
    inv, aud,
    locs: h.locs.map(l => ({ loc: l[0], zone: l[1], group: l[2], src: l[3] })),
    day2: (d2 => d2 ? { zones: d2.zones.slice(), open: !!d2.openToo, on: d2.on } : null)(ST.day2Of(h.round.settings)),
    dirty: 0,
  };
}
function D() { if (!DRAFT) DRAFT = draftFrom(S.head); return DRAFT; }
function nextId(kind) {
  const pre = kind === 'Audit' ? 'AUD' : 'INV';
  let n = 1;
  while (D().teams.some(t => t.id === pre + n)) n++;
  return pre + n;
}
function teamName(id) { const t = D().teams.find(x => x.id === id); return t ? t.name : id; }

function teamsView() {
  const d = D();
  const gl = ST.groups(d.locs);
  const pile = pilesByLoc();
  const gp = {};
  gl.forEach(g => { gp[g.group] = g.locs.reduce((s, l) => s + (pile[l] || 0), 0); });

  const cnt = (map, id) => gl.filter(g => map[g.group] === id && d.inv[g.group] !== ST.SKIP).reduce((s, g) => s + g.n, 0);
  const none = gl.filter(g => !d.inv[g.group]).reduce((s, g) => s + g.n, 0);

      <td class="num">${f(t.kind === 'Audit' ? cnt(d.aud, t.id) : cnt(d.inv, t.id))}</td>

  const nAll = gl.filter(g => d.inv[g.group] !== ST.SKIP).reduce((a, g) => a + g.n, 0);
  const openOther = dz ? gl.filter(g => !dz.zones.includes(g.zone) && d.inv[g.group] !== ST.SKIP).reduce((a, g) => a + openIn(g), 0) : 0;
  const dayOf = (g) => dz.zones.includes(g.zone) ? '2' : dz.open && openIn(g) ? `1 · โลเปิด ${f(openIn(g))} → 2` : '1';
  const lock = dz && dz.on ? 'disabled' : '';
  const dayBar = `<div class="st-h">วันนับ <span class="st-sub">นับ 2 วัน = วันแรกนับโลที่ไม่มีของขายออก · วันที่ 2 นับโลที่ยังขายอยู่ในวันแรก ตอนสต๊อกนิ่งแล้ว (ตัดยอดเช้าวันที่ 2)</span></div>
    <div class="st-bar">
      ${dz && dz.on ? '<span class="st-chip plain green">นับ 2 วัน · เปิดวันที่ 2 แล้ว</span>'
        : `<button class="st-chip ${dz ? '' : 'on'}" data-day2="off">นับวันเดียว</button><button class="st-chip ${dz ? 'on' : ''}" data-day2="on">นับ 2 วัน</button>`}
      ${dz ? `<span class="st-sub">วันที่ 2 นับโซน</span>${zl.map(z => `<button class="st-chip ${dz.zones.includes(z) ? 'on' : ''}" data-day2z="${esc(z)}" ${lock}>${esc(z)}</button>`).join('')}
        <label class="st-ck"><input type="checkbox" data-day2open ${dz.open ? 'checked' : ''} ${lock}> + โลเปิดขายในโซนอื่น <b>${f(openOther)}</b></label>
        <span class="sp"></span><span>วันแรก <b>${f(nAll - n2)}</b> โล · วันที่ 2 <b>${f(n2)}</b> โล</span>` : ''}
    </div>`;

  let rows = '';
  let zone = '';
  const show = (g) => !FILTER || (FILTER === 'none' ? !d.inv[g.group] : FILTER === 'skip' ? d.inv[g.group] === ST.SKIP
    : FILTER.startsWith('a:') ? d.aud[g.group] === FILTER.slice(2) : d.inv[g.group] === FILTER);
  gl.filter(show).forEach(g => {
    if (g.zone !== zone) {
      zone = g.zone;
      const zg = gl.filter(x => x.zone === zone);
      rows += `<tr class="z"><td>โซน ${esc(zone)}</td><td class="num">${f(zg.reduce((s, x) => s + x.n, 0))}</td><td class="num">${f(zg.reduce((s, x) => s + gp[x.group], 0))}</td>${dz ? '<td></td>' : ''}
        <td><select class="st-in" data-zone-inv="${esc(zone)}" aria-label="ทีม Inventory ทั้งโซน ${esc(zone)}"><option value="">ทั้งโซน…</option>${invT.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}<option value="${ST.SKIP}">ไม่นับ</option></select></td>
        <td><select class="st-in" data-zone-aud="${esc(zone)}" aria-label="Audit ทั้งโซน ${esc(zone)}"><option value="">ทั้งโซน…</option>${audT.map(t => `<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}<option value="${ST.SKIP}">ไม่มี</option></select></td></tr>`;
    }
    const iv = d.inv[g.group] || '';
    rows += `<tr><td class="k">${esc(g.group)}</td><td class="num">${f(g.n)}</td><td class="num mu">${f(gp[g.group])}</td>${dz ? `<td class="mu">${iv === ST.SKIP ? '—' : dayOf(g)}</td>` : ''}
      <td><select class="st-in ${!iv ? 'none' : iv === ST.SKIP ? 'skip' : ''}" data-inv="${esc(g.group)}" aria-label="ทีม Inventory แถว ${esc(g.group)}">${opt(invT, iv === ST.SKIP ? '' : iv, 'ยังไม่มีทีม')}<option value="${ST.SKIP}" ${iv === ST.SKIP ? 'selected' : ''}>ไม่นับ</option></select></td>
      <td><select class="st-in" data-aud="${esc(g.group)}" aria-label="Audit แถว ${esc(g.group)}">${opt(audT, d.aud[g.group] || '', '—')}</select></td></tr>`;
  });

  return `<div class="st-h">ทีม <span class="st-sub">Inventory นับทุกโลในแถวที่ได้ · Audit หนึ่งแถวต่อหนึ่งคน เลือกโลสุ่มตรวจเอง อย่างน้อย ${auditMin()}% ต่อแถว</span></div>
    <div class="st-wrap"><table class="st-xl"><thead><tr><th>รหัส</th><th>ประเภท</th><th>ชื่อทีม</th><th>คนนับ (คั่นด้วย ,)</th><th class="num">โล</th><th></th></tr></thead>
      <tbody>${teamRows || '<tr><td colspan="6" class="mu">ยังไม่มีทีม — กดเพิ่มข้างล่าง</td></tr>'}</tbody></table></div>
    <div class="st-bar" style="margin-top:6px"><button class="st-btn" data-add-team="Inventory">+ ทีม Inventory</button><button class="st-btn" data-add-team="Audit">+ Audit</button></div>

    ${dayBar}
    <div class="st-h">แบ่งแถว <span class="st-sub">${f(d.locs.length)} โล · วางรายการ Location ด้วย Ctrl+V เพื่อเพิ่มโลที่ไม่มีในสมุด</span></div>
    <div class="st-bar">
      ${chip('', 'ทั้งหมด', d.locs.length)}
      ${invT.map(t => chip(t.id, t.name, cnt(d.inv, t.id))).join('')}
      ${none ? chip('none', 'ยังไม่มีทีม', none, 'red') : ''}
      ${skipN ? chip('skip', 'ไม่นับ', skipN) : ''}
      ${audT.map(t => chip('a:' + t.id, 'Audit ' + t.name, cnt(d.aud, t.id), 'amber')).join('')}
      <span class="sp"></span>
      <input class="st-add" id="addLoc" placeholder="+ โล เช่น R1-07-01" aria-label="เพิ่ม Location">
      <button class="st-btn" data-auto="inv" ${invT.length ? '' : 'disabled'}>แบ่ง Inventory อัตโนมัติ</button>
      <button class="st-btn" data-auto="aud" ${audT.length ? '' : 'disabled'}>แบ่ง Audit อัตโนมัติ</button>
    </div>
    ${TOAST ? `<div class="st-toast">${esc(TOAST)}</div>` : ''}
    <div class="st-wrap"><table class="st-xl"><thead><tr><th>แถว</th><th class="num">โล</th><th class="num">กองในสมุด</th>${dz ? '<th>วันนับ</th>' : ''}<th>ทีม Inventory</th><th>Audit</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="${dz ? 6 : 5}" class="mu">ไม่มีแถวตามที่กรอง</td></tr>`}</tbody></table></div>
    <div class="st-save"><span>${d.dirty ? `<b>แก้แล้ว ${d.dirty} อย่าง ยังไม่บันทึก</b>` : 'บันทึกแล้ว'}</span><span class="sp"></span>
      ${d.dirty ? '<button class="st-btn" data-act="undo">ยกเลิกที่แก้</button>' : ''}
      <button class="st-btn p" data-act="teams-save" ${S.busy ? 'disabled' : ''}>บันทึกทีม/โซน</button></div>`;
}

function touch(msg) { D().dirty++; TOAST = msg || ''; paintBody(); paintTabs(); }

function addLocs(list) {
  const d = D();
  const have = new Set(d.locs.map(l => ST.up(l.loc)));
  let added = 0, dup = 0;
  list.forEach(loc => {
    if (have.has(loc)) { dup++; return; }
    have.add(loc);
    const p = ST.parseLoc(loc);
    d.locs.push({ loc, zone: p.zone, group: p.group, src: 'เพิ่มเอง' });
    added++;
  });
  d.locs.sort((a, b) => ST.locCmp(a.loc, b.loc));
  if (added) touch(`✓ เพิ่ม ${added} โล${dup ? ` (มีอยู่แล้ว ${dup})` : ''}`);
  else { TOAST = dup ? `มีอยู่แล้วทั้ง ${dup} โล` : ''; paintBody(); }
}

async function saveTeams() {
  const d = D();
  const bad = d.teams.find(t => !t.name.trim());
  if (bad) { S.err = `ทีม ${bad.id} ยังไม่มีชื่อ`; paint(); return; }
  const gl = ST.groups(d.locs);
  const teams = d.teams.map(t => {
    const map = t.kind === 'Audit' ? d.aud : d.inv;
    /* แถวที่ไม่นับไม่ส่งให้ใคร แม้จะเคยแบ่ง Audit ไว้ก่อนตั้งไม่นับ หน้ากรอกจะได้ไม่มีโลที่ไม่ต้องไป */
    const zones = gl.filter(g => map[g.group] === t.id && d.inv[g.group] !== ST.SKIP).map(g => g.group);
    const members = t.members.split(',').map(s => s.trim()).filter(Boolean);
    return { id: t.id, kind: t.kind, name: t.name.trim(), members: members.length ? members : (t.kind === 'Audit' ? [t.name.trim()] : []), zones, locs: zones.reduce((s, z) => s + gl.find(g => g.group === z).n, 0) };
  });
  const skip = gl.filter(g => d.inv[g.group] === ST.SKIP).map(g => g.group);
  const locs = d.locs.map(l => [l.loc, l.zone, l.group, l.src]);
  await job('กำลังบันทึกทีม/โซน…', async () => {
    await post({ op: 'st-teams', round: S.rid, pass: 1, teams, locs, skip });
    /* นับ 2 วัน: โลเปิดคิดจากยอดตั้งต้นชุดล่าสุด ส่งเมื่อเปลี่ยนจากที่บันทึกไว้เท่านั้น (เปิดวันที่ 2 แล้วแก้ไม่ได้) */
    const had = day2();
    const plan = d.day2 ? ST.day2Plan(S.head.piles, d.day2.zones, d.day2.open) : null;
    const same = (a, b) => JSON.stringify(a && [a.zones, a.locs, a.openToo]) === JSON.stringify(b && [b.zones, b.locs, b.openToo]);
    if (!(had && had.on) && !same(plan, had)) await post({ op: 'st-day2', round: S.rid, day2: plan });
    S.head = await get('st-head', { round: S.rid });
    DRAFT = null; TOAST = '';
    S.ok = `✓ บันทึกทีม/โซนแล้ว ${teams.length} ทีม${plan ? ` · นับ 2 วัน (วันที่ 2: โซน ${plan.zones.join(', ') || '—'}${plan.locs.length ? ` + โลเปิด ${plan.locs.length}` : ''})` : ''}`;
  });
}

/* ── แท็บห้องควบคุม ─────────────────────────────────────────────────────
   ภาพรวมสดของวันนับ: ตัวเลขสรุป ผังคลังที่เปลี่ยนสีตามผลนับ ช่องทีม และเรื่องที่ต้องดู (ST.control)
   ใช้บันทึกนับที่หน้านี้ดึงอยู่แล้ว ไม่ถามสคริปต์เพิ่ม
   โหมดจอทีวี (?tv=1) ไว้เปิดในคลังให้คนนับเห็น จึงไม่บอกว่าโลไหนต่างกับสมุด คนนับต้องนับโดยไม่รู้ยอด */

const KEY_TARGET = 'wms:st:target';   // เวลาที่อยากให้เสร็จของแต่ละรอบ {รหัสรอบ: 'HH:mm'} เก็บในเครื่องหัวหน้า
const CT_FLOW = 24;                   // แถวที่วาดเป็นตารางไม่ได้ (ชื่อซ้ำตำแหน่ง / ยาวมาก) เรียงต่อกันบรรทัดละเท่านี้
const CT = {
  rid: '', sel: '', team: '', cm: null,
  prev: null,      // สีของแต่ละช่องตอนวาดครั้งก่อน ช่องที่เปลี่ยนจะเด้ง
  zones: null,     // โซนที่ครบแล้วตอนวาดครั้งก่อน โซนที่เพิ่งครบน้องกล่องฉลองหนึ่งครั้ง
  wasLeft: false,
  tv: new URLSearchParams(location.search).get('tv') === '1',
};
let WAKE = null;

const hm = (ms) => new Date(ms).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
function targets() { try { return JSON.parse(load(KEY_TARGET) || '{}') || {}; } catch (e) { return {}; } }
function targetOf() { return targets()[S.rid] || ''; }
function setTarget(v) {
  const m = targets();
  if (v) m[S.rid] = v; else delete m[S.rid];
  save(KEY_TARGET, JSON.stringify(m));
}

/** รอบ 2 กำลังเปิด = ดูโลในแผนรอบ 2 · นอกนั้นดูรอบ 1: โลที่นับได้ตอนนี้ กับโลที่รอวันที่ 2 */
function controlModel() {
  const r = R(), d = day2();
  if (r.status === 'นับรอบ 2') {
    const a2 = analysis2();
    const locs = planSaved().map(p => { const x = ST.parseLoc(p.loc); return { loc: p.loc, group: p.row || x.group, zone: x.zone }; });
    const lines = a2 ? a2.lines : [];
    return { pass: 2, label: 'รอบ 2', d: null, lines, m: ST.control({ locs, teams: S.head.teams, pass: 2, entries: S.log, lines, now: Date.now(), counting: true }) };
  }
  const w = ST.day2Wait(d);
  const lines = analysis().lines;
  return {
    pass: 1, label: d ? (d.on ? 'วันที่ 2' : 'วันแรก') : '', d, lines,
    m: ST.control({
      locs: countLocs(), wait: countLocsAll().filter(l => w(l.loc)), teams: S.head.teams, pass: 1, entries: S.log, lines,
      again: d && d.on ? d.moved : [], now: Date.now(), counting: r.status === 'นับรอบ 1',
    }),
  };
}

/** เรื่องที่ต้องดู: ของ ST.control บวกเรื่องที่หน้านี้รู้เอง (โลไม่มีทีม สมุดขยับ หลายคนนับ เป้าเวลา) */
function controlAlerts(cm) {
  const m = cm.m;
  const out = m.alerts.map(a => ({ ...a }));
  if (cm.pass === 1) {
    const p = prog();
    if (p.unassigned) out.push({ level: 'warn', code: 'unassigned', text: `ยังไม่มีทีม ${f(p.unassigned)} โล แบ่งทีมในแท็บทีม/โซน` });
    if (MOVES && MOVES.day1 && MOVES.list.length) out.push({ level: 'warn', code: 'moves', blind: true, text: `โลวันแรกมีของขยับในสมุด ${f(MOVES.list.length)} แถว จะถูกให้นับใหม่ตอนเปิดนับวันที่ 2` });
    const multi = (analysis().multi || []).filter(x => x.kind !== 'Audit').length;
    if (multi) out.push({ level: 'info', code: 'multi', blind: true, text: `มี ${f(multi)} โลที่หลายคนนับ ยอดอาจซ้ำ ดูในแท็บวิเคราะห์` });
    if (p.extra.length) out.push({ level: 'info', code: 'extra', blind: true, text: `คนนับเพิ่มโลนอกรายการ ${f(p.extra.length)} โล` });
    const done = out.find(x => x.code === 'done');
    if (done && cm.d && !cm.d.on) done.text = 'นับวันแรกครบแล้ว กดเปิดนับวันที่ 2 ได้ในแท็บตั้งรอบ';
    else if (done && R().status === 'นับรอบ 1') done.text = 'นับครบทุกโลแล้ว ปิดรับนับรอบ 1 ได้ในแท็บวิเคราะห์';
  }
  /* มือถือที่ติดต่อมาล่าสุดยังค้างส่ง: แถวพวกนี้หัวหน้ายังไม่เห็น ไม่ขึ้นในผัง ไม่ใช่ผลต่าง จอทีวีขึ้นได้ */
  ST.deviceWatch(S.devices, Date.now(), { pass: cm.pass }).stuck.forEach(d => out.push({
    level: 'warn', code: 'unsent',
    text: `มือถือของ ${d.who || d.device}${d.team ? ` (${teamLabel(d.team, cm.pass)})` : ''} ค้างส่ง ${f(d.pend)} แถว · ติดต่อล่าสุด ${d.at ? hm(d.at) : '-'} — ให้เปิดหน้ากรอกตรงที่มีสัญญาณ`,
  }));
  const tg = targetOf();
  if (tg && m.eta) {
    const [h, mi] = tg.split(':').map(Number);
    const t = new Date(m.now);
    t.setHours(h, mi, 0, 0);
    const late = Math.round((m.eta - t.getTime()) / 60000);
    if (late > 0) out.push({ level: 'warn', code: 'late', text: `คาดว่าเสร็จ ${etaText(m.eta, m.now)} ช้ากว่าเป้า ${tg} อยู่ ${f(late)} นาที` });
  }
  const rank = { warn: 0, info: 1, ok: 2 };
  return out.sort((x, y) => rank[x.level] - rank[y.level]);
}

function teamLabel(id, pass) { const t = (S.head.teams || []).find(x => x.id === id && x.pass === pass); return t ? t.name : id; }

/**
 * ข้อความต่อท้ายตอนกดปิดรับนับ: มือถือที่ยังค้างส่ง กับมือถือที่เงียบไปนาน (ถ้านับต่อแบบไม่มีเน็ตหลังติดต่อครั้งสุดท้าย แถวจะค้างในเครื่อง)
 * สคริปต์รุ่นเก่าไม่รายงานมือถือ ไม่ต่อท้ายอะไร
 */
function unsentText(pass) {
  if (!S.devices) return '';
  const w = ST.deviceWatch(S.devices, Date.now(), { pass });
  const name = (d) => `${d.who || d.device}${d.team ? ` (${teamLabel(d.team, pass)})` : ''}`;
  const list = (a, fn) => a.slice(0, 8).map(fn).join('\n') + (a.length > 8 ? `\n…อีก ${a.length - 8} เครื่อง` : '');
  let t = '';
  if (w.stuck.length) t += `\n\n⚠ มือถือที่ยังค้างส่ง ${w.stuck.length} เครื่อง — ปิดรับตอนนี้ โลพวกนั้นจะขึ้นว่ายังไม่นับ\n` + list(w.stuck, d => `• ${name(d)} ค้าง ${f(d.pend)} แถว · ติดต่อล่าสุด ${hm(d.at)}`);
  if (w.quiet.length) t += `\n\nมือถือที่เงียบไปเกิน 15 นาที (ติดต่อล่าสุดส่งครบแล้ว) ถ้าหลังจากนั้นยังนับต่อ ให้เปิดหน้ากรอกจนขึ้น ✓ ส่งครบ ก่อน\n` + list(w.quiet, d => `• ${name(d)} ${hm(d.at)}`);
  return t;
}

/** ความเร็วต่ำมากเวลาเสร็จจะข้ามวัน บอกเป็นคำแทนเวลาที่ดูเหมือนวันนี้ */
function etaText(eta, now) { return eta - now > 12 * 3600000 ? 'เกิน 12 ชม.' : hm(eta); }

const CT_STATE = { todo: 'ยังไม่นับ', ok: 'นับแล้ว', bad: 'นับแล้ว ต่างกับสมุด', again: 'ต้องนับใหม่', wait: 'รอวันที่ 2' };

/** สีที่ช่องแสดงจริง จอทีวีไม่แสดงว่าต่างกับสมุด */
function ctShown(s) { return CT.tv && s === 'bad' ? 'ok' : s; }

function ctCell(loc, c, style) {
  const shown = ctShown(c.s);
  const text = `${loc} · ${CT_STATE[shown]}${c.who.length ? ' · ' + c.who.join(', ') : ''}${c.at ? ' ' + hm(c.at) : ''}${c.here.length ? ' · ตอนนี้ ' + c.here.join(', ') + ' อยู่ที่นี่' : ''}`;
  const cls = `ct-c ${shown}${c.here.length ? ' here' : ''}${!CT.tv && CT.sel === loc ? ' sel' : ''}` +
    `${CT.prev && CT.prev[loc] && CT.prev[loc] !== shown ? ' flip' : ''}${CT.team && c.team !== CT.team ? ' off' : ''}`;
  /* จอทีวีกับช่องที่รอวันที่ 2 กดไม่ได้ ไม่มีรายละเอียดให้ดู */
  return CT.tv || c.s === 'wait'
    ? `<i class="${cls}" style="${style}" title="${esc(text)}"></i>`
    : `<button type="button" class="${cls}" style="${style}" data-cell="${esc(loc)}" title="${esc(text)}" aria-label="${esc(text)}"></button>`;
}

/**
 * ผังของหนึ่งแถว · แร็ค = ช่อง × ชั้น ชั้น 1 อยู่ล่างเหมือนของจริง · แถวพื้น = เรียงตามตำแหน่ง
 * ชื่อที่ตำแหน่งซ้ำกัน หรือแถวที่ยาวมาก วาดเป็นตารางไม่ได้ เรียงต่อกันแล้วขึ้นบรรทัดใหม่
 */
function ctGroup(g, cells) {
  const pos = g.locs.map(l => ST.cellPos(l));
  const cols = [...new Set(pos.map(p => p.col))].sort((a, b) => a - b);
  const rows = [...new Set(pos.map(p => p.row))].sort((a, b) => b - a);
  const uniq = new Set(pos.map(p => p.col + '|' + p.row)).size === pos.length;
  if (!uniq || cols.length > 60 || (rows.length === 1 && cols.length > CT_FLOW)) {
    return `<div class="ct-cells" style="grid-template-columns:repeat(${Math.min(g.locs.length, CT_FLOW)},var(--c))">${g.locs.map(l => ctCell(l, cells[l], '')).join('')}</div>`;
  }
  const ci = new Map(cols.map((c, i) => [c, i + 1])), ri = new Map(rows.map((r, i) => [r, i + 1]));
  return `<div class="ct-cells" style="grid-template-columns:repeat(${cols.length},var(--c))">` +
    g.locs.map((l, i) => ctCell(l, cells[l], `grid-column:${ci.get(pos[i].col)};grid-row:${ri.get(pos[i].row)}`)).join('') + '</div>';
}

function ctMap(m) {
  const zones = [];
  m.groups.forEach(g => {
    let z = zones[zones.length - 1];
    if (!z || z.zone !== g.zone) { z = { zone: g.zone, groups: [], total: 0, done: 0, wait: 0 }; zones.push(z); }
    z.groups.push(g); z.total += g.total; z.done += g.done; z.wait += g.wait;
  });
  const n = Object.keys(m.cells).length;
  const size = (n <= 400 ? 18 : n <= 1000 ? 14 : n <= 2600 ? 12 : 10) + (CT.tv ? 3 : 0);
  const states = new Set(Object.keys(m.cells).map(l => m.cells[l].s));
  const body = zones.map(z => `<div class="ct-zone">
      <div class="zh">โซน <b>${esc(z.zone)}</b> · ${z.total ? `${f(z.done)}/${f(z.total)} โล` : ''}${z.wait ? `${z.total ? ' · ' : ''}รอวันที่ 2 ${f(z.wait)} โล` : ''}</div>
      <div class="ct-rows">${z.groups.map(g => {
        const mine = !CT.team || g.locs.some(l => m.cells[l].team === CT.team);
        return `<div class="ct-g ${g.total && g.done === g.total ? 'full' : ''} ${mine ? '' : 'dim'}">
          <div class="gh"><b>${esc(g.group)}</b> ${g.total ? `${f(g.done)}/${f(g.total)}${g.done === g.total ? ' ✓' : ''}` : 'รอวันที่ 2'}</div>${ctGroup(g, m.cells)}</div>`;
      }).join('')}</div></div>`).join('');
  const key = (cls, label) => `<span><i class="ct-c ${cls}"></i>${label}</span>`;
  return `<div class="ct-map" style="--c:${size}px"><div class="ct-zones">${body}</div>
    <div class="ct-legend">${key('todo', 'ยังไม่นับ')}${key('ok', 'นับแล้ว')}${CT.tv ? '' : key('bad', 'ต่างกับสมุด')}${key('todo here', 'มีคนนับอยู่')}
      ${states.has('again') ? key('again', 'ต้องนับใหม่') : ''}${states.has('wait') ? key('wait', 'รอวันที่ 2') : ''}</div></div>`;
}

/** รายละเอียดของโลที่กดในผัง (หน้าหัวหน้าเท่านั้น): ใครนับ เมื่อไร และแต่ละกองเทียบกับสมุด */
function ctSel(cm) {
  const l = CT.sel, c = l && cm.m.cells[l];
  if (!c || CT.tv) return '';
  const tn = (id) => { const t = cm.m.teams.find(x => x.id === id); return t ? t.name : id; };
  const rows = cm.lines.filter(x => x.loc === l && (x.sku || x.long)).map(x => `<tr><td><span class="st-g ${GCLS[x.group] || ''}">${esc(x.group)}</span></td>
    <td>${esc(x.sku || '—')}</td><td class="mu">${esc(x.name)}</td><td>${esc(x.lot)}</td><td>${esc(x.po)}</td><td class="num">${f(x.book)}</td>
    <td class="num">${x.inv === null || x.inv === undefined ? '—' : f(x.inv)}</td><td class="num ${x.diff < 0 ? 'neg' : x.diff > 0 ? 'pos' : ''}">${x.diff ? signed(x.diff) : ''}</td></tr>`).join('');
  return `<div class="ct-sel"><div class="hd"><b>${esc(l)}</b><span>${CT_STATE[c.s]}${c.team ? ' · ' + esc(tn(c.team)) : ''}${c.who.length ? ' · ' + esc(c.who.join(', ')) : ''}${c.at ? ' · ' + hm(c.at) : ''}</span>
      <span class="sp"></span>${cm.pass === 1 ? '<button class="st-btn" data-act="ct-analyze">ดูในวิเคราะห์</button>' : ''}<button class="st-btn" data-act="ct-clear">ปิด</button></div>
    ${rows ? `<div class="st-wrap" style="margin-top:8px"><table class="st-xl"><thead><tr><th>กลุ่ม</th><th>SKU</th><th>ชื่อ</th><th>LOT</th><th>PO</th>
        <th class="num">สมุด</th><th class="num">นับ</th><th class="num">ต่าง</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="st-note">${c.s === 'ok' ? 'โลนี้ว่างทั้งในสมุดและที่นับได้' : 'ยังไม่มีผลนับ และในสมุดไม่มีของ'}</div>`}</div>`;
}

function controlView() {
  const r = R();
  const cm = controlModel();
  const m = cm.m, tv = CT.tv;
  /* เปลี่ยนรอบ หรือรอบ 1 → รอบ 2: ผังเป็นคนละชุด ไม่เทียบกับสีเดิม */
  if (CT.rid !== S.rid + '|' + cm.pass) { CT.rid = S.rid + '|' + cm.pass; CT.prev = null; CT.zones = null; CT.sel = ''; CT.team = ''; }
  CT.cm = cm;
  if (!m.total && !Object.keys(m.cells).length) {
    return `<div class="st-empty">ยังไม่มีรายการ Location ของรอบนี้<br>ดึงยอดตั้งต้นและแบ่งทีมก่อน แล้วผังคลังจะขึ้นที่นี่<br><button class="st-btn" data-go="setup">ไปหน้าตั้งรอบ</button></div>`;
  }
  const started = m.first > 0;
  const live = counting();
  const kpi = (lb, v, sub, extra) => `<div class="ct-kpi"><div class="lb">${lb}</div><div class="v">${v}</div><div class="sub">${sub}</div>${extra || ''}</div>`;
  const slow = m.teams.find(t => t.id === m.etaTeam);
  const etaSub = !started ? 'ยังไม่เริ่มนับ' : !m.left || !m.eta ? ''
    : `${esc(slow ? slow.name : '')} ช้าสุด${m.etaGuess ? ' (ประมาณ)' : ''}${m.paused ? ' · ถ้าเริ่มนับต่อตอนนี้' : ''}`;
  const kpis = kpi(`คืบหน้า${cm.label ? ' ' + cm.label : ''}`, `${m.pct}%`, `${f(m.done)} / ${f(m.total)} โล`, `<div class="bar"><i style="width:${m.pct}%"></i></div>`) +
    kpi('คาดว่าเสร็จ', !m.total ? '—' : !m.left ? 'ครบแล้ว' : m.eta ? etaText(m.eta, m.now) : '—', etaSub,
      tv ? '' : `<label class="tg">เป้า <input type="time" id="ctTarget" value="${esc(targetOf())}" aria-label="เวลาที่อยากให้นับเสร็จ"></label>`) +
    kpi('กำลังนับ', `${f(m.active)} คน`, m.paused ? `ไม่มีใครนับมา ${ST.spanText(m.paused)}` : m.pace ? `ความเร็วรวม ${f(m.pace)} โล/ชม.` : '') +
    (tv ? kpi('เหลือ', `${f(m.left)} โล`, started ? `เริ่มนับ ${hm(m.first)}` : '')
      : kpi('ตรงกับสมุด', m.acc.pct === null ? '—' : `${m.acc.pct}%`, m.acc.checked ? `${f(m.acc.ok)} / ${f(m.acc.checked)} โลที่นับแล้ว` : ''));

  const icon = { warn: '⚠', info: 'ⓘ', ok: '✓' };
  const alerts = controlAlerts(cm).filter(a => !(tv && a.blind));
  const alertsHtml = alerts.length ? `<div class="ct-alerts">${alerts.map(a => `<div class="ct-al ${a.level}"><span aria-hidden="true">${icon[a.level]}</span><span>${esc(a.text)}</span></div>`).join('')}</div>` : '';

  const side = m.teams.map(t => {
    const idle = live && t.started && t.left > 0 && t.idle >= ST.CTRL.idle;
    const etaT = !t.total ? '' : !t.left ? 'ครบแล้ว ✓' : t.eta ? `เสร็จ ~${etaText(t.eta, m.now)}${t.guess ? ' (ประมาณ)' : ''}` : '';
    const last = t.last ? `ล่าสุด <b>${esc(t.last.loc)}</b> · ${esc(t.last.who)} · ${t.idle < 1 ? 'เมื่อกี้' : ST.spanText(t.idle) + 'ก่อน'}` : 'ยังไม่เริ่มนับ';
    return `<button type="button" class="ct-team ${CT.team === t.id ? 'on' : ''} ${t.total && !t.left ? 'done' : ''}" data-ct-team="${esc(t.id)}" aria-pressed="${CT.team === t.id}" title="กดเพื่อดูเฉพาะแถวของทีมนี้ในผัง">
      <div class="tn"><i class="dot ${t.here ? 'live' : idle ? 'idle' : ''}"></i>${esc(t.name)}<span class="pc">${t.pct}%</span></div>
      <div class="bar"><i style="width:${t.pct}%"></i></div>
      <div class="ln"><b>${f(t.done)}/${f(t.total)}</b> โล${t.pace ? ` · ${f(t.pace)} โล/ชม.` : ''}${etaT ? ' · ' + etaT : ''}</div>
      <div class="ln">${last}</div></button>`;
  }).join('');
  const au = cm.pass === 1 ? prog().audit : null;
  const audit = au && au.n ? `<div class="ct-aud">Audit สุ่มแล้ว <b>${au.pct}%</b> ของ ${f(au.n)} โล (ขั้นต่ำ ${au.min}%)</div>` : '';

  const head = tv
    ? `<div class="ct-tvhead"><img src="../icons/mascot-walk.png" alt="" width="48" height="48"><div class="nm"><b>${esc(r.name)}</b><span>${esc(r.status)}${cm.label ? ' · ' + cm.label : ''}</span></div>
        <span class="sp"></span><span class="clock" id="ctClock">${hm(Date.now())}</span>
        <button class="st-btn" data-act="tv-full">เต็มจอ</button><button class="st-btn" data-act="tv-exit">ออกจากจอทีวี</button></div>`
    : `<div class="st-bar" style="margin-bottom:8px"><span class="st-pill ${live ? 'go' : ''}">${live ? '● ' : ''}${esc(r.status)}${cm.label ? ' · ' + cm.label : ''}</span>
        <span class="sp"></span><span>${S.at ? 'อัปเดต ' + new Date(S.at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : ''}</span>
        <button class="st-btn" data-act="tv" title="เปิดบนจอในคลัง ไม่แสดงว่าโลไหนต่างกับสมุด">จอทีวี</button></div>`;

  return `${head}<div class="ct-kpis">${kpis}</div>${alertsHtml}
    <div class="ct-grid"><div>${ctMap(m)}${ctSel(cm)}</div><div class="ct-side">${side || '<div class="ct-aud">ยังไม่มีทีม แบ่งทีมในแท็บทีม/โซน</div>'}${audit}</div></div>
    ${tv ? '' : '<div class="st-note">กดช่องในผังเพื่อดูผลนับของโลนั้น · กดทีมเพื่อดูเฉพาะแถวของทีม · เวลาคาดว่าเสร็จคิดจากความเร็วครึ่งชั่วโมงล่าสุดของแต่ละทีม · อัปเดตเองทุก 20 วินาที</div>'}`;
}

/** หลังวาด: จำสีของแต่ละช่องไว้เทียบรอบหน้า และฉลองโซนที่เพิ่งครบ (เปิดแท็บครั้งแรกไม่ฉลองของที่ครบไปก่อนแล้ว) */
function controlAfter() {
  const cm = CT.cm;
  if (!cm) return;
  const m = cm.m;
  const shown = {};
  Object.keys(m.cells).forEach(l => { shown[l] = ctShown(m.cells[l].s); });
  const zs = {};
  m.groups.forEach(g => { const z = zs[g.zone] = zs[g.zone] || { t: 0, d: 0 }; z.t += g.total; z.d += g.done; });
  const full = Object.keys(zs).filter(z => zs[z].t && zs[z].d === zs[z].t);
  if (CT.zones && window.WmsMotion && window.WmsMotion.cheer) {
    const fresh = full.filter(z => !CT.zones.includes(z));
    if (m.total && !m.left && CT.wasLeft) window.WmsMotion.cheer(cm.label ? `นับ${cm.label}ครบแล้ว` : 'นับครบทุกโลแล้ว', `${f(m.total)} โล`);
    else if (fresh.length) window.WmsMotion.cheer(`โซน ${fresh.join(', ')} ครบแล้ว`, `นับแล้ว ${f(m.done)} จาก ${f(m.total)} โล`);
  }
  CT.zones = full;
  CT.wasLeft = m.left > 0;
  CT.prev = shown;
}

/** จอไม่ดับระหว่างเปิดจอทีวี (เบราว์เซอร์ที่ไม่มีก็แค่ต้องตั้งเครื่องไม่ให้พักจอเอง) */
async function wake() {
  try {
    if (!navigator.wakeLock || WAKE) return;
    WAKE = await navigator.wakeLock.request('screen');
    WAKE.addEventListener('release', () => { WAKE = null; });
  } catch (e) { WAKE = null; }
}

function setTv(on) {
  CT.tv = on;
  const u = new URL(location.href);
  u.searchParams.set('tab', 'control');
  if (on) u.searchParams.set('tv', '1'); else u.searchParams.delete('tv');
  history.replaceState(null, '', u.pathname + u.search);
  if (on) {
    try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* เต็มจอไม่ได้ก็ยังใช้จอทีวีได้ */ }
    wake();
  } else {
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* ไม่ได้อยู่ในเต็มจอ */ }
    if (WAKE) { WAKE.release().catch(() => {}); WAKE = null; }
  }
  CT.prev = null;      // สีของช่องเปลี่ยนตามโหมด (จอทีวีไม่มีสีต่างกับสมุด) ไม่ถือว่าช่องเปลี่ยน
  paint();
}

    ${MOVES && MOVES.err ? `<div class="st-note">เช็คสมุดไม่สำเร็จ: ${esc(MOVES.err)}</div>` : MOVES && !MOVES.list.length ? `<div class="st-note">✓ ${MOVES.day1 ? 'โลวันแรกไม่มีของขยับในสมุด' : 'สมุดไม่มีแถวใหม่หลังดึงยอดตั้งต้น'} (เช็คเมื่อ ${new Date(MOVES.at).toLocaleTimeString('th-TH')})</div>` : ''}`;

/**
 * เช็คว่าสมุดมีแถวใหม่หลังดึงยอดตั้งต้นไหม หยุดรับ-จ่ายแล้วไม่ควรมี
 * ตอนเปิดแท็บใช้ข้อมูลกลาง (เร็ว อาจช้ากว่าสมุดไม่กี่ชั่วโมง) กดปุ่ม = อ่านสมุดสด
 */
async function loadFifo(fresh) {
  const tx = WmsSettings.txUrl();
  if (!tx) throw new Error('ยังไม่มี URL Transaction ในหน้าตั้งค่า');
  let fifo = fresh ? null : await WmsGas.json(tx, 'tx-fifo&shared=1', { retries: 0 }).catch(() => null);
  if (!fifo || fifo.error || !fifo.rows) fifo = await WmsGas.json(tx, 'tx-fifo', { retries: 0 });
  if (fifo.error) throw new Error(fifo.error);
  FIFO = { data: fifo, at: Date.now() };
  return fifo;
}

async function checkMoves(fresh) {
  const tx = WmsSettings.txUrl();
  if (!tx || !R() || !R().lastRow) return;
  const run = async () => {
    const fifo = await loadFifo(fresh);
    const d = day2();
    let list = ST.movesAfter(fifo, d && !d.on && d.row1 ? d.row1 : R().lastRow, R().cutoff);
    /* นับ 2 วัน วันแรก: Outbound ขายจากโลเปิด (โลวันที่ 2) เป็นเรื่องปกติ ดูเฉพาะแถวที่แตะโลวันแรก = โลนั้นต้องนับใหม่ */
    const day1 = !!(d && !d.on);
    if (day1) {
      const mine = new Set(countLocs().map(l => ST.up(l.loc)));
      list = list.filter(m => mine.has(ST.up(m.from)) || mine.has(ST.up(m.to)));
    }
    MOVES = { list, at: Date.now(), day1 };
  };
  if (!fresh) { try { await run(); } catch (e) { MOVES = { list: [], err: e.message, at: Date.now() }; } paintBody(); return; }
  await job('กำลังอ่านสมุด Transaction…', async () => { try { await run(); } catch (e) { MOVES = { list: [], err: e.message, at: Date.now() }; } });
}
