<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>กรอกผลนับ — นับสต๊อกใหญ่</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<!--
  หน้ากรอกผลนับบนมือถือ เปิดจากลิงก์ที่หัวหน้าส่งใน LINE (#u=URL สคริปต์&k=รหัสนับ&r=รอบ)
  ไม่มีหน้าเข้าระบบและเมนูของ WMS เพราะคนนับหลายคนไม่มีบัญชี — สิทธิ์อยู่ที่รหัสในลิงก์
  นับแบบไม่รู้ยอด: สคริปต์ไม่ส่งยอดในสมุดมาที่หน้านี้เลย และส่งให้เฉพาะแถวที่ทีมตัวเองนับ
  เน็ตหลุด: ทุกแถวเก็บในเครื่องก่อน แล้วค่อยทยอยส่ง ส่งซ้ำได้ สคริปต์ตัดซ้ำด้วยรหัสแถว
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--wms-bg)}
body{font-family:var(--wms-font);color:var(--wms-text);-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
button,input{font-family:inherit}

/* ── แถบบน: รอบ ทีม ชื่อ และสถานะการส่ง ── */
.ct-head{position:sticky;top:0;z-index:5}
.ct-top{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--wms-surface);border-bottom:1px solid var(--wms-border)}
/* เส้นความคืบหน้าของทีมใต้แถบบน อยู่ตลอดทั้งตอนเลือกโลและตอนกรอก ยาวขึ้นทุกครั้งที่เสร็จโล */
.ct-prog{height:0;overflow:hidden;background:#E0E7FF;transition:height .3s}
.ct-prog.on{height:4px}
.ct-prog i{position:relative;display:block;width:0;height:100%;overflow:hidden;border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,#6366F1,#8B5CF6 55%,#22C55E);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ct-top .who{flex:1;min-width:0;font-size:13px;color:var(--wms-muted);line-height:1.35}
.ct-top .who b{display:block;font-size:15px;color:var(--wms-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-net{flex:none;padding:5px 11px;border-radius:999px;border:1px solid var(--wms-border);background:var(--wms-surface);
  font-size:12.5px;font-weight:600;color:var(--wms-muted);white-space:nowrap}
.ct-net.ok{background:#ECFDF5;border-color:#A7F3D0;color:#047857}
.ct-net.wait{background:#EEF2FF;border-color:#C7D2FE;color:#4338CA}
.ct-net.off{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.ct-net.bad{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}

.ct-main{max-width:560px;margin:0 auto;padding:12px 14px 120px}
.ct-h{margin:16px 0 8px;font-size:14px;font-weight:700}
.ct-h:first-child{margin-top:0}
.ct-msg{padding:28px 10px;text-align:center;font-size:15px;line-height:1.7;color:var(--wms-muted)}
.ct-msg b{color:var(--wms-text)}
.ct-band{margin-bottom:10px;padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.55}
.ct-band.warn{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E}
.ct-band.bad{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
.ct-band.info{background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3}
.ct-band button{margin-top:6px}

/* ── ปุ่มใหญ่ กดง่ายด้วยนิ้วโป้ง ── */
.ct-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;
  border:1px solid var(--wms-border2);background:var(--wms-surface);font-size:16px;font-weight:600;color:var(--wms-text);cursor:pointer}
.ct-btn:active{transform:scale(.98)}
.ct-btn.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff}
.ct-btn.g{background:#ECFDF5;border-color:#A7F3D0;color:#047857}
.ct-btn.r{color:#B91C1C;border-color:#FECACA}
.ct-btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.ct-btn:disabled{opacity:.45}
.ct-btn.w{width:100%}
.ct-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* ── เลือกทีม / ชื่อ ── */
.ct-pick{display:flex;flex-direction:column;gap:8px}
.ct-team{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:10px 14px;border-radius:12px;border:1px solid var(--wms-border2);
  background:var(--wms-surface);text-align:left;cursor:pointer;font-size:16px;font-weight:700;color:var(--wms-text)}
.ct-team small{display:block;font-size:12.5px;font-weight:400;color:var(--wms-muted);margin-top:2px}
.ct-team .k{margin-left:auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--wms-surface2);color:var(--wms-muted)}
.ct-team.on{border-color:var(--wms-primary);background:var(--wms-primary-light)}
.ct-names{display:flex;flex-wrap:wrap;gap:8px}
.ct-name{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--wms-border2);background:var(--wms-surface);font-size:15px;cursor:pointer}
.ct-name.on{border-color:var(--wms-primary);background:var(--wms-primary);color:#fff;font-weight:600}

/* ── ช่องพิมพ์ ตัวใหญ่ 16px+ มือถือจะไม่ซูมเอง ── */
.ct-in{width:100%;height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-size:17px;color:var(--wms-text)}
.ct-in:focus{outline:none;border-color:var(--wms-primary);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.ct-in.qty{font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ct-lb{display:block;margin:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--wms-muted)}
.ct-hint{min-height:18px;margin-top:4px;font-size:13px;line-height:1.4;color:var(--wms-muted)}
.ct-hint.ok{color:#047857;font-weight:600}
.ct-hint.bad{color:#B45309;font-weight:600}
.ct-sug{display:flex;flex-direction:column;margin-top:4px;border:1px solid var(--wms-border);border-radius:10px;overflow:hidden;background:var(--wms-surface)}
.ct-sug button{display:block;width:100%;min-height:44px;padding:7px 12px;border:0;border-bottom:1px solid #EEF2F6;background:none;text-align:left;
  font-size:15px;color:var(--wms-text);cursor:pointer}
.ct-sug button:last-child{border-bottom:0}
.ct-sug button small{display:block;font-size:12.5px;color:var(--wms-muted)}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── รายการ Location ── */
.ct-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.ct-chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--wms-border);background:var(--wms-surface);
  font-size:14px;color:var(--wms-muted);cursor:pointer;white-space:nowrap}
.ct-chip b{color:var(--wms-text);margin-left:3px}
.ct-chip.on{border-color:var(--wms-primary);background:var(--wms-primary-light);color:var(--wms-primary-dark)}
.ct-list{border:1px solid var(--wms-border);border-radius:12px;overflow:hidden;background:var(--wms-surface)}
.ct-grp{display:flex;justify-content:space-between;padding:7px 14px;background:#F1F5F9;font-size:13px;font-weight:700;color:var(--wms-muted)}
.ct-grp .low{color:#B45309}
.ct-grp .full{color:#047857}
.ct-loc{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border:0;border-bottom:1px solid #EEF2F6;background:none;
  text-align:left;font-size:17px;font-weight:700;color:var(--wms-text);cursor:pointer}
.ct-loc:last-child{border-bottom:0}
.ct-loc .st{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--wms-faint)}
.ct-loc .st.done{color:#047857}
.ct-loc .st.wait{color:#4338CA}
.ct-loc .go{color:var(--wms-faint);font-size:20px;font-weight:400}

/* ── หน้า Location: กองที่นับแล้ว + ฟอร์ม ── */
.ct-lochead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ct-lochead .nm{flex:1;font-size:26px;font-weight:800;letter-spacing:.3px}
.ct-lochead .nm small{display:block;font-size:12.5px;font-weight:500;color:var(--wms-muted);letter-spacing:0}
.ct-piles{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ct-pile{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--wms-border);
  background:var(--wms-surface);text-align:left;cursor:pointer;color:var(--wms-text)}
.ct-pile.on{border-color:var(--wms-primary);box-shadow:0 0 0 2px rgba(79,70,229,.18)}
.ct-pile .d{flex:1;min-width:0;font-size:15px;font-weight:700}
.ct-pile .d small{display:block;font-size:12.5px;font-weight:400;color:var(--wms-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-pile .q{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ct-pile .pend{font-size:11px;font-weight:600;color:#4338CA}
.ct-pile.empty{justify-content:center;font-size:16px;font-weight:700;color:#047857;background:#ECFDF5;border-color:#A7F3D0}
.ct-form{padding:12px;border:1px solid var(--wms-border);border-radius:14px;background:var(--wms-surface)}
.ct-form.edit{border-color:var(--wms-primary);background:#FAFAFF}
.ct-form .tt{font-size:13.5px;font-weight:700;color:var(--wms-muted)}
.ct-bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--wms-surface);border-top:1px solid var(--wms-border)}
.ct-bottom .ct-btn{flex:1}
.ct-rej{margin-bottom:10px;padding:10px 12px;border-radius:10px;background:#FEF2F2;border:1px solid #FECACA;font-size:13.5px;color:#991B1B;line-height:1.6}
.ct-rej summary{font-weight:700;cursor:pointer}
.ct-rej li{margin:4px 0 0 16px}
.ct-foot{margin-top:18px;font-size:12px;color:var(--wms-faint);text-align:center;line-height:1.6}

/* ── น้องกล่อง: ทักทายตอนเข้า ฉลองตอนเสร็จโล และอยู่ด้วยตอนติดขัด
      ไม่อยู่ในฟอร์มกรอก SKU / จำนวน จะได้ไม่เกะกะตอนนับ ── */
.ct-mas{display:block;width:108px;height:108px;margin:0 auto 8px;object-fit:contain}
.ct-mas.sm{width:76px;height:76px}
.ct-hi{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:8px 14px 8px 8px;border-radius:14px;
  background:var(--wms-primary-light);border:1px solid #C7D2FE;color:var(--wms-primary-dark);font-size:13.5px;line-height:1.45}
.ct-hi img{flex:none;width:58px;height:58px}
.ct-hi b{display:block;font-size:16.5px}
.ct-band.pic{display:flex;align-items:center;gap:10px}
.ct-band.pic img{flex:none;width:40px;height:40px}
.ct-band.pic > span{flex:1;min-width:0}
.ct-toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:8px;
  max-width:calc(100% - 28px);padding:6px 18px 6px 8px;border-radius:18px;background:var(--wms-surface);border:1px solid #A7F3D0;
  box-shadow:0 10px 28px rgba(15,23,42,.18);transform:translateX(-50%);pointer-events:none;font-size:13.5px;color:var(--wms-muted);white-space:nowrap}
.ct-toast img{flex:none;width:58px;height:58px}
.ct-toast b{display:block;font-size:17px;color:#047857}
.ct-toast.all{border-color:#FDE68A;background:#FFFBEB}
.ct-toast.all b{color:#B45309}
.ct-toast.mile{border-color:#C4B5FD;background:#F5F3FF}
.ct-toast.mile b{color:#6D28D9}
.ct-toast.go{border-color:#C7D2FE}
.ct-toast.go b{color:var(--wms-primary-dark)}
@media (prefers-reduced-motion:no-preference){
  .ct-mas.hop,.ct-toast img{animation:wms-hop .7s cubic-bezier(.34,1.56,.64,1) both}
  .ct-mas.look,.ct-band.look img{animation:wms-peek 2.4s ease-in-out 2;transform-origin:50% 90%}
  .ct-mas.walk,.ct-hi img{animation:ct-bob .5s ease-in-out infinite alternate}
  .ct-toast{animation:ct-toast 1.9s ease both}
  .ct-toast.long{animation-duration:2.8s}
}
@keyframes ct-bob{to{transform:translateY(-4px) rotate(-2deg)}}
@keyframes ct-toast{0%{opacity:0;transform:translate(-50%,14px)}12%{opacity:1;transform:translate(-50%,0)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,0)}}

/* ── ความคืบหน้าบนรายการโล: วงแหวนเติมเต็ม เลขวิ่งขึ้น ── */
.ct-hero{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:8px 14px 8px 8px;border-radius:14px;
  background:linear-gradient(120deg,#EEF2FF,#F5F3FF);border:1px solid #C7D2FE}
.ct-hero.full{background:linear-gradient(120deg,#ECFDF5,#F0FDF4);border-color:#A7F3D0}
.ct-ring{position:relative;flex:none;width:60px;height:60px}
.ct-ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ct-ring circle{fill:none;stroke-width:6.5}
.ct-ring .bg{stroke:#E0E7FF}
.ct-ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ct-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
  color:var(--wms-primary-dark);font-variant-numeric:tabular-nums}
.ct-hero.full .ct-ring b{color:#047857}
.ct-hero .tx{flex:1;min-width:0;font-size:13px;line-height:1.45;color:var(--wms-muted)}
.ct-hero .tx b{display:block;font-size:16.5px;color:var(--wms-text)}

/* ── กำลังโหลดรอบ: สายพานของระบบตัวใหญ่ น้องกล่องเดินอยู่บนนั้น ── */
.ct-load{padding:64px 10px 20px;text-align:center;font-size:14px;color:var(--wms-muted)}
.ct-load .wms-busy-belt{display:block;margin:0 auto 44px;transform:scale(2);transform-origin:50% 100%}
.ct-load b{display:block;margin-bottom:2px;font-size:16.5px;color:var(--wms-text)}

/* ── ลูกเล่นตอนกด ── */
.ct-btn,.ct-team{position:relative;overflow:hidden}
.ct-rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none}
.ct-net.go{background-image:repeating-linear-gradient(-45deg,rgba(99,102,241,.16) 0 7px,transparent 7px 14px);background-size:19.8px 19.8px}
.ct-pile .pend.sent{color:#047857}
.ct-fly{position:fixed;left:0;top:0;z-index:7;padding:5px 13px;border-radius:999px;background:var(--wms-primary);color:#fff;
  font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 8px 22px rgba(79,70,229,.45);pointer-events:none;white-space:nowrap}
.ct-rain{position:fixed;inset:0;z-index:8;overflow:hidden;pointer-events:none}
.ct-rain i{position:absolute;top:-18px;width:8px;height:12px;border-radius:2px;
  animation:ct-fall var(--d) cubic-bezier(.35,.55,.6,1) var(--t) both}
.ct-lochead .nm{position:relative;overflow:hidden}

/* เข้าหน้าใหม่เท่านั้นที่ขยับ วาดซ้ำในหน้าเดิม (ดึงข้อมูลทุกนาที แตะเลือกชื่อ) ไม่ขยับ
   up = เปิดลิงก์ / เริ่มนับ · fwd = เข้าโล (สไลด์จากขวา + แสงสแกนผ่านชื่อโล) · back = กลับรายการ */
@media (prefers-reduced-motion:no-preference){
  .ct-go-up > *{animation:ct-rise .45s cubic-bezier(.2,.8,.2,1) both}
  .ct-go-up > :nth-child(2){animation-delay:60ms}
  .ct-go-up > :nth-child(3){animation-delay:110ms}
  .ct-go-up > :nth-child(n+4){animation-delay:160ms}
  .ct-go-up .ct-pick > *,.ct-go-up .ct-list > [style],.ct-go-back .ct-list > [style]{animation:ct-rise .42s cubic-bezier(.2,.8,.2,1) both;
    animation-delay:calc(var(--i,12) * 30ms + 140ms)}
  .ct-go-up .ct-hi img{animation:ct-walkin .9s cubic-bezier(.2,.8,.2,1) both,ct-bob .5s ease-in-out .9s infinite alternate}
  .ct-go-fwd > *{animation:ct-in-r .36s cubic-bezier(.2,.8,.2,1) both}
  .ct-go-back > *{animation:ct-in-l .36s cubic-bezier(.2,.8,.2,1) both}
  .ct-go-fwd .ct-form{animation:ct-rise .5s cubic-bezier(.2,.8,.2,1) .1s both}
  .ct-go-fwd .ct-lochead .nm::after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(99,102,241,.38),transparent);animation:ct-scan .95s ease-out .12s both}
  .ct-bottom.ct-go{animation:ct-up .38s cubic-bezier(.2,.8,.2,1) both}
  .ct-pile.fresh{animation:ct-land .65s cubic-bezier(.34,1.56,.64,1) .34s both}
  .ct-pile .pend.sent{animation:ct-fade 1.4s ease .7s forwards}
  .ct-hero.go .ct-ring{animation:wms-hop .7s cubic-bezier(.34,1.56,.64,1) both}
  .ct-prog i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
    transform:translateX(-100%);animation:ct-shine 2.6s ease-in-out infinite}
  .ct-net.go{animation:ct-stripe .7s linear infinite}
  .ct-rip{animation:ct-rip .55s ease-out forwards}
}
@keyframes ct-rise{from{opacity:0;transform:translateY(16px)}}
@keyframes ct-in-r{from{opacity:0;transform:translateX(40px)}}
@keyframes ct-in-l{from{opacity:0;transform:translateX(-40px)}}
@keyframes ct-up{from{transform:translateY(100%)}}
@keyframes ct-walkin{from{opacity:0;transform:translateX(-80px) rotate(-10deg)}}
@keyframes ct-scan{from{transform:translateX(-110%)}to{transform:translateX(250%)}}
@keyframes ct-land{0%{opacity:0;transform:translateY(-14px) scale(.9)}
  55%{opacity:1;transform:scale(1.03);box-shadow:0 0 0 5px rgba(99,102,241,.32)}100%{box-shadow:0 0 0 0 rgba(99,102,241,0)}}
@keyframes ct-fade{to{opacity:0}}
@keyframes ct-shine{60%,100%{transform:translateX(100%)}}
@keyframes ct-stripe{to{background-position:19.8px 0}}
@keyframes ct-rip{to{transform:scale(1);opacity:0}}
@keyframes ct-fall{to{transform:translate(var(--x),calc(100vh + 30px)) rotate(var(--r))}}
</style>
</head>
<body>

<header class="ct-head"><div class="ct-top" id="top"></div><div class="ct-prog" aria-hidden="true"><i id="progBar"></i></div></header>
<main class="ct-main" id="main"></main>
<div id="bottom"></div>

<script src="../wms-gas.js"></script>
<script src="../wms-stocktake.js"></script>
<!-- พลุ สั่น เครื่องหมายถูก ป้ายเด้ง ชุดเดียวกับทั้งระบบ · หน้านี้ไม่มีเมนู WMS จึงไม่ใช้สายพานรอโหลดมุมล่าง (ส่งผลนับเบื้องหลังบ่อย จะกะพริบตลอด) -->
<script type="module">
import { celebrate, shake, saved, bump } from '../wms-motion.js';
window.WmsMotion = { celebrate, shake, saved, bump };
</script>
<script>
const ST = window.WmsStocktake;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 3 });

/* น้องกล่อง ท่าเดียวกับทั้งระบบ (wms-motion.js) · hop = เด้งดีใจ, look = ส่องหา, walk = เดินถือกล่อง */
const MAS = { cheer: '../icons/mascot-cheer.png', look: '../icons/mascot-look.png', oops: '../icons/mascot-oops.png', walk: '../icons/mascot-walk.png' };
const MOVE = { cheer: 'hop', look: 'look', walk: 'walk', oops: '' };
const mas = (pose, size) => `<img class="ct-mas ${MOVE[pose]} ${size || ''}" src="${MAS[pose]}" alt="" width="108" height="108">`;
const pic = (pose, cls, html) => `<div class="ct-band pic ${cls} ${MOVE[pose]}"><img src="${MAS[pose]}" alt="" width="40" height="40"><span>${html}</span></div>`;

/* ── ลูกเล่น: ขยับตอนเปลี่ยนหน้า เพิ่มกอง ส่งถึงชีต และเสร็จโล วาดซ้ำในหน้าเดิมไม่ขยับ
      เครื่องที่ตั้ง "ลดการเคลื่อนไหว" ไว้ นิ่งทั้งหมด ข้อมูลขึ้นครบเหมือนเดิม ── */
const STILL = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const FX = (fn, ...a) => { const m = window.WmsMotion; if (m && m[fn]) m[fn](...a); };
/** สั่นเบา ๆ ให้รู้ว่ากดติด (Android) iPhone ไม่สั่นก็ไม่เป็นไร */
const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
let GO = '';              // หน้าถัดไปเข้ามาแบบไหน up / fwd / back ใช้ครั้งเดียว
let FRESH = '';           // กองที่เพิ่งเพิ่ม เด้งลงรายการ
let RING = null;          // % บนวงแหวนรอบก่อน วงแหวนวิ่งต่อจากค่านี้ (null = เพิ่งเข้ามา เริ่มจาก 0)
const SENT = new Set();   // แถวที่เพิ่งส่งถึงชีต ขึ้น "✓ ส่งแล้ว" แป๊บเดียว
const BELT = `<span class="wms-busy-belt" aria-hidden="true"><i></i><i></i><i></i><img src="${MAS.walk}" alt="" width="36" height="36"></span>`;
const RING_C = 169.65;    // เส้นรอบวงของวงแหวน r = 27

/* ทุกอย่างของหน้านี้อยู่ในเครื่อง ไม่ไปปนกับค่าของหน้าอื่น และไม่ถูกสำรองไปเครื่องอื่น (WmsSettings.SKIP) */
const K = { cfg: 'wms:st:cfg', me: 'wms:st:me', dev: 'wms:st:dev', mine: 'wms:st:mine', rd: 'wms:st:rd' };
const outKey = () => 'wms:st:out:' + CFG.round;
function load(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch (e) { NET.err = 'เครื่องเต็ม เก็บผลนับไม่ได้ — ส่งให้ถึงชีตก่อนแล้วค่อยนับต่อ'; return false; }
}

/* ลิงก์จากหัวหน้า: เก็บไว้ในเครื่องแล้วลบออกจากช่องที่อยู่ คนอื่นมองจอจะไม่เห็นรหัส */
let CFG = (() => {
  const fromLink = ST.parseLink(location.hash);
  if (fromLink) {
    try { localStorage.setItem(K.cfg, JSON.stringify(fromLink)); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
    return fromLink;
  }
  return load(K.cfg, null);
})();

let DEV = (() => {
  let d = ''; try { d = localStorage.getItem(K.dev) || ''; } catch (e) {}
  if (!d) { d = ST.deviceId(); try { localStorage.setItem(K.dev, d); } catch (e) {} }
  return d;
})();

let RD = null;                       // ข้อมูลรอบ: ทีม โซน Location SKU PO (ไม่มียอดในสมุด)
let ME = load(K.me, null);           // {round, pass, team, who}
let MINE = load(K.mine, null);       // แถวของทีมตัวเองจากชีต {round, team, since, rows}
let BOX = { out: [], rej: [] };      // out = รอส่ง  rej = ชีตไม่รับ
let VIEW = 'list', LOC = '', FILTER = 'left', EDIT = '', PICK = null, Q = '';
const NET = { sending: false, err: '', at: 0, fail: 0, timer: 0, loading: false };

if (CFG) BOX = load(outKey(), BOX);
if (ME && (!CFG || ME.round !== CFG.round)) ME = null;
if (MINE && (!CFG || !ME || MINE.round !== CFG.round || MINE.team !== ME.team)) MINE = null;

function team() { return RD && ME ? RD.teams.find(t => t.id === ME.team && t.pass === ME.pass) : null; }
function isAudit() { const t = team(); return !!t && t.kind === 'Audit'; }
function myLocs() { return team() ? ST.teamLocs(team(), RD.locs) : []; }
function pending() { const s = new Set(BOX.out.map(i => i.uid)); return s; }
/** แถวทั้งหมดของทีมนี้: ที่ชีตรับแล้ว + ที่ยังรอส่งในเครื่อง */
function entries() {
  const local = BOX.out.map(i => ({ ...i, clientAt: i.at }));
  return ST.merge((MINE && MINE.rows) || [], local);
}
function atLoc(loc) { return ME ? ST.atLoc(entries(), loc, ME.team, ME.pass) : []; }
/** รอบ 2: คนที่นับโลนี้ในรอบ 1 ห้ามนับซ้ำ (สคริปต์ก็ตีกลับ แต่บอกก่อนจะได้ไม่เสียเวลานับ) */
function banned(loc) {
  if (!ME || ME.pass < 2 || !RD || !RD.plan) return false;
  const hit = RD.plan.find(p => p[0] === ST.up(loc));
  const me = String(ME.who).trim().toUpperCase();
  return !!hit && (hit[1] || []).some(w => String(w).trim().toUpperCase() === me);
}
/** จำนวนโลในรายการที่ทีมนี้นับแล้ว (ชุดเดียวกับที่ locState ถือว่านับแล้ว) */
function doneN(locs) {
  if (!ME) return 0;
  const s = new Set();
  ST.effective(entries()).forEach(e => { if (e.team === ME.team && e.pass === ME.pass) s.add(ST.up(e.loc)); });
  return locs.filter(l => s.has(l.loc)).length;
}
function locState(loc, pend) {
  const rows = atLoc(loc);
  if (!rows.length) return null;
  const empty = rows.length === 1 && rows[0].type === 'ว่าง';
  return { n: rows.filter(r => r.type === 'นับ').length, empty, wait: rows.some(r => pend.has(r.uid)) };
}

/* ── คุยกับสคริปต์ ───────────────────────────────────────────────────── */

function urlOf(api, params) {
  const q = new URLSearchParams({ api, k: CFG.key, round: CFG.round, ...(params || {}) });
  return CFG.url + (CFG.url.includes('?') ? '&' : '?') + q.toString();
}

async function loadRound() {
  /* ยังไม่มีข้อมูลรอบ: ขึ้นฉากรอโหลด (ก่อนหน้านี้ขึ้น "โหลดไม่ได้" ค้างไว้ระหว่างรอ) */
  NET.loading = true; RD ? paintTop() : paint();
  try {
    const res = await WmsGas.json(urlOf('st-round'), 'st-round', { retries: 1, timeoutMs: 60000 });
    if (res.error) throw new Error(res.error);
    RD = { ...res, at: Date.now() };
    save(K.rd, { id: CFG.round, ...RD });
    NET.err = '';
    NET.old = ST.oldScript(res);
  } catch (e) {
    const old = load(K.rd, null);
    if (old && old.id === CFG.round) { RD = old; NET.err = 'ออฟไลน์ ใช้ข้อมูลรอบที่โหลดไว้'; }
    else NET.err = e.message;
  }
  NET.loading = false;
  if (ME && !team()) ME = null;       // หัวหน้าลบทีมนี้ไปแล้ว ให้เลือกใหม่
  /* หัวหน้าเปิดรอบ 2: ทีมกับรายการโลเปลี่ยน ให้เลือกทีมของรอบ 2 ใหม่ (ผลที่ค้างส่งยังอยู่ครบ) */
  if (ME && RD && RD.round.pass > ME.pass && RD.round.status === 'นับรอบ 2') { ME = null; PICK = null; }
  if (!ME) VIEW = 'who';
  GO = 'up';
  paint();
  if (ME) { pull(); flush(); }
}

/**
 * งานเบื้องหลัง (ส่งเสร็จ ดึงแถวเพื่อน) ระหว่างอยู่ในหน้าโล วาดแค่รายการกองกับคำเตือน
 * ฟอร์มที่กำลังพิมพ์ไม่ถูกแตะ คีย์บอร์ดไม่หุบ · หน้าอื่นวาดตามปกติ
 */
function bgPaint() {
  const box = $('piles');
  if (VIEW !== 'loc' || !box) { paint(); return; }
  paintTop();
  const h = pilesHTML();
  if (box._html !== h) { box.innerHTML = h; box._html = h; }
  const w = $('locWarn');
  if (w) w.innerHTML = locWarn();
}

/** แถวของทีมที่ชีตรับแล้ว ขอเฉพาะแถวใหม่หลังแถวล่าสุดที่เคยได้ */
async function pull() {
  if (!ME || NET.sending || !navigator.onLine) return;
  const t = ME.team;
  const since = MINE && MINE.team === t ? MINE.since : 0;
  try {
    const res = await WmsGas.json(urlOf('st-mine', { team: t, since }), 'st-mine', { retries: 0, timeoutMs: 45000 });
    if (res.error) throw new Error(res.error);
    got(res, t, since);
    bgPaint();
  } catch (e) { /* ไม่เป็นไร รอบหน้าค่อยดึง แถวในเครื่องยังอยู่ครบ */ }
}

function got(res, t, since) {
  const was = RD && RD.round.pass;
  if (res.round && RD) Object.assign(RD.round, res.round);
  /* เปิดรอบ 2 ระหว่างที่หน้านี้เปิดอยู่: โหลดทีม/แผนของรอบ 2 ใหม่ */
  if (RD && was && RD.round.pass > was) setTimeout(loadRound, 0);
  if (!ME || ME.team !== t) return;
  if (!MINE || MINE.team !== t) MINE = { round: CFG.round, team: t, since: 0, rows: [] };
  /* คำตอบนี้มีแถวตั้งแต่ since ถ้าในเครื่องยังไม่ถึง since แปลว่ามีช่องโหว่ ไม่เลื่อนจุดอ่านต่อ */
  if (since > MINE.since) return;
  MINE.rows = ST.merge(MINE.rows, (res.rows || []).map(ST.fromRow));
  MINE.since = Math.max(MINE.since, res.last || 0);
  save(K.mine, MINE);
}

/** ฟิลด์ที่สคริปต์ใช้ ไม่ส่งของที่ใช้แค่ในเครื่อง */
function wire(i) {
  return { uid: i.uid, pass: i.pass, team: i.team, who: i.who, loc: i.loc, type: i.type, sku: i.sku, long: i.long, lot: i.lot, po: i.po, qty: i.qty, ref: i.ref, at: i.at };
}

/**
 * ส่งที่ค้างทีละชุด (40 แถว) ทีละคำขอ ส่งไม่ถึงก็ลองใหม่ห่างขึ้นเรื่อย ๆ
 * ส่งซ้ำได้ปลอดภัย สคริปต์ตัดแถวที่เคยรับแล้วด้วยรหัสแถว ปิดหน้าไประหว่างส่งก็ไม่หาย
 */
async function flush() {
  clearTimeout(NET.timer);
  if (NET.sending || !BOX.out.length || !ME || !RD) { paintTop(); return; }
  if (!navigator.onLine) { paintTop(); return; }
  NET.sending = true; paintTop();
  try {
    while (BOX.out.length) {
      const sent = ST.batch(BOX.out, 40);
      const t = ME.team;
      const since = MINE && MINE.team === t ? MINE.since : 0;
      const res = await WmsGas.post(CFG.url, { op: 'st-count', k: CFG.key, round: CFG.round, device: DEV, team: t, since, items: sent.map(wire) }, { timeoutMs: 60000 });
      if (res.error) throw new Error(res.error);
      const a = ST.ack(BOX.out, sent, res);
      BOX.out = a.outbox;
      BOX.rej = BOX.rej.concat(a.rejected);
      save(outKey(), BOX);
      const bad = new Set(a.rejected.map(i => i.uid));
      sent.forEach(i => { if (!bad.has(i.uid)) SENT.add(i.uid); });
      clearTimeout(NET.sentT);
      NET.sentT = setTimeout(() => SENT.clear(), 2500);
      got(res, t, since);
      NET.fail = 0; NET.err = ''; NET.at = Date.now();
      bgPaint();
    }
  } catch (e) {
    NET.fail++;
    NET.err = e.message;
    const wait = [5, 15, 30, 60][Math.min(NET.fail - 1, 3)] * 1000;
    NET.timer = setTimeout(flush, wait);
  }
  NET.sending = false;
  bgPaint();
}

function later() { clearTimeout(NET.timer); NET.timer = setTimeout(flush, 1500); }

function push(type, fields) {
  const t = team();
  const it = {
    uid: ST.uid(DEV, Date.now()), pass: ME.pass, team: ME.team, kind: t.kind, who: ME.who, loc: LOC, type,
    sku: '', long: '', lot: '', po: '', qty: type === 'ว่าง' ? 0 : '', ref: '', at: new Date().toISOString(), ...fields,
  };
  BOX.out.push(it);
  save(outKey(), BOX);
  later();
  return it;
}

/* ── วาดหน้า ─────────────────────────────────────────────────────────── */

function paint() { paintTop(); paintMain(); }

function paintTop() {
  const box = $('top');
  if (!CFG) { box.innerHTML = '<div class="who"><b>กรอกผลนับ</b></div>'; return; }
  const n = BOX.out.length;
  const net = !navigator.onLine ? ['off', `ออฟไลน์ · เก็บไว้ ${n}`]
    : NET.sending ? ['wait go', `กำลังส่ง ${n}…`]
    : n && NET.err ? ['bad', `ส่งไม่ได้ · ค้าง ${n}`]
    : n ? ['wait', `รอส่ง ${n}`]
    : NET.loading ? ['wait', 'กำลังโหลด…'] : ['ok', '✓ ส่งครบ'];
  const t = team();
  /* เส้นความคืบหน้าใต้แถบบน (ไม่ถูกวาดใหม่ ความยาวจึงค่อย ๆ ยืดออก) */
  const bar = $('progBar');
  const locs = t && VIEW !== 'who' ? myLocs() : [];
  bar.parentElement.classList.toggle('on', locs.length > 0);
  bar.style.width = locs.length ? (doneN(locs) * 100 / locs.length).toFixed(1) + '%' : '0';
  const html = `<div class="who"><b>${esc(RD ? RD.round.name : 'นับสต๊อก')}</b>${t ? `${esc(t.name)} · ${esc(ME.who)}` : esc(CFG.round)}</div>` +
    `<button class="ct-net ${net[0]}" data-act="net" aria-label="สถานะการส่ง">${esc(net[1])}</button>`;
  if (box._html === html) return;      // ไม่วาดซ้ำ เครื่องหมายถูกที่กำลังวาดตัวเองจะได้ไม่หาย
  box.innerHTML = html; box._html = html;
  /* ส่งครบ: เครื่องหมายถูกวาดตัวเอง · มีแถวรอส่งเพิ่ม: ป้ายเด้ง */
  const pill = box.querySelector('.ct-net');
  if (n) NET.had = true;
  if (net[0] === 'ok' && NET.had) { NET.had = false; FX('saved', pill); FX('bump', pill); }
  else if (n > (NET.n || 0)) FX('bump', pill);
  NET.n = n;
}

/** หน้าหลักตามสถานะ คืน [เนื้อหา, ปุ่มล่าง] */
function drawMain() {
  if (!CFG) return [`<div class="ct-msg">${mas('look')}<b>เปิดจากลิงก์ที่หัวหน้าส่งให้</b><br>ลิงก์นับสต๊อกมีรหัสรอบอยู่ข้างใน ขอลิงก์ใหม่ใน LINE กลุ่มได้</div>`, ''];
  if (!RD) {
    return [NET.loading ? `<div class="ct-load" role="status">${BELT}<b>น้องกล่องกำลังไปหยิบรายการโลมาให้</b>รอแป๊บนึงนะ</div>`
      : `<div class="ct-msg">${mas('oops')}<b>โหลดรอบนับไม่ได้</b><br>${esc(NET.err)}<br><br><button class="ct-btn" data-act="reload">ลองใหม่</button></div>`, ''];
  }
  if (RD.round.status === 'ปิดแล้ว') return [`<div class="ct-msg">${mas('cheer')}<b>รอบนี้ปิดแล้ว</b><br>ขอบคุณที่ช่วยนับ</div>`, ''];
  if (VIEW === 'who' || !team()) return [whoView(), ''];
  if (VIEW === 'loc' && LOC) return [bands() + locView(), locBottom()];
  return [bands() + listView(), ''];
}

/** วาดหน้าหลัก ถ้าเหมือนเดิมทุกตัวอักษรไม่แตะ · GO = เพิ่งเปลี่ยนหน้า ให้เนื้อหาเลื่อนเข้ามา */
function paintMain() {
  const box = $('main'), bot = $('bottom');
  const go = STILL ? '' : GO;
  GO = '';
  const [m, b] = drawMain();
  if (!go && m === box._html && b === bot._html) return;
  ['ct-go-up', 'ct-go-fwd', 'ct-go-back'].forEach(c => box.classList.remove(c));
  box.innerHTML = m; box._html = m;
  bot.innerHTML = b; bot._html = b;
  if (go) {
    void box.offsetWidth;
    box.classList.add('ct-go-' + go);
    clearTimeout(box._go);
    box._go = setTimeout(() => box.classList.remove('ct-go-' + go), 1500);
  }
  ringFx();
}

/** วงแหวนบนรายการโล: ถอยไปค่าครั้งก่อน (เพิ่งเข้ามา = 0 และวงเด้งขึ้น) แล้วเติมไปค่าจริง เลขกลางวงวิ่งตาม */
function ringFx() {
  const fg = $('ringFg'), n = $('ringN');
  if (!fg) return;
  const first = RING == null, from = first ? 0 : RING, to = Number(n.dataset.to);
  RING = to;
  if (from === to || STILL) return;
  if (first) fg.closest('.ct-hero').classList.add('go');
  fg.style.transition = 'none';
  fg.style.strokeDashoffset = ringOff(from);
  n.textContent = from + '%';
  fg.getBoundingClientRect();
  fg.style.transition = '';
  fg.style.strokeDashoffset = ringOff(to);
  const t0 = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - t0) / 1000), e = 1 - Math.pow(1 - p, 3);
    n.textContent = Math.round(from + (to - from) * e) + '%';
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/** สคริปต์ยังเป็นรุ่นเก่า (หัวหน้าลืม Deploy) นับต่อได้ แต่บางอย่างจะไม่ทำงาน */
function oldBand() {
  return NET.old ? pic('oops', 'bad', `<b>ระบบนับยังไม่อัปเดต</b> แจ้งหัวหน้าให้ Deploy สคริปต์นับสต๊อกเวอร์ชันใหม่ · นับต่อได้ ผลนับเก็บครบ`) : '';
}

function bands() {
  let h = oldBand();
  if (!RD.round.pass) h += pic('look', 'warn', `<b>หัวหน้ายังไม่กดเริ่มนับ</b> กรอกไว้ได้ ผลนับเก็บในเครื่องและส่งให้เองเมื่อเปิดนับ<br><button class="ct-btn sm" data-act="reload">เช็คอีกครั้ง</button>`);
  else if (RD.round.status === 'ตั้งค่า') h += '<div class="ct-band warn">หัวหน้าพักการนับไว้ชั่วคราว ผลที่กรอกยังเก็บและส่งได้ตามปกติ</div>';
  else if (RD.round.status === 'วิเคราะห์') h += `<div class="ct-band info">หัวหน้าปิดรับนับรอบ ${RD.round.pass >= 2 ? 2 : 1} แล้ว ผลที่ค้างในเครื่องยังส่งได้ ถ้าจะนับเพิ่มถามหัวหน้าก่อน</div>`;
  else if (ME && ME.pass >= 2) h += '<div class="ct-band info"><b>รอบ 2 นับซ้ำ</b> นับทุกกองในโลเหมือนรอบ 1 · โลที่คุณนับในรอบ 1 ให้คนอื่นในทีมนับ</div>';
  if (NET.err && BOX.out.length && navigator.onLine) h += pic('oops', 'bad', `<b>ส่งไม่ได้</b> ${esc(NET.err)} — ผลนับยังอยู่ในเครื่อง จะลองส่งใหม่เอง`);
  if (BOX.rej.length) {
    h += `<details class="ct-rej"><summary>ชีตไม่รับ ${BOX.rej.length} แถว — แตะดู</summary><ul>` +
      BOX.rej.slice(-30).map(r => `<li>${esc(r.loc)} ${esc(r.type === 'นับ' ? `${r.sku} × ${r.qty}` : r.type)} — ${esc(r.why)}</li>`).join('') +
      `</ul><button class="ct-btn sm" data-act="rej-clear">รับทราบ ล้างรายการ</button></details>`;
  }
  return h;
}

/* ── เลือกทีมและชื่อ ─────────────────────────────────────────────────── */

function whoView() {
  const pass = RD.round.pass || 1;
  const list = RD.teams.filter(t => t.pass === pass && t.zones.length);
  if (!list.length) return `<div class="ct-msg">${mas('look')}<b>ยังไม่มีทีมในรอบนี้</b><br>รอหัวหน้าแบ่งทีมก่อน แล้วกดลองใหม่<br><br><button class="ct-btn" data-act="reload">ลองใหม่</button></div>`;
  const sel = PICK || (ME ? { team: ME.team, who: ME.who } : { team: '', who: '' });
  PICK = sel;
  const card = (t, i) => {
    const n = ST.teamLocs(t, RD.locs).length;
    const z = pass >= 2 ? 'รอบ 2 นับซ้ำ' : t.zones.length > 3 ? `${t.zones[0]} … ${t.zones[t.zones.length - 1]} (${t.zones.length} แถว)` : t.zones.join(', ');
    return `<button class="ct-team ${sel.team === t.id ? 'on' : ''}" style="--i:${Math.min(i, 12)}" data-team="${esc(t.id)}"><span>${esc(t.name)}<small>${esc(z)} · ${f(n)} โล</small></span><span class="k">${t.kind}</span></button>`;
  };
  const inv = list.filter(t => t.kind !== 'Audit'), aud = list.filter(t => t.kind === 'Audit');
  const t = list.find(x => x.id === sel.team);
  const hi = pass >= 2 ? ['รอบ 2 มาช่วยนับซ้ำกัน', 'นับให้ละเอียดเหมือนรอบแรกนะ'] : ['สวัสดี มานับสต๊อกกัน', 'เลือกทีมกับชื่อ แล้วกดเริ่มนับ'];
  return oldBand() + `<div class="ct-hi"><img src="${MAS.walk}" alt="" width="58" height="58"><span><b>${hi[0]}</b>${hi[1]}</span></div>` +
    `<div class="ct-h">เลือกทีมของคุณ</div><div class="ct-pick">${inv.map(card).join('')}</div>` +
    (aud.length ? `<div class="ct-h">Audit</div><div class="ct-pick">${aud.map(card).join('')}</div>` : '') +
    (t ? `<div class="ct-h">ชื่อคุณ</div>
      ${t.members.length ? `<div class="ct-names">${t.members.map(m => `<button class="ct-name ${sel.who === m ? 'on' : ''}" data-name="${esc(m)}">${esc(m)}</button>`).join('')}</div>` : ''}
      <input class="ct-in" id="whoIn" style="margin-top:8px" maxlength="40" placeholder="หรือพิมพ์ชื่อ" value="${esc(t.members.includes(sel.who) ? '' : sel.who)}" autocomplete="name">
      <button class="ct-btn p w" style="margin-top:12px" data-act="who-ok">เริ่มนับ</button>` : '') +
    `<div class="ct-foot">เครื่องนี้: ${esc(DEV)} · ผลนับทุกแถวบันทึกชื่อ ทีม และเวลา</div>`;
}

/* ── รายการ Location ของทีม ──────────────────────────────────────────── */

/**
 * การ์ดความคืบหน้า วาดที่ค่าจริงเสมอ (วาดซ้ำได้ผลเหมือนเดิม หน้าจะได้ไม่ถูกวาดใหม่โดยไม่จำเป็น)
 * ringFx พาวงแหวนวิ่งจากค่าครั้งก่อน กลับจากโลที่เพิ่งเสร็จจะเห็นวงยืดขึ้น
 */
const ringOff = (pct) => (RING_C * (1 - pct / 100)).toFixed(2);
function hero(done, total, audit, min) {
  const pct = total ? Math.floor(done * 100 / total) : 0;
  const full = !audit && total > 0 && done === total;
  const t = team();
  const title = audit ? `สุ่มแล้ว ${f(done)} โล` : full ? 'นับครบทุกโลแล้ว' : `นับแล้ว ${f(done)} จาก ${f(total)} โล`;
  const sub = audit ? `ต้องสุ่มอย่างน้อย ${min}% ทุกแถว · ${esc(t.name)}` : full ? 'เก่งมาก ขอบคุณที่ช่วยนับ' : `เหลืออีก ${f(total - done)} โล · ${esc(t.name)}`;
  return `<div class="ct-hero ${full ? 'full' : ''}">
      <div class="ct-ring"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="ctRingG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${full ? '#22C55E' : '#6366F1'}"/><stop offset="1" stop-color="${full ? '#15803D' : '#A855F7'}"/></linearGradient></defs>
        <circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="ringFg" cx="32" cy="32" r="27" stroke="url(#ctRingG)"
          style="stroke-dasharray:${RING_C};stroke-dashoffset:${ringOff(pct)}"/></svg>
        <b id="ringN" data-to="${pct}">${pct}%</b></div>
      <div class="tx"><b>${title}</b>${sub}</div></div>`;
}

function listView() {
  const locs = myLocs();
  const pend = pending();
  const st = {};
  locs.forEach(l => { st[l.loc] = locState(l.loc, pend); });
  const done = locs.filter(l => st[l.loc]).length;
  const audit = isAudit();
  const min = RD.round.auditMin || ST.AUDIT_MIN;
  const q = ST.up(Q);
  const show = locs.filter(l => (!q || l.loc.includes(q)) && (FILTER === 'all' || (FILTER === 'done' ? st[l.loc] : !st[l.loc])));
  /* โลนอกรายการที่ทีมนี้นับไว้ หัวหน้าเห็นในหน้าความคืบหน้า */
  const known = new Set(locs.map(l => l.loc));
  const extra = [...new Set(ST.effective(entries()).filter(e => e.team === ME.team && e.pass === ME.pass && !known.has(ST.up(e.loc))).map(e => ST.up(e.loc)))];
  let rows = '', grp = '', k = 0;
  /* แถวบน ๆ ที่เห็นบนจอไล่ขึ้นทีละแถวตอนเข้าหน้า (ลำดับใน --i) ที่เหลือขึ้นพร้อมกัน */
  const nth = () => (k < 16 ? ` style="--i:${k++}"` : '');
  show.forEach(l => {
    if (l.group !== grp) {
      grp = l.group;
      const gl = locs.filter(x => x.group === grp);
      const gd = gl.filter(x => st[x.loc]).length;
      const pct = Math.round(gd * 100 / gl.length);
      rows += `<div class="ct-grp"${nth()}><span>แถว ${esc(grp)}</span>` + (audit
        ? `<span class="${pct >= min ? 'full' : 'low'}">สุ่มแล้ว ${gd}/${gl.length} · ${pct}% (ต้อง ${min}%)</span>`
        : `<span class="${gd === gl.length ? 'full' : ''}">${gd}/${gl.length}</span>`) + '</div>';
    }
    const s = st[l.loc];
    const no = banned(l.loc);
    const label = no && !s ? 'ให้คนอื่นนับ' : !s ? '' : s.empty ? 'ว่าง ✓' : `✓ ${s.n} กอง`;
    rows += `<button class="ct-loc"${nth()} data-loc="${esc(l.loc)}">${esc(l.loc)}<span class="st ${s ? (s.wait ? 'wait' : 'done') : no ? 'wait' : ''}">${label}${s && s.wait ? ' · รอส่ง' : ''}</span><span class="go">›</span></button>`;
  });
  const typed = q && !known.has(q) && q.length >= 2 && ME.pass < 2;
  const left = locs.length - done;
  return hero(done, locs.length, audit, min) + `<div class="ct-chips">
      <button class="ct-chip ${FILTER === 'left' ? 'on' : ''}" data-filter="left">${audit ? 'ยังไม่สุ่ม' : 'เหลือ'}<b>${f(left)}</b></button>
      <button class="ct-chip ${FILTER === 'done' ? 'on' : ''}" data-filter="done">${audit ? 'สุ่มแล้ว' : 'นับแล้ว'}<b>${f(done)}</b></button>
      <button class="ct-chip ${FILTER === 'all' ? 'on' : ''}" data-filter="all">ทั้งหมด<b>${f(locs.length)}</b></button>
    </div>
    ${audit ? `<div class="ct-band info">Audit เลือกโลสุ่มตรวจเอง อย่างน้อย ${min}% ของแต่ละแถว · ไม่เห็นตัวเลขของทีม Inventory</div>` : ''}
    <input class="ct-in" id="locQ" placeholder="ค้นหาโล หรือพิมพ์โลที่ไม่มีในรายการ" value="${esc(Q)}" autocapitalize="characters" autocomplete="off" spellcheck="false">
    ${typed ? `<button class="ct-btn w" style="margin-top:8px" data-loc="${esc(q)}">นับโล ${esc(q)} (นอกรายการ)</button>` : ''}
    <div class="ct-list" style="margin-top:10px">${rows || `<div class="ct-msg">${FILTER === 'left' && !q
      ? `${mas('cheer')}<b>${audit ? 'สุ่มครบทุกแถวแล้ว' : 'นับครบทุกโลแล้ว'}</b><br>เก่งมาก ขอบคุณที่ช่วยนับ`
      : `${mas('look', 'sm')}ไม่มีโลตามที่ค้น`}</div>`}</div>
    ${extra.length ? `<div class="ct-h">โลนอกรายการที่นับไว้</div><div class="ct-list">${extra.map(l => `<button class="ct-loc" data-loc="${esc(l)}">${esc(l)}<span class="st done">✓</span><span class="go">›</span></button>`).join('')}</div>` : ''}
    <div class="ct-foot"><button class="ct-btn sm" data-act="who">เปลี่ยนทีม/ชื่อ</button> <button class="ct-btn sm" data-act="reload">โหลดรายการใหม่</button></div>`;
}

/* ── หน้า Location: กองที่นับ + ฟอร์มเพิ่มกอง ───────────────────────── */

let FORM = { sku: '', long: '', lot: '', po: '', qty: '' };

function skuName(long, sku) {
  const s = ST.skuExact(RD.skus, long || sku);
  return s ? s[2] : '';
}

/** กองที่นับแล้วในโลนี้ · กองที่เพิ่งเพิ่มเด้งลง · แถวที่เพิ่งส่งถึงชีตขึ้น "✓ ส่งแล้ว" แล้วจางไป */
function pilesHTML() {
  const rows = atLoc(LOC);
  const pend = pending();
  const empty = rows.find(r => r.type === 'ว่าง');
  return rows.filter(r => r.type === 'นับ').map(r => `<button class="ct-pile ${EDIT === r.uid ? 'on' : ''} ${FRESH === r.uid ? 'fresh' : ''}" data-pile="${esc(r.uid)}">
      <span class="d">${esc(r.sku || r.long)}<small>${esc(skuName(r.long, r.sku) || '—')} · LOT ${esc(r.lot || '-')} · PO ${esc(r.po || '-')}${r.who && r.who !== ME.who ? ' · ' + esc(r.who) : ''}</small>${pend.has(r.uid) ? '<span class="pend">รอส่ง</span>' : SENT.has(r.uid) ? '<span class="pend sent">✓ ส่งแล้ว</span>' : ''}</span>
      <span class="q">${f(r.qty)}</span></button>`).join('') +
    (empty ? `<button class="ct-pile empty" data-act="unempty">ว่าง ✓ <span style="font-weight:400;font-size:13px">(แตะเพื่อยกเลิก)</span></button>` : '');
}

function locView() {
  const rows = atLoc(LOC);
  const piles = rows.filter(r => r.type === 'นับ');
  const p = ST.parseLoc(LOC);
  if (banned(LOC)) {
    return `<div class="ct-lochead"><button class="ct-btn sm" data-act="back" aria-label="กลับไปรายการโล">‹ โล</button>
      <div class="nm">${esc(LOC)}<small>แถว ${esc(p.group)}</small></div></div>
      <div class="ct-msg">${mas('look')}<b>คุณนับโลนี้ในรอบ 1 แล้ว</b><br>รอบ 2 ให้คนอื่นในทีมนับ ผลจะได้เทียบกันได้จริง</div>`;
  }
  const editing = EDIT && piles.find(r => r.uid === EDIT);
  return `<div class="ct-lochead"><button class="ct-btn sm" data-act="back" aria-label="กลับไปรายการโล">‹ โล</button>
      <div class="nm">${esc(LOC)}<small>แถว ${esc(p.group)}${piles.length ? ` · ${piles.length} กอง` : ''}</small></div></div>
    <div id="locWarn">${locWarn()}</div>
    <div class="ct-piles" id="piles">${pilesHTML()}</div>
    <div class="ct-form ${editing ? 'edit' : ''}">
      <div class="tt">${editing ? 'แก้กองนี้' : piles.length ? 'เพิ่มกองถัดไป' : 'กองแรก'}</div>
      <label class="ct-lb" for="fSku">SKU</label>
      <input class="ct-in" id="fSku" value="${esc(FORM.sku)}" autocapitalize="characters" autocomplete="off" spellcheck="false" enterkeyhint="next" placeholder="พิมพ์รหัสหรือชื่อสินค้า">
      <div id="skuHint" class="ct-hint"></div><div id="skuSug"></div>
      <div class="ct-grid">
        <div><label class="ct-lb" for="fLot">LOT</label><input class="ct-in" id="fLot" value="${esc(FORM.lot)}" inputmode="numeric" autocomplete="off" enterkeyhint="next"></div>
        <div><label class="ct-lb" for="fPo">PO</label><input class="ct-in" id="fPo" value="${esc(FORM.po)}" inputmode="numeric" autocomplete="off" enterkeyhint="next"></div>
      </div>
      <div id="poHint" class="ct-hint"></div><div id="poSug"></div>
      <label class="ct-lb" for="fQty">จำนวน</label>
      <input class="ct-in qty" id="fQty" value="${esc(FORM.qty)}" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0">
      ${editing
        ? `<div class="ct-row2"><button class="ct-btn p" data-act="save-edit">บันทึกที่แก้</button><button class="ct-btn" data-act="cancel-edit">ยกเลิก</button></div>
           <button class="ct-btn r w" style="margin-top:8px" data-act="del">ลบกองนี้</button>`
        : `<button class="ct-btn p w" style="margin-top:12px" data-act="add">+ เพิ่มกอง</button>`}
    </div>`;
}

function locBottom() {
  if (banned(LOC)) return `<div class="ct-bottom"><button class="ct-btn p" data-act="next">โลถัดไป</button></div>`;
  const rows = atLoc(LOC);
  const none = !rows.length;
  return `<div class="ct-bottom">${none ? '<button class="ct-btn g" data-act="empty">โลนี้ว่าง</button>' : ''}<button class="ct-btn ${none ? '' : 'p'}" data-act="next">เสร็จ → โลถัดไป</button></div>`;
}

/** คำใบ้ใต้ช่อง SKU / PO อัปเดตตอนพิมพ์โดยไม่วาดทั้งหน้า (คีย์บอร์ดไม่หุบ) */
function hints() {
  const sh = $('skuHint'), ss = $('skuSug'), ph = $('poHint'), ps = $('poSug');
  if (!sh) return;
  const ex = ST.skuExact(RD.skus, FORM.sku);
  if (ex) { FORM.long = ex[1]; sh.className = 'ct-hint ok'; sh.textContent = '✓ ' + ex[2]; ss.innerHTML = ''; }
  else {
    FORM.long = '';
    const hits = ST.skuSearch(RD.skus, FORM.sku, 6);
    sh.className = 'ct-hint' + (FORM.sku && !hits.length ? ' bad' : '');
    sh.textContent = FORM.sku && !hits.length ? 'ไม่พบ SKU นี้ในคลัง — ตรวจตัวสะกดอีกครั้ง' : '';
    ss.innerHTML = FORM.sku && hits.length ? `<div class="ct-sug">${hits.map(s => `<button data-sku="${esc(s[0] || s[1])}">${esc(s[0] || s[1])}<small>${esc(s[2])}${s[0] ? ' · ' + esc(s[1]) : ''}</small></button>`).join('')}</div>` : '';
  }
  const poHit = RD.pos.find(p => ST.norm(p[0]) === ST.norm(FORM.po));
  const odd = poHit ? ST.pileWarn({ sku: FORM.sku, long: FORM.long, lot: FORM.lot, po: FORM.po }, RD.pos, RD.skus, true) : [];
  if (poHit && odd.length) { ph.className = 'ct-hint bad'; ph.textContent = '⚠ ' + odd.join(' · '); ps.innerHTML = ''; }
  else if (poHit) { ph.className = 'ct-hint ok'; ph.textContent = poHit[1] ? `✓ PO ${poHit[0]} · ${poHit[1]}` : `✓ PO ${poHit[0]}`; ps.innerHTML = ''; }
  else {
    const hits = ST.poSearch(RD.pos, FORM.po, 5);
    ph.className = 'ct-hint' + (FORM.po.length >= 4 && !hits.length ? ' bad' : '');
    ph.textContent = FORM.po.length >= 4 && !hits.length ? 'ไม่พบ PO นี้ — ตรวจเลขอีกครั้ง' : '';
    ps.innerHTML = hits.length ? `<div class="ct-sug">${hits.map(p => `<button data-po="${esc(p[0])}">${esc(p[0])}<small>${esc(p[1] || '')}</small></button>`).join('')}</div>` : '';
  }
}

function openLoc(loc) {
  const from = VIEW;
  LOC = ST.up(loc); VIEW = 'loc'; EDIT = ''; FORM = { sku: '', long: '', lot: '', po: '', qty: '' };
  PRES = { loc: LOC, others: [] };
  GO = 'fwd';
  paint(); hints(); window.scrollTo(0, 0);
  /* มาจากรายการ: แถบปุ่มล่างเลื่อนขึ้นมา · โลต่อโล แถบอยู่ที่เดิม */
  const bar = document.querySelector('.ct-bottom');
  if (bar && from !== 'loc' && !STILL) bar.classList.add('ct-go');
  setTimeout(() => { const el = $('fSku'); if (el && !atLoc(LOC).length) el.focus(); }, 50);
  if (!banned(LOC)) announce(LOC);
}

/* ── กันสองคนนับโลเดียวกัน ─────────────────────────────────────────────── */

let PRES = { loc: '', others: [] };   // คนอื่นในงานเดียวกันที่เปิดโลนี้อยู่ (จากสคริปต์)

/**
 * บอกสคริปต์ว่าเครื่องนี้เปิดโลไหนอยู่ ('' = ออกจากโลแล้ว) ถ้ามีคนอื่นเปิดโลเดียวกันอยู่ ขึ้นเตือน
 * เน็ตหลุด / สคริปต์รุ่นเก่า = ไม่เตือน นับต่อได้ตามปกติ · ใส่คำเตือนในกล่องของมันเอง ไม่วาดทั้งหน้า (คีย์บอร์ดไม่หุบ)
 */
function announce(loc) {
  if (!ME || !CFG || !navigator.onLine) return;
  const t = team();
  WmsGas.post(CFG.url, { op: 'st-open', k: CFG.key, round: CFG.round, pass: ME.pass, kind: t ? t.kind : 'Inventory', who: ME.who, device: DEV, loc },
    { timeoutMs: 15000, retries: 0 })
    .then((res) => {
      if (!res || res.error || !loc || LOC !== loc || VIEW !== 'loc') return;
      PRES = { loc, others: res.others || [] };
      const box = $('locWarn');
      if (box) box.innerHTML = locWarn();
    })
    .catch(() => {});
}

/** เตือนในหน้าโล: มีคนเปิดโลนี้อยู่ · เพื่อนในทีมนับโลนี้ไปแล้ว */
function locWarn() {
  let h = '';
  if (PRES.loc === LOC && PRES.others.length) {
    const names = PRES.others.map(o => esc(o.who) + (o.ago ? ` (${o.ago} นาทีก่อน)` : ' (เมื่อกี้)')).join(', ');
    h += pic('look', 'warn', `<b>${names} เปิดโลนี้อยู่</b><br>ตกลงกันก่อนว่าใครนับ ถ้านับกองเดียวกันซ้ำ ยอดจะเกิน`);
  }
  const me = String(ME.who).trim().toUpperCase();
  const rows = atLoc(LOC).filter(r => r.who && String(r.who).trim().toUpperCase() !== me);
  const mates = esc([...new Set(rows.map(r => r.who))].join(', '));
  const n = rows.filter(r => r.type === 'นับ').length;
  if (n) h += pic('look', 'info', `<b>${mates} นับโลนี้ไว้แล้ว ${n} กอง</b><br>กองที่มีชื่อเพื่อนอยู่ในรายการข้างล่าง ไม่ต้องนับซ้ำ`);
  else if (rows.length) h += pic('look', 'info', `<b>${mates} ตั้งโลนี้ว่างไว้แล้ว</b><br>ถ้าเจอของในโลนี้ เพิ่มกองได้เลย`);
  return h;
}

/** ช่องที่ต้องแก้: เคอร์เซอร์ไปที่ช่องนั้น ช่องสั่น เครื่องสั่นสั้น ๆ */
function oops(id) {
  const el = $(id);
  if (el) { el.focus(); FX('shake', el); }
  buzz([30, 40, 30]);
}

/** ค่าที่กรอก ผ่านแล้วคืนฟิลด์ของแถว ไม่ผ่านคืน null (บอกเหตุผลแล้ว) */
function readForm() {
  const sku = ST.up(FORM.sku), lot = String(FORM.lot).trim(), po = String(FORM.po).trim();
  const qty = Number(String(FORM.qty).replace(/,/g, ''));
  if (!sku) { alert('ใส่ SKU ก่อน'); oops('fSku'); return null; }
  if (!(qty > 0) || !isFinite(qty)) { alert('ใส่จำนวนที่นับได้ (มากกว่า 0)\nถ้าโลว่าง กด "โลนี้ว่าง"'); oops('fQty'); return null; }
  const ex = ST.skuExact(RD.skus, sku);
  if (!ex && !confirm(`ไม่พบ SKU "${sku}" ในคลัง\nแน่ใจว่าพิมพ์ถูก? (ถ้าใช่ กดตกลง)`)) { oops('fSku'); return null; }
  const v = { sku: ex ? (ex[0] || ex[1]) : sku, long: ex ? ex[1] : '', lot, po, qty };
  /* PO / LOT ไม่เข้ากับ SKU ตามสมุด จับตั้งแต่ตรงนี้ หน้าวิเคราะห์จะได้ไม่มี "LOT/PO ผิด" ที่มาจากพิมพ์ผิด */
  const warn = ST.pileWarn(v, RD.pos, RD.skus);
  if (warn.length && !confirm('ดูป้ายอีกครั้ง\n• ' + warn.join('\n• ') + '\n\nแน่ใจว่าถูก? (ถ้าใช่ กดตกลง)')) {
    oops(!lot || /^LOT/.test(warn[0]) ? 'fLot' : 'fPo');
    return null;
  }
  return v;
}

/** stay = false ตอนบันทึกก่อนออกจากโล (ไม่ต้องวาดหน้าเดิมซ้ำ) · คืน true ถ้าบันทึกแล้ว */
function addPile(stay) {
  const v = readForm();
  if (!v) return false;
  const rows = atLoc(LOC);
  const same = rows.find(r => r.type === 'นับ' && ST.norm(r.long || r.sku) === ST.norm(v.long || v.sku) && ST.norm(r.lot) === ST.norm(v.lot) && ST.norm(r.po) === ST.norm(v.po));
  if (same && !confirm(`มีกอง ${v.sku} LOT ${v.lot || '-'} PO ${v.po || '-'} ในโลนี้แล้ว (${f(same.qty)})\nเพิ่มเป็นอีกกองแยก? ยอดจะรวมกัน`)) return false;
  const empty = rows.find(r => r.type === 'ว่าง');
  if (empty) push('ยกเลิก', { ref: empty.uid });
  const from = rectOf('[data-act="add"]');
  const it = push('นับ', v);
  FORM = { sku: '', long: '', lot: '', po: '', qty: '' };
  if (stay === false) return true;
  FRESH = it.uid;
  paint(); hints(); landFx(from, it);
  setTimeout(() => { const el = $('fSku'); if (el) el.focus(); }, 30);
  return true;
}

function rectOf(sel) { const el = document.querySelector(sel); return el ? el.getBoundingClientRect() : null; }

/** กองที่เพิ่งบันทึก: ป้าย +จำนวน ลอยโค้งจากปุ่มขึ้นไปลงรายการ กองนั้นเด้งลงมา เลขวิ่งจาก 0 */
function landFx(from, it) {
  FRESH = '';
  buzz(12);
  const row = document.querySelector(`.ct-pile[data-pile="${CSS.escape(it.uid)}"]`);
  if (!row || STILL) return;
  const q = row.querySelector('.q');
  const qty = Number(it.qty);
  if (Number.isInteger(qty) && qty > 1) {
    const t0 = performance.now() + 340;
    const step = (now) => {
      const p = Math.max(0, Math.min(1, (now - t0) / 520));
      q.textContent = f(Math.round(qty * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  if (!from || !document.body.animate) return;
  const to = q.getBoundingClientRect();
  const fly = document.createElement('div');
  fly.className = 'ct-fly';
  fly.textContent = '+' + f(qty);
  document.body.appendChild(fly);
  const w = fly.offsetWidth, h = fly.offsetHeight;
  const x0 = from.left + from.width / 2 - w / 2, y0 = from.top + from.height / 2 - h / 2;
  const x1 = to.left + to.width / 2 - w / 2, y1 = to.top + to.height / 2 - h / 2;
  const at = (x, y, s) => `translate(${Math.round(x)}px,${Math.round(y)}px) scale(${s})`;
  fly.animate([
    { transform: at(x0, y0, 0.6), opacity: 0 },
    { transform: at((x0 + x1) / 2, Math.min(y0, y1) - 70, 1.15), opacity: 1, offset: 0.5 },
    { transform: at(x1, y1, 0.5), opacity: 0.2 },
  ], { duration: 560, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });
  setTimeout(() => fly.remove(), 620);
}

function editPile(uid) {
  const r = atLoc(LOC).find(x => x.uid === uid);
  if (!r) return;
  EDIT = uid;
  FORM = { sku: r.sku || r.long, long: r.long, lot: r.lot, po: r.po, qty: String(r.qty) };
  paint(); hints();
  const el = $('fQty'); if (el) { el.scrollIntoView({ block: 'center' }); }
}

/** แก้ = แถวใหม่ที่ชี้แถวเดิม แถวเดิมยังอยู่ในชีต ใครแก้อะไรเมื่อไหร่ย้อนดูได้ */
function saveEdit(stay) {
  const v = readForm();
  if (!v) return false;
  const from = rectOf('[data-act="save-edit"]');
  const it = push('นับ', { ...v, ref: EDIT });
  EDIT = ''; FORM = { sku: '', long: '', lot: '', po: '', qty: '' };
  if (stay !== false) { FRESH = it.uid; paint(); hints(); landFx(from, it); }
  return true;
}

/** ช่องที่พิมพ์ไว้แต่ยังไม่กด "+ เพิ่มกอง" / "บันทึกที่แก้" */
function typed() {
  const pile = EDIT ? atLoc(LOC).find(r => r.uid === EDIT) : null;
  return ST.formDirty(FORM, pile);
}

/** ก่อนออกจากโล: บันทึกกองที่พิมพ์ค้างไว้ให้ก่อน ถ้ากรอกไม่ครบจะเตือนและอยู่โลเดิม */
function keepTyped() {
  if (!typed()) { EDIT = ''; return true; }
  return EDIT ? saveEdit(false) : addPile(false);
}

/** ปุ่ม "เสร็จ → โลถัดไป" */
function doneLoc() {
  if (!banned(LOC) && !typed() && !atLoc(LOC).length &&
      !confirm('โลนี้ยังไม่ได้กรอกอะไร\nข้ามไปก่อน? (ถ้าโลว่าง ให้กด "โลนี้ว่าง")')) return;
  const loc = LOC, before = doneN(myLocs());
  if (keepTyped()) { nextLoc(); cheer(loc, before); }
}

/** การ์ดน้องกล่องเด้งขึ้นเหนือปุ่มล่างแป๊บเดียว กดทะลุได้ ไม่บังปุ่ม */
let TOAST = 0;
function toast(cls, html, ms) {
  const old = document.querySelector('.ct-toast');
  if (old) old.remove();
  clearTimeout(TOAST);
  const el = document.createElement('div');
  el.className = 'ct-toast ' + cls;
  el.setAttribute('role', 'status');
  el.innerHTML = `<img src="${MAS.cheer}" alt="" width="58" height="58"><span>${html}</span>`;
  document.body.appendChild(el);
  TOAST = setTimeout(() => el.remove(), ms);
  return el;
}

/* นับไปถึง 1 ใน 4 / ครึ่งทาง / 3 ใน 4 ของโลทั้งหมด ฉลองใหญ่ขึ้นหน่อย */
const MILES = [[25, 'ไปได้ 1 ใน 4 แล้ว'], [50, 'ครึ่งทางแล้ว สู้ ๆ'], [75, 'อีกนิดเดียว']];

/**
 * เสร็จโลแล้ว: น้องกล่องเด้งขึ้นมาพร้อมพลุ บอกว่าเหลืออีกกี่โล · ข้ามโลไม่ฉลอง
 * before = จำนวนโลที่นับแล้วก่อนกดเสร็จ ใช้ดูว่าเพิ่งข้ามหลักไหน และเพิ่งนับครบหรือเปล่า
 */
function cheer(loc, before) {
  if (banned(loc) || !atLoc(loc).length) return;
  const locs = myLocs(), done = doneN(locs);
  const left = locs.length - done;
  const audit = isAudit();
  const all = !audit && locs.length > 0 && left === 0;
  const fresh = before != null && done > before;
  const mile = !audit && !all && fresh ? MILES.filter(m => before * 100 < m[0] * locs.length && done * 100 >= m[0] * locs.length).pop() : null;
  const sub = audit ? `สุ่มแล้ว ${f(done)} โล` : all ? 'นับครบทุกโลแล้ว 🎉' : mile ? `${mile[1]} · เหลือ ${f(left)} โล` : `เหลือ ${f(left)} โล`;
  const big = all || mile;
  const el = toast(all ? 'all long' : mile ? 'mile long' : '', `<b>เสร็จ ${esc(loc)} ✓</b>${sub}`, big ? 2900 : 2000);
  buzz(big ? [20, 70, 20, 70, 40] : [15, 60, 25]);
  FX('celebrate', el);
  if (big) setTimeout(() => FX('celebrate', el), 280);
  if (all && fresh) rain();
}

/** เพิ่งนับครบทุกโล: พลุกระดาษโปรยลงมาทั้งจอ */
function rain() {
  if (STILL) return;
  const box = document.createElement('div');
  box.className = 'ct-rain';
  box.setAttribute('aria-hidden', 'true');
  const C = ['#6366F1', '#A5B4FC', '#22C55E', '#F59E0B', '#F472B6', '#38BDF8'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i');
    p.style.cssText = `left:${(Math.random() * 100).toFixed(1)}%;background:${C[i % C.length]};--x:${Math.round(Math.random() * 140 - 70)}px;` +
      `--r:${Math.round(Math.random() * 900 - 450)}deg;--d:${(1.8 + Math.random() * 1.6).toFixed(2)}s;--t:${Math.round(Math.random() * 900)}ms`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4600);
}

/** Inventory เดินต่อโลถัดไปที่ยังไม่นับตามทางเดิน · Audit กลับไปเลือกโลเอง */
function nextLoc() {
  const locs = myLocs();
  const pend = pending();
  const i = locs.findIndex(l => l.loc === LOC);
  const after = locs.slice(i + 1).concat(locs.slice(0, Math.max(i, 0)));
  const nx = isAudit() ? null : after.find(l => !locState(l.loc, pend) && !banned(l.loc));
  if (nx) { openLoc(nx.loc); return; }
  VIEW = 'list'; LOC = ''; EDIT = ''; GO = 'back'; paint(); window.scrollTo(0, 0);
  announce('');
}

/* แตะปุ่ม: วงคลื่นแผ่ออกจากจุดที่นิ้วแตะ */
document.addEventListener('pointerdown', (e) => {
  const b = !STILL && e.target.closest && e.target.closest('.ct-btn,.ct-team');
  if (!b) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2;
  const w = document.createElement('span');
  w.className = 'ct-rip';
  w.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(w);
  setTimeout(() => w.remove(), 600);
}, { passive: true });

/* ── ปุ่มและช่อง ─────────────────────────────────────────────────────── */

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.team) {
    PICK = { team: d.team, who: '' };
    const tm = RD.teams.find(x => x.id === d.team);
    if (tm && tm.members.length === 1) PICK.who = tm.members[0];
    paintMain();
    return;
  }
  if (d.name) { PICK.who = d.name; paintMain(); return; }
  if (d.filter) { FILTER = d.filter; paintMain(); return; }
  if (d.loc) { openLoc(d.loc); return; }
  if (d.pile) { EDIT === d.pile ? (EDIT = '', FORM = { sku: '', long: '', lot: '', po: '', qty: '' }, paint(), hints()) : editPile(d.pile); return; }
  if (d.sku) { FORM.sku = d.sku; $('fSku').value = d.sku; hints(); $('fLot').focus(); return; }
  if (d.po) { FORM.po = d.po; $('fPo').value = d.po; hints(); $('fQty').focus(); return; }
  switch (d.act) {
    case 'reload': loadRound(); break;
    case 'net': flush(); pull(); break;
    case 'who': PICK = null; VIEW = 'who'; paint(); break;
    case 'who-ok': {
      const typed = ($('whoIn') && $('whoIn').value.trim()) || '';
      const who = typed || PICK.who;
      if (!who) { alert('เลือกหรือพิมพ์ชื่อคุณก่อน'); oops('whoIn'); return; }
      const tm = RD.teams.find(x => x.id === PICK.team && x.pass === (RD.round.pass || 1));
      if (BOX.out.length && ME && ME.team !== tm.id) { alert('ยังมีผลนับของทีมเดิมรอส่ง ' + BOX.out.length + ' แถว — รอให้ส่งครบก่อนเปลี่ยนทีม'); return; }
      ME = { round: CFG.round, pass: tm.pass, team: tm.id, who };
      save(K.me, ME);
      if (!MINE || MINE.team !== ME.team) MINE = null;
      VIEW = 'list'; FILTER = 'left'; PICK = null; GO = 'up'; RING = null;
      paint(); pull();
      toast('go', `<b>สู้ ๆ นะ ${esc(who)}!</b>${esc(tm.name)} · ${f(myLocs().length)} โล`, 2000);
      buzz(15);
      break;
    }
    case 'back': if (VIEW !== 'loc' || keepTyped()) { VIEW = 'list'; LOC = ''; EDIT = ''; GO = 'back'; paint(); announce(''); } break;
    case 'add': addPile(); break;
    case 'save-edit': saveEdit(); break;
    case 'cancel-edit': EDIT = ''; FORM = { sku: '', long: '', lot: '', po: '', qty: '' }; paint(); hints(); break;
    case 'del':
      if (confirm('ลบกองนี้? (ในชีตจะมีแถวยกเลิกต่อท้าย แถวเดิมไม่หาย)')) { push('ยกเลิก', { ref: EDIT }); EDIT = ''; FORM = { sku: '', long: '', lot: '', po: '', qty: '' }; paint(); hints(); }
      break;
    case 'empty':
      if (typed() && !confirm('มีกองที่พิมพ์ไว้แต่ยังไม่ได้เพิ่ม\nทิ้งที่พิมพ์ แล้วตั้งโลนี้ว่าง?')) break;
      FORM = { sku: '', long: '', lot: '', po: '', qty: '' };
      { const loc = LOC, before = doneN(myLocs()); push('ว่าง', {}); nextLoc(); cheer(loc, before); }
      break;
    case 'unempty': { const em = atLoc(LOC).find(r => r.type === 'ว่าง'); if (em && confirm('ยกเลิก "ว่าง" ของโลนี้?')) { push('ยกเลิก', { ref: em.uid }); paint(); hints(); } break; }
    case 'next': doneLoc(); break;
    case 'rej-clear': BOX.rej = []; save(outKey(), BOX); paint(); break;
  }
});

document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'fSku') { FORM.sku = e.target.value; hints(); }
  else if (id === 'fLot') { FORM.lot = e.target.value; hints(); }
  else if (id === 'fPo') { FORM.po = e.target.value; hints(); }
  else if (id === 'fQty') FORM.qty = e.target.value;
  else if (id === 'locQ') {
    Q = e.target.value;
    const pos = e.target.selectionStart;
    paintMain();
    const el = $('locQ'); el.focus(); el.setSelectionRange(pos, pos);
  }
});

/* Enter = ไปช่องถัดไป ช่องจำนวนกด Enter = เพิ่มกอง เหมือนกรอกลงชีต */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const order = ['fSku', 'fLot', 'fPo', 'fQty'];
  const i = order.indexOf(e.target.id);
  if (i === -1) return;
  e.preventDefault();
  if (i < 3) { $(order[i + 1]).focus(); return; }
  EDIT ? saveEdit() : addPile();
});

window.addEventListener('online', () => { NET.fail = 0; paintTop(); flush(); pull(); });
window.addEventListener('offline', () => paintTop());
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); pull(); } });
/* ดึงแถวของเพื่อนร่วมทีมทุกนาที คนละเครื่องนับแถวเดียวกันจะได้เห็นว่าโลไหนนับแล้ว */
setInterval(() => { if (!document.hidden && VIEW !== 'loc') pull(); }, 60000);
setInterval(() => { if (BOX.out.length && !NET.sending) flush(); }, 30000);
window.addEventListener('beforeunload', (e) => { if (BOX.out.length) { e.preventDefault(); e.returnValue = ''; } });

paint();
if (CFG) loadRound();
</script>
</body>
