<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ป้ายบ่งชี้ — เอกสารคลังสินค้า</title>
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-paper.css">
<link rel="stylesheet" href="./wh-forms.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ขนาดป้ายเท่ากันทั้งสองโหมด (≈198×136mm ตามป้ายจริงที่ใช้อยู่)
   ต่างกันแค่ใส่กี่ใบต่อแผ่น — A5 ทีละใบ หรือ A4 แนวตั้งสองใบเพื่อประหยัดกระดาษ */
.paper{ padding:6mm; }
body.p1 .paper{ width:210mm; min-height:148mm; }
body.p2 .paper{ width:210mm; min-height:297mm; }

.tags{ display:flex; flex-direction:column; gap:6mm; }
body.p1 .tag:nth-child(n+2){ display:none; }

.tag{ width:100%; border-collapse:collapse; table-layout:fixed; }
/* 17mm ให้ป้ายสูงเต็มหน้า A5 พอดี — ปล่อยตามเนื้อหาจะเหลือขาวท้ายป้าย 15mm
     แล้วสัดส่วนจะผิดจากป้ายจริงที่ทีมใช้อยู่ */
  .tag td{ border:1px solid #000; padding:0.8mm 1.6mm; height:17mm; vertical-align:middle; }
.tag .ttl{ text-align:center; font-size:19pt; font-weight:700; height:15mm; }
.tag .k{ font-size:13pt; font-weight:700; white-space:nowrap; }
.tag .k.sm{ font-size:11pt; }
.tag input{ width:100%; border:0; background:#F8FAFC; font-family:inherit; font-size:16pt;
  font-weight:700; color:#000; outline:none; padding:0 1mm; height:11mm; }
.tag input:focus{ background:#EEF2FF; }
.tag input.sm{ font-size:13pt; height:9mm; }
/* ชื่อสินค้าใต้รหัส — ป้ายที่เขียนแค่ LNO-216 ไม่บอกใครว่ากล่องนี้คืออะไร */
.tag .nm{ font-size:9pt; font-weight:400; color:#334155; line-height:1.2;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag .pcs{ font-size:11pt; font-weight:700; padding-left:1mm; white-space:nowrap; }
.tag .cell{ display:flex; align-items:center; gap:1mm; }

@media print{
  .paper{ min-height:0 !important; }
  .tag input{ background:none !important; }
  .tag{ break-inside:avoid; }
}
</style>
</head>
<body data-wms-module="warehouse" class="p1">

<div class="wms-shell">
<div data-wms-shell="warehouse" data-root="../"></div>
<div class="wms-main">
  <div data-wh-nav="tag"></div>
  <div id="warnSlot"></div>

  <div class="fm-bar">
    <a class="fm-btn" href="./">← รายการเอกสาร</a>
    <span class="fm-name">🏷️ ป้ายบ่งชี้</span>
    <span class="fm-meta">กระดาษ</span>
    <button class="fm-btn primary" id="b1" onclick="setPer(1)">1 ป้าย · A5 แนวนอน</button>
    <button class="fm-btn" id="b2" onclick="setPer(2)">2 ป้าย · A4 แนวตั้ง</button>
    <span class="fm-spacer"></span>
    <button class="fm-btn" onclick="copyFirst()">⧉ คัดลอกใบแรก</button>
    <button class="fm-btn" onclick="location.reload()">🧹 ล้าง</button>
    <button class="fm-btn primary" onclick="window.print()">🖨 พิมพ์</button>
  </div>

  <div class="fm-stage">
    <div class="paper wh-paper"><div class="tags" id="tags"></div></div>
  </div>
</div><!-- /.wms-main -->
</div><!-- /.wms-shell -->

<script type="module" src="../wms-shell.js"></script>
<script type="module" src="./wh-nav.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-stock.js"></script>
<script src="./wh-sku.js"></script>
<script src="./wh-form.js"></script>
<script src="./wh-shared.js"></script>
<script>
/* ช่องทั้งหมดมาจากป้ายจริงที่ใช้อยู่ ไม่ใช่จากชีต "ใบบ่งชี้ผ้าปู" ในไฟล์ Excel
   ซึ่งมีแค่ PO / SKU / QTY / Date — ป้ายที่ใช้จริงมี Location, LOT, MFG,
   Transfer Date และช่องเซ็นสองคน คือใบรับเข้าคลัง ไม่ใช่ป้ายติดของเฉย ๆ */
const TAG = `
  <table class="tag">
    <colgroup><col style="width:22%"><col style="width:31%"><col style="width:16%"><col style="width:31%"></colgroup>
    <tbody>
      <tr><td class="ttl" colspan="4">ป้ายบ่งชี้</td></tr>
      <tr>
        <td colspan="2"></td>
        <td class="k">RC/Date</td>
        <td><input type="date" data-rc></td>
      </tr>
      <tr><td class="k">Location</td><td colspan="3"><input data-loc></td></tr>
      <tr><td class="k">SKU</td>
        <td colspan="3"><input data-sku autocomplete="off"><div class="nm"></div></td></tr>
      <tr>
        <td class="k">PO.</td><td><input class="sm"></td>
        <td class="k">LOT.</td><td><input class="sm"></td>
      </tr>
      <tr>
        <td class="k">QTY</td>
        <td><div class="cell"><input class="sm"><span class="pcs">Pcs.</span></div></td>
        <td class="k">MFG.</td><td><input class="sm"></td>
      </tr>
      <tr><td class="k sm">Transfer Date.</td><td colspan="3"><input class="sm"></td></tr>
      <tr>
        <td class="k sm">ผู้ดำเนินการรับเข้า</td><td><input class="sm"></td>
        <td class="k sm">ผู้ตรวจสอบ</td><td><input class="sm"></td>
      </tr>
    </tbody>
  </table>`;

document.getElementById('tags').innerHTML = TAG + TAG;

document.getElementById('tags').addEventListener('input', (e) => {
  if (!e.target.matches('[data-sku]')) return;
  const nm = e.target.parentNode.querySelector('.nm');
  const hit = window.WhSku ? WhSku.find(e.target.value) : null;
  if (nm) nm.textContent = hit ? hit.name : '';
});

/* @page ต้องเปลี่ยนตามโหมดด้วย ไม่งั้นเลือก A4 แล้วเครื่องพิมพ์ยังใช้ขนาด A5
   ตามที่ประกาศไว้ตอนโหลดหน้า แล้วป้ายใบที่สองจะถูกตัดหาย */
function setPer(n) {
  document.body.className = 'p' + n;
  document.body.dataset.wmsModule = 'warehouse';
  document.getElementById('b1').className = 'fm-btn' + (n === 1 ? ' primary' : '');
  document.getElementById('b2').className = 'fm-btn' + (n === 2 ? ' primary' : '');
  let st = document.getElementById('tag-page-size');
  if (!st) { st = document.createElement('style'); st.id = 'tag-page-size'; document.head.appendChild(st); }
  st.textContent = n === 1
    ? '@page { size: 210mm 148mm; margin: 6mm; }'
    : '@page { size: 210mm 297mm; margin: 6mm; }';
}

/** ของ PO เดียวกันมักติดหลายกล่อง — ใบที่สองมักซ้ำใบแรกทั้งใบ */
function copyFirst() {
  const tags = [...document.querySelectorAll('.tag')];
  const src = [...tags[0].querySelectorAll('input')].map((i) => i.value);
  [...tags[1].querySelectorAll('input')].forEach((i, k) => {
    i.value = src[k];
    i.dispatchEvent(new Event('input', { bubbles: true }));
  });
}

WhForm.wire(document.getElementById('tags'));

// RC/Date คือวันที่รับเข้า ซึ่งคือวันที่กรอกป้ายเกือบทุกครั้ง
const d = new Date();
const today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
              '-' + String(d.getDate()).padStart(2, '0');
document.querySelectorAll('[data-rc]').forEach((el) => { el.value = today; });

setPer(1);
WhShared.warnIfNoSku();
</script>
</body>
</html>
