<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LOT / PO ที่ขายออก — WMS</title>
<link rel="icon" type="image/png" sizes="32x32" href="../wms-icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../wms-logo.png">
<link rel="apple-touch-icon" href="../wms-icon-180.png">
<link rel="stylesheet" href="../wms-theme.css">
<link rel="stylesheet" href="../wms-gate.css">
<script src="../wms-gate.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ── แถบแหล่งข้อมูล ชุดเดียวกับหน้าเช็ครายการตัดสต๊อก ── */
.tx-src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;
  background:var(--wms-surface2);border-bottom:1px solid var(--wms-border);font-size:12px}
.tx-src .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  background:var(--wms-surface);border:1px solid var(--wms-border);color:var(--wms-muted)}
.tx-src .pill b{color:var(--wms-text);font-weight:600}
.tx-src .pill.warn{background:#FEF3C7;border-color:#FDE68A;color:#92400E}
.tx-src .sp{flex:1}
.tx-src button{padding:4px 12px;border-radius:999px;border:1px solid var(--wms-border2);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:13px;color:#334155;cursor:pointer}
.tx-src button:hover:not(:disabled){background:var(--wms-primary-light);border-color:var(--wms-primary);
  color:var(--wms-primary-dark)}
.tx-src button.p{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff}
.tx-src button.p:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.tx-src button:disabled{opacity:.6;cursor:default}
.tx-src select{padding:4px 8px;border-radius:8px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px;color:var(--wms-text)}
.tx-err{width:100%;font-size:13px;color:#B91C1C;font-weight:600}
/* ช่วงวันที่ที่เลือกเอง ส่วนหลังช่องวันที่วาดใหม่ได้โดยไม่แตะช่องวันที่ จึงห่อไว้แต่ไม่ให้กล่องนี้มีผลกับการจัดแถว */
.tx-src input[type=date]{padding:3px 6px;border-radius:8px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px;color:var(--wms-text)}
.lp-tail{display:contents}
.lp-pend{width:100%;font-size:13px;color:#92400E}

/* ── แถบเลือกวัน เลื่อนข้างได้ เดือนหนึ่งมีสามสิบกว่าวัน ── */
.lp-days{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;background:var(--wms-surface);
  border-bottom:1px solid var(--wms-border);scrollbar-width:thin}
.lp-days:empty{display:none}
.lp-day{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--wms-border2);background:var(--wms-surface);font-family:var(--wms-font);font-size:13px;
  color:#334155;cursor:pointer;font-variant-numeric:tabular-nums}
.lp-day:hover{border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.lp-day.on{background:var(--wms-primary);border-color:var(--wms-primary);color:#fff;font-weight:700}
/* ผลเทียบรายวันของวันนั้น บอกด้วยเครื่องหมายด้วย ไม่ใช่สีอย่างเดียว */
.lp-day i{font-style:normal;font-size:12px;font-weight:700}
.lp-day.d-ok i{color:#166534}
.lp-day.d-warn i{color:#B45309}
.lp-day.d-bad i{color:#B91C1C}
.lp-day.on i{color:#fff}
/* ปุ่มทั้งเดือนติดซ้ายตอนเลื่อนแถบ เงาสีพื้นบังวันที่เลื่อนลอดไปข้างหลัง */
.lp-day.all{position:sticky;left:0;z-index:1;box-shadow:-20px 0 0 var(--wms-surface),10px 0 0 var(--wms-surface)}

/* ── ยอดรวม ── */
.tx-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:12px 20px;
  background:var(--wms-surface);border-bottom:1px solid var(--wms-border)}
.tx-sum:empty{display:none}
.tx-stat{padding:8px 11px;border-radius:var(--wms-radius-sm);background:var(--wms-surface2)}
.tx-stat small{display:block;font-size:12px;color:var(--wms-muted)}
.tx-stat b{font-size:20px;font-weight:700;color:var(--wms-text);font-variant-numeric:tabular-nums}
.tx-stat b.tx-mid{color:#B45309}
.tx-stat b.tx-neg{color:#B91C1C}
.tx-stat i{display:block;font-style:normal;font-size:12px;color:var(--wms-muted)}

/* ── เนื้อหา ── */
.tx-body{padding:14px 20px 60px}
.tx-empty{padding:44px 20px;text-align:center;color:var(--wms-muted);font-size:14px;line-height:1.7}
.tx-empty b{color:var(--wms-text)}
.tx-note{margin-bottom:12px;font-size:13px;color:var(--wms-muted);line-height:1.6}
.tx-warn{margin-bottom:12px;padding:10px 13px;border-radius:var(--wms-radius-sm);background:#FEF3C7;
  border:1px solid #FDE68A;color:#92400E;font-size:13px;line-height:1.6}
.tx-warn.bad{background:#FEE2E2;border-color:#FECACA;color:#991B1B}
.tx-warn b{font-weight:700}
.tx-pass{margin-bottom:12px;padding:10px 13px;border-radius:var(--wms-radius-sm);background:#DCFCE7;
  border:1px solid #BBF7D0;color:#166534;font-size:13px;font-weight:600;line-height:1.6}
.tx-pass small,.tx-warn small{display:block;font-size:12px;font-weight:400;opacity:.85}

.tx-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--wms-muted)}
.tx-bar .sp{flex:1}
.tx-opt{padding:5px 13px;border-radius:999px;border:1px solid var(--wms-border2);background:var(--wms-surface);
  font-family:var(--wms-font);font-size:13px;color:#334155;cursor:pointer}
.tx-opt:hover{border-color:var(--wms-primary);color:var(--wms-primary-dark)}
.tx-opt.on{background:var(--wms-primary-light);border-color:var(--wms-primary);color:var(--wms-primary-dark);font-weight:600}
.tx-input{flex:1;min-width:180px;max-width:360px;padding:9px 13px;border-radius:10px;border:1.5px solid var(--wms-border2);
  background:var(--wms-surface);font-family:var(--wms-font);font-size:14px;color:var(--wms-text);outline:none}
.tx-input:focus{border-color:var(--wms-primary)}

/* ตารางกว้างกว่าจอมือถือ เลื่อนเฉพาะตาราง */
.tx-wrap{overflow-x:auto;background:var(--wms-surface);border:1px solid var(--wms-border);border-radius:var(--wms-radius)}
.tx-tbl{width:100%;border-collapse:collapse;font-size:13px}
.tx-tbl th{text-align:left;padding:9px 11px;background:var(--wms-surface2);font-size:12px;
  font-weight:600;color:var(--wms-muted);border-bottom:1px solid var(--wms-border);white-space:nowrap}
.tx-tbl td{padding:8px 11px;border-bottom:1px solid #F1F5F9;vertical-align:top;line-height:1.45}
.tx-tbl tr:last-child td{border-bottom:0}
.tx-tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-tbl th.num{text-align:right}
.tx-tbl .nw{white-space:nowrap}
.tx-tbl .sum td{background:var(--wms-surface2);font-weight:700}
.tx-sub{display:block;font-size:12px;color:var(--wms-muted);line-height:1.5}
.tx-mid{color:#B45309;font-weight:600}
.tx-neg{color:#B91C1C;font-weight:700}
.tx-tag{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:999px;background:var(--wms-primary-light);
  color:var(--wms-primary-dark);font-size:12px;font-weight:600;white-space:nowrap}
.tx-row{font-weight:600;color:var(--wms-primary-dark)}

/* SKU เดียวออกหลาย LOT/PO ในวันเดียว แถวต่อจากแถวแรกไม่ต้องเขียนชื่อซ้ำ มีเส้นซ้ายบอกว่าเป็นกลุ่มเดียวกัน */
.lp-tbl .k-sku{min-width:200px}
.lp-tbl tr.lp-grp td{border-bottom-color:transparent}
.lp-tbl tr.lp-in td:first-child{box-shadow:inset 3px 0 0 var(--wms-primary-light)}
.lp-tbl .k-src{min-width:150px}
.lp-tbl .k-ord{min-width:120px}
.lp-tbl .k-note{min-width:160px}
/* สลับมุมมองอยู่บนสุดของเนื้อหา เส้นใต้แยกจากตัวกรองด้านล่าง */
.lp-view{padding-bottom:12px;border-bottom:1px solid var(--wms-border)}

/* ── ประมาณ LOT ให้ของ LOT 0 ── ป้ายเขียนคำว่า ประมาณ ไม่ได้บอกด้วยสีอย่างเดียว */
.lp-guess{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:#FEF3C7;color:#92400E;
  font-size:11px;font-weight:700;vertical-align:1px;white-space:nowrap}
.lp-est{margin-bottom:12px;padding:11px 14px;border-radius:var(--wms-radius-sm);background:var(--wms-surface);
  border:1px solid var(--wms-border);border-left:4px solid #F59E0B;font-size:13px;line-height:1.6;color:var(--wms-text)}
.lp-est .say{font-weight:600}
.lp-est .say b{font-variant-numeric:tabular-nums}
.lp-est ul{margin:6px 0 0 18px;color:var(--wms-muted)}
.lp-est li b{color:var(--wms-text);font-variant-numeric:tabular-nums}
.lp-est .act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px;font-size:12px;color:var(--wms-muted)}
.lp-sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--wms-border);color:var(--wms-muted)}
.lp-sub b{color:var(--wms-text);font-variant-numeric:tabular-nums}
.lp-how{margin-top:6px}
.lp-how summary{cursor:pointer;font-weight:600;color:var(--wms-primary-dark)}
.lp-how ol{margin:6px 0 4px 20px}
.lp-how li{margin-bottom:3px}
.lp-how small{display:block;font-size:12px}

@media (max-width:640px){
  .mod-title h2 .en,.mod-title p{display:none}
  .tx-src,.lp-days,.tx-sum{padding-left:16px;padding-right:16px}
  .tx-src button{min-height:44px;padding:0 16px}
  .tx-src select,.tx-src input[type=date]{min-height:44px;font-size:16px}
  .lp-range{flex-wrap:wrap}
  .lp-day{min-height:44px;padding:0 14px}
  .tx-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tx-body{padding-left:16px;padding-right:16px}
  .tx-opt{display:inline-flex;align-items:center;min-height:44px;padding:0 15px}
  .tx-input{flex-basis:100%;min-height:44px;font-size:16px;max-width:none}   /* ต่ำกว่า 16px iPhone จะซูมหน้าเองตอนแตะช่องค้น */
  .lp-out .tx-opt{flex:1;justify-content:center}
  .lp-out span{display:none}
  .tx-row{display:inline-block;padding:10px 6px;margin:-10px -6px}

  /* แถวเป็นการ์ด: SKU บนสุด LOT PO จำนวนเรียงกันบรรทัดเดียว ที่มาอยู่ล่าง ไม่ต้องเลื่อนข้าง */
  .lp-tbl,.lp-tbl tbody{display:block}
  .lp-tbl thead{display:none}
  .lp-tbl tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;column-gap:10px;row-gap:4px;
    padding:11px 12px;border-bottom:1px solid var(--wms-border)}
  .lp-tbl tr.lp-grp{border-bottom:1px dashed var(--wms-border)}
  .lp-tbl tr:last-child{border-bottom:0}
  .lp-tbl td{display:block;min-width:0;padding:0;border:0;white-space:normal}
  .lp-tbl .k-date{grid-column:1/-1;font-size:12px;color:var(--wms-muted)}
  .lp-tbl .k-sku{grid-column:1/-1;min-width:0}
  .lp-tbl:not(.lp-ord) tr.lp-in .k-sku{display:none}
  .lp-tbl .k-ord,.lp-tbl .k-note{grid-column:1/-1;min-width:0}
  .lp-ord tr.lp-in .k-ord{display:none}
  .lp-tbl .k-note:empty{display:none}
  .lp-view .tx-opt{flex:1;justify-content:center}
  .lp-tbl .k-lot::before,.lp-tbl .k-po::before,.lp-tbl .k-qty::before{content:attr(data-label);display:block;
    font-size:12px;font-weight:500;color:var(--wms-muted)}
  .lp-tbl .k-qty{font-size:16px;font-weight:700}
  .lp-tbl .k-src{grid-column:1/-1;min-width:0}
  .lp-tbl tr.sum{display:flex;justify-content:space-between;background:var(--wms-surface2)}
  .lp-tbl tr.sum .k-qty::before{display:none}
  .lp-est{padding:11px 12px}
  .lp-est .act .tx-opt{flex:1;justify-content:center}
}
</style>
</head>
<body data-wms-module="lotpo">

<div class="wms-shell">
<div data-wms-shell="lotpo" data-root="../"></div>
<div class="wms-main">

  <div class="mod-head">
    <div class="mod-title">
      <div class="ic"><img src="../icons/clipboard-list.png" alt="" width="38" height="38"></div>
      <div>
        <h2>LOT / PO ที่ขายออก<span class="en"> · Lot &amp; PO Out</span></h2>
        <p>SKU ที่ขายออกแต่ละวันมาจาก LOT และ PO ไหน อ่านจากแถวขายในสต๊อกราย Location ไว้ทำรายงานส่งบัญชี — อ่านอย่างเดียว ไม่แก้ชีต</p>
      </div>
    </div>
  </div>

  <div class="tx-src" id="src"></div>
  <div class="lp-days" id="days"></div>
  <div class="tx-sum" id="sum"></div>
  <div class="tx-body" id="body"></div>

</div><!-- /.wms-main -->
</div><!-- /.wms-shell -->

<script type="module" src="../wms-shell.js"></script>
<script src="../wms-settings.js"></script>
<script src="../wms-gas.js"></script>
<script src="../wms-shared.js"></script>
<script src="../wms-cut.js"></script>
<script src="../wms-lotpo.js"></script>
<script src="../wms-lot0.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f = n => Math.round(n).toLocaleString('en-US');
const dm = d => { const p = String(d || '').split('-'); return p.length === 3 ? `${+p[2]}/${+p[1]}` : ''; };
const pad = n => String(n).padStart(2, '0');

/* แถวขายของหนึ่งเดือนราวสี่ร้อยกิโลไบต์ เก็บไว้ เปิดหน้ากลับมาจะได้ไม่ต้องรอสคริปต์อ่านชีตใหม่ */
const CACHE = 'wms:lotpo:ledger';
const SHOW_MAX = 500;   // ทั้งเดือนมีเป็นหมื่นบรรทัด วาดหมดหน้าจะหน่วง คัดลอกกับดาวน์โหลดยังได้ครบ

let LED = null;     // คำตอบ tx-daily ของช่วงที่ดึงไว้ (from, to)
let RAW = [];       // WmsLotPo.build(LED) ยังเป็น SKU ที่ขาย ใช้ปันล็อตให้ออเดอร์ที่ตัดด้วย SKU เดียวกัน
let ROWS = [];      // RAW ที่แปลงคืนเป็น SKU ตอนซื้อแล้ว
let MONTH = '';     // yyyy-mm เดือนในตัวเลือก
/*
 * ช่วงวันที่ที่จะดึง yyyy-mm-dd ปกติคือทั้งเดือน เลือกเองได้ เพราะ Report ของเดือนเลยไปถึงต้นเดือนถัดไป
 * (ผู้ใช้ขอ 2026-11-06) ป้ายบนจอใช้ช่วงของข้อมูลที่ดึงมาแล้ว (LED.from ถึง LED.to) ไม่ใช่ช่องที่กำลังแก้
 */
let FROM = '', TO = '';
let RANGE_ERR = '';
const RANGE_MAX = 62;   // วัน ทั้งเดือนบวกต้นเดือนถัดไปพอ ช่วงยาวกว่านี้แถวขายกับออเดอร์ใหญ่เกินจะเก็บลงเครื่อง
let DAY = '';       // '' = ทั้งช่วง
let ONLY = '';      // '' | split | unknown | gap | conv
let Q = '';
let BUSY = '';
let ERR = '';
let CUT = null;     // ผลเทียบรายวันล่าสุดจากหน้าเช็ครายการตัดสต๊อก อ่านจากเครื่องนี้
let VIEW = 'sku';   // sku = รวมราย SKU, order = รายออเดอร์
/* ออเดอร์ของเดือนจากไฟล์ตัดสต๊อก (cut-api.gs ?api=cut-orders) หนึ่งเดือนราวสองเมกะไบต์ ไม่เก็บลงเครื่อง เปิดหน้าใหม่ดึงใหม่ */
let ORD = null;
let ORD_ERR = '';
let OLINES = [];    // WmsLotPo.allocate(ROWS, ORD)
let LATE = [];      // วันที่มีออเดอร์ แต่สมุดยังลงขายไม่ถึง

/*
 * ประมาณ LOT ให้ของ LOT 0 (public/wms-lot0.js) ต้องอ่านสมุดทั้งชีต (tx-fifo ชุดกลาง) ไม่ใช่แค่แถวขายของเดือน
 * เก็บลงเครื่องเฉพาะแถวขายของเดือนที่ดึงไว้ ผูกกับเวลาที่ดึงแถวขาย ดึงแถวขายใหม่ก็ประมาณใหม่
 */
const EST_CACHE = 'wms:lotpo:lot0';
const GUESS_KEY = 'wms:lotpo:guess';
let EST = null;     // WmsLot0.only(WmsLot0.run(tx-fifo), แถวขายของ LED) + led = LED.at
let EST_BUSY = '';
let EST_ERR = '';
let GUESS = true;   // ปิดได้ อยากดู LOT 0 ตามที่สมุดลงไว้
try { GUESS = localStorage.getItem(GUESS_KEY) !== '0'; } catch (e) {}

function monthRange(m) {
  const [y, mo] = m.split('-').map(Number);
  const last = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  return { from: `${m}-01`, to: `${m}-${pad(last)}` };
}

function thisMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}

function monthName(m) {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
}

function setMonth(m) {
  const r = monthRange(m);
  MONTH = m;
  FROM = r.from;
  TO = r.to;
  RANGE_ERR = '';
}

/** ช่วงนี้คือทั้งเดือนพอดีไหม */
function isMonth(from, to) {
  const r = monthRange(from.slice(0, 7));
  return from === r.from && to === r.to;
}

/** ชื่อช่วงบนจอ ทั้งเดือนใช้ชื่อเดือน ช่วงที่เลือกเองบอกวันแรกถึงวันสุดท้าย */
function nameOf(from, to) { return isMonth(from, to) ? monthName(from.slice(0, 7)) : `${dm(from)} ถึง ${dm(to)}`; }
function ofName(from, to) { return isMonth(from, to) ? `ของ${monthName(from.slice(0, 7))}` : `วันที่ ${dm(from)} ถึง ${dm(to)}`; }
/** ช่วงของข้อมูลที่ดึงมาแล้ว ยังไม่ได้ดึงใช้ช่วงที่เลือกไว้ */
const shown = () => (LED ? [LED.from, LED.to || monthRange(LED.from.slice(0, 7)).to] : [FROM, TO]);
const shownName = () => nameOf(...shown());
const allName = () => (isMonth(...shown()) ? 'ทั้งเดือน' : 'ทั้งช่วง');

/** ช่องวันที่ที่เลือก ผิดคืนข้อความบอกเหตุ */
function rangeErr(from, to) {
  if (!from || !to) return 'เลือกวันที่ให้ครบทั้งสองช่อง';
  if (from > to) return 'วันแรกต้องไม่เลยวันสุดท้าย';
  if ((Date.parse(to) - Date.parse(from)) / 864e5 + 1 > RANGE_MAX) return `เลือกได้ไม่เกิน ${RANGE_MAX} วัน`;
  return '';
}

/**
 * ผลเทียบรายวันที่หน้าเช็ครายการตัดสต๊อกเก็บไว้ในเครื่อง คิดซ้ำด้วยกติกาเดียวกับแท็บเทียบรายวัน
 * รายงานนี้ควรส่งบัญชีเมื่อวันนั้นตรงทั้งสามระบบแล้ว หน้านี้จึงบอกไว้ให้เห็นก่อนคัดลอก
 */
function readCut() {
  try {
    const raw = JSON.parse(localStorage.getItem('wms:cut:result') || 'null');
    const led = JSON.parse(localStorage.getItem('wms:cut:ledger') || 'null');
    if (!raw || raw.app !== 'cut' || !raw.daily || !raw.period || !led || !led.cells) return null;
    const c = WmsCut.compareDaily(raw.daily, raw.period, led);
    const by = {};
    c.days.forEach((d) => { by[d.date] = d; });
    return { from: c.from, to: c.to, at: led.at || raw.at, by, period: raw.period };
  } catch (e) {
    return null;
  }
}

/** ok = ตรงทั้งสามระบบและตรง Report, warn = ต่างแค่ลงคนละวัน, bad = มียอดต้องแก้จริง */
function dayState(d) {
  if (!d) return '';
  const all = [d.status, d.rep && d.rep.status].filter(Boolean);
  if (all.every((s) => s === 'ok')) return 'ok';
  return all.some((s) => s !== 'ok' && s !== 'shift') ? 'bad' : 'warn';
}

function readCache() {
  try {
    const l = JSON.parse(localStorage.getItem(CACHE) || 'null');
    if (!l || l.app !== 'transaction' || !l.lines || !l.from) return;
    const e = JSON.parse(localStorage.getItem(EST_CACHE) || 'null');
    /* v 2 = จับคู่แถวด้วย SKU จำนวน วันที่ ชุดที่เก็บก่อนหน้านั้นจับด้วยเลขแถวอย่างเดียว ประมาณใหม่ */
    if (e && e.rows && e.led === l.at && e.v === 2) EST = e;
    take(l);
  } catch (e) {}
}

function take(l) {
  LED = l;
  MONTH = l.from.slice(0, 7);
  FROM = l.from;
  TO = l.to || monthRange(MONTH).to;
  RANGE_ERR = '';
  if (EST && EST.led !== l.at) EST = null;
  /* วันล่าสุดที่มีขายคือวันที่ทำรายงานบ่อยสุด */
  if (!DAY || !l.days.includes(DAY)) DAY = l.days[l.days.length - 1] || '';
  rebuild();
}

/** ค่าประมาณที่ใช้ได้ตอนนี้ ปิดไว้หรือสคริปต์รุ่นเก่าที่แยกแถวรับคืนไม่ได้ ไม่ใช้ */
const useEst = () => (GUESS && EST && EST.ok ? EST : null);

function rebuild() {
  if (!LED) return;
  RAW = WmsLotPo.build(LED, useEst());
  ROWS = WmsLotPo.convert(RAW, LED.convert);
  pair();
}

/**
 * อ่านสมุดทั้งชีตแล้วประมาณ LOT ให้แถวขาย LOT 0 ปกติอ่านชุดกลางที่สคริปต์เก็บไว้ fresh = ให้สคริปต์อ่านชีตใหม่
 * ไม่บังหน้ารายงาน ระหว่างรอยังดูและคัดลอกได้ เสร็จแล้วบรรทัด LOT 0 ค่อยแยกเป็น LOT ที่ประมาณได้
 */
async function loadEst(fresh) {
  const url = WmsSettings.txUrl();
  if (EST_BUSY || !url || !LED) return;
  EST_ERR = '';
  const say = (sec) => { EST_BUSY = `กำลังอ่านสมุดทั้งชีตเพื่อประมาณ LOT ให้ของ LOT 0…${sec ? ` ${sec} วินาที` : ''}`; renderEst(); };
  const opts = { retries: 1, timeoutMs: 240000, onProgress: say };
  say(0);
  try {
    let res;
    if (fresh) {
      res = await WmsShared.press(url, 'tx-fifo', null, opts);
      if (res && res.error === WmsShared.OLD) res = await WmsGas.json(url, 'tx-fifo', opts);
    } else {
      res = await WmsShared.read(url, 'tx-fifo', opts);
    }
    if (res && res.busy && !res.rows) throw new Error(`${WmsShared.runner(res.busy)} กำลังดึงสมุดชุดใหม่อยู่ รอสักครู่แล้วกดอีกครั้ง`);
    if (res.error) throw new Error(res.error);
    if (res.app !== 'transaction') throw new Error('URL ของ Transaction ในหน้าตั้งค่าไม่ใช่สคริปต์ tx-api.gs');
    if (!res.rows) throw new Error('สคริปต์ tx-api.gs ยังเป็นรุ่นที่ไม่ส่งแถวของสมุด ให้วางโค้ดใหม่แล้ว Deploy เป็น New version');
    EST = Object.assign(WmsLot0.only(WmsLot0.run(res), LED), { led: LED.at });
    try { localStorage.setItem(EST_CACHE, JSON.stringify(EST)); } catch (e) {}
  } catch (e) {
    EST_ERR = e.message;
  }
  EST_BUSY = '';
  rebuild();
  renderSum();
  renderBody();
}

/**
 * ปันล็อตให้ออเดอร์ ต้องเป็นเดือนเดียวกันทั้งสองฝั่ง วันที่สมุดยังลงขายไม่ถึงตัดออกก่อน
 * ไม่งั้นออเดอร์ทั้งวันจะขึ้นว่าสมุดลงไม่ถึง ทั้งที่แค่ยังไม่ได้ลง
 */
function pair() {
  OLINES = [];
  LATE = [];
  if (!ORD || !LED) return;
  if (ORD.from !== LED.from || ORD.to !== LED.to) { ORD = null; return; }
  const last = LED.last || '';
  const late = {};
  const lines = ORD.lines.filter((l) => {
    const d = ORD.days[l[0]];
    if (d <= last) return true;
    late[d] = 1;
    return false;
  });
  LATE = Object.keys(late).sort();
  OLINES = WmsLotPo.convert(WmsLotPo.allocate(RAW, Object.assign({}, ORD, { lines })), LED.convert);
}

async function loadOrders() {
  const url = WmsSettings.cutUrl();
  if (BUSY || !url || !LED) return;
  /* ช่วงเดียวกับแถวขายที่ดึงไว้ ปันล็อตได้ต้องเป็นช่วงเดียวกันทั้งสองฝั่ง */
  const r = { from: LED.from, to: LED.to };
  ORD_ERR = '';
  const say = (sec) => { BUSY = `กำลังอ่านออเดอร์จากไฟล์ตัดสต๊อก…${sec ? ` ${sec} วินาที` : ''}`; renderSrc(); };
  say(0);
  renderBody();
  try {
    /* อ่านแท็บ Transaction ทั้งแท็บ เป็นแสนแถว เผื่อเวลาไว้เหมือนหน้าเช็คตัดสต๊อก */
    const res = await WmsGas.json(url, `cut-orders&from=${r.from}&to=${r.to}`, { retries: 1, timeoutMs: 300000, onProgress: say });
    if (res.error) throw new Error(res.error);
    if (res.app !== 'cut') throw new Error('URL เช็คตัดสต๊อกในหน้าตั้งค่าไม่ใช่สคริปต์ cut-api.gs');
    if (!res.lines) throw new Error('สคริปต์ cut-api.gs ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version');
    ORD = res;
  } catch (e) {
    ORD_ERR = e.message;
  }
  BUSY = '';
  pair();
  render();
}

async function load() {
  const url = WmsSettings.txUrl();
  if (BUSY || !url || RANGE_ERR) return;
  const r = { from: FROM, to: TO };
  ERR = '';
  const say = (sec) => { BUSY = `กำลังอ่านแถวขาย${ofName(r.from, r.to)}…${sec ? ` ${sec} วินาที` : ''}`; renderSrc(); };
  say(0);
  renderBody();
  try {
    const res = await WmsGas.json(url, `tx-daily&from=${r.from}&to=${r.to}`, { retries: 1, onProgress: say });
    if (res.error) throw new Error(res.error);
    if (res.app !== 'transaction') throw new Error('URL ของ Transaction ในหน้าตั้งค่าไม่ใช่สคริปต์ tx-api.gs');
    if (!res.lines) throw new Error('สคริปต์ tx-api.gs ยังเป็นรุ่นเก่า ให้วางโค้ดใหม่แล้ว Deploy เป็น New version');
    DAY = '';
    take(res);
    try { localStorage.setItem(CACHE, JSON.stringify(res)); } catch (e) {}
  } catch (e) {
    ERR = e.message;
    if (window.WmsMotion) setTimeout(() => window.WmsMotion.shake(document.querySelector('#src .tx-err')), 0);
  }
  BUSY = '';
  CUT = readCut();
  /* แถวขายชุดใหม่ต้องประมาณใหม่ เลขแถวของชุดเก่าอาจเลื่อนไปแล้ว */
  if (!ERR && GUESS) loadEst(false);
  /* ดึงใหม่ตอนดูรายออเดอร์ ออเดอร์ต้องใหม่ด้วย ไม่งั้นจะปันล็อตชุดใหม่ให้ออเดอร์ชุดเก่า */
  if (!ERR && VIEW === 'order' && WmsSettings.cutUrl()) {
    ORD = null;
    pair();
    loadOrders();
    return;
  }
  render();
}

/* ── แถบบน ─────────────────────────────────────────────────────────────── */

function renderSrc() {
  const off = BUSY ? 'disabled' : '';
  /* เดือนกับช่องวันที่ไม่ถูกวาดใหม่ตอนแก้วันที่ (pick) เคอร์เซอร์ในช่องวันที่จะได้ไม่หลุดระหว่างพิมพ์ */
  $('src').innerHTML = `<span class="pill">📅 <select id="month" aria-label="เดือน" ${off}>${monthOpts()}</select></span>
    <span class="pill lp-range"><input type="date" id="from" aria-label="ตั้งแต่วันที่" value="${esc(FROM)}" ${off}>
      ถึง <input type="date" id="to" aria-label="ถึงวันที่" value="${esc(TO)}" ${off}></span>
    <span id="srcTail" class="lp-tail">${tailHtml()}</span>`;
  $('month').onchange = (e) => {
    if (!e.target.value) return;
    setMonth(e.target.value);
    DAY = '';
    load();
  };
  $('from').onchange = pick;
  $('to').onchange = pick;
  bindTail();
}

/** สิบสองเดือนล่าสุด เดือนที่ดึงไว้อยู่นอกช่วงก็ยังต้องมีในรายการ ช่วงที่ไม่ใช่ทั้งเดือนขึ้นเป็น เลือกช่วงเอง */
function monthOpts() {
  const [y, m] = thisMonth().split('-').map(Number);
  const months = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(y, m - 1 - i, 1);
    months.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`);
  }
  if (MONTH && !months.includes(MONTH)) months.push(MONTH);
  const custom = !FROM || !TO || !isMonth(FROM, TO);
  return (custom ? '<option value="" selected>เลือกช่วงเอง</option>' : '') + months.map((x) =>
    `<option value="${x}" ${!custom && x === MONTH ? 'selected' : ''}>${esc(monthName(x))}</option>`).join('');
}

/** ส่วนหลังช่องวันที่ วาดใหม่ได้ทุกครั้งที่แก้วันที่ */
function tailHtml() {
  const url = WmsSettings.txUrl();
  const off = BUSY ? 'disabled' : '';
  let html = '';
  /* ช่วงของ Report ในไฟล์ตัดสต๊อกที่ตรวจล่าสุด (เก็บไว้ในเครื่องตอนกดตรวจที่หน้าเช็ค) กดทีเดียวได้ช่วงเดียวกัน */
  const rep = repRange();
  if (rep && (rep.from !== FROM || rep.to !== TO)) {
    html += `<button id="repBtn" ${off} title="ช่วงวันที่ของ Report ในไฟล์ตัดสต๊อกที่ตรวจล่าสุด">ใช้ช่วงของ Report ${esc(dm(rep.from))} ถึง ${esc(dm(rep.to))}</button>`;
  }
  if (BUSY) {
    html += `<span class="pill">⏳ ${esc(BUSY)}</span>`;
  } else if (LED) {
    const when = new Date(LED.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    html += `<span class="pill">🕐 ดึงเมื่อ <b>${esc(when)}</b></span>`;
    if (LED.last) html += `<span class="pill">สมุดลงขายถึง <b>${esc(dm(LED.last))}</b></span>`;
    if (LED.sheet && LED.sheet.url) html += `<span class="pill"><a href="${esc(LED.sheet.url)}" target="_blank" rel="noopener">เปิดชีต ↗</a></span>`;
    /* แถวที่ไม่เข้ารายงาน ต้องบอกจำนวน ไม่งั้นยอดที่หายจะดูเหมือนขายน้อย */
    if (LED.noDate && LED.noDate.rows) html += `<span class="pill warn">แถวขายไม่มีวันที่ทั้งชีต ${f(LED.noDate.rows)} แถว ไม่อยู่ในรายงาน</span>`;
    if (LED.noSku && LED.noSku.rows) html += `<span class="pill warn">แถวขายไม่มี SKU คอลัมน์ B ${f(LED.noSku.rows)} แถว ${f(LED.noSku.qty)} ชิ้น</span>`;
    if (LED.future && LED.future.rows) html += `<span class="pill warn">วันที่ขายเกินวันนี้ ${f(LED.future.rows)} แถว</span>`;
  }
  html += `<span class="sp"></span>`;
  if (url) {
    const fresh = LED && LED.from === FROM && LED.to === TO;
    html += `<button id="loadBtn" class="${fresh ? '' : 'p'}" ${BUSY || RANGE_ERR ? 'disabled' : ''}>${BUSY ? 'กำลังดึง…' : fresh ? '🔄 ดึงใหม่' : '▶️ ดึงข้อมูล'}</button>`;
  } else {
    html += `<span class="pill">ยังไม่ได้ตั้ง Apps Script URL ของ Transaction — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a></span>`;
  }
  if (RANGE_ERR) html += `<div class="tx-err">${esc(RANGE_ERR)}</div>`;
  else if (LED && !BUSY && (LED.from !== FROM || LED.to !== TO)) {
    html += `<div class="lp-pend">เลือกช่วง <b>${esc(nameOf(FROM, TO))}</b> แล้ว กด ดึงข้อมูล — ตอนนี้ยังแสดง ${esc(shownName())}</div>`;
  }
  if (ERR) html += `<div class="tx-err">ดึงข้อมูลไม่สำเร็จ: ${esc(ERR)}</div>`;
  return html;
}

/** ช่วงวันที่ของ Report จากผลตรวจล่าสุดของหน้าเช็คตัดสต๊อก ไม่มีหรือยาวเกินได้ null */
function repRange() {
  const p = CUT && CUT.period;
  return p && p.from && p.to && !rangeErr(p.from, p.to) ? p : null;
}

function bindTail() {
  const btn = $('loadBtn');
  if (btn) btn.onclick = load;
  const rb = $('repBtn');
  if (rb) {
    rb.onclick = () => {
      const p = repRange();
      FROM = p.from;
      TO = p.to;
      MONTH = FROM.slice(0, 7);
      RANGE_ERR = '';
      DAY = '';
      load();
    };
  }
}

/** แก้วันที่ยังไม่ดึงทันที เลือกครบแล้วค่อยกดดึงข้อมูล พิมพ์ทีละช่องจะได้ไม่ดึงซ้ำหลายรอบ */
function pick() {
  FROM = $('from').value;
  TO = $('to').value;
  RANGE_ERR = rangeErr(FROM, TO);
  if (FROM) MONTH = FROM.slice(0, 7);
  $('month').innerHTML = monthOpts();
  $('srcTail').innerHTML = tailHtml();
  bindTail();
}

function renderDays() {
  if (!LED || !LED.days.length || BUSY) { $('days').innerHTML = ''; return; }
  const words = { ok: 'เทียบรายวันตรงแล้ว', warn: 'ลงตัดคนละวัน', bad: 'เทียบรายวันยังไม่ตรง' };
  const mark = { ok: '✓', warn: '!', bad: '✕' };
  const chip = (d) => {
    const s = CUT ? dayState(CUT.by[d]) : '';
    return `<button class="lp-day${d === DAY ? ' on' : ''}${s ? ` d-${s}` : ''}" data-day="${d}"
      ${s ? `title="${words[s]}"` : ''}>${dm(d)}${s ? `<i aria-label="${words[s]}">${mark[s]}</i>` : ''}</button>`;
  };
  $('days').innerHTML = `<button class="lp-day all${DAY ? '' : ' on'}" data-day="">${allName()}</button>` + LED.days.map(chip).join('');
  /* เลื่อนแถบเองแทน scrollIntoView ที่จะพาทั้งหน้าเลื่อนตามไปด้วย รอเฟรมถัดไปให้ความกว้างปุ่มลงตัวก่อน */
  requestAnimationFrame(() => {
    const box = $('days'), on = box.querySelector('.lp-day.on:not(.all)');
    if (on) box.scrollLeft = on.offsetLeft - box.clientWidth / 2 + on.offsetWidth / 2;
  });
}

/** แถวขายของวันที่เลือก ใช้เทียบกับผลเทียบรายวันเสมอ ไม่ว่าดูมุมไหน */
function picked() { return DAY ? ROWS.filter((r) => r.date === DAY) : ROWS; }

const byOrder = () => VIEW === 'order' && !!ORD;

/** บรรทัดที่ตารางแสดงและปุ่มคัดลอกจะได้ */
function chosen() { return WmsLotPo.filter(byOrder() ? OLINES : ROWS, { date: DAY, q: Q, only: ONLY }); }

function renderSum() {
  if (!LED || BUSY) { $('sum').innerHTML = ''; return; }
  const stat = (label, n, sub, cls) => `<div class="tx-stat"><small>${esc(label)}</small><b class="${cls || ''}" data-count="${n}">${f(n)}</b><i>${esc(sub)}</i></div>`;
  if (byOrder()) {
    const o = WmsLotPo.totals(DAY ? OLINES.filter((r) => r.date === DAY) : OLINES);
    $('sum').innerHTML =
      stat('ชิ้นที่ออก', o.qty, DAY ? `วันที่ ${dm(DAY)}` : shownName()) +
      stat('ออเดอร์', o.orders, `${f(o.lines)} บรรทัด ออเดอร์ × SKU × LOT/PO`) +
      stat('ไม่รู้ LOT หรือ PO', o.unknown.qty, `${f(o.unknown.lines)} บรรทัด · LOT 0 หรือ PO 0`, o.unknown.qty ? 'tx-mid' : '') +
      guessStat(o) +
      stat('ยอดไม่ลงกัน', o.gap.qty, `${f(o.gap.lines)} บรรทัด · สมุดกับแท็บ Transaction`, o.gap.qty ? 'tx-neg' : '');
    return;
  }
  const t = WmsLotPo.totals(picked());
  $('sum').innerHTML =
    stat('ชิ้นที่ขายออก', t.qty, DAY ? `วันที่ ${dm(DAY)}` : shownName()) +
    stat('SKU', t.skus, `${f(t.lines)} บรรทัด SKU × LOT/PO`) +
    stat('SKU ที่ออกหลาย LOT/PO', t.split, `${f(t.splitLines)} บรรทัด${DAY ? '' : ' · นับเป็น SKU ต่อวัน'}`) +
    stat('ไม่รู้ LOT หรือ PO', t.unknown.qty, `${f(t.unknown.lines)} บรรทัด · LOT 0 หรือ PO 0`, t.unknown.qty ? 'tx-mid' : '') +
    guessStat(t);
}

/** ช่องนี้ขึ้นเฉพาะตอนมีบรรทัดที่ประมาณ LOT ได้ */
function guessStat(t) {
  if (!t.guess.qty) return '';
  return `<div class="tx-stat"><small>LOT/PO ประมาณ</small><b class="tx-mid" data-count="${t.guess.qty}">${f(t.guess.qty)}</b>
    <i>${f(t.guess.lines)} บรรทัด · ไม่ใช่ที่สมุดบันทึก</i></div>`;
}

/* ── เนื้อหา ───────────────────────────────────────────────────────────── */

/** ผลเทียบรายวันของช่วงที่เลือก บอกก่อนว่าส่งบัญชีได้หรือยัง */
function statusHtml() {
  const goCut = '<a href="../cut-check/">หน้าเช็ครายการตัดสต๊อก</a>';
  if (!CUT) {
    return `<div class="tx-note">ยังไม่มีผลเทียบรายวันในเครื่องนี้ จึงยังบอกไม่ได้ว่าวันไหนตรงแล้ว — เปิด${goCut} กดตรวจและดึงยอดขาย แล้วกลับมาที่หน้านี้</div>`;
  }
  const when = new Date(CUT.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const at = `<small>ผลเทียบรายวันจาก${goCut} ดึงยอดขายเมื่อ ${esc(when)}</small>`;
  if (!DAY) {
    const days = LED.days.filter((d) => d >= CUT.from && d <= CUT.to);
    if (!days.length) return `<div class="tx-note">ผลเทียบรายวันล่าสุดเป็นของ ${esc(dm(CUT.period.from))} ถึง ${esc(dm(CUT.period.to))} ไม่ครอบคลุมช่วงนี้ — ตรวจที่${goCut}</div>`;
    const n = { ok: 0, warn: 0, bad: 0, '': 0 };
    days.forEach((d) => { n[dayState(CUT.by[d])]++; });
    if (n.ok === days.length) return `<div class="tx-pass">✓ เทียบรายวันตรงครบทั้ง ${f(days.length)} วันที่มีขายแล้ว ส่งรายงาน${allName()}ให้บัญชีได้${at}</div>`;
    return `<div class="tx-warn">เทียบรายวันตรงแล้ว <b>${f(n.ok)}</b> จาก ${f(days.length)} วันที่มีขาย
      ${n.bad ? ` · ยังไม่ตรง <b>${f(n.bad)}</b> วัน` : ''}${n.warn ? ` · ลงตัดคนละวัน <b>${f(n.warn)}</b> วัน` : ''}
      — วันที่มีเครื่องหมาย ✓ บนแถบวันส่งบัญชีได้แล้ว${at}</div>`;
  }
  if (DAY < CUT.from || DAY > CUT.to) {
    return `<div class="tx-note">วันที่ ${esc(dm(DAY))} อยู่นอกช่วงที่เทียบรายวันล่าสุด (${esc(dm(CUT.from))} ถึง ${esc(dm(CUT.to))}) — ตรวจที่${goCut}ก่อนส่งบัญชี</div>`;
  }
  const d = CUT.by[DAY];
  if (!d) return `<div class="tx-note">วันที่ ${esc(dm(DAY))} ยังไม่มีผลเทียบรายวัน — ตรวจที่${goCut}ก่อนส่งบัญชี</div>`;
  /* สมุดถูกแก้หลังกดดึงยอดขายที่หน้าเช็ค ผลเทียบที่เห็นเป็นของสมุดฉบับก่อน */
  const qty = WmsLotPo.totals(picked()).qty;
  const stale = d.s !== qty ? `<small>ยอดขายวันนี้ในสมุดตอนนี้ ${f(qty)} ชิ้น ตอนเทียบเป็น ${f(d.s)} ชิ้น สมุดถูกแก้หลังเทียบ — กดดึงยอดขายใหม่ที่${goCut}</small>` : '';
  const s = dayState(d);
  if (s === 'ok' && !stale) return `<div class="tx-pass">✓ วันที่ ${esc(dm(DAY))} เทียบรายวันตรงทั้งสามระบบและตรง Report แล้ว ส่งบัญชีได้${at}</div>`;
  if (s === 'ok') return `<div class="tx-warn">วันที่ ${esc(dm(DAY))} เคยเทียบตรงแล้ว${stale}${at}</div>`;
  if (s === 'warn') {
    return `<div class="tx-warn">วันที่ ${esc(dm(DAY))} มีบาง SKU ลงตัดคนละวันกับระบบอื่น ยอดของวันนี้อาจไปอยู่วันข้างเคียง — ดูที่${goCut}ก่อนส่งบัญชี${stale}${at}</div>`;
  }
  const n = d.bad || (d.rep ? d.rep.bad : 0);
  return `<div class="tx-warn bad">วันที่ ${esc(dm(DAY))} เทียบรายวันยังไม่ตรง${n ? ` ${f(n)} SKU` : ''} — แก้ให้ตรงที่${goCut}ก่อนส่งบัญชี${stale}${at}</div>`;
}

/** SKU ตอนซื้อตัวหนา ใต้ชื่อบอก SKU ที่ขายถ้าแปลงคืนมา */
function skuHtml(r, tag) {
  const conv = r.sold ? `<span class="tx-sub">ขายเป็น ${esc(r.sold)}</span>`
    : r.many ? '<span class="tx-sub tx-mid">MASTER มี SKU ตอนซื้อหลายตัว ยังไม่แปลงคืน</span>' : '';
  return `<b>${esc(r.sku)}</b><span class="tx-sub">${esc(r.name)}</span>${conv}${tag}`;
}

/** SKU ในรายงานเป็น SKU ตอนซื้อหรือยัง บอกไว้ก่อนส่งบัญชี scope คือบรรทัดของวันหรือเดือนที่เลือก */
function convNote(scope) {
  const c = LED.convert;
  const tab = '<b>MASTER แปลงสินค้า</b>';
  const still = 'SKU ในรายงานยังเป็น SKU ที่ขาย ยังไม่ได้แปลงคืนเป็น SKU ตอนซื้อ';
  if (c === undefined) return `<div class="tx-note">${still} — สคริปต์ tx-api.gs ยังเป็นรุ่นที่ไม่อ่านแท็บ ${tab} ให้วางโค้ดใหม่ Deploy เป็น New version แล้วกดดึงใหม่</div>`;
  if (!c) return `<div class="tx-note">${still} — ไฟล์สมุด Transaction ยังไม่มีแท็บ ${tab}</div>`;
  if (!c.pairs.length) return `<div class="tx-warn">แท็บ ${tab} ยังไม่มีคู่ SKU — แถวแรกเป็นหัวตาราง ใส่ SKU ตอนซื้อกับ SKU หลังแปลงตั้งแต่แถวที่ 2</div>`;
  const t = WmsLotPo.totals(scope);
  /* หัวคอลัมน์ไม่บอกว่าอันไหนเป็นอะไร สคริปต์ใช้ A กับ B บอกไว้ให้เห็นถ้ากรอกสลับกัน */
  const col = (v) => `"${esc(v || 'ไม่มีหัว')}"`;
  const plain = /ซื้อ/.test(c.cols[0]) && /แปลง|ขาย/.test(c.cols[1]);
  const out = [`<div class="tx-note">คืน SKU ที่แปลงแล้วเป็น SKU ตอนซื้อตามแท็บ ${tab} (${f(c.pairs.length)} คู่)
    · ${DAY ? `วันที่ ${esc(dm(DAY))}` : esc(shownName())} แปลงคืน <b>${f(t.conv.lines)}</b> บรรทัด ${f(t.conv.qty)} ชิ้น
    — SKU เดิมอยู่ในคอลัมน์ SKU ที่ขาย</div>`];
  if (!plain) {
    out.push(`<div class="tx-warn">หัวตารางในแท็บ ${tab} ไม่ได้บอกว่าคอลัมน์ไหนเป็นอะไร จึงใช้ ${col(c.cols[0])} เป็น SKU ตอนซื้อ ${col(c.cols[1])} เป็น SKU หลังแปลง
      — ถ้าสลับกัน ตั้งหัวคอลัมน์เป็น <b>SKU ตอนซื้อ</b> กับ <b>SKU หลังแปลง</b></div>`);
  }
  if (t.many.lines) {
    out.push(`<div class="tx-warn">${f(t.many.lines)} บรรทัด (${f(t.many.qty)} ชิ้น) ยังไม่แปลงคืน เพราะ SKU หลังแปลงตัวเดียวมี SKU ตอนซื้อหลายตัวในแท็บ ${tab}
      — กดตัวกรอง <b>แปลงคืน</b> เพื่อดู</div>`);
  }
  if (c.blank) out.push(`<div class="tx-note">แท็บ ${tab} มี ${f(c.blank)} แถวที่กรอกไม่ครบสองช่อง ไม่ได้ใช้</div>`);
  return out.join('');
}

function lotHtml(v, unknown, what) {
  if (!unknown) return esc(v);
  return `<span class="tx-mid">${esc(v === '' ? 'ว่าง' : v)}</span><span class="tx-sub">ไม่รู้ ${what}</span>`;
}

/** LOT ที่ประมาณได้มีป้ายติดไว้ ชี้ค้างเห็นว่าประมาณจากอะไร */
function lotCell(r) {
  if (r.guess) return `${esc(r.lot)}<span class="lp-guess" title="${esc(WmsLotPo.GUESS[r.guess] || '')}">ประมาณ</span>`;
  return lotHtml(r.lot, r.noLot, 'LOT');
}

function rowLinks(rows) {
  const links = rows.slice(0, 3).map((row) => {
    const u = WmsCut.rowUrl(LED.sheet, row);
    return u ? `<a class="tx-row" href="${esc(u)}" target="_blank" rel="noopener">${row}</a>` : String(row);
  }).join(' · ');
  return links + (rows.length > 3 ? ` +${rows.length - 3}` : '');
}

/** ประมาณจากแถวไหน หรือยังไม่รู้เพราะอะไร */
function guessHtml(r) {
  const from = (r.from || []).length ? ` · แถว ${rowLinks(r.from)}` : '';
  if (r.guess) return `<span class="tx-sub">${esc(WmsLotPo.GUESS[r.guess] || '')}${from}</span>`;
  /* stale กับ none ไม่มีแถวต้นทางให้ดู (none ชี้กลับแถวขายเอง) */
  if (r.why && r.noLot && r.noPo) return `<span class="tx-sub tx-mid">${esc(WmsLotPo.WHY[r.why] || '')}${r.why === 'stale' || r.why === 'none' ? '' : from}</span>`;
  return '';
}

/** PO ที่ลง -01 -02 ต่อท้ายรวมเป็น PO เดียวกันแล้ว บอกว่ารวมรอบไหนไว้ */
function poHtml(r) {
  const p = r.parts || [];
  return lotHtml(r.po, r.noPo, 'PO') + (p.length > 1
    ? `<span class="tx-sub" title="PO เดียวกันที่รับคนละวัน ส่วนท้ายคือวันที่รับเข้า">รวมรอบ ${esc(p.join(' '))}</span>` : '');
}

/** บอกกติกาเมื่อช่วงที่ดูมีบรรทัดที่รวม PO -01 -02 ไว้ */
function poNote(scope) {
  const n = scope.filter((r) => (r.parts || []).length > 1).length;
  return n ? `<div class="tx-note">PO ที่ลง <b>-01 -02</b> ต่อท้าย (วันที่รับเข้าคลัง) คือ <b>PO เดียวกัน</b> รายงานใช้เลข PO โดยตัดส่วนท้ายออก
    · รวมไว้ ${f(n)} บรรทัด</div>` : '';
}

/** ที่มาของบรรทัด: หยิบจาก Location ไหน และลิงก์ไปแถวในชีต ไว้แก้ LOT/PO ที่ผิด */
function srcHtml(r) {
  const bad = r.bad.length ? `<span class="tx-sub tx-neg">จำนวนพิมพ์ไม่ใช่ตัวเลข ${f(r.bad.length)} แถว ไม่ได้นับ</span>` : '';
  return `<span class="tx-sub">${esc(r.locs.join(', '))}</span><span class="tx-sub">แถว ${rowLinks(r.rows)}</span>${bad}${guessHtml(r)}`;
}

const cutNote = (rows) => rows.length > SHOW_MAX
  ? `<div class="tx-note" style="margin-top:10px">แสดง ${f(SHOW_MAX)} จาก ${f(rows.length)} บรรทัด เลือกวันหรือค้นหาเพื่อดูส่วนที่เหลือ — ปุ่มคัดลอกและดาวน์โหลดได้ครบทุกบรรทัด</div>`
  : '';

/** รายออเดอร์: บรรทัดของออเดอร์เดียวกันอยู่ติดกัน แถวต่อจากแถวแรกไม่เขียนเลขออเดอร์ซ้ำ */
function orderListHtml(rows) {
  const show = rows.slice(0, SHOW_MAX);
  const body = show.map((r, i) => {
    const prev = show[i - 1], next = show[i + 1];
    const same = (a) => !!r.ref && a && a.date === r.date && a.ref === r.ref;
    const cls = [same(prev) ? 'lp-in' : '', same(next) ? 'lp-grp' : ''].filter(Boolean).join(' ');
    const ord = !r.ref
      ? '<span class="tx-neg">ไม่มีออเดอร์</span>'
      : same(prev) ? `<span class="tx-sub">${esc(r.ref)}</span>`
        : `<b>${esc(r.ref)}</b><span class="tx-sub">${[r.src, r.online, r.sup].filter(Boolean).map(esc).join(' · ')}</span>`;
    const none = r.miss === 'ledger' || r.miss === 'minus';
    /* ไม่รู้ LOT/PO บอกอยู่ในช่องแล้ว ช่องหมายเหตุบนจอเหลือเรื่องยอดไม่ลงกันกับที่มาของ LOT ประมาณ ไฟล์ที่ส่งออกยังมีครบ */
    const note = r.miss ? `<span class="tx-sub tx-neg">${esc(WmsLotPo.note(r))}</span>` : guessHtml(r);
    return `<tr${cls ? ` class="${cls}"` : ''}>
      ${DAY ? '' : `<td class="nw k-date">${esc(dm(r.date))}</td>`}
      <td class="nw k-ord">${ord}</td>
      <td class="k-sku">${skuHtml(r, r.split > 1 ? `<span class="tx-tag">ได้ ${r.split} LOT/PO</span>` : '')}</td>
      <td class="nw k-lot" data-label="LOT">${none ? '—' : lotCell(r)}</td>
      <td class="nw k-po" data-label="PO">${none ? '—' : poHtml(r)}</td>
      <td class="num k-qty" data-label="จำนวน">${f(r.qty)}</td>
      <td class="k-note">${note}</td>
    </tr>`;
  }).join('');
  const t = WmsLotPo.totals(rows);
  return `<div class="tx-wrap"><table class="tx-tbl lp-tbl lp-ord">
    <thead><tr>${DAY ? '' : '<th>วันที่</th>'}<th>ออเดอร์</th><th>SKU / ชื่อสินค้า</th><th>LOT</th><th>PO</th><th class="num">จำนวน</th><th>หมายเหตุ</th></tr></thead>
    <tbody>${body}
      <tr class="sum">${DAY ? '' : '<td></td>'}<td class="k-ord">${f(t.orders)} ออเดอร์</td><td class="k-sku">${f(t.lines)} บรรทัด</td><td></td><td></td><td class="num k-qty">${f(t.qty)}</td><td></td></tr>
    </tbody></table></div>${cutNote(rows)}`;
}

function listHtml() {
  const rows = chosen();
  if (!rows.length) {
    return Q || ONLY
      ? '<div class="tx-empty art-search">ไม่พบรายการที่ตรงกับที่เลือก</div>'
      : '<div class="tx-empty art-done">ไม่มีแถวขายในช่วงนี้</div>';
  }
  if (byOrder()) return orderListHtml(rows);
  const show = rows.slice(0, SHOW_MAX);
  const body = show.map((r, i) => {
    const prev = show[i - 1], next = show[i + 1];
    /* SKU ตอนซื้อเดียวกันแต่ขายเป็นคนละ SKU เป็นคนละกลุ่ม จำนวน LOT/PO บนป้ายนับตาม SKU ที่ขาย */
    const same = (a) => a && a.date === r.date && a.sku === r.sku && (a.sold || '') === (r.sold || '');
    const cls = [same(prev) ? 'lp-in' : '', same(next) ? 'lp-grp' : ''].filter(Boolean).join(' ');
    const sku = same(prev)
      ? `<span class="tx-sub">${esc(r.sku)}</span>`
      : skuHtml(r, r.split > 1 ? `<span class="tx-tag">ออก ${r.split} LOT/PO</span>` : '');
    return `<tr${cls ? ` class="${cls}"` : ''}>
      ${DAY ? '' : `<td class="nw k-date">${esc(dm(r.date))}</td>`}
      <td class="k-sku">${sku}</td>
      <td class="nw k-lot" data-label="LOT">${lotCell(r)}</td>
      <td class="nw k-po" data-label="PO">${poHtml(r)}</td>
      <td class="num k-qty" data-label="จำนวน">${f(r.qty)}</td>
      <td class="k-src">${srcHtml(r)}</td>
    </tr>`;
  }).join('');
  const t = WmsLotPo.totals(rows);
  const cut = cutNote(rows);
  return `<div class="tx-wrap"><table class="tx-tbl lp-tbl">
    <thead><tr>${DAY ? '' : '<th>วันที่</th>'}<th>SKU / ชื่อสินค้า</th><th>LOT</th><th>PO</th><th class="num">จำนวน</th><th>Location · แถวในชีต</th></tr></thead>
    <tbody>${body}
      <tr class="sum">${DAY ? '' : '<td></td>'}<td class="k-sku">รวม ${f(t.lines)} บรรทัด</td><td></td><td></td><td class="num k-qty">${f(t.qty)}</td><td></td></tr>
    </tbody></table></div>${cut}`;
}

function renderList() {
  const box = $('list');
  if (box) box.innerHTML = listHtml();
  const n = chosen().length;
  const copy = $('copyBtn');
  if (copy) { copy.textContent = `📋 คัดลอก ${f(n)} บรรทัด`; copy.disabled = !n; }
  const dl = $('dlBtn');
  if (dl) dl.disabled = !n;
}

function renderBody() {
  if (!WmsSettings.txUrl()) {
    $('body').innerHTML = `<div class="tx-empty art-link">ยังไม่ได้ตั้ง Apps Script URL ของ Transaction — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a><br>
      ใช้ URL เดียวกับหน้าสต๊อกราย Location</div>`;
    return;
  }
  if (BUSY) { $('body').innerHTML = ''; return; }
  if (!LED) {
    $('body').innerHTML = `<div class="tx-empty art-data">กด <b>ดึงข้อมูล</b> ด้านบน เพื่ออ่านแถวขาย${esc(ofName(FROM, TO))} จากสมุด Transaction</div>`;
    return;
  }
  if (!LED.days.length) {
    $('body').innerHTML = `<div class="tx-empty art-done">${esc(shownName())} ยังไม่มีแถวขายในสมุด</div>`;
    return;
  }
  const views = `<div class="tx-bar lp-view">
      <button class="tx-opt${VIEW === 'sku' ? ' on' : ''}" data-view="sku">รวมราย SKU</button>
      <button class="tx-opt${VIEW === 'order' ? ' on' : ''}" data-view="order">รายออเดอร์</button>
    </div>`;
  if (VIEW === 'order' && !ORD) {
    $('body').innerHTML = views + (!WmsSettings.cutUrl()
      ? `<div class="tx-empty art-link">เลขออเดอร์มาจากไฟล์ตัดสต๊อกของเดือน ยังไม่ได้ตั้ง Apps Script URL ของเช็ครายการตัดสต๊อก — <a href="../settings/">ตั้งที่หน้าตั้งค่า</a></div>`
      : `${ORD_ERR ? `<div class="tx-warn bad">ดึงออเดอร์ไม่สำเร็จ: ${esc(ORD_ERR)}</div>` : ''}
        <div class="tx-empty art-data">เลขออเดอร์มาจากแท็บตัดสต๊อกระบบ Transaction ในไฟล์ตัดสต๊อกของเดือน<br><br>
        <button class="tx-opt" data-orders>▶️ ดึงออเดอร์</button></div>`);
    return;
  }
  const scope = (byOrder() ? OLINES : ROWS).filter((r) => !DAY || r.date === DAY);
  const count = (only) => WmsLotPo.filter(scope, { only }).length;
  /* ตัวเลขบนปุ่มนับเป็นบรรทัดทุกปุ่ม ตรงกับจำนวนที่ปุ่มคัดลอกจะได้ */
  const opt = (v, label) => `<button class="tx-opt${ONLY === v ? ' on' : ''}" data-only="${v}">${label} ${f(count(v))} บรรทัด</button>`;
  const conv = LED.convert && LED.convert.pairs.length ? opt('conv', 'แปลงคืน') : '';
  const guess = count('guess') || ONLY === 'guess' ? opt('guess', 'LOT ประมาณ') : '';
  const opts = byOrder()
    ? opt('', 'ทั้งหมด') + opt('split', 'ได้หลาย LOT/PO') + opt('unknown', 'ไม่รู้ LOT/PO') + guess + opt('gap', 'ยอดไม่ลงกัน') + conv
    : opt('', 'ทั้งหมด') + opt('split', 'ออกหลาย LOT/PO') + opt('unknown', 'ไม่รู้ LOT/PO') + guess + conv;
  const cols = byOrder() ? WmsLotPo.ORDER_HEAD.join(' · ') : WmsLotPo.HEAD.join(' · ');
  $('body').innerHTML = `${views}${statusHtml()}<div id="est">${estHtml(scope)}</div>${convNote(scope)}${poNote(scope)}${byOrder() ? orderNote() : ''}
    <div class="tx-bar">
      <input id="q" class="tx-input" type="search" placeholder="ค้นหา${byOrder() ? 'เลขออเดอร์ เลขออนไลน์' : ''} SKU ชื่อสินค้า LOT หรือ PO" value="${esc(Q)}" autocomplete="off">
      ${opts}
    </div>
    <div class="tx-bar lp-out">
      <button class="tx-opt" id="copyBtn">📋 คัดลอก</button>
      <button class="tx-opt" id="dlBtn">⬇️ ดาวน์โหลด CSV</button>
      <span>คัดลอกแล้ววางใน Excel ได้เลย คอลัมน์ ${cols} ทุกบรรทัดมีข้อมูลครบ กรองหรือทำ Pivot ต่อได้</span>
    </div>
    <div id="list"></div>`;
  renderList();
}

/** บรรทัดของวันหรือเดือนที่เลือก ในมุมที่กำลังดู */
const scopeRows = () => (byOrder() ? OLINES : ROWS).filter((r) => !DAY || r.date === DAY);

/** ระหว่างอ่านสมุดทั้งชีต วาดแค่กล่องนี้ ไม่วาดทั้งหน้า ช่องค้นหาจะได้ไม่หลุดตอนพิมพ์ */
function renderEst() {
  const box = $('est');
  if (box) box.innerHTML = estHtml(scopeRows());
}

/**
 * ของ LOT 0 ที่ขายออกในช่วงนี้ ประมาณ LOT ได้เท่าไร ที่เหลือรออะไร
 * เป็นค่าประมาณ ต้องบอกกติกาไว้ตรงนี้ คนส่งบัญชีจะได้อธิบายได้
 */
function estHtml(scope) {
  const t = WmsLotPo.totals(scope);
  const left = Object.values(t.why).reduce((a, b) => a + b, 0);
  const lot0 = scope.some((r) => r.noLot && r.noPo) || t.guess.qty;
  if (!lot0) return '';
  const where = DAY ? `วันที่ ${esc(dm(DAY))}` : esc(shownName());
  if (!GUESS) {
    return `<div class="tx-note">ปิดการประมาณ LOT ให้ของ LOT 0 อยู่ รายงานแสดง LOT 0 ตามที่สมุดลงไว้
      <button class="tx-opt" data-guess>เปิดการประมาณ</button></div>`;
  }
  if (EST_BUSY) return `<div class="lp-est">⏳ ${esc(EST_BUSY)} <small>ระหว่างนี้รายงานยังเป็น LOT 0 ตามที่สมุดลงไว้</small></div>`;
  if (EST_ERR) {
    return `<div class="tx-warn bad">อ่านสมุดทั้งชีตไม่สำเร็จ ยังประมาณ LOT ให้ของ LOT 0 ไม่ได้: ${esc(EST_ERR)}
      <button class="tx-opt" data-est-load>ลองอีกครั้ง</button></div>`;
  }
  if (!EST) {
    return `<div class="lp-est">ของ LOT 0 ยังไม่ได้ประมาณ LOT — ต้องอ่านสมุดทั้งชีตก่อน
      <div class="act"><button class="tx-opt" data-est-load>▶️ ประมาณ LOT</button></div></div>`;
  }
  if (!EST.ok) {
    return `<div class="tx-warn">สคริปต์ tx-api.gs ยังเป็นรุ่นที่แยกแถวรับคืนกับ M/E ไม่ได้ จึงยังประมาณ LOT ให้ของ LOT 0 ไม่ได้
      — วางโค้ดใหม่ Deploy เป็น New version แล้วกด <button class="tx-opt" data-est-fresh>🔄 อ่านสมุดใหม่</button></div>`;
  }
  const when = new Date(EST.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const n = (v) => `<b>${f(v || 0)}</b>`;
  const g = t.guess.by, w = t.why;
  const got = [['before', 'จากยอดก่อนนับ'], ['return', 'จากรับคืน'], ['me', 'จาก M/E'], ['conv', 'จากแปลงสินค้า']]
    .filter(([k]) => g[k]).map(([k, label]) => `${label} ${n(g[k])}`).join(' · ');
  /* กติกาของที่มาที่มีในช่วงนี้ คนส่งบัญชีจะได้อธิบายได้ว่าเลขมาจากไหน */
  const rules = [
    g.before ? 'ของนับที่ไม่รู้ LOT แบ่งตามแท็บยอดก่อนนับ ล็อตที่เข้าหลังสุดก่อน (ของเก่าควรออกไปก่อนแล้ว)' : '',
    g.return || g.me ? 'รับคืนกับ M/E ใช้ LOT/PO ที่ SKU นั้นขายออกล่าสุดก่อนรับเข้า' : '',
    g.conv ? 'แปลงสินค้าใช้ LOT/PO ของ SKU ต้นทาง' : '',
  ].filter(Boolean).join(' · ');
  const wait = [
    ['count', 'มาจากนับสต๊อก ต้องใช้ยอดก่อนวันนับ'],
    ['short', 'มาจากนับสต๊อก แต่แท็บยอดก่อนนับไม่มี SKU นี้หรือมีไม่พอ'],
    ['return', 'รับคืนแต่ไม่มีแถวขายก่อนหน้าให้ย้อนดู'],
    ['me', 'M/E แต่ไม่มีแถวขายก่อนหน้า'],
    ['none', 'สมุดขายจากกอง LOT 0 เกินที่รับเข้า'],
    ['conv', 'แปลงสินค้าแต่หาแถวเบิกคู่ไม่เจอ'],
    ['other', 'รับเข้าจากแถวที่ไม่บอกว่ามาจากไหน'],
    ['stale', 'ยังไม่ได้ประมาณ แถวขายนี้ไม่มีในสมุดทั้งชีตที่อ่านไว้ (ลงหลังเวลาที่อ่าน หรือถูกแก้ทีหลัง) กดอ่านสมุดใหม่'],
  ].filter(([k]) => w[k]).map(([k, label]) => `<li>${label} ${n(w[k])} ชิ้น</li>`).join('');
  return `<div class="lp-est">
    <div class="say">ของ LOT 0 ที่ขายออก${where} ${n(t.guess.qty + left)} ชิ้น · ประมาณ LOT/PO ได้ ${n(t.guess.qty)} ชิ้น · ยังไม่รู้ ${n(left)} ชิ้น</div>
    <ul>
      ${t.guess.qty ? `<li>ประมาณได้ ${got} ชิ้น — ${rules} เป็นค่าประมาณ ไม่ใช่ที่สมุดบันทึกไว้ บรรทัดเหล่านี้มีป้าย <span class="lp-guess">ประมาณ</span></li>` : ''}
      ${wait}
    </ul>
    ${beforeHtml(w)}
    <div class="act">
      ${t.guess.qty ? `<button class="tx-opt${ONLY === 'guess' ? ' on' : ''}" data-only="guess">ดูบรรทัดที่ประมาณ</button>` : ''}
      <button class="tx-opt" data-est-fresh>🔄 อ่านสมุดใหม่</button>
      <button class="tx-opt" data-guess>ปิดการประมาณ</button>
      <span>อ่านสมุดทั้งชีตเมื่อ ${esc(when)} · สมุดไม่ถูกแก้${EST.moved ? ` · มีการแทรกหรือลบแถวในชีตระหว่างอ่าน จับคู่ด้วย SKU จำนวน วันที่ให้ ${f(EST.moved)} แถว` : ''}</span>
    </div>
  </div>`;
}

/**
 * แท็บยอดก่อนนับอยู่ในสภาพไหน ยังไม่มีบอกวิธีใส่ มีแล้วบอกว่าใช้ได้เท่าไร (นับทั้งชีต ไม่ใช่แค่ช่วงที่เลือก)
 * w คือชิ้นที่ยังไม่รู้ของช่วงที่เลือก แยกตามเหตุ
 */
function beforeHtml(w) {
  const b = EST.before;
  const tab = '<b>ยอดก่อนนับ</b>';
  const how = `<details class="lp-how"${b === null && w.count ? ' open' : ''}><summary>วิธีใส่ยอดก่อนนับ</summary>
    <ol>
      <li>เพิ่มแท็บชื่อ ${tab} ในไฟล์สมุด Transaction (ไฟล์เดียวกับแท็บ MASTER แปลงสินค้า)</li>
      <li>วางได้สองแบบ — <b>มีสมุด Transaction รอบก่อนนับ</b>: ก๊อปทั้งชีตรวมหัวตารางมาวาง ระบบคิดยอดคงเหลือแต่ละ LOT/PO เอง
        · <b>มีรายงานยอดหรือรายงานรับเข้า</b>: แถวแรกเป็นหัวตาราง <b>SKU · LOT · PO · จำนวน</b> (วันที่รับ ใส่หรือไม่ใส่ก็ได้)</li>
      <li>กด 🔄 อ่านสมุดใหม่ ด้านล่าง</li>
    </ol>
    <small>ของนับที่ไม่รู้ LOT จะถูกแบ่งตามยอดนี้ เริ่มจากล็อตที่เข้าหลังสุด ส่วนที่นับแล้วรู้ LOT หักออกจากล็อตนั้นก่อน</small></details>`;
  if (b === undefined) {
    return w.count ? `<div class="lp-sub">สคริปต์ tx-api.gs ยังเป็นรุ่นที่ไม่อ่านแท็บ ${tab} — วางโค้ดใหม่ Deploy เป็น New version ก่อน${how}</div>` : '';
  }
  if (b === null) return w.count ? `<div class="lp-sub">ไฟล์สมุดยังไม่มีแท็บ ${tab}${how}</div>` : '';
  const NAME = { sku: 'SKU', lot: 'LOT', po: 'PO', qty: 'จำนวน' };
  if (b.missing.length) {
    return `<div class="lp-sub tx-neg">แท็บ ${tab} หาคอลัมน์ ${b.missing.map((k) => NAME[k]).join(', ')} ไม่เจอ — แถวแรกต้องเป็นหัวตาราง${how}</div>`;
  }
  const mode = b.mode === 'ledger' ? `สมุดรอบก่อน ${f(b.rows)} แถว` : `ตาราง ${f(b.rows)} แถว`;
  const miss = b.missN ? `<br>SKU ในแท็บที่สมุดตอนนี้ไม่มี ${f(b.missN)} ตัว ไม่ได้ใช้ ไม่กระทบรายงาน: ${esc(b.miss.join(', '))}${b.missN > b.miss.length ? ' …' : ''}` : '';
  return `<div class="lp-sub">ใช้แท็บ ${tab} (${mode}) มียอดของ ${f(b.skus)} SKU · ทั้งชีตแบ่งให้ของนับที่ไม่รู้ LOT ได้ <b>${f(b.used)}</b> ชิ้น
    ยังขาด <b>${f(b.short)}</b> ชิ้น${miss}${how}</div>`;
}

/** รายออเดอร์เป็นการปันส่วน ต้องบอกให้ชัดว่ามาจากไหนและเชื่อได้แค่ไหน */
function orderNote() {
  const when = new Date(ORD.at).toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const out = [`<div class="tx-note">เลขออเดอร์มาจากแท็บตัดสต๊อกระบบ Transaction ในไฟล์ตัดสต๊อก (ดึงเมื่อ ${esc(when)})
    สมุดลงขายรวมต่อ SKU ต่อวัน ไม่ได้บอกว่าออเดอร์ไหนหยิบล็อตไหน หน้านี้จึงปันให้ <b>ล็อตเก่าก่อน ตามลำดับแถวในแท็บ</b>
    — วันที่เทียบรายวันตรงแล้ว ทุกชิ้นได้ LOT/PO ครบ</div>`];
  const r = { from: LED.from, to: LED.to };
  if (!ORD.lines.length) {
    out.push(`<div class="tx-warn bad">ไฟล์ตัดสต๊อกที่ตั้งไว้ไม่มีออเดอร์${esc(ofName(...shown()))}${ORD.span.from ? ` (มีวันที่ ${esc(dm(ORD.span.from))} ถึง ${esc(dm(ORD.span.to))})` : ''}
      — เปลี่ยน URL เช็คตัดสต๊อกเป็นไฟล์ของช่วงนี้ที่<a href="../settings/">หน้าตั้งค่า</a></div>`);
  } else if (ORD.span.from > r.from || ORD.span.to < r.to) {
    out.push(`<div class="tx-note">ไฟล์ตัดสต๊อกมีออเดอร์วันที่ ${esc(dm(ORD.span.from))} ถึง ${esc(dm(ORD.span.to))} วันอื่นในช่วงนี้จะขึ้นว่าไม่มีออเดอร์</div>`);
  }
  if (LATE.length) {
    out.push(`<div class="tx-note">ออเดอร์วันที่ ${LATE.map((d) => esc(dm(d))).join(', ')} ยังไม่ได้ปันล็อต เพราะสมุดลงขายถึง ${esc(dm(LED.last))}</div>`);
  }
  /* เลขคำสั่งซื้อออนไลน์กับบริษัทขนส่งในไฟล์ส่งออก มาจากแท็บเดียวกัน (cut-api.gs รุ่นที่ส่งช่อง refs) */
  if (!ORD.refs) {
    out.push(`<div class="tx-warn">สคริปต์ cut-api.gs ยังเป็นรุ่นที่ไม่ส่งเลขคำสั่งซื้อออนไลน์กับบริษัทขนส่ง สองคอลัมน์นี้ในไฟล์ส่งออกจะว่าง
      — วางโค้ดใหม่ Deploy เป็น New version แล้วกดดึงใหม่</div>`);
  } else if (ORD.online === false) {
    out.push(`<div class="tx-warn">แท็บตัดสต๊อกระบบ Transaction ไม่มีคอลัมน์ <b>เลขคำสั่งซื้อออนไลน์</b> คอลัมน์นี้ในไฟล์ส่งออกจะว่าง</div>`);
  } else if (ORD.rounded) {
    out.push(`<div class="tx-note">เลขคำสั่งซื้อออนไลน์ ${f(ORD.rounded)} ออเดอร์ในแท็บตัดถูกชีตปัดเป็นเลขยกกำลัง (เช่น 9.90123E+17) หลักท้ายหายไปแล้ว
      ไฟล์ส่งออกแสดงตามชีตและบอกไว้ในหมายเหตุ — เดือนถัดไปตั้งคอลัมน์นั้นเป็น ข้อความธรรมดา (รูปแบบ → ตัวเลข → ข้อความธรรมดา) ก่อนวางข้อมูล</div>`);
  }
  return out.join('');
}

function render() {
  renderSrc();
  renderDays();
  renderSum();
  renderBody();
}

/* ── ส่งออก ────────────────────────────────────────────────────────────── */

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    /* เบราว์เซอร์ที่ไม่ให้ใช้ clipboard ตรงๆ ใช้วิธีเลือกข้อความแล้วคัดลอกแทน */
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove();
    return ok;
  }
}

function download() {
  const blob = new Blob([WmsLotPo.csv(chosen(), byOrder())], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lot-po-${byOrder() ? 'orders-' : ''}${DAY || (isMonth(...shown()) ? shown()[0].slice(0, 7) : shown().join('_'))}${ONLY ? '-' + ONLY : ''}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('days').addEventListener('click', (e) => {
  const b = e.target.closest('[data-day]');
  if (!b) return;
  DAY = b.dataset.day;
  renderDays();
  renderSum();
  renderBody();
});

$('body').addEventListener('click', (e) => {
  const view = e.target.closest('[data-view]');
  if (view) {
    if (VIEW === view.dataset.view) return;
    VIEW = view.dataset.view;
    ONLY = '';
    /* ดึงออเดอร์ตอนเปิดดูรายออเดอร์ครั้งแรก คนที่ดูแค่ราย SKU ไม่ต้องรอ */
    if (VIEW === 'order' && !ORD && !ORD_ERR && WmsSettings.cutUrl()) { loadOrders(); return; }
    renderSum();
    renderBody();
    return;
  }
  if (e.target.closest('[data-orders]')) { loadOrders(); return; }
  if (e.target.closest('[data-est-load]')) { loadEst(false); return; }
  if (e.target.closest('[data-est-fresh]')) { loadEst(true); return; }
  if (e.target.closest('[data-guess]')) {
    GUESS = !GUESS;
    try { localStorage.setItem(GUESS_KEY, GUESS ? '1' : '0'); } catch (err) {}
    if (!GUESS && ONLY === 'guess') ONLY = '';
    rebuild();
    renderSum();
    renderBody();
    if (GUESS && !EST) loadEst(false);
    return;
  }
  const only = e.target.closest('[data-only]');
  if (only) {
    ONLY = only.dataset.only;
    renderBody();
    return;
  }
  if (e.target.closest('#copyBtn')) {
    const btn = $('copyBtn');
    copyText(WmsLotPo.tsv(chosen(), byOrder())).then((ok) => {
      btn.textContent = ok ? 'คัดลอกแล้ว วางใน Excel ได้เลย' : 'คัดลอกไม่ได้ ลองกดอีกครั้ง';
      if (ok) window.WmsMotion?.saved(btn); else window.WmsMotion?.shake(btn);
    });
    return;
  }
  if (e.target.closest('#dlBtn')) download();
});

$('body').addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  Q = e.target.value.trim();
  renderList();   // ไม่วาดช่องค้นใหม่ ไม่งั้นเคอร์เซอร์จะหลุดระหว่างพิมพ์
});

readCache();
CUT = readCut();
/* ช่วงเริ่มต้น: ช่วงที่ดึงไว้ล่าสุด ถ้ายังไม่มีใช้ช่วงของ Report ที่หน้าเช็คตรวจล่าสุด แล้วค่อยเป็นทั้งเดือนนี้ */
if (!LED) {
  const p = repRange();
  if (p) { FROM = p.from; TO = p.to; MONTH = FROM.slice(0, 7); } else setMonth(thisMonth());
}
render();
if (!LED && WmsSettings.txUrl()) load();
else if (LED && !EST && GUESS && WmsSettings.txUrl()) loadEst(false);
</script>
</body>
</html>
